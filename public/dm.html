<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tulip Hot | Private DM</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #050505; color: white; font-family: sans-serif; }
        .dm-header { padding: 15px; background: #000; border-bottom: 2px solid #ff0055; display: flex; align-items: center; gap: 10px; }
        .back-btn { color: #ff0055; text-decoration: none; font-size: 20px; }
        #dm-box { height: calc(100vh - 130px); overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .dm-input-area { position: fixed; bottom: 0; width: 100%; padding: 10px; background: #111; display: flex; gap: 10px; }
        input { flex: 1; background: #222; border: 1px solid #444; color: white; padding: 12px; border-radius: 20px; outline: none; }
    </style>
</head>
<body>
    <div class="dm-header">
        <a href="chat.html" class="back-btn">←</a>
        <div id="target-name" style="font-weight: bold;">Chatting Privately...</div>
    </div>

    <div id="dm-box"></div>

    <div class="dm-input-area">
        <input type="text" id="dm-text" placeholder="Type a private message...">
        <button onclick="sendDM()" style="background:#ff0055; border:none; color:white; padding:10px 20px; border-radius:20px;">SEND</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const params = new URLSearchParams(window.location.search);
        const target = params.get('with');

        document.getElementById('target-name').innerText = `Chatting with ${target}`;

        function sendDM() {
            const val = document.getElementById('dm-text').value;
            if(!val) return;
            socket.emit('privateMessage', { to: target, text: val });
            document.getElementById('dm-text').value = '';
        }

        socket.on('newPrivateMessage', (data) => {
            const div = document.createElement('div');
            div.style.padding = '10px';
            div.style.background = data.from === 'Me' ? '#ff0055' : '#222';
            div.style.alignSelf = data.from === 'Me' ? 'flex-end' : 'flex-start';
            div.style.borderRadius = '10px';
            div.innerText = data.text;
            document.getElementById('dm-box').appendChild(div);
        });
    </script>
</body>
</html>
