<!DOCTYPE html>
<html>

<body>

<h3>Private Chat</h3>

<div id="chat"></div>

<input id="msg">

<button onclick="send()">Send</button>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io()

const params = new URLSearchParams(location.search)

const to = params.get("user")

let name = localStorage.getItem("tulip_name")

socket.emit("join",name)

function send(){

socket.emit("dm",{

from:name,

to:to,

text:msg.value

})

msg.value=""

}

socket.on("dm",(data)=>{

if(data.from==to){

chat.innerHTML+=data.from+": "+data.text+"<br>"

}

})

</script>

</body>
</html>
