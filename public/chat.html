<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">

<title>Tulip Chat</title>

<style>

html,body{
margin:0;
height:100%;
overflow:hidden;
font-family:Arial;
background:#f5e3ea;
display:flex;
}

/* SIDEBAR */

#sidebar{
width:220px;
background:white;
padding:20px;
border-right:1px solid #ddd;
}

#logo{
font-size:22px;
color:#ff3d6e;
font-weight:bold;
margin-bottom:20px;
}

.user{
padding:6px;
}

/* CHAT AREA */

#chatArea{
flex:1;
display:flex;
flex-direction:column;
}

#header{
background:#ff3d6e;
color:white;
padding:12px;
font-size:18px;
}

#chatBox{
flex:1;
overflow:auto;
padding:20px;
display:flex;
flex-direction:column;
gap:10px;
}

.msg{
background:#ff3d6e;
color:white;
padding:10px 16px;
border-radius:20px;
max-width:70%;
}

.msg img{
max-width:200px;
border-radius:10px;
}

/* INPUT */

#inputArea{
display:flex;
padding:10px;
gap:6px;
}

#text{
flex:1;
padding:10px;
border-radius:20px;
border:1px solid #ccc;
}

button{
background:#ff3d6e;
color:white;
border:none;
padding:10px 14px;
border-radius:10px;
}

</style>

</head>

<body>

<div id="sidebar">

<div id="logo">🌷 Tulip Chat</div>

<div id="online">0 users online</div>

<div id="users"></div>

</div>

<div id="chatArea">

<div id="header">Tulip Chat</div>

<div id="chatBox"></div>

<div id="inputArea">

<input id="text" placeholder="Type message">

<button onclick="send()">Send</button>

<input type="file" id="file" hidden>

<button onclick="pick()">📷</button>

</div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io()

let name = localStorage.getItem("username")
let gender = localStorage.getItem("gender")

if(!name){
location.href="login.html"
}

socket.emit("join",{name,gender})

function avatar(g){
return g==="female" ? "👩" : "👨"
}

/* SEND MESSAGE */

function send(){

let msg = text.value

socket.emit("message",{user:name,gender,msg})

text.value=""

}

/* RECEIVE MESSAGE */

socket.on("message",(d)=>{

let div = document.createElement("div")

div.className="msg"

let icon = avatar(d.gender)

if(d.msg && d.msg.startsWith("/uploads")){

div.innerHTML = icon+" "+d.user+"<br><img src='"+d.msg+"'>"

}else{

div.innerText = icon+" "+d.user+": "+d.msg

}

chatBox.appendChild(div)

chatBox.scrollTop = chatBox.scrollHeight

})

/* CLEAR CHAT */

socket.on("clearChat",()=>{

chatBox.innerHTML=""

})

/* ONLINE USERS */

socket.on("online",(list)=>{

users.innerHTML=""

let count=0

for(let id in list){

count++

let u=document.createElement("div")

u.className="user"

u.innerText = avatar(list[id].gender)+" "+list[id].name

users.appendChild(u)

}

online.innerText = count+" users online"

})

/* FILE PICK */

function pick(){

file.click()

}

/* FILE UPLOAD */

file.onchange = ()=>{

let f = file.files[0]

let fd = new FormData()

fd.append("file",f)

fetch("/upload",{method:"POST",body:fd})

.then(r=>r.json())

.then(d=>{

socket.emit("message",{user:name,gender,msg:d.url})

})

}

</script>

</body>
</html>
