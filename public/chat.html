<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tulip Hot | Gold Elite</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --accent: #ff0055; --gold: #ffd700; --glass: rgba(0,0,0,0.85); }
        body { background: #000; color: #fff; font-family: 'Lexend', sans-serif; overflow: hidden; height: 100vh; }

        /* ADULT HD BACKGROUND */
        .bg { position: fixed; inset: 0; background: linear-gradient(rgba(0,0,0,0.7), #000), url('https://images.unsplash.com/photo-1514924013411-cbf25faa35bb?q=80&w=1500') center/cover; z-index: -1; }

        .app { display: grid; grid-template-rows: 60px 1fr auto; height: 100%; }
        
        /* HEADER */
        header { background: var(--glass); border-bottom: 2px solid var(--accent); display: flex; align-items: center; justify-content: space-between; padding: 0 15px; box-shadow: 0 0 20px rgba(255,0,85,0.4); }

        /* CHAT AREA */
        #chats { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        
        .bubble { max-width: 85%; padding: 12px 16px; border-radius: 20px; position: relative; animation: pop 0.3s ease; }
        @keyframes pop { from { transform: scale(0.8); opacity: 0; } }

        .me { align-self: flex-end; background: linear-gradient(135deg, var(--accent), #8b0000); border-bottom-right-radius: 2px; }
        .others { align-self: flex-start; background: #1a1a1e; border: 1px solid #333; border-bottom-left-radius: 2px; }

        /* ADVANCED TOOLS */
        .input-area { background: var(--glass); padding: 15px; border-top: 1px solid #222; }
        .tool-row { display: flex; gap: 20px; margin-bottom: 12px; }
        .tool-row i { font-size: 22px; cursor: pointer; color: #aaa; transition: 0.3s; }
        .tool-row i:hover { color: var(--accent); }

        .main-in { display: flex; gap: 10px; }
        input { flex: 1; background: #111; border: 1px solid #333; padding: 12px 20px; border-radius: 30px; color: #fff; outline: none; }
        .send-btn { background: var(--accent); border: none; width: 45px; height: 45px; border-radius: 50%; color: #fff; }

        /* VIP BADGE */
        .badge { font-size: 9px; background: var(--gold); color: #000; padding: 2px 6px; border-radius: 10px; font-weight: 900; margin-left: 5px; }
    </style>
</head>
<body>
    <div class="bg"></div>
    <div class="app">
        <header>
            <div style="font-weight:900;">TULIP <span style="color:var(--accent)">HOT</span></div>
            <div style="color:#0f0; font-size:12px;"><i class="fas fa-users"></i> <span id="online">1</span> LIVE</div>
        </header>

        <div id="chats"></div>

        <div class="input-area">
            <div class="tool-row">
                <label for="up"><i class="fas fa-camera"></i></label>
                <input type="file" id="up" hidden accept="image/*">
                <i class="fas fa-gift" onclick="alert('VIP Gifting Coming Soon!')"></i>
                <i class="fas fa-microphone" onclick="alert('Voice Chat Coming Soon!')"></i>
            </div>
            <div class="main-in">
                <input type="text" id="msg" placeholder="Write something hot..." autocomplete="off">
                <button class="send-btn" onclick="send()"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const user = new URLSearchParams(window.location.search).get('username') || "Guest";
        const role = new URLSearchParams(window.location.search).get('role') || "user";

        socket.emit('join', { username: user, role: role });

        socket.on('newMessage', (data) => {
            const box = document.getElementById('chats');
            const isMe = data.user === user;
            const div = document.createElement('div');
            div.className = `bubble ${isMe ? 'me' : 'others'}`;
            
            let html = `<div style="font-size:10px; font-weight:bold; margin-bottom:5px; color:${isMe?'#ffb3c1':'#ff0055'}">${data.user}`;
            if(data.role === 'owner') html += `<span class="badge">OWNER</span>`;
            html += `</div>`;

            if(data.type === 'image') {
                html += `<img src="${data.text}" style="max-width:100%; border-radius:10px;" onload="scroll()">`;
            } else {
                html += `<span>${data.text}</span>`;
            }

            div.innerHTML = html;
            box.appendChild(div);
            scroll();
        });

        socket.on('updateUserCount', (c) => document.getElementById('online').innerText = c);

        function send() {
            const i = document.getElementById('msg');
            if(!i.value.trim()) return;
            socket.emit('sendMessage', { text: i.value });
            i.value = '';
        }

        document.getElementById('up').onchange = (e) => {
            const r = new FileReader();
            r.onload = () => socket.emit('sendMessage', { type: 'image', text: r.result });
            r.readAsDataURL(e.target.files[0]);
        };

        function scroll() { const b = document.getElementById('chats'); b.scrollTop = b.scrollHeight; }
        document.getElementById('msg').onkeypress = (e) => { if(e.key==='Enter') send(); };
    </script>
</body>
</html>
