<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Tulip Chat</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f6f6f6;
}

#login{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:white;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

#login input{
margin:5px;
padding:10px;
width:200px;
}

#main{
display:none;
height:100vh;
}

#topbar{
height:50px;
background:#ff6b81;
color:white;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 10px;
}

#menu{
position:fixed;
left:-250px;
top:0;
width:250px;
height:100%;
background:white;
transition:.3s;
overflow:auto;
}

#menu.open{
left:0;
}

#onlineList div{
padding:10px;
border-bottom:1px solid #eee;
}

#chatArea{
display:flex;
height:calc(100vh - 50px);
}

#users{
width:30%;
background:#fff;
border-right:1px solid #ddd;
overflow:auto;
}

#chat{
width:70%;
display:flex;
flex-direction:column;
}

#messages{
flex:1;
overflow:auto;
padding:10px;
}

.msg{
margin:5px 0;
padding:8px;
background:white;
border-radius:6px;
}

#inputBar{
display:flex;
padding:10px;
background:#eee;
}

#inputBar input{
flex:1;
padding:10px;
}

#inputBar button{
margin-left:5px;
}

#progress{
font-size:12px;
color:#555;
}

#inboxBadge{
background:red;
color:white;
border-radius:50%;
padding:2px 6px;
font-size:12px;
}

</style>

</head>

<body>

<div id="login">

<h2>Tulip Chat</h2>

<input id="name" placeholder="Name">

<input id="age" placeholder="Age">

<select id="gender">
<option>Male</option>
<option>Female</option>
</select>

<button onclick="start()">Enter Chat</button>

</div>

<div id="main">

<div id="topbar">

<span onclick="toggleMenu()">☰</span>

<span>Tulip Chat</span>

<span>
📥 <span id="inboxBadge">0</span>
<button onclick="location.reload()">⟳</button>
</span>

</div>

<div id="menu">

<h3 style="padding:10px">Online Users</h3>

<div id="onlineList"></div>

</div>

<div id="chatArea">

<div id="users"></div>

<div id="chat">

<div id="messages"></div>

<div id="progress"></div>

<div id="inputBar">

<input id="msg" placeholder="message">

<input type="file" id="file">

<button onclick="send()">Send</button>

<button onclick="upload()">GIF / Pic</button>

</div>

</div>

</div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

let socket
let username
let dmUser=null
let unread=0

function start(){

username=document.getElementById("name").value

localStorage.setItem("username",username)

document.getElementById("login").style.display="none"

document.getElementById("main").style.display="block"

socket=io()

socket.emit("join",username)

socket.on("chat",(data)=>{

addMsg(data)

})

socket.on("join",(u)=>{

addMsg(u+" joined the chat")

})

socket.on("onlineUsers",(users)=>{

let html=""

users.forEach(u=>{

html+=`<div onclick="openDM('${u}')">${u}</div>`

})

document.getElementById("onlineList").innerHTML=html

})

socket.on("dm",(data)=>{

if(data.to===username){

unread++

document.getElementById("inboxBadge").innerText=unread

addMsg("(DM) "+data.from+": "+data.msg)

}

})

}

function addMsg(text){

let div=document.createElement("div")

div.className="msg"

div.innerHTML=text

document.getElementById("messages").appendChild(div)

document.getElementById("messages").scrollTop=999999

}

function send(){

let text=document.getElementById("msg").value

if(text==="/clear"){

document.getElementById("messages").innerHTML=""

return

}

if(dmUser){

socket.emit("dm",{to:dmUser,msg:text,from:username})

addMsg("(DM to "+dmUser+") "+text)

}else{

socket.emit("chat",username+": "+text)

}

document.getElementById("msg").value=""

}

function upload(){

let file=document.getElementById("file").files[0]

if(!file) return

let data=new FormData()

data.append("photo",file)

let xhr=new XMLHttpRequest()

xhr.open("POST","/upload")

xhr.upload.onprogress=function(e){

let percent=Math.round((e.loaded/e.total)*100)

document.getElementById("progress").innerText="upload "+percent+"%"

}

xhr.onload=function(){

let res=JSON.parse(xhr.responseText)

socket.emit("chat",username+`<br><img src="${res.url}" width="150">`)

}

xhr.send(data)

}

function toggleMenu(){

let m=document.getElementById("menu")

m.classList.toggle("open")

}

function openDM(u){

dmUser=u

addMsg("DM with "+u)

}

</script>

</body>
</html>
