<!DOCTYPE html><html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Tulip Chat</title><style>

/* ===== GLOBAL ===== */

*{
box-sizing:border-box;
}

body{
margin:0;
height:100vh;
display:flex;
flex-direction:column;
font-family:Arial, sans-serif;
background:#f5dbe3;
overflow:hidden;
}

/* ===== HEADER ===== */

#header{
height:50px;
background:#ff3d6e;
color:white;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 12px;
flex-shrink:0;
}

#title{
font-weight:bold;
font-size:16px;
}

#header button{
background:none;
border:none;
color:white;
font-size:18px;
cursor:pointer;
}

/* ===== USERS PANEL ===== */

#usersPanel{
position:fixed;
left:-250px;
top:50px;
width:230px;
height:100%;
background:white;
box-shadow:0 0 12px rgba(0,0,0,0.2);
transition:0.3s;
overflow-y:auto;
padding:10px;
z-index:1000;
}

#usersPanel.open{
left:0;
}

.userItem{
padding:6px;
border-bottom:1px solid #eee;
font-size:14px;
}

/* ===== INBOX PANEL ===== */

#inboxPanel{
position:fixed;
right:-260px;
top:50px;
width:240px;
height:100%;
background:white;
box-shadow:0 0 12px rgba(0,0,0,0.2);
transition:0.3s;
overflow-y:auto;
padding:10px;
z-index:1000;
}

#inboxPanel.open{
right:0;
}

/* ===== CHAT AREA ===== */

#chat{
flex:1;
overflow-y:auto;
padding:12px;
display:flex;
flex-direction:column;
gap:8px;
}

/* ===== MESSAGE ===== */

.msg{
background:#ff3d6e;
color:white;
padding:10px 14px;
border-radius:20px;
max-width:75%;
font-size:14px;
word-wrap:break-word;
}

.msg img{
max-width:220px;
border-radius:10px;
margin-top:4px;
}

/* ===== INPUT BAR ===== */

#inputBar{
height:65px;
display:flex;
align-items:center;
gap:6px;
padding:6px;
background:white;
flex-shrink:0;
border-top:1px solid #ddd;
}

#text{
flex:1;
border-radius:20px;
border:1px solid #ccc;
padding:10px;
font-size:14px;
outline:none;
}

button.sendBtn{
background:#ff3d6e;
border:none;
color:white;
padding:8px 12px;
border-radius:10px;
font-size:14px;
}

#progress{
font-size:12px;
color:#444;
margin-left:4px;
}

</style></head><body><!-- ===== HEADER ===== --><div id="header"><button onclick="toggleUsers()">☰</button>

<div id="title">Tulip Chat</div><div><button onclick="location.reload()">🔄</button>

<button onclick="toggleInbox()">📥</button>

</div></div><!-- USERS --><div id="usersPanel"><h3>Online Users</h3><div id="onlineList"></div></div><!-- INBOX --><div id="inboxPanel"><h3>Inbox</h3><div id="dmList">No messages</div></div><!-- CHAT --><div id="chat"></div><!-- INPUT --><div id="inputBar"><input id="text" placeholder="Type message"><button class="sendBtn" onclick="send()">Send</button>

<input type="file" id="file" hidden accept="image/*,.gif"><button class="sendBtn" onclick="upload()">GIF</button>

<span id="progress"></span>

</div><script src="/socket.io/socket.io.js"></script><script>

/* ===== SOCKET ===== */

const socket = io()

let username = localStorage.getItem("username") || prompt("Enter name")
let gender = localStorage.getItem("gender") || prompt("male / female")

localStorage.setItem("username",username)
localStorage.setItem("gender",gender)

socket.emit("join",{username,gender})

/* ===== AVATAR ===== */

function avatar(g){

return g==="female"?"👩":"👨"

}

/* ===== SEND MESSAGE ===== */

function send(){

let msg=text.value.trim()

if(!msg)return

if(msg==="/clear"){
chat.innerHTML=""
text.value=""
return
}

socket.emit("message",{username,gender,msg})

text.value=""

}

/* ===== RECEIVE MESSAGE ===== */

socket.on("message",(d)=>{

let div=document.createElement("div")

div.className="msg"

let icon=avatar(d.gender)

if(d.msg.includes("/uploads")){

div.innerHTML=icon+" "+d.username+"<br><img src='"+d.msg+"'>"

}else{

div.innerText=icon+" "+d.username+": "+d.msg

}

chat.appendChild(div)

chat.scrollTop=chat.scrollHeight

})

/* ===== ONLINE USERS ===== */

socket.on("onlineUsers",(users)=>{

onlineList.innerHTML=""

users.forEach(u=>{

let div=document.createElement("div")

div.className="userItem"

div.innerText=(u.gender==="female"?"👩":"👨")+" "+u.username

onlineList.appendChild(div)

})

})

/* ===== PANELS ===== */

function toggleUsers(){

usersPanel.classList.toggle("open")

}

function toggleInbox(){

inboxPanel.classList.toggle("open")

}

/* ===== FILE UPLOAD ===== */

function upload(){

file.click()

}

file.onchange=()=>{

let f=file.files[0]

let fd=new FormData()

fd.append("file",f)

let xhr=new XMLHttpRequest()

xhr.open("POST","/upload")

xhr.upload.onprogress=(e)=>{

let percent=Math.round((e.loaded/e.total)*100)

progress.innerText=percent+"%"

}

xhr.onload=()=>{

let res=JSON.parse(xhr.responseText)

socket.emit("message",{

username,

gender,

msg:res.url

})

progress.innerText=""

}

xhr.send(fd)

}

</script></body>
</html>
