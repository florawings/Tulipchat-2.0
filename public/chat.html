<!DOCTYPE html><html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Tulip Chat</title><style>

body{
margin:0;
font-family:system-ui;
background:#0f0f0f;
color:white;
display:flex;
height:100vh;
overflow:hidden;
}

/* SIDEBAR */

#sidebar{
width:220px;
background:#181818;
padding:10px;
position:absolute;
left:-220px;
top:0;
height:100%;
transition:0.3s;
}

#sidebar.open{
left:0;
}

.user{
padding:8px;
border-bottom:1px solid #333;
cursor:pointer;
}

.user:hover{
background:#333;
}

/* TOPBAR */

#topbar{
background:#1a1a1a;
padding:10px;
display:flex;
align-items:center;
gap:10px;
}

#menu{
font-size:20px;
cursor:pointer;
}

/* CHAT */

#chat{
flex:1;
display:flex;
flex-direction:column;
}

#messages{
flex:1;
overflow:auto;
padding:10px;
display:flex;
flex-direction:column;
gap:8px;
}

/* BUBBLES */

.msg{
padding:10px;
border-radius:10px;
max-width:70%;
}

.me{
background:#b983ff;
align-self:flex-end;
}

.other{
background:#2a2a2a;
align-self:flex-start;
}

/* INPUT */

#input{
display:flex;
padding:10px;
background:#1a1a1a;
}

#text{
flex:1;
padding:10px;
border:none;
border-radius:20px;
background:#2b2b2b;
color:white;
}

button{
margin-left:6px;
padding:10px;
border:none;
border-radius:6px;
background:#b983ff;
color:white;
}

</style></head><body><div id="sidebar">
<h3>Online Users</h3>
<div id="users"></div>
</div><div id="chat"><div id="topbar">
<span id="menu">☰</span>
<span id="title">Public Chat</span>
</div><div id="messages"></div><div id="input">
<input id="text" placeholder="Type message">
<button onclick="send()">Send</button>
<input type="file" id="file" accept="image/*">
<span id="progress"></span>
</div></div><script src="/socket.io/socket.io.js"></script><script src="client.js"></script></body>
</html>
