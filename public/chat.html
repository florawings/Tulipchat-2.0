<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tulip Chat</title>

<style>

body{
margin:0;
font-family:Arial;
background:#ececec;
}

.topbar{
background:black;
color:white;
padding:12px;
display:flex;
justify-content:space-between;
}

.menu{
position:fixed;
left:-260px;
top:0;
width:260px;
height:100%;
background:white;
transition:0.3s;
}

.menu.show{
left:0;
}

.users{
position:fixed;
right:-220px;
top:0;
width:220px;
height:100%;
background:#111;
color:white;
transition:0.3s;
}

.users.show{
right:0;
}

.chat{
height:70vh;
overflow:auto;
padding:10px;
}

.msg{
background:white;
padding:8px;
margin-bottom:6px;
border-radius:5px;
}

.system{
background:#eee;
font-style:italic;
}

.inputbar{
display:flex;
padding:8px;
background:white;
position:fixed;
bottom:0;
width:100%;
}

.inputbar input{
flex:1;
padding:10px;
}

</style>

</head>

<body>

<div class="topbar">

<div onclick="toggleMenu()">☰</div>

<div>🌷 Tulip Chat</div>

<div onclick="toggleUsers()">👥</div>

</div>

<div class="menu" id="menu">

<div onclick="joinRoom('public')">Public Chat</div>
<div onclick="createRoom()">Create Room</div>

</div>

<div class="users" id="users">

<h3 style="padding:10px">Users</h3>

</div>

<div class="chat" id="chat"></div>

<div class="inputbar">

<input id="msgInput" placeholder="Type message">

<button onclick="sendMsg()">Send</button>

<button onclick="sendImage()">📷</button>

<button onclick="sendGif()">GIF</button>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io()

let username = localStorage.getItem("name")

if(!username){

username = prompt("Enter username")

localStorage.setItem("name",username)

}

let room="public"

/* OWNER LOGIN */

let isOwner=false

if(username==="Lord_lucifer"){

let p=prompt("Owner password")

if(p==="766521"){

isOwner=true

}

}

/* JOIN ROOM */

socket.emit("joinRoom",{
username:username,
room:room
})

function joinRoom(r){

room=r

chat.innerHTML=""

socket.emit("joinRoom",{
username:username,
room:r
})

}

/* SEND MESSAGE */

function sendMsg(){

let text=msgInput.value

if(!text) return

socket.emit("chatMessage",{
username:username,
room:room,
message:text
})

msgInput.value=""

}

/* RECEIVE MESSAGE */

socket.on("message",(data)=>{

addMsg(data.username+": "+data.message)

})

/* SYSTEM MESSAGE */

socket.on("system",(msg)=>{

chat.innerHTML+=`
<div class="msg system">
${msg}
</div>
`

chat.scrollTop=chat.scrollHeight

})

/* IMAGE */

function sendImage(){

let url=prompt("Image URL")

socket.emit("chatMessage",{
username:username,
room:room,
message:"<img src='"+url+"' width='200'>"
})

}

/* GIF */

function sendGif(){

let url=prompt("GIF URL")

socket.emit("chatMessage",{
username:username,
room:room,
message:"<img src='"+url+"' width='200'>"
})

}

/* ADD MESSAGE */

function addMsg(text){

chat.innerHTML+=`
<div class="msg">
${text}
</div>
`

chat.scrollTop=chat.scrollHeight

}

/* MENU */

function toggleMenu(){

menu.classList.toggle("show")

}

/* USERS PANEL */

function toggleUsers(){

document.getElementById("users").classList.toggle("show")

}

/* ROOM */

function createRoom(){

let r=prompt("Room name")

alert("Room '"+r+"' created")

}

</script>

</body>
</html>
