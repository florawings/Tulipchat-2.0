<!DOCTYPE html><html>
<head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tulip Chat</title><style>

body{
margin:0;
font-family:Arial;
background:#f2dce3;
height:100vh;
display:flex;
flex-direction:column;
}

/* HEADER */

#header{
height:50px;
background:#ff3d6e;
color:white;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 12px;
flex-shrink:0;
}

#header button{
background:none;
border:none;
color:white;
font-size:18px;
}

/* CHAT AREA */

#chat{
flex:1;
overflow-y:auto;
padding:10px;
display:flex;
flex-direction:column;
gap:8px;
}

/* MESSAGE */

.msg{
background:#ff3d6e;
color:white;
padding:8px 14px;
border-radius:18px;
max-width:75%;
font-size:14px;
}

.msg img{
max-width:180px;
border-radius:8px;
}

/* INPUT */

#input{
height:60px;
background:white;
display:flex;
align-items:center;
padding:6px;
gap:6px;
flex-shrink:0;
}

#text{
flex:1;
padding:8px;
border-radius:18px;
border:1px solid #ccc;
}

button{
background:#ff3d6e;
color:white;
border:none;
padding:8px 12px;
border-radius:8px;
}

</style></head><body><div id="header"><button onclick="toggleMenu()">☰</button>

<div>Tulip Chat</div><div>
<button onclick="location.reload()">🔄</button>
<button onclick="openInbox()">📥</button>
</div></div><div id="chat"></div><div id="input"><input id="text" placeholder="Type message"><button onclick="send()">Send</button>

<input type="file" id="file" hidden accept="image/*,.gif"><button onclick="upload()">GIF</button>

</div><script src="/socket.io/socket.io.js"></script><script>

const socket = io()

let username = localStorage.getItem("username") || "User"
let gender = localStorage.getItem("gender") || "male"

socket.emit("join",{username,gender})

function avatar(g){
return g==="female"?"👩":"👨"
}

/* SEND MESSAGE */

function send(){

let msg=text.value.trim()

if(!msg) return

socket.emit("chat",{username,gender,msg})

text.value=""

}

/* RECEIVE MESSAGE */

socket.on("chat",(d)=>{

let div=document.createElement("div")
div.className="msg"

let icon=avatar(d.gender)

if(d.msg.includes("/uploads")){

div.innerHTML=icon+" "+d.username+"<br><img src='"+d.msg+"'>"

}else{

div.innerText=icon+" "+d.username+": "+d.msg

}

chat.appendChild(div)

chat.scrollTop=chat.scrollHeight

})

/* GIF / IMAGE UPLOAD */

function upload(){
file.click()
}

file.onchange=()=>{

let f=file.files[0]

let fd=new FormData()
fd.append("file",f)

fetch("/upload",{
method:"POST",
body:fd
})
.then(r=>r.json())
.then(d=>{

socket.emit("chat",{
username,
gender,
msg:d.url
})

})

}

function toggleMenu(){
alert("online users panel coming")
}

function openInbox(){
alert("DM inbox coming")
}

</script></body>
</html>
