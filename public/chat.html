<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tulip Chat</title>

<style>

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

body{
height:100vh;
display:flex;
background:#0f0f0f;
color:white;
overflow:hidden;
}

/* LEFT SIDEBAR */

#sidebar{
width:220px;
background:#111;
padding:10px;
overflow-y:auto;
}

#logo{
font-size:20px;
margin-bottom:15px;
}

.room{
padding:10px;
border-bottom:1px solid #222;
cursor:pointer;
}

.room:hover{
background:#1c1c1c;
}

/* CHAT AREA */

#chatArea{
flex:1;
display:flex;
flex-direction:column;
background:
linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.6)),
url("https://images.unsplash.com/photo-1499382926300-90a93d8a1d6c");

background-size:cover;
background-position:center;
}

/* HEADER */

#chatHeader{
height:50px;
background:#000;
display:flex;
align-items:center;
padding:0 15px;
}

#roomName{flex:1;font-weight:bold;}

#onlineCount{font-size:13px;opacity:.8}

/* MESSAGES */

#messages{
flex:1;
overflow-y:auto;
padding:15px;
}

.message{
background:#1c1c1c;
padding:10px;
border-radius:10px;
margin-bottom:10px;
max-width:70%;
}

.system{
opacity:.7;
font-style:italic;
}

/* INPUT BAR */

#inputBar{
display:flex;
padding:10px;
background:#000;
gap:6px;
}

#msgInput{
flex:1;
padding:10px;
border-radius:20px;
border:none;
outline:none;
}

button{
padding:10px 14px;
border:none;
background:#ff2e63;
color:white;
border-radius:8px;
cursor:pointer;
}

/* ONLINE USERS */

#users{
width:200px;
background:#151515;
overflow-y:auto;
padding:10px;
}

.user{
padding:8px;
border-bottom:1px solid #222;
cursor:pointer;
}

/* DM WINDOW */

.dm{
position:fixed;
bottom:0;
right:20px;
width:260px;
background:#111;
border:1px solid #333;
display:none;
}

.dmHeader{
background:#000;
padding:8px;
display:flex;
justify-content:space-between;
}

.dmMessages{
height:200px;
overflow-y:auto;
padding:10px;
}

.dmInput{
display:flex;
padding:8px;
gap:4px;
}

.dmInput input{
flex:1;
padding:6px;
}

img,video{
max-width:220px;
border-radius:8px;
margin-top:6px;
}

</style>
</head>

<body>

<!-- LEFT SIDEBAR -->

<div id="sidebar">

<div id="logo">🌷 Tulip Chat</div>

<div class="room">Adult Room</div>
<div class="room">Normal Room</div>
<div class="room">Private Room</div>

</div>

<!-- CHAT AREA -->

<div id="chatArea">

<div id="chatHeader">

<div id="roomName">Adult Room</div>

<div id="onlineCount">2 online</div>

</div>

<div id="messages"></div>

<div id="inputBar">

<input id="msgInput" placeholder="Type message">

<button onclick="sendMsg()">Send</button>

<button onclick="emoji()">😀</button>

<input type="file" id="file" hidden>

<button onclick="file.click()">📷</button>

</div>

</div>

<!-- ONLINE USERS -->

<div id="users">

<h3>Online</h3>

<div class="user" onclick="openDM('Garima')">Garima</div>
<div class="user" onclick="openDM('Rahul')">Rahul</div>

</div>

<!-- DM WINDOW -->

<div class="dm" id="dmBox">

<div class="dmHeader">

<span id="dmUser"></span>

<button onclick="closeDM()">X</button>

</div>

<div class="dmMessages" id="dmMessages"></div>

<div class="dmInput">

<input id="dmInput">

<button onclick="sendDM()">Send</button>

</div>

</div>

<script>

/* MAIN CHAT */

function sendMsg(){

let text=msgInput.value

if(!text) return

addMessage("You: "+text)

msgInput.value=""

}

function addMessage(text){

let div=document.createElement("div")

div.className="message"

div.innerText=text

messages.appendChild(div)

messages.scrollTop=messages.scrollHeight

}

function emoji(){

msgInput.value+="😊"

}

/* IMAGE UPLOAD */

file.onchange=function(){

let f=this.files[0]

let url=URL.createObjectURL(f)

let div=document.createElement("div")

div.className="message"

if(f.type.includes("video")){
div.innerHTML="<video src='"+url+"' controls autoplay loop></video>"
}else{
div.innerHTML="<img src='"+url+"'>"
}

messages.appendChild(div)

}

/* DM */

function openDM(name){

dmUser.innerText=name

dmBox.style.display="block"

}

function closeDM(){

dmBox.style.display="none"

}

function sendDM(){

let text=dmInput.value

let div=document.createElement("div")

div.innerText="Me: "+text

dmMessages.appendChild(div)

dmInput.value=""

}

/* SYSTEM DEMO */

setTimeout(()=>{
let div=document.createElement("div")
div.className="message system"
div.innerText="Garima joined the room"
messages.appendChild(div)
},2000)

</script>

</body>
</html>
