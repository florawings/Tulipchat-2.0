<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tulip Chat</title><script src="/socket.io/socket.io.js"></script><style>

body{
margin:0;
font-family:Arial;
background:#e6e6e6;
height:100vh;
display:flex;
flex-direction:column;
overflow:hidden;
}

.topbar{
background:black;
color:white;
padding:10px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-weight:bold;
}

.chat{
flex:1;
overflow-y:auto;
padding:10px;
}

.msg{
margin-bottom:12px;
}

.bubble{
background:white;
padding:10px;
border-radius:8px;
display:inline-block;
max-width:80%;
}

.tag{
font-size:11px;
color:gray;
margin-left:6px;
}

.inputbar{
display:flex;
align-items:center;
background:white;
padding:8px;
}

.inputbar input{
flex:1;
padding:10px;
border-radius:20px;
border:1px solid #ccc;
margin:0 5px;
}

.btn{
font-size:18px;
cursor:pointer;
margin:0 5px;
}

.menu{
position:fixed;
left:-260px;
top:0;
width:260px;
height:100%;
background:white;
box-shadow:2px 0 10px rgba(0,0,0,0.3);
transition:0.3s;
z-index:100;
overflow:auto;
}

.menu.show{
left:0;
}

.menu-header{
padding:20px;
background:#f3f3f3;
font-weight:bold;
}

.menu-item{
padding:15px;
border-bottom:1px solid #eee;
cursor:pointer;
}

.friends{
position:fixed;
right:-260px;
bottom:0;
width:260px;
height:60%;
background:white;
box-shadow:-2px 0 10px rgba(0,0,0,0.3);
transition:0.3s;
z-index:100;
overflow:auto;
border-top-left-radius:10px;
}

.friends.show{
right:0;
}

.friends-header{
padding:15px;
background:#f3f3f3;
font-weight:bold;
}

.friendbtn{
position:fixed;
bottom:10px;
right:10px;
background:black;
color:white;
padding:10px 15px;
border-radius:10px;
font-size:18px;
cursor:pointer;
z-index:200;
}

.room{
padding:10px;
border-bottom:1px solid #ddd;
cursor:pointer;
}

.room:hover{
background:#eee;
}

</style></head><body><div class="menu" id="menu"><div class="menu-header">
🌷 Tulip Chat
</div><div id="roomList"></div><div class="menu-item" onclick="createRoom()">➕ Create Room</div></div><div class="friends" id="friends"><div class="friends-header">
👥 Friends
</div><div id="friendsList" style="padding:10px"><div>👨 Rahul 🟢</div>
<div>👩 Neha 🟢</div></div></div><div class="topbar"><div onclick="toggleMenu()">☰</div><div class="logo">🌷 Tulip Chat</div><div>🔔</div></div><div class="chat" id="chat"></div><div class="inputbar"><span class="btn" onclick="uploadImage()">🖼</span>
<span class="btn" onclick="sendGIF()">🎞</span>
<span class="btn" onclick="youtube()">▶</span>
<span class="btn" onclick="uploadVideo()">🎥</span>
<span class="btn" onclick="voiceTyping()">🎤</span>

<input id="msgInput" placeholder="Type message"><span class="btn" onclick="sendMsg()">➤</span>

</div><div class="friendbtn" onclick="toggleFriends()">≡</div><input type="file" id="imgFile" accept="image/*" style="display:none">
<input type="file" id="videoFile" accept="video/*" style="display:none"><script>

let socket = io()

let username = localStorage.getItem("name")
let type = localStorage.getItem("type")

let currentRoom="general"

socket.emit("join",{name:username,type:type})



function toggleMenu(){
menu.classList.toggle("show")
}

function toggleFriends(){
friends.classList.toggle("show")
}



function sendMsg(){

let input=document.getElementById("msgInput")

if(input.value==="") return

socket.emit("message",{
room:currentRoom,
text:input.value
})

input.value=""

}



socket.on("message",(data)=>{

let badge=""

if(data.role==="owner"){
badge="👑 Owner"
}

if(data.role==="superadmin"){
badge="⭐ Admin"
}

if(data.role==="user"){
badge="✔ User"
}

if(data.role==="guest"){
badge="👻 Guest"
}

chat.innerHTML+=`

<div class="msg">

<div class="bubble">

<b>${data.user}</b>
<span class="tag">${badge}</span>

<br>

${data.text}

<button onclick="kick('${data.user}')">Kick</button>

</div>

</div>

`

chat.scrollTop=chat.scrollHeight

})



function kick(name){
socket.emit("kick",name)
}



socket.on("rooms",(rooms)=>{

roomList.innerHTML=""

rooms.forEach(r=>{

roomList.innerHTML+=`
<div class="room" onclick="joinRoom('${r}')">
${r}
</div>
`

})

})



function joinRoom(room){

currentRoom=room

chat.innerHTML=""

socket.emit("joinRoom",room)

}



function createRoom(){

let room=prompt("Room name")

if(!room) return

socket.emit("createRoom",room)

}



/* MEDIA FEATURES */

function uploadImage(){

let file=imgFile

file.click()

file.onchange=function(){

let reader=new FileReader()

reader.onload=function(e){

chat.innerHTML+=`
<div class="msg">
<img src="${e.target.result}" width="200">
</div>
`

}

reader.readAsDataURL(file.files[0])

}

}



function sendGIF(){

let url=prompt("Paste GIF URL")

if(!url) return

chat.innerHTML+=`
<div class="msg">
<img src="${url}" width="200">
</div>
`

}



function youtube(){

let link=prompt("YouTube link")

if(!link) return

let id=link.split("v=")[1]

chat.innerHTML+=`
<iframe width="250" height="150"
src="https://www.youtube.com/embed/${id}"
frameborder="0"
allowfullscreen>
</iframe>
`

}



function uploadVideo(){

let file=videoFile

file.click()

file.onchange=function(){

let url=URL.createObjectURL(file.files[0])

chat.innerHTML+=`
<video width="250" controls>
<source src="${url}">
</video>
`

}

}



function voiceTyping(){

let speech=new webkitSpeechRecognition()

speech.lang="en-US"

speech.start()

speech.onresult=function(event){

msgInput.value=event.results[0][0].transcript

}

}

</script></body>
</html>
