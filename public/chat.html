<!DOCTYPE html>
<html>

<head>

<title>Tulip Chat</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<script src="/socket.io/socket.io.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#ffd6ea;
}

.top{
background:#ff2e93;
color:white;
padding:12px;
font-size:18px;
}

.container{
display:flex;
height:calc(100vh - 60px);
}

.users{
width:22%;
background:black;
color:white;
padding:10px;
overflow:auto;
}

.chat{
flex:1;
display:flex;
flex-direction:column;
background:white;
}

#messages{
flex:1;
overflow:auto;
padding:10px;
}

.msg{
background:#f1f1f1;
padding:10px;
margin-bottom:8px;
border-radius:6px;
}

.input{
display:flex;
padding:10px;
background:#eee;
position:fixed;
bottom:0;
left:0;
right:0;
}

.input input{
flex:1;
padding:12px;
font-size:16px;
border-radius:6px;
border:1px solid #ccc;
}

.input button{
padding:12px 14px;
margin-left:6px;
font-size:16px;
border:none;
border-radius:6px;
}

.send{
background:#ff2e93;
color:white;
}

.cam{
background:#2196f3;
color:white;
}

.gif{
background:#ff9800;
color:white;
}

</style>

</head>

<body>

<div class="top">🌷 Tulip Chat</div>

<div class="container">

<div class="users">

<h3>Online</h3>

<div id="online"></div>

</div>

<div class="chat">

<div id="messages"></div>

</div>

</div>

<div class="input">

<input id="msg" placeholder="message">

<button class="send" onclick="send()">Send</button>

<button class="cam" onclick="openGallery()">📷</button>

<button class="gif" onclick="sendGif()">GIF</button>

<input type="file" id="imageInput" accept="image/*" style="display:none">

</div>

<script>

let socket = io()

let name = prompt("Enter name")

socket.emit("join",{name:name})

let messages = document.getElementById("messages")

function add(text){

messages.innerHTML += "<div class='msg'>"+text+"</div>"

messages.scrollTop = messages.scrollHeight

}

function send(){

let text = document.getElementById("msg").value

if(!text) return

socket.emit("message",{

user:name,
text:text

})

msg.value=""

}

/* IMAGE FROM GALLERY */

function openGallery(){

document.getElementById("imageInput").click()

}

document.getElementById("imageInput").addEventListener("change",function(){

let file=this.files[0]

if(!file) return

let reader=new FileReader()

reader.onload=function(e){

socket.emit("image",{

user:name,
url:e.target.result

})

}

reader.readAsDataURL(file)

})

/* GIF */

function sendGif(){

let url=prompt("Paste GIF link")

if(!url) return

socket.emit("image",{

user:name,
url:url

})

}

/* RECEIVE MESSAGE */

socket.on("message",(d)=>{

add("<b>"+d.user+"</b>: "+d.text)

})

/* RECEIVE IMAGE */

socket.on("image",(d)=>{

add("<b>"+d.user+"</b><br><img src='"+d.url+"' width='200'>")

})

/* SYSTEM MESSAGE */

socket.on("system",(t)=>{

add("<i>"+t+"</i>")

})

/* ONLINE USERS */

socket.on("online",(users)=>{

let html=""

for(let id in users){

html += "<div>"+users[id].name+"</div>"

}

document.getElementById("online").innerHTML = html

})

</script>

</body>

</html>
