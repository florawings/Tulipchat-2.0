<!DOCTYPE html><html>
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Tulip Chat</title><style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial;
}

body{

height:100dvh;
display:flex;
flex-direction:column;

background:
linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),
url("https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2");

background-size:cover;
background-position:center;

color:white;

}

/* header */

#header{

height:55px;
display:flex;
align-items:center;

background:#ff3b6b;

padding:0 15px;

font-weight:bold;

}

#menuBtn{

font-size:22px;
margin-right:10px;
cursor:pointer;

}

/* sidebar */

#sidebar{

position:fixed;
left:-260px;
top:0;

width:260px;
height:100%;

background:rgba(0,0,0,0.9);

padding:20px;

transition:0.3s;

z-index:10;

}

#sidebar.show{
left:0;
}

#overlay{

position:fixed;
top:0;
left:0;

width:100%;
height:100%;

background:rgba(0,0,0,0.5);

display:none;

z-index:9;

}

#overlay.show{
display:block;
}

/* users */

#userList{
list-style:none;
margin-top:15px;
}

#userList li{

padding:8px;
border-radius:6px;
cursor:pointer;

}

#userList li:hover{

background:rgba(255,255,255,0.15);

}

/* chat */

#messages{

flex:1;
overflow-y:auto;
padding:15px;

scroll-behavior:smooth;

}

/* message bubble */

.message{

max-width:75%;
padding:10px 14px;

border-radius:14px;

margin-bottom:12px;

background:rgba(255,255,255,0.2);

}

.me{

background:#ff3b6b;
margin-left:auto;

}

.system{

font-size:13px;
opacity:0.8;
text-align:center;

}

/* avatar */

.avatar{

width:28px;
height:28px;

border-radius:50%;

background:white;

color:black;

display:inline-flex;
align-items:center;
justify-content:center;

font-size:13px;
margin-right:6px;

}

/* media */

.chatMedia{

max-width:230px;

border-radius:10px;

margin-top:6px;

}

/* reactions */

.reactions{

font-size:13px;
margin-top:4px;

}

/* typing */

#typing{

font-size:12px;
opacity:0.8;

padding-left:15px;

}

/* input */

#inputArea{

display:flex;

padding:10px;

background:rgba(0,0,0,0.75);

}

#msgInput{

flex:1;

padding:10px;

border:none;

border-radius:20px;

outline:none;

}

button{

margin-left:6px;

padding:9px 12px;

border:none;

background:#ff3b6b;

color:white;

border-radius:8px;

cursor:pointer;

}

#uploadStatus{

font-size:12px;

padding-left:15px;

}

</style></head><body><div id="sidebar"><h3>Online Users</h3><p id="onlineCount">0 users online</p><ul id="userList"></ul></div><div id="overlay" onclick="closeMenu()"></div><div id="header"><span id="menuBtn" onclick="toggleMenu()">☰</span>

Tulip Chat

</div><div id="messages"></div><div id="typing"></div><div id="uploadStatus"></div><div id="inputArea"><input id="msgInput" placeholder="Type message"><button onclick="sendMsg()">Send</button>

<button onclick="addEmoji()">😀</button>

<input type="file" id="fileInput" accept="image/*,image/gif" style="display:none"><button onclick="fileInput.click()">📷</button>

</div><script src="/socket.io/socket.io.js"></script><script>

const socket = io({

reconnection:true,
reconnectionAttempts:Infinity,
reconnectionDelay:1000

})

let username = localStorage.getItem("username")

if(!username){

username = prompt("Enter name")

localStorage.setItem("username",username)

}

socket.emit("join",username)

/* menu */

function toggleMenu(){

sidebar.classList.toggle("show")
overlay.classList.toggle("show")

}

function closeMenu(){

sidebar.classList.remove("show")
overlay.classList.remove("show")

}

/* message */

function addMessage(html,type=""){

let div=document.createElement("div")

div.className="message "+type

div.innerHTML=html

messages.appendChild(div)

messages.scrollTop=messages.scrollHeight

}

/* time */

function getTime(){

let d=new Date()

return d.getHours()+":"+("0"+d.getMinutes()).slice(-2)

}

/* send */

function sendMsg(){

let msg=msgInput.value

if(msg=="") return

socket.emit("chat message",{

user:username,
msg:msg,
time:getTime()

})

msgInput.value=""

}

/* receive */

socket.on("chat message",(data)=>{

let type=""

if(data.user===username) type="me"

addMessage("<span class='avatar'>"+data.user[0]+"</span><b>"+data.user+"</b> "+data.time+"<br>"+data.msg+"<div class='reactions'>❤️ 🔥 👍</div>",type)

})

/* system */

socket.on("system",(msg)=>{

addMessage(msg,"system")

})

/* users */

socket.on("user list",(users)=>{

onlineCount.innerText=users.length+" users online"

userList.innerHTML=""

users.forEach(u=>{

let li=document.createElement("li")

li.innerText=u

li.onclick=()=>sendDM(u)

userList.appendChild(li)

})

})

/* dm */

function sendDM(user){

let msg=prompt("DM "+user)

if(!msg) return

socket.emit("private message",{

from:username,
to:user,
msg:msg

})

}

socket.on("private message",(data)=>{

addMessage("<b>DM "+data.from+":</b> "+data.msg)

})

/* emoji */

function addEmoji(){

msgInput.value+="😊"

}

/* typing */

msgInput.addEventListener("input",()=>{

socket.emit("typing",username)

})

socket.on("typing",(user)=>{

typing.innerText=user+" is typing..."

setTimeout(()=>typing.innerText="",1500)

})

/* upload */

fileInput.addEventListener("change",function(){

let file=this.files[0]

if(!file) return

let form=new FormData()

form.append("image",file)

let xhr=new XMLHttpRequest()

xhr.open("POST","/upload")

xhr.upload.onprogress=function(e){

if(e.lengthComputable){

let percent=Math.round((e.loaded/e.total)*100)

uploadStatus.innerText="Uploading "+percent+"%"

}

}

xhr.onload=function(){

uploadStatus.innerText=""

let data=JSON.parse(xhr.responseText)

socket.emit("chat message",{

user:username,

msg:"<img class='chatMedia' src='"+data.url+"'>",

time:getTime()

})

}

xhr.send(form)

})

</script></body>
</html>
