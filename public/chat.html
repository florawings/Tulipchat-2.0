<!DOCTYPE html><html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tulip Chat</title><style>
*{box-sizing:border-box}

body{
margin:0;
height:100vh;
font-family:Arial;
background:#f2dce3;
overflow:hidden;
}

/* HEADER */

#header{
position:fixed;
top:0;
left:0;
right:0;
height:50px;
background:#ff3d6e;
color:white;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 12px;
z-index:1000;
}

#header button{
background:none;
border:none;
color:white;
font-size:18px;
}

/* USERS PANEL */

#usersPanel{
position:fixed;
left:-230px;
top:50px;
width:220px;
height:100%;
background:white;
transition:0.3s;
box-shadow:0 0 10px rgba(0,0,0,0.2);
padding:10px;
overflow:auto;
}

#usersPanel.open{
left:0;
}

/* INBOX PANEL */

#inboxPanel{
position:fixed;
right:-250px;
top:50px;
width:230px;
height:100%;
background:white;
transition:0.3s;
box-shadow:0 0 10px rgba(0,0,0,0.2);
padding:10px;
overflow:auto;
}

#inboxPanel.open{
right:0;
}

/* CHAT AREA */

#chat{
position:absolute;
top:50px;
bottom:60px;
left:0;
right:0;
overflow-y:auto;
padding:10px;
display:flex;
flex-direction:column;
gap:8px;
}

/* MESSAGE */

.msg{
background:#ff3d6e;
color:white;
padding:10px 14px;
border-radius:20px;
max-width:75%;
font-size:14px;
word-wrap:break-word;
}

.msg img{
max-width:200px;
border-radius:10px;
margin-top:5px;
}

/* INPUT BAR */

#inputBar{
position:fixed;
bottom:0;
left:0;
width:100%;
height:60px;
background:white;
display:flex;
align-items:center;
gap:6px;
padding:6px;
border-top:1px solid #ccc;
}

#text{
flex:1;
border-radius:20px;
border:1px solid #ccc;
padding:8px;
font-size:14px;
}

button.send{
background:#ff3d6e;
color:white;
border:none;
padding:8px 12px;
border-radius:10px;
}

#progress{
font-size:12px;
color:#444;
}

/* USERS */

.userItem{
padding:6px;
border-bottom:1px solid #eee;
font-size:14px;
}
</style></head><body><!-- HEADER --><div id="header"><button onclick="toggleUsers()">☰</button>

<div>Tulip Chat</div><div><button onclick="location.reload()">🔄</button>

<button onclick="toggleInbox()">📥</button>

</div></div><!-- USERS --><div id="usersPanel"><h3>Online Users</h3><div id="onlineList"></div></div><!-- INBOX --><div id="inboxPanel"><h3>Inbox</h3><div>No DM yet</div></div><!-- CHAT --><div id="chat"></div><!-- INPUT --><div id="inputBar"><input id="text" placeholder="Type message"><button class="send" onclick="send()">Send</button>

<input type="file" id="file" hidden accept="image/*,.gif"><button class="send" onclick="upload()">GIF</button>

<span id="progress"></span>

</div><script src="/socket.io/socket.io.js"></script><script>

const socket = io()

/* LOGIN ONCE */

let username = localStorage.getItem("username")
let gender = localStorage.getItem("gender")

if(!username){
username = prompt("Enter name")
localStorage.setItem("username",username)
}

if(!gender){
gender = prompt("male / female")
localStorage.setItem("gender",gender)
}

socket.emit("join",{username,gender})

/* AVATAR */

function avatar(g){
return g==="female"?"👩":"👨"
}

/* SEND MESSAGE */

function send(){

let msg=text.value.trim()

if(!msg)return

socket.emit("message",{username,gender,msg})

text.value=""

}

/* RECEIVE MESSAGE */

socket.on("message",(d)=>{

let div=document.createElement("div")
div.className="msg"

let icon=avatar(d.gender)

if(d.msg.includes("/uploads")){
div.innerHTML=icon+" "+d.username+"<br><img src='"+d.msg+"'>"
}else{
div.innerText=icon+" "+d.username+": "+d.msg
}

chat.appendChild(div)

chat.scrollTop=chat.scrollHeight

})

/* ONLINE USERS */

socket.on("onlineUsers",(users)=>{

onlineList.innerHTML=""

users.forEach(u=>{

let div=document.createElement("div")
div.className="userItem"

div.innerText=(u.gender==="female"?"👩":"👨")+" "+u.username

onlineList.appendChild(div)

})

})

/* PANELS */

function toggleUsers(){
usersPanel.classList.toggle("open")
}

function toggleInbox(){
inboxPanel.classList.toggle("open")
}

/* FILE UPLOAD */

function upload(){
file.click()
}

file.onchange=()=>{

let f=file.files[0]

let fd=new FormData()
fd.append("file",f)

let xhr=new XMLHttpRequest()

xhr.open("POST","/upload")

xhr.upload.onprogress=(e)=>{

let percent=Math.round((e.loaded/e.total)*100)
progress.innerText=percent+"%"

}

xhr.onload=()=>{

let res=JSON.parse(xhr.responseText)

socket.emit("message",{
username,
gender,
msg:res.url
})

progress.innerText=""

}

xhr.send(fd)

}

</script></body>
</html>
