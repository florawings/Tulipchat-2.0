<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Tulip Chat</title>

<style>

/* BASIC RESET */

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial;
}

/* BODY */

body{
height:100vh;
display:flex;
background:#f2f2f2;
}

/* SIDEBAR */

#sidebar{
width:220px;
background:#1e1e2f;
color:white;
display:flex;
flex-direction:column;
}

#sidebar h2{
padding:15px;
border-bottom:1px solid #333;
}

#users{
flex:1;
overflow:auto;
}

.user{
padding:10px;
cursor:pointer;
border-bottom:1px solid #333;
}

.user:hover{
background:#2c2c44;
}

/* MAIN */

#main{
flex:1;
display:flex;
flex-direction:column;
}

/* HEADER */

#header{
background:#ff2d6f;
color:white;
padding:15px;
display:flex;
justify-content:space-between;
}

/* CHAT AREA */

#messages{
flex:1;
overflow:auto;
padding:10px;
}

.message{
background:white;
padding:10px;
margin-bottom:10px;
border-radius:6px;
max-width:70%;
}

.my{
background:#d8ffd8;
margin-left:auto;
}

.system{
text-align:center;
color:#666;
margin:10px;
}

/* INPUT BAR */

#sendBar{
display:flex;
padding:10px;
gap:6px;
background:white;
border-top:1px solid #ddd;
}

#messageInput{
flex:1;
padding:10px;
border-radius:6px;
border:1px solid #ccc;
}

/* BUTTONS */

button{
background:#ff2d6f;
color:white;
border:none;
padding:10px 14px;
border-radius:6px;
cursor:pointer;
}

button:hover{
opacity:0.8;
}

/* IMAGE */

img{
max-width:200px;
border-radius:6px;
margin-top:5px;
}

/* DM WINDOW */

#dmWindow{
position:fixed;
right:10px;
bottom:10px;
width:300px;
background:white;
border-radius:8px;
box-shadow:0 0 10px rgba(0,0,0,0.2);
display:none;
flex-direction:column;
}

#dmHeader{
background:#ff2d6f;
color:white;
padding:10px;
}

#dmMessages{
flex:1;
overflow:auto;
padding:10px;
height:200px;
}

#dmInputBar{
display:flex;
padding:6px;
}

#dmInput{
flex:1;
padding:8px;
border:1px solid #ccc;
}

</style>

</head>

<body>

<!-- SIDEBAR -->

<div id="sidebar">

<h2>Online</h2>

<div id="users"></div>

</div>

<!-- MAIN -->

<div id="main">

<div id="header">

<div>🌷 Tulip Chat</div>

<div onclick="logout()">Logout</div>

</div>

<div id="messages"></div>

<div id="sendBar">

<input id="messageInput" placeholder="message">

<button onclick="sendMessage()">Send</button>

<input type="file" id="imageUpload" hidden>

<button onclick="openImage()">📷</button>

<button onclick="sendGIF()">GIF</button>

</div>

</div>

<!-- DM WINDOW -->

<div id="dmWindow">

<div id="dmHeader"></div>

<div id="dmMessages"></div>

<div id="dmInputBar">

<input id="dmInput">

<button onclick="sendDM()">Send</button>

</div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io()

let username = localStorage.getItem("username")

if(!username){

username = prompt("Enter name")

localStorage.setItem("username",username)

}

/* JOIN */

socket.emit("join",username)

const messages=document.getElementById("messages")

const usersDiv=document.getElementById("users")

/* ADD MESSAGE */

function addMessage(data){

let div=document.createElement("div")

if(data.type==="system"){

div.className="system"

div.innerText=data.text

}

else{

div.className="message"

if(data.user===username) div.classList.add("my")

if(data.type==="image"){

div.innerHTML="<b>"+data.user+"</b><br><img src='"+data.text+"'>"

}

else{

div.innerHTML="<b>"+data.user+"</b>: "+data.text

}

}

messages.appendChild(div)

messages.scrollTop=messages.scrollHeight

}

/* RECEIVE */

socket.on("message",(data)=>{

addMessage(data)

saveLocal(data)

})

/* SEND */

function sendMessage(){

let text=document.getElementById("messageInput").value.trim()

if(!text) return

socket.emit("message",{

user:username,

text:text,

type:"text"

})

document.getElementById("messageInput").value=""

}

/* ENTER SEND */

document.getElementById("messageInput").addEventListener("keypress",e=>{

if(e.key==="Enter") sendMessage()

})

/* IMAGE */

function openImage(){

document.getElementById("imageUpload").click()

}

document.getElementById("imageUpload").addEventListener("change",function(){

const file=this.files[0]

const reader=new FileReader()

reader.onload=function(){

socket.emit("message",{

user:username,

text:reader.result,

type:"image"

})

}

reader.readAsDataURL(file)

})

/* GIF */

function sendGIF(){

const url=prompt("Paste GIF link")

if(!url) return

socket.emit("message",{

user:username,

text:url,

type:"image"

})

}

/* ONLINE USERS */

socket.on("users",(list)=>{

usersDiv.innerHTML=""

list.forEach(u=>{

let div=document.createElement("div")

div.className="user"

div.innerText=u

div.onclick=()=>openDM(u)

usersDiv.appendChild(div)

})

})

/* DM */

let currentDM=null

function openDM(user){

currentDM=user

document.getElementById("dmWindow").style.display="flex"

document.getElementById("dmHeader").innerText="DM : "+user

document.getElementById("dmMessages").innerHTML=""

}

/* SEND DM */

function sendDM(){

let text=document.getElementById("dmInput").value

socket.emit("dm",{

to:currentDM,

from:username,

text:text

})

document.getElementById("dmInput").value=""

}

/* RECEIVE DM */

socket.on("dm",(data)=>{

if(data.from===currentDM){

let div=document.createElement("div")

div.innerText=data.from+": "+data.text

document.getElementById("dmMessages").appendChild(div)

}

})

/* LOCAL STORAGE SAVE */

function saveLocal(data){

let history=JSON.parse(localStorage.getItem("chatHistory")||"[]")

history.push(data)

localStorage.setItem("chatHistory",JSON.stringify(history))

}

/* LOAD HISTORY */

window.onload=()=>{

let history=JSON.parse(localStorage.getItem("chatHistory")||"[]")

history.forEach(addMessage)

}

/* LOGOUT */

function logout(){

localStorage.removeItem("username")

location.href="login.html"

}

</script>

</body>

</html>
