<!DOCTYPE html><html>
<head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tulip Chat</title><style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial;
background:#0e0e0e;
display:flex;
height:100vh;
color:white;
overflow:hidden;
}

/* sidebar */

#sidebar{
width:200px;
background:black;
padding:15px;
}

#sidebar h2{
color:#ff4da6;
margin-top:0;
}

.room{
padding:8px;
background:#111;
border-radius:6px;
margin-bottom:6px;
cursor:pointer;
}

.room:hover{
background:#222;
}

/* chat */

#chat{
flex:1;
display:flex;
flex-direction:column;
background:url("https://images.unsplash.com/photo-1518199266791-5375a83190b7") center/cover;
}

/* messages */

#messages{
flex:1;
overflow-y:auto;
padding:15px;
}

.message{
background:rgba(0,0,0,0.6);
padding:10px;
border-radius:10px;
margin-bottom:10px;
max-width:70%;
}

.message img{
max-width:200px;
border-radius:10px;
}

.message video{
max-width:220px;
border-radius:10px;
}

/* input bar */

#inputBar{
display:flex;
padding:10px;
background:black;
position:fixed;
bottom:0;
left:200px;
right:0;
}

#text{
flex:1;
padding:10px;
border:none;
border-radius:20px;
outline:none;
}

button{
margin-left:6px;
padding:10px;
border:none;
border-radius:8px;
background:#ff4da6;
color:white;
cursor:pointer;
}

#file{
margin-left:6px;
}

#progress{
margin-left:10px;
font-size:12px;
}

</style></head><body><div id="sidebar"><h2>Tulip Chat</h2><div class="room" onclick="joinRoom('normal')">Normal Room</div><div class="room" onclick="joinRoom('adult')">Adult Room</div><h3>Online Users</h3><div id="online"></div></div><div id="chat"><div id="messages"></div></div><div id="inputBar"><input id="text" placeholder="Type message"><button onclick="sendMsg()">Send</button>

<input type="file" id="file"><span id="progress"></span>

</div><script src="/socket.io/socket.io.js"></script><script>

const socket=io()

let room="normal"

let username=localStorage.getItem("username")||prompt("Enter username")

function joinRoom(r){

room=r

socket.emit("join",r)

}

function addMsg(html){

let div=document.createElement("div")

div.className="message"

div.innerHTML=html

document.getElementById("messages").appendChild(div)

document.getElementById("messages").scrollTop=999999

}

function sendMsg(){

let text=document.getElementById("text").value

if(!text)return

socket.emit("message",{room,user:username,msg:text})

document.getElementById("text").value=""

}

socket.on("message",(data)=>{

addMsg("<b>"+data.user+":</b> "+data.msg)

})

/* file upload */

document.getElementById("file").onchange=function(){

let file=this.files[0]

let form=new FormData()

form.append("file",file)

let xhr=new XMLHttpRequest()

xhr.open("POST","/upload")

xhr.upload.onprogress=e=>{

let p=Math.round((e.loaded/e.total)*100)

document.getElementById("progress").innerText=p+"%"

}

xhr.onload=()=>{

let url=xhr.responseText

if(file.type.startsWith("image")){

socket.emit("message",{room,user:username,msg:"<img src='"+url+"'>"})

}

}

xhr.send(form)

}

</script></body>
</html>
