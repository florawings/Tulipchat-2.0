<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tulip Pro | Master</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #f43f5e;
            --owner-gold: #fbbf24;
            --glass: rgba(15, 23, 42, 0.7);
            --sidebar-bg: rgba(15, 23, 42, 0.85);
        }

        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #000 url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1200') no-repeat center center fixed;
            background-size: cover;
            overflow: hidden;
            color: #f8fafc;
        }

        /* --- SLIM HEADER --- */
        header {
            height: 55px;
            background: var(--glass);
            backdrop-filter: blur(15px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1100;
        }

        .brand { font-weight: 600; font-size: 18px; letter-spacing: 1px; }
        .brand span { color: var(--primary); }

        /* --- LAYOUT ENGINE --- */
        #main-container { display: flex; flex: 1; overflow: hidden; }

        /* --- GLASS SIDEBAR --- */
        #sidebar {
            background: var(--sidebar-bg);
            backdrop-filter: blur(25px);
            transition: 0.4s ease;
            z-index: 2000;
            padding: 15px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255,255,255,0.1);
        }

        /* Mobile Adjustments */
        @media screen and (max-width: 767px) {
            #sidebar { position: fixed; left: -100%; width: 75%; height: 100%; }
            #sidebar.open { left: 0; box-shadow: 20px 0 50px rgba(0,0,0,0.5); }
            .msg { max-width: 85%; }
        }

        /* PC Adjustments */
        @media screen and (min-width: 768px) {
            #sidebar { position: static; width: 280px; left: 0; }
            #sidebar-toggle { display: none; }
            .msg { max-width: 60%; }
        }

        /* --- MODERN CHAT BUBBLES --- */
        #chat-scroller {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: rgba(0,0,0,0.2);
        }

        .msg {
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 14px;
            position: relative;
            animation: popIn 0.2s ease-out;
            backdrop-filter: blur(8px);
        }

        @keyframes popIn { from { opacity:0; transform: scale(0.9); } to { opacity:1; transform: scale(1); } }

        .msg.me {
            align-self: flex-end;
            background: linear-gradient(135deg, #f43f5e 0%, #fb7185 100%);
            border-bottom-right-radius: 2px;
            box-shadow: 0 4px 12px rgba(244, 63, 94, 0.3);
        }

        .msg.other {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.12);
            border-bottom-left-radius: 2px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* FIX: Undefined Name Solution */
        .u-name { font-size: 11px; font-weight: 600; margin-bottom: 2px; display: block; opacity: 0.9; }
        .u-name.owner { color: var(--owner-gold); text-shadow: 0 0 8px rgba(251,191,36,0.4); }

        /* --- INPUT AREA --- */
        .input-area {
            padding: 12px;
            background: var(--glass);
            display: flex;
            gap: 10px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        #msgIn {
            flex: 1;
            padding: 10px 18px;
            border-radius: 25px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05);
            color: white;
            outline: none;
        }

        #sendBtn {
            background: var(--primary);
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(244, 63, 94, 0.4);
        }

        .user-item {
            padding: 10px;
            margin-bottom: 6px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.2s;
        }
        .user-item:hover { background: rgba(255,255,255,0.1); }
        .user-item.owner-gold { border-left: 3px solid var(--owner-gold); }

        #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1500; }
    </style>
</head>
<body>

<div id="overlay" onclick="toggleSidebar()"></div>

<header>
    <div id="sidebar-toggle" onclick="toggleSidebar()" style="font-size:22px; cursor:pointer;">☰</div>
    <div class="brand">TULIP <span>PRO</span></div>
    <div id="status" style="font-size:10px; color:var(--owner-gold); font-weight:600;">Public Room</div>
</header>

<div id="main-container">
    <div id="sidebar">
        <h3 style="color:var(--primary); font-size:16px; margin:0 0 15px 0;">Online Users</h3>
        <div id="online-list" style="flex:1; overflow-y:auto;"></div>
        <button onclick="location.href='index.html'" style="margin-top:10px; width:100%; padding:10px; background:rgba(244,63,94,0.1); color:var(--primary); border:1px solid var(--primary); border-radius:10px; font-weight:600;">🚪 LOGOUT</button>
    </div>

    <div id="chat-section" style="flex:1; display:flex; flex-direction:column;">
        <div id="chat-scroller"></div>
        <div class="input-area">
            <input type="text" id="msgIn" placeholder="Write something..." autocomplete="off">
            <button id="sendBtn" onclick="send()">➤</button>
        </div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    const params = new URLSearchParams(window.location.search);
    const username = params.get('username') || "Guest";
    const gender = params.get('gender') || "Male";
    const role = params.get('role') || "user";

    let selectedUser = 'all';

    socket.emit('join', { username, gender, role });

    function toggleSidebar() {
        const sb = document.getElementById('sidebar');
        const ov = document.getElementById('overlay');
        sb.classList.toggle('open');
        ov.style.display = sb.classList.contains('open') ? 'block' : 'none';
    }

    // --- USER LIST UPDATE (FIXED UNDEFINED) ---
    socket.on('updateUserList', (users) => {
        const list = document.getElementById('online-list');
        list.innerHTML = users.map(u => `
            <div class="user-item ${u.role === 'owner' ? 'owner-gold' : ''}" onclick="startDM('${u.username}')">
                <span style="font-size:20px;">${u.gender === 'Female' ? '👩' : '👨'}</span>
                <span style="color:${u.role === 'owner' ? 'var(--owner-gold)' : 'white'}; font-weight:600; font-size:13px;">${u.username}</span>
            </div>
        `).join('') + `<div onclick="startDM('all')" class="user-item" style="opacity:0.5; margin-top:10px; font-size:12px;">🌍 Return to Public</div>`;
    });

    function startDM(user) {
        selectedUser = user;
        document.getElementById('status').innerText = (user === 'all') ? "Public Room" : "DM: " + user;
        if(window.innerWidth < 768) toggleSidebar();
    }

    // --- MESSAGE RENDERING (FIXED UNDEFINED) ---
    socket.on('newMessage', (data) => {
        const div = document.createElement('div');
        const isMe = data.user === username;
        div.className = `msg ${isMe ? 'me' : 'other'}`;
        
        const senderName = data.user || "Guest";
        const senderIcon = data.gender === 'Female' ? '👩' : '👨';
        const nameClass = data.role === 'owner' ? 'u-name owner' : 'u-name';
        const pvtTag = data.to !== 'all' ? ' <small style="color:gold;">(PVT)</small>' : '';

        div.innerHTML = `<span class="${nameClass}">${senderIcon} ${senderName}${pvtTag}</span>${data.text}`;
        
        const scroller = document.getElementById('chat-scroller');
        scroller.appendChild(div);
        scroller.scrollTop = scroller.scrollHeight;
    });

    function send() {
        const input = document.getElementById('msgIn');
        const val = input.value.trim();
        if(!val) return;

        if(val === '/clear' && role === 'owner') {
            socket.emit('adminClear');
        } else {
            socket.emit('sendMessage', { message: val, to: selectedUser });
        }
        input.value = '';
    }

    socket.on('clearScreen', () => { document.getElementById('chat-scroller').innerHTML = ''; });
    document.getElementById('msgIn').addEventListener('keypress', (e) => { if(e.key === 'Enter') send(); });
</script>
</body>
</html>
