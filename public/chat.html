<!DOCTYPE html><html>
<head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tulip Chat</title><style>

body{
margin:0;
font-family:Arial;
height:100vh;
display:flex;
flex-direction:column;

background:
linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),
url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee");

background-size:cover;
color:white;
}

/* header */

#header{
height:50px;
background:#111;
display:flex;
align-items:center;
padding:0 10px;
}

#menuBtn{
font-size:22px;
cursor:pointer;
}

/* sidebar */

#sidebar{
position:fixed;
left:-260px;
top:0;
width:260px;
height:100%;
background:#000;
transition:.3s;
padding:20px;
}

#sidebar.show{
left:0;
}

.menuItem{
padding:10px;
border-bottom:1px solid #333;
cursor:pointer;
}

/* chat */

#messages{
flex:1;
overflow-y:auto;
padding:15px;
}

.message{
background:rgba(0,0,0,0.65);
padding:10px;
border-radius:10px;
margin-bottom:10px;
}

.chatMedia{
max-width:220px;
border-radius:8px;
}

/* input */

#inputArea{
display:flex;
padding:10px;
background:#111;
}

#msgInput{
flex:1;
padding:10px;
border:none;
border-radius:20px;
}

button{
margin-left:6px;
padding:8px 12px;
background:#ff3b6b;
border:none;
color:white;
border-radius:8px;
}

/* DM popup */

#dmBox{
position:fixed;
right:20px;
bottom:80px;
width:250px;
background:#111;
display:none;
flex-direction:column;
border-radius:10px;
}

#dmMessages{
height:200px;
overflow-y:auto;
padding:10px;
}

</style></head><body><div id="sidebar"><h3>Rooms</h3><div class="menuItem" onclick="joinRoom('adult')">Adult room</div>
<div class="menuItem" onclick="joinRoom('normal')">Normal room</div>
<div class="menuItem" onclick="joinRoom('private')">Private room</div></div><div id="header"><span id="menuBtn" onclick="toggleMenu()">☰</span>

<span style="margin-left:10px">Tulip Chat</span>

<span id="online" style="margin-left:auto"></span>

</div><div id="messages"></div><div id="inputArea"><input id="msgInput" placeholder="Type here"><button onclick="sendMsg()">Send</button>

<input type="file" id="fileInput" style="display:none"><button onclick="fileInput.click()">📷</button>

</div><div id="dmBox"><div id="dmMessages"></div><input id="dmInput" placeholder="DM..."></div><script src="/socket.io/socket.io.js"></script><script>

const socket = io()

let username = localStorage.getItem("username")

if(!username){

username = prompt("Enter name")
localStorage.setItem("username",username)

}

let room="adult"

socket.emit("join",{username,room})

function toggleMenu(){

sidebar.classList.toggle("show")

}

/* rooms */

function joinRoom(r){

room=r
messages.innerHTML=""

socket.emit("join",{username,room})

}

/* message */

function addMsg(html){

let div=document.createElement("div")
div.className="message"
div.innerHTML=html

messages.appendChild(div)

messages.scrollTop=messages.scrollHeight

}

function sendMsg(){

let msg=msgInput.value

socket.emit("chat message",{

user:username,
msg:msg,
room:room

})

msgInput.value=""

}

socket.on("chat message",(data)=>{

addMsg("<b>"+data.user+"</b><br>"+data.msg)

})

socket.on("system",(msg)=>{

addMsg("<i>"+msg+"</i>")

})

socket.on("online",(list)=>{

online.innerText="Online: "+list.length

})

/* DM */

socket.on("dm",(data)=>{

dmBox.style.display="flex"

dmMessages.innerHTML += "<b>"+data.from+"</b>: "+data.msg+"<br>"

})

/* upload */

fileInput.onchange=function(){

let file=this.files[0]

let form=new FormData()

form.append("file",file)

fetch("/upload",{method:"POST",body:form})

.then(r=>r.json())

.then(data=>{

let url=data.url
let ext=url.split('.').pop()

let media=""

if(ext==="mp4"){

media=`<video class="chatMedia" controls autoplay loop src="${url}"></video>`

}else{

media=`<img class="chatMedia" src="${url}">`

}

socket.emit("chat message",{

user:username,
msg:media,
room:room

})

})

}

</script></body>
</html>
