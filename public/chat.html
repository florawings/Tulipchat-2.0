<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Tulip Chat</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f4f4f4;
height:100vh;
display:flex;
flex-direction:column;
}

.topbar{
background:#ff5c7a;
color:white;
padding:12px;
display:flex;
justify-content:space-between;
align-items:center;
font-weight:bold;
}

.container{
display:flex;
flex:1;
}

.sidebar{
width:220px;
background:#ececec;
padding:10px;
}

.chatArea{
flex:1;
display:flex;
flex-direction:column;
}

.messages{
flex:1;
overflow:auto;
padding:10px;
}

.msg{
background:white;
padding:8px;
margin-bottom:6px;
border-radius:6px;
}

.inputBar{
display:flex;
padding:10px;
background:#ddd;
}

.inputBar input{
flex:1;
padding:10px;
border:none;
border-radius:4px;
}

.inputBar button{
margin-left:6px;
padding:10px 14px;
background:#ff5c7a;
border:none;
color:white;
border-radius:4px;
}

.user{
font-size:14px;
margin-bottom:6px;
}

.owner{
color:red;
font-weight:bold;
}

</style>

</head>

<body>

<div class="topbar">

<span>🌷 Tulip Chat</span>

<span id="userInfo"></span>

</div>

<div class="container">

<div class="sidebar">

<div><b>Online Users</b></div>

<div id="onlineList"></div>

</div>

<div class="chatArea">

<div class="messages" id="chat"></div>

<div class="inputBar">

<input id="msg" placeholder="Type message">

<button onclick="send()">Send</button>

</div>

</div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io()

let username = localStorage.getItem("username")
let role = localStorage.getItem("role")

if(!username){
 window.location="login.html"
}

let userInfo = username

if(role === "owner"){
 userInfo += " (OWNER)"
}

document.getElementById("userInfo").innerText = userInfo

socket.emit("join", username)

socket.on("chat",(msg)=>{

 let div=document.createElement("div")

 div.className="msg"

 div.innerText=msg

 document.getElementById("chat").appendChild(div)

})

socket.on("onlineUsers",(users)=>{

 let list=""

 users.forEach(u=>{

  list += `<div class="user">${u}</div>`

 })

 document.getElementById("onlineList").innerHTML=list

})

function send(){

 let msg=document.getElementById("msg").value

 if(!msg) return

 socket.emit("chat",username+": "+msg)

 document.getElementById("msg").value=""

}

</script>

</body>
</html>
