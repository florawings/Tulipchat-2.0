<!DOCTYPE html>
<html>

<head>

<title>Tulip Chat</title>

<script src="/socket.io/socket.io.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#e9eef3;
}

#topbar{
background:#111;
color:white;
padding:12px;
display:flex;
justify-content:space-between;
}

#container{
display:flex;
height:90vh;
}

/* rooms */

#rooms{
width:200px;
background:white;
border-right:1px solid #ccc;
}

.room{
padding:12px;
cursor:pointer;
border-bottom:1px solid #eee;
}

.room:hover{
background:#f5f5f5;
}

/* chat */

#chat{
flex:1;
display:flex;
flex-direction:column;
}

#messages{
flex:1;
overflow:auto;
padding:15px;
}

.msg{
background:white;
margin:6px 0;
padding:8px;
border-radius:6px;
box-shadow:0 0 3px rgba(0,0,0,0.1);
}

/* users */

#users{
width:180px;
background:white;
border-left:1px solid #ccc;
padding:10px;
}

/* send */

#sendbox{
display:flex;
border-top:1px solid #ccc;
}

#msg{
flex:1;
padding:12px;
border:none;
}

#send{
background:#22c55e;
color:white;
border:none;
padding:12px 18px;
cursor:pointer;
}

</style>

</head>

<body>

<div id="topbar">

<div>Tulip Chat</div>

<div id="user"></div>

</div>

<div id="container">

<div id="rooms">

<div class="room" onclick="joinRoom('main')">Main Room</div>
<div class="room" onclick="joinRoom('adult')">Adult Room</div>
<div class="room" onclick="joinRoom('quiz')">Quiz Room</div>
<div class="room" onclick="joinRoom('marathi')">Marathi Room</div>

</div>

<div id="chat">

<div id="messages"></div>

<div id="sendbox">

<input id="msg" placeholder="Type message">

<button id="send">Send</button>

</div>

</div>

<div id="users">

<h3>Online</h3>
<div id="userlist"></div>

</div>

</div>

<script>

const socket = io()

let username = localStorage.getItem("username")

let currentRoom="main"

if(!username){

location="index.html"

}

document.getElementById("user").innerText=username

socket.emit("join",{
username:username,
room:currentRoom
})

function joinRoom(room){

currentRoom = room

document.getElementById("messages").innerHTML=""

socket.emit("join",{
username:username,
room:room
})

}

document.getElementById("send").onclick=function(){

let text=document.getElementById("msg").value

if(text=="") return

socket.emit("chat message",{
user:username,
msg:text,
room:currentRoom
})

document.getElementById("msg").value=""

}

socket.on("chat message",(data)=>{

let div=document.createElement("div")

div.className="msg"

div.innerText=data.user + " : " + data.msg

document.getElementById("messages").appendChild(div)

})

</script>

</body>

</html>
