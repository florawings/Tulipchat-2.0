<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tulip Chat</title><style>

body{
margin:0;
font-family:Arial;
background:#0f0f0f;
color:white;
display:flex;
height:100vh;
overflow:hidden;
}

/* SIDEBAR */

#sidebar{
width:220px;
background:#1a1a1a;
padding:10px;
display:flex;
flex-direction:column;
}

#sidebar h3{
margin-top:0;
color:#ff4da6;
}

.room{
padding:8px;
cursor:pointer;
border-radius:6px;
margin-bottom:5px;
}

.room:hover{
background:#333;
}

/* ONLINE USERS */

#online{
flex:1;
overflow:auto;
}

#online div{
padding:6px;
cursor:pointer;
border-bottom:1px solid #333;
}

/* CHAT AREA */

#chat{
flex:1;
display:flex;
flex-direction:column;
}

/* MESSAGES */

#messages{
flex:1;
overflow-y:auto;
padding:15px;
}

.message{
background:#262626;
padding:10px;
border-radius:10px;
margin-bottom:10px;
max-width:70%;
}

/* INPUT BAR */

#inputBar{
display:flex;
padding:10px;
background:#1a1a1a;
}

#text{
flex:1;
padding:10px;
border:none;
border-radius:20px;
outline:none;
}

button{
margin-left:6px;
padding:10px;
border:none;
border-radius:8px;
background:#ff4da6;
color:white;
cursor:pointer;
}

#file{
margin-left:5px;
}

#progress{
font-size:12px;
margin-left:10px;
}

/* DM WINDOW */

#dmBox{
position:fixed;
right:20px;
bottom:20px;
width:260px;
background:#1a1a1a;
border-radius:10px;
display:none;
flex-direction:column;
}

#dmHeader{
background:#ff4da6;
padding:10px;
border-radius:10px 10px 0 0;
}

#dmMessages{
height:180px;
overflow:auto;
padding:10px;
}

#dmInput{
display:flex;
padding:10px;
}

#dmText{
flex:1;
padding:8px;
border:none;
border-radius:10px;
}

</style></head><body><!-- SIDEBAR --><div id="sidebar"><h3>Tulip Chat</h3><div class="room" onclick="room='normal'">Normal Room</div><div class="room" onclick="room='adult'">Adult Room</div><div class="room" onclick="room='private'">Private Room</div><h4>Online Users</h4><div id="online"></div></div><!-- CHAT --><div id="chat"><div id="messages"></div><div id="inputBar"><input id="text" placeholder="Type message"><button onclick="sendMessage()">Send</button>

<input type="file" id="file"><span id="progress"></span>

</div></div><!-- DM --><div id="dmBox"><div id="dmHeader" id="dmUser">DM</div><div id="dmMessages"></div><div id="dmInput"><input id="dmText"><button onclick="sendDM()">Send</button>

</div></div><script src="/socket.io/socket.io.js"></script><script src="client.js"></script></body></html>
