<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tulip Chat</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f1f1f1;
}

header{
background:#ff2d7a;
color:white;
padding:12px;
display:flex;
justify-content:space-between;
align-items:center;
font-size:18px;
}

#menu button{
background:white;
border:none;
padding:6px 10px;
margin-left:5px;
border-radius:5px;
}

#chat{
height:75vh;
overflow:auto;
padding:10px;
}

.msg{
background:white;
padding:10px;
margin:6px 0;
border-radius:8px;
}

.bottom{
position:fixed;
bottom:0;
width:100%;
display:flex;
background:white;
border-top:1px solid #ccc;
}

.bottom input{
flex:1;
padding:12px;
border:none;
}

.bottom button{
border:none;
padding:12px;
background:#ff2d7a;
color:white;
}

</style>

</head>

<body>

<header>

<span>🌷 Tulip Chat</span>

<div id="menu">

<button onclick="showUsers()">👥</button>

<button onclick="showDM()">💬</button>

<button onclick="logout()">🚪</button>

</div>

</header>

<div id="chat"></div>

<div class="bottom">

<button onclick="emoji()">😀</button>

<input id="msg" placeholder="message">

<button onclick="send()">Send</button>

<button onclick="image()">📷</button>

<button onclick="gif()">GIF</button>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket=io()

let name=localStorage.getItem("name")

socket.emit("join",name)

socket.on("msg",(data)=>{

let div=document.createElement("div")

div.className="msg"

div.innerText=data.name+": "+data.text

document.getElementById("chat").appendChild(div)

})

function send(){

let text=document.getElementById("msg").value

socket.emit("msg",{
name:name,
text:text
})

document.getElementById("msg").value=""

}

function logout(){

localStorage.clear()

location.href="/"

}

function showUsers(){
alert("Online users feature")
}

function showDM(){
alert("DM inbox feature")
}

function emoji(){
document.getElementById("msg").value+="😀"
}

function image(){
alert("Upload image feature")
}

function gif(){
alert("GIF feature")
}

</script>

</body>
</html>
