<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Tulip Chat</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f2f2f2;
}

header{
background:#ff2d7a;
color:white;
padding:12px;
display:flex;
justify-content:space-between;
}

#users{
position:fixed;
left:0;
top:50px;
bottom:0;
width:120px;
background:black;
color:white;
overflow:auto;
}

#chat{
margin-left:120px;
padding:10px;
height:80vh;
overflow:auto;
}

.msg{
background:white;
padding:8px;
margin:5px;
border-radius:6px;
}

.system{
background:#ddd;
}

.bottom{
position:fixed;
bottom:0;
left:120px;
right:0;
display:flex;
}

.bottom input{
flex:1;
padding:10px;
border:none;
}

button{
border:none;
padding:10px;
background:#ff2d7a;
color:white;
}

img{
max-width:150px;
border-radius:6px;
}

</style>

</head>

<body>

<header>

<span>🌷 Tulip Chat</span>

</header>

<div id="users"></div>

<div id="chat"></div>

<div class="bottom">

<input id="msg" placeholder="message">

<button onclick="send()">Send</button>

<input type="file" id="imgInput" hidden>

<button onclick="upload()">📷</button>

<button onclick="gif()">GIF</button>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io()

let name = localStorage.getItem("name")

if(!name){

name = prompt("Enter name")

localStorage.setItem("name",name)

}

socket.emit("join",name)

socket.on("system",(text)=>{

addMessage("System: "+text,"system")

})

socket.on("message",(data)=>{

addMessage(data.name+": "+data.text)

})

socket.on("image",(data)=>{

let div = document.createElement("div")

div.className="msg"

div.innerHTML = data.name + "<br><img src='"+data.url+"'>"

chat.appendChild(div)

})

socket.on("gif",(data)=>{

let div = document.createElement("div")

div.className="msg"

div.innerHTML = data.name + "<br><img src='"+data.url+"'>"

chat.appendChild(div)

})

socket.on("dm",(data)=>{

addMessage("DM from "+data.from+": "+data.text)

})

socket.on("users",(list)=>{

users.innerHTML=""

for(let id in list){

let u=document.createElement("div")

u.innerText=list[id]

u.onclick=()=>{

let msg=prompt("DM message")

socket.emit("dm",{

to:id,

name:name,

text:msg

})

}

users.appendChild(u)

}

})

function send(){

let text=msg.value

socket.emit("message",{

name:name,

text:text

})

msg.value=""

}

function upload(){

imgInput.click()

}

imgInput.onchange=function(){

let file=this.files[0]

let reader=new FileReader()

reader.onload=function(){

socket.emit("image",{

name:name,

url:reader.result

})

}

reader.readAsDataURL(file)

}

function gif(){

let url=prompt("Paste GIF link")

socket.emit("gif",{

name:name,

url:url

})

}

function addMessage(text,type){

let div=document.createElement("div")

div.className="msg "+(type||"")

div.innerText=text

chat.appendChild(div)

chat.scrollTop=chat.scrollHeight

}

</script>

</body>
</html>
