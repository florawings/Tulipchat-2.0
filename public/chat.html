<!DOCTYPE html><html>
<head><title>Tulip Chat</title><style>

body{
margin:0;
display:flex;
height:100vh;
font-family:sans-serif;
background:linear-gradient(135deg,#ffd6e7,#ffe9f3,#f5e6ff);
}

#sidebar{
width:220px;
background:rgba(255,255,255,0.7);
padding:15px;
}

#chatArea{
flex:1;
display:flex;
flex-direction:column;
}

#messages{
flex:1;
overflow:auto;
padding:20px;
}

.message{
background:white;
padding:10px;
border-radius:10px;
margin-bottom:10px;
max-width:70%;
}

.me{
background:#ff4d8d;
color:white;
margin-left:auto;
}

#inputArea{
display:flex;
padding:10px;
background:white;
}

#msgInput{
flex:1;
padding:10px;
border-radius:10px;
border:1px solid #ccc;
}

button{
margin-left:5px;
padding:8px 12px;
border:none;
background:#ff4d8d;
color:white;
border-radius:8px;
cursor:pointer;
}

#userList li{
cursor:pointer;
margin-bottom:5px;
}

</style></head><body><div id="sidebar"><h3>🌷 Tulip Chat</h3><button onclick="logout()">Logout</button>

<p id="onlineCount">0 users online</p><ul id="userList"></ul></div><div id="chatArea"><div id="messages"></div><div id="inputArea"><input id="msgInput" placeholder="Type message"><button onclick="sendMsg()">Send</button>

</div></div><script src="/socket.io/socket.io.js"></script><script>

const socket=io()

let username=localStorage.getItem("username")

if(!username){
location="/"
}

socket.emit("join",username)

function addMessage(text,type=""){

let div=document.createElement("div")

div.className="message "+type

div.innerHTML=text

document.getElementById("messages").appendChild(div)

document.getElementById("messages").scrollTop=
document.getElementById("messages").scrollHeight

}

function sendMsg(){

let input=document.getElementById("msgInput")

if(input.value.trim()=="") return

socket.emit("chat message",{
user:username,
msg:input.value
})

input.value=""

}

socket.on("chat message",(data)=>{

let type=""

if(data.user===username){
type="me"
}

addMessage("<b>"+data.user+":</b> "+data.msg,type)

})

socket.on("private message",(data)=>{

addMessage("<b>DM "+data.from+":</b> "+data.msg)

})

socket.on("user list",(users)=>{

document.getElementById("onlineCount").innerText=
users.length+" users online"

let ul=document.getElementById("userList")

ul.innerHTML=""

users.forEach(u=>{

let li=document.createElement("li")

li.innerText=u

li.onclick=()=>sendDM(u)

ul.appendChild(li)

})

})

function sendDM(user){

let msg=prompt("Send message to "+user)

if(!msg) return

socket.emit("private message",{
from:username,
to:user,
msg:msg
})

}

function logout(){

localStorage.removeItem("username")

location="/"

}

</script></body>
</html>
