<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tulip Chat</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f2d6dd;
height:100vh;
display:flex;
flex-direction:column;
}

/* TOP BAR */

.topbar{
height:60px;
background:#ff3f6c;
color:white;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 15px;
font-size:20px;
}

.icons{
display:flex;
gap:15px;
font-size:20px;
cursor:pointer;
}

/* MAIN */

.main{
flex:1;
display:flex;
overflow:hidden;
}

/* USERS 30% */

.users{
width:30%;
background:white;
border-right:2px solid #ddd;
overflow-y:auto;
padding:10px;
}

.user{
padding:8px;
border-bottom:1px solid #eee;
cursor:pointer;
}

/* CHAT 70% */

.chat{
width:70%;
display:flex;
flex-direction:column;
}

/* MESSAGES */

.messages{
flex:1;
overflow-y:auto;
padding:15px;
}

.msg{
background:#ff4d7d;
color:white;
padding:10px 15px;
border-radius:20px;
margin:6px 0;
max-width:70%;
}

.system{
background:#aaa;
}

/* IMAGE */

.msg img{
max-width:200px;
border-radius:10px;
}

/* INPUT */

.input{
display:flex;
padding:10px;
gap:8px;
background:white;
border-top:1px solid #ddd;
}

.input input[type=text]{
flex:1;
padding:10px;
border-radius:20px;
border:1px solid #ccc;
}

.btn{
background:#ff3f6c;
border:none;
color:white;
padding:10px 15px;
border-radius:10px;
cursor:pointer;
}

/* PROGRESS */

#progress{
font-size:12px;
color:#444;
margin-left:5px;
}

</style>
</head>

<body>

<!-- TOP BAR -->

<div class="topbar">

<div>🌷 Tulip Chat</div>

<div class="icons">

<span onclick="openInbox()">📥</span>

<span onclick="ownerPanel()">🛠</span>

</div>

</div>

<!-- MAIN -->

<div class="main">

<!-- USERS -->

<div class="users" id="users"></div>

<!-- CHAT -->

<div class="chat">

<div class="messages" id="messages"></div>

<div class="input">

<input id="msg" placeholder="Type message">

<button class="btn" onclick="send()">Send</button>

<button class="btn" onclick="gif()">GIF</button>

<label class="btn">
📷
<input type="file" id="file" hidden>
</label>

<span id="progress"></span>

</div>

</div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket=io()

let username=localStorage.username || prompt("Enter name")

socket.emit("join",{username})

/* SEND MESSAGE */

function send(){

let m=msg.value

if(!m) return

socket.emit("msg",m)

msg.value=""

}

/* RECEIVE MESSAGE */

socket.on("msg",(data)=>{

let div=document.createElement("div")

div.className="msg"

if(data.system) div.classList.add("system")

if(data.image){

div.innerHTML="<b>"+data.username+"</b><br><img src='"+data.image+"'>"

}else{

div.innerHTML="<b>"+(data.username||"System")+"</b>: "+data.text

}

messages.appendChild(div)

messages.scrollTop=messages.scrollHeight

})

/* USERS */

socket.on("users",(list)=>{

users.innerHTML=""

list.forEach(u=>{

let div=document.createElement("div")

div.className="user"

div.innerHTML=u.username+" ➜ DM"

div.onclick=()=>openDM(u.username)

users.appendChild(div)

})

})

/* CLEAR */

socket.on("clear",()=>{

messages.innerHTML=""

})

/* FILE UPLOAD */

file.onchange=()=>{

let f=file.files[0]

let form=new FormData()

form.append("file",f)

let xhr=new XMLHttpRequest()

xhr.open("POST","/upload")

xhr.upload.onprogress=(e)=>{

let p=Math.round((e.loaded/e.total)*100)

progress.innerText=p+"%"

}

xhr.onload=()=>{

let res=JSON.parse(xhr.response)

socket.emit("msg",{

image:res.url

})

progress.innerText=""

}

xhr.send(form)

}

/* GIF BUTTON */

function gif(){

let url=prompt("Paste GIF url")

if(url){

socket.emit("msg",{image:url})

}

}

/* INBOX */

function openInbox(){

alert("DM inbox")

}

/* OWNER PANEL */

function ownerPanel(){

alert("Owner dashboard")

}

/* DM */

function openDM(user){

alert("Open DM with "+user)

}

</script>

</body>
                                         </html>
