<!DOCTYPE html>
<html>

<head>

<title>Chat</title>

<script src="/socket.io/socket.io.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#eee;
}

#top{
background:black;
color:white;
padding:15px;
display:flex;
justify-content:space-between;
}

#messages{
height:70vh;
overflow:auto;
padding:10px;
}

.msg{
background:#ddd;
padding:8px;
margin:5px 0;
border-radius:5px;
}

#sendbox{
position:fixed;
bottom:0;
width:100%;
display:flex;
}

#msg{
flex:1;
padding:12px;
border:none;
}

#send{
background:#22c55e;
color:white;
border:none;
padding:12px 20px;
}

</style>

</head>

<body>

<div id="top">

<div id="user"></div>

<button onclick="logout()">Logout</button>

</div>

<div id="messages"></div>

<div id="sendbox">

<input id="msg">

<button id="send">Send</button>

</div>

<script>

const socket = io()

let username=localStorage.getItem("username")

if(!username){

location="index.html"

}

document.getElementById("user").innerText="User: "+username

socket.emit("join",username)

document.getElementById("send").onclick=function(){

let text=document.getElementById("msg").value

socket.emit("chat message",{user:username,msg:text})

document.getElementById("msg").value=""

}

socket.on("chat message",(data)=>{

let div=document.createElement("div")

div.className="msg"

div.innerText=data.user+" : "+data.msg

document.getElementById("messages").appendChild(div)

})

function logout(){

localStorage.removeItem("username")

location="index.html"

}

</script>

</body>

</html>
