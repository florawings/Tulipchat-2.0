<!DOCTYPE html><html>
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Tulip Chat</title><style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial;
}

body{

height:100dvh;
display:flex;

background:
linear-gradient(rgba(0,0,0,0.55),rgba(0,0,0,0.55)),
url("https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2");

background-size:cover;
background-position:center;

color:white;

}

/* sidebar */

#sidebar{

width:230px;
background:rgba(0,0,0,0.65);
padding:15px;
overflow:auto;

}

#sidebar h2{
margin-bottom:10px;
}

#onlineCount{
margin-bottom:10px;
}

#userList{
list-style:none;
}

#userList li{
padding:6px;
cursor:pointer;
border-radius:6px;
}

#userList li:hover{
background:rgba(255,255,255,0.15);
}

/* chat area */

#chatArea{

flex:1;
display:flex;
flex-direction:column;

}

/* header */

#header{

height:55px;
display:flex;
align-items:center;
padding-left:15px;
background:#ff3b6b;

font-weight:bold;

}

/* messages */

#messages{

flex:1;
overflow-y:auto;
padding:15px;

}

/* bubble */

.message{

max-width:70%;
padding:10px 14px;
border-radius:15px;
margin-bottom:10px;

background:rgba(255,255,255,0.2);

}

.me{
background:#ff3b6b;
margin-left:auto;
}

/* image */

.chatImg{
max-width:230px;
border-radius:10px;
margin-top:6px;
}

/* input */

#inputArea{

display:flex;
padding:10px;
background:rgba(0,0,0,0.65);

}

#msgInput{

flex:1;
padding:10px;
border:none;
border-radius:20px;
outline:none;

}

button{

margin-left:6px;
padding:9px 12px;
border:none;
background:#ff3b6b;
color:white;
border-radius:8px;
cursor:pointer;

}

/* upload status */

#uploadStatus{

font-size:12px;
padding-left:15px;

}

/* mobile */

@media(max-width:700px){

#sidebar{
display:none;
}

}

</style></head><body><div id="sidebar"><h2>🌷 Tulip Chat</h2><button onclick="logout()">Logout</button>

<p id="onlineCount">0 users online</p><ul id="userList"></ul></div><div id="chatArea"><div id="header">Tulip Chat

</div><div id="messages"></div><div id="uploadStatus"></div><div id="inputArea"><input id="msgInput" placeholder="Type message"><button onclick="sendMsg()">Send</button>

<input type="file" id="fileInput" accept="image/*,image/gif" style="display:none"><button onclick="fileInput.click()">📷 / GIF</button>

</div></div><script src="/socket.io/socket.io.js"></script><script>

const socket = io()

let username = localStorage.getItem("username")

if(!username){

username = prompt("Enter your name")

localStorage.setItem("username",username)

}

socket.emit("join",username)


function addMessage(html,type=""){

let div = document.createElement("div")

div.className="message "+type

div.innerHTML=html

messages.appendChild(div)

messages.scrollTop = messages.scrollHeight

}


/* send text */

function sendMsg(){

let msg = msgInput.value

if(msg=="") return

socket.emit("chat message",{

user:username,
msg:msg

})

msgInput.value=""

}


/* receive message */

socket.on("chat message",(data)=>{

let type=""

if(data.user===username){

type="me"

}

addMessage("<b>"+data.user+":</b> "+data.msg,type)

})


/* system message */

socket.on("system",(msg)=>{

addMessage("<i>"+msg+"</i>")

})


/* user list */

socket.on("user list",(users)=>{

onlineCount.innerText = users.length+" users online"

userList.innerHTML=""

users.forEach(u=>{

let li=document.createElement("li")

li.innerText=u

li.onclick=()=>sendDM(u)

userList.appendChild(li)

})

})


/* DM */

function sendDM(user){

let msg = prompt("Send message to "+user)

if(!msg) return

socket.emit("private message",{

from:username,
to:user,
msg:msg

})

}


/* receive DM */

socket.on("private message",(data)=>{

addMessage("<b>DM "+data.from+":</b> "+data.msg)

})


/* upload image */

fileInput.addEventListener("change",function(){

let file=this.files[0]

if(!file) return

let form=new FormData()

form.append("image",file)

let xhr=new XMLHttpRequest()

xhr.open("POST","/upload")

xhr.upload.onprogress=function(e){

if(e.lengthComputable){

let percent=Math.round((e.loaded/e.total)*100)

uploadStatus.innerText="Uploading "+percent+"%"

}

}

xhr.onload=function(){

uploadStatus.innerText=""

let data=JSON.parse(xhr.responseText)

socket.emit("chat message",{

user:username,
msg:"<img class='chatImg' src='"+data.url+"'>"

})

}

xhr.send(form)

})


function logout(){

localStorage.removeItem("username")

location.reload()

}

</script></body>
</html>
