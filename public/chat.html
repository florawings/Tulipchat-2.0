<!DOCTYPE html><html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Tulip Chat</title><style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial;
height:100dvh;
display:flex;
background:#f7e4ec;
}

/* sidebar */

#sidebar{

width:220px;
background:white;
border-right:1px solid #eee;
padding:15px;
overflow:auto;

}

#sidebar h3{
margin-top:0;
color:#ff3f7c;
}

#userList{
list-style:none;
padding:0;
}

#userList li{
padding:6px;
cursor:pointer;
border-radius:6px;
}

#userList li:hover{
background:#ffd0e2;
}

/* chat area */

#chatArea{

flex:1;
display:flex;
flex-direction:column;

}

/* header */

#chatHeader{

height:55px;
background:#ff3f7c;
color:white;
display:flex;
align-items:center;
padding-left:15px;
font-weight:bold;

}

/* messages */

#messages{

flex:1;
overflow-y:auto;
padding:15px;

}

/* message bubble */

.message{

background:white;
padding:10px 14px;
border-radius:15px;
margin-bottom:10px;
max-width:75%;

}

.me{

background:#ff3f7c;
color:white;
margin-left:auto;

}

/* image */

.chatImg{

max-width:240px;
border-radius:10px;

}

/* bottom input */

#inputArea{

display:flex;
padding:10px;
background:white;
border-top:1px solid #ddd;

}

#msgInput{

flex:1;
padding:10px;
border-radius:20px;
border:1px solid #ccc;

}

/* buttons */

button{

margin-left:6px;
padding:8px 12px;
border:none;
background:#ff3f7c;
color:white;
border-radius:8px;
cursor:pointer;

}

/* upload */

#uploadStatus{

font-size:12px;
padding-left:15px;

}

/* typing */

#typing{

font-size:12px;
padding-left:15px;
color:#666;

}

/* mobile */

@media(max-width:700px){

#sidebar{
display:none;
}

}

</style></head><body><div id="sidebar"><h3>🌷 Tulip Chat</h3><button onclick="logout()">Logout</button>

<p id="onlineCount">0 users online</p><ul id="userList"></ul></div><div id="chatArea"><div id="chatHeader">
Tulip Chat
</div><div id="messages"></div><div id="typing"></div><div id="uploadStatus"></div><div id="inputArea"><input id="msgInput" placeholder="Type message"><button onclick="sendMsg()">Send</button>

<input type="file" id="imgInput" accept="image/*,image/gif" style="display:none"><button onclick="document.getElementById('imgInput').click()">📷</button>

</div></div><script src="/socket.io/socket.io.js"></script><script>

const socket=io()

let username=localStorage.getItem("username")

if(!username){
location="/"
}

socket.emit("join",username)


function addMessage(html,type=""){

let box=document.createElement("div")

box.className="message "+type

box.innerHTML=html

document.getElementById("messages").appendChild(box)

document.getElementById("messages").scrollTop=
document.getElementById("messages").scrollHeight

}


/* send message */

function sendMsg(){

let input=document.getElementById("msgInput")

if(input.value.trim()=="") return

socket.emit("chat message",{
user:username,
msg:input.value
})

input.value=""

}


/* receive */

socket.on("chat message",(data)=>{

let type=""

if(data.user===username){
type="me"
}

addMessage("<b>"+data.user+":</b> "+data.msg,type)

})


/* DM */

function sendDM(user){

let msg=prompt("Send message to "+user)

if(!msg) return

socket.emit("private message",{
from:username,
to:user,
msg:msg
})

}


/* user list */

socket.on("user list",(users)=>{

document.getElementById("onlineCount").innerText=
users.length+" users online"

let ul=document.getElementById("userList")

ul.innerHTML=""

users.forEach(u=>{

let li=document.createElement("li")

li.innerText=u

li.onclick=()=>sendDM(u)

ul.appendChild(li)

})

})


/* upload image or gif from phone */

document.getElementById("imgInput")
.addEventListener("change",function(){

let file=this.files[0]

let form=new FormData()

form.append("image",file)

let xhr=new XMLHttpRequest()

xhr.open("POST","/upload")

xhr.upload.onprogress=function(e){

if(e.lengthComputable){

let percent=Math.round((e.loaded/e.total)*100)

document.getElementById("uploadStatus")
.innerText="Uploading "+percent+"%"

}

}

xhr.onload=function(){

document.getElementById("uploadStatus").innerText=""

let data=JSON.parse(xhr.responseText)

socket.emit("chat message",{
user:username,
msg:"<img class='chatImg' src='"+data.url+"'>"
})

}

xhr.send(form)

})


/* typing */

let typingTimer

document.getElementById("msgInput")
.addEventListener("input",()=>{

socket.emit("typing",username)

clearTimeout(typingTimer)

typingTimer=setTimeout(()=>{
socket.emit("stop typing")
},1500)

})


socket.on("typing",(user)=>{

if(user!==username){

document.getElementById("typing").innerText=
user+" is typing..."

}

})


socket.on("stop typing",()=>{

document.getElementById("typing").innerText=""

})


function logout(){

localStorage.removeItem("username")

location="/"

}

</script></body></html>
