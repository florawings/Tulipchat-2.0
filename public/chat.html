<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="/socket.io/socket.io.js"></script>

<style>

body{
margin:0;
font-family:sans-serif;
background:#0f1b3d;
color:white;
height:100vh;
display:flex;
flex-direction:column;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
background:#07142c;
padding:12px;
}

.menu{
cursor:pointer;
font-size:22px;
}

.icons span{
margin-left:12px;
cursor:pointer;
font-size:18px;
}

.container{
flex:1;
display:flex;
}

.chatArea{
flex:3;
display:flex;
flex-direction:column;
}

#chatbox{
flex:1;
overflow-y:auto;
padding:10px;
}

.message{
background:#1e293b;
padding:8px 12px;
border-radius:8px;
margin-bottom:8px;
max-width:80%;
}

.system{
background:#334155;
}

.inputbar{
display:flex;
padding:10px;
background:#07142c;
}

.inputbar input{
flex:1;
padding:10px;
border:none;
border-radius:5px;
}

.inputbar button{
margin-left:6px;
padding:10px 14px;
background:#22c55e;
border:none;
color:white;
border-radius:5px;
}

.users{
flex:1;
background:#020617;
padding:10px;
overflow-y:auto;
}

.user{
margin-bottom:8px;
}

.sidemenu{
position:fixed;
left:-200px;
top:0;
height:100%;
width:200px;
background:#020617;
padding:20px;
transition:0.3s;
}

.sidemenu a{
display:block;
margin-bottom:15px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="header">

<div class="menu" onclick="toggleMenu()">☰</div>

<div>🌷 Tulip Chat</div>

<div class="icons">

<span onclick="openMessages()">💬</span>

<span onclick="openFriends()">👥</span>

<span onclick="showNotifications()">🔔</span>

<span onclick="refreshChat()">🔄</span>

</div>

</div>


<div id="sideMenu" class="sidemenu">

<a onclick="refreshChat()">Refresh</a>

<a onclick="logout()">Logout</a>

</div>


<div class="container">


<div class="chatArea">

<div id="chatbox"></div>

<div class="inputbar">

<input id="msg" placeholder="Type message">

<button onclick="send()">Send</button>

</div>

</div>


<div class="users">

<b>Online Users</b>

<div id="userlist"></div>

</div>


</div>


<script>

const socket = io()

let user = localStorage.getItem("user")

socket.emit("join",user)


socket.on("msg",(m)=>{

let div=document.createElement("div")

div.className="message"

div.innerText=m

chatbox.appendChild(div)

chatbox.scrollTop=chatbox.scrollHeight

})


socket.on("system",(m)=>{

let div=document.createElement("div")

div.className="message system"

div.innerText=m

chatbox.appendChild(div)

})


socket.on("users",(list)=>{

userlist.innerHTML=""

list.forEach(u=>{

let div=document.createElement("div")

div.className="user"

div.innerText=u

userlist.appendChild(div)

})

})


function send(){

let text=msg.value

if(text==="") return

socket.emit("chat",{user,text})

msg.value=""

}


function toggleMenu(){

let menu=document.getElementById("sideMenu")

if(menu.style.left=="0px"){

menu.style.left="-200px"

}else{

menu.style.left="0px"

}

}


function openMessages(){

alert("Private messages coming soon")

}


function openFriends(){

alert("Friend request system coming soon")

}


function showNotifications(){

alert("No new notifications")

}


function refreshChat(){

location.reload()

}


function logout(){

localStorage.removeItem("user")

window.location="index.html"

}

</script>

</body>

</html>
