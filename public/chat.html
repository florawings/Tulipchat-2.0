<!DOCTYPE html>
<html>

<head>

<title>Tulip Chat</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="/socket.io/socket.io.js"></script>

<style>

body{
margin:0;
font-family:Arial;

background-image:url("https://images.unsplash.com/photo-1528459801416-a9e53bbf4e17");
background-size:cover;
background-position:center;
background-attachment:fixed;

height:100vh;
display:flex;
flex-direction:column;
}

/* top bar */

#topbar{
background:#111;
color:white;
padding:12px;
display:flex;
justify-content:space-between;
}

/* main layout */

#main{
flex:1;
display:flex;
overflow:hidden;
}

/* rooms */

#rooms{
width:120px;
background:white;
overflow:auto;
}

.room{
padding:12px;
border-bottom:1px solid #eee;
cursor:pointer;
font-size:14px;
}

.room:hover{
background:#f3f3f3;
}

/* chat area */

#chat{
flex:1;
display:flex;
flex-direction:column;

background:rgba(255,255,255,0.85);
backdrop-filter:blur(6px);
}

#messages{
flex:1;
overflow:auto;
padding:12px;
}

/* message bubble */

.msg{
background:white;
padding:10px;
border-radius:10px;
margin-bottom:8px;
max-width:80%;

box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

/* send box */

#sendbox{
display:flex;
background:white;
border-top:1px solid #ddd;
padding:6px;
}

#msg{
flex:1;
border:none;
padding:10px;
border-radius:20px;
background:#f1f1f1;
}

#send{
background:#22c55e;
border:none;
color:white;
padding:8px 16px;
border-radius:20px;
margin-left:6px;
cursor:pointer;
}

/* online users */

#users{
width:110px;
background:white;
overflow:auto;
border-left:1px solid #ddd;
font-size:13px;
}

.user{
padding:10px;
border-bottom:1px solid #eee;
}

</style>

</head>

<body>

<div id="topbar">

<div>Tulip Chat</div>

<div id="user"></div>

</div>

<div id="main">

<div id="rooms">

<div class="room" onclick="joinRoom('main')">Main</div>

<div class="room" onclick="joinRoom('adult')">Adult</div>

<div class="room" onclick="joinRoom('quiz')">Quiz</div>

<div class="room" onclick="joinRoom('marathi')">Marathi</div>

</div>

<div id="chat">

<div id="messages"></div>

<div id="sendbox">

<input id="msg" placeholder="Type message">

<button id="send">Send</button>

</div>

</div>

<div id="users">

<div style="padding:10px;font-weight:bold">Online</div>

<div id="userlist"></div>

</div>

</div>

<script>

const socket = io()

let username = localStorage.getItem("username")

let currentRoom="main"

if(!username){

location="index.html"

}

document.getElementById("user").innerText=username

socket.emit("join",{
username:username,
room:currentRoom
})

function joinRoom(room){

currentRoom=room

document.getElementById("messages").innerHTML=""

socket.emit("join",{
username:username,
room:room
})

}

document.getElementById("send").onclick=function(){

let text=document.getElementById("msg").value

if(!text) return

socket.emit("chat message",{
user:username,
msg:text,
room:currentRoom
})

document.getElementById("msg").value=""

}

socket.on("chat message",(data)=>{

let div=document.createElement("div")

div.className="msg"

div.innerText=data.user+" : "+data.msg

document.getElementById("messages").appendChild(div)

})

</script>

</body>

</html>
