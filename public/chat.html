<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Tulip Chat</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f6f6f6;
height:100vh;
display:flex;
flex-direction:column;
}

/* TOP BAR */

#topbar{
background:#ff5ca8;
color:white;
padding:10px;
display:flex;
justify-content:space-between;
align-items:center;
}

#menuBtn{
font-size:22px;
cursor:pointer;
}

#inbox{
font-size:18px;
cursor:pointer;
}

/* MAIN LAYOUT */

#container{
flex:1;
display:flex;
height:100%;
}

/* USERS */

#users{
width:30%;
background:#222;
color:white;
overflow:auto;
display:none;
}

#users div{
padding:8px;
border-bottom:1px solid #444;
cursor:pointer;
}

/* CHAT */

#chatArea{
flex:1;
display:flex;
flex-direction:column;
}

#messages{
flex:1;
overflow:auto;
padding:10px;
background:white;
}

.msg{
margin:5px 0;
padding:6px;
background:#f1f1f1;
border-radius:6px;
}

/* INPUT */

#inputBar{
display:flex;
padding:6px;
background:#ddd;
}

#msg{
flex:1;
padding:6px;
}

button{
padding:6px;
margin-left:4px;
}

/* LOGIN */

#loginBox{
position:absolute;
top:0;
left:0;
right:0;
bottom:0;
background:white;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

</style>

</head>

<body>

<div id="loginBox">

<h2>Join Tulip Chat</h2>

<input id="name" placeholder="Name"><br><br>

<input id="age" placeholder="Age"><br><br>

<select id="gender">
<option value="male">Male</option>
<option value="female">Female</option>
</select>

<br><br>

<button onclick="join()">Enter Chat</button>

</div>

<div id="topbar">

<span id="menuBtn">☰</span>

<span>Tulip Chat</span>

<span id="inbox">🔔 <span id="count">0</span></span>

</div>

<div id="container">

<div id="users"></div>

<div id="chatArea">

<div id="messages"></div>

<div id="inputBar">

<input id="msg" placeholder="Type message">

<input type="file" id="file">

<button onclick="send()">Send</button>

</div>

</div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket=io()

let username=""
let users=[]
let inboxCount=0

const messages=document.getElementById("messages")

/* JOIN */

function join(){

username=document.getElementById("name").value

socket.emit("join",{username})

document.getElementById("loginBox").style.display="none"

}

/* SEND MESSAGE */

function send(){

const text=document.getElementById("msg").value

if(text==="/clear"){

messages.innerHTML=""

return

}

socket.emit("chat message",{

user:username,
text:text

})

document.getElementById("msg").value=""

}

/* RECEIVE MESSAGE */

socket.on("chat message",(data)=>{

const div=document.createElement("div")

div.className="msg"

div.innerText=data.user+": "+data.text

messages.appendChild(div)

messages.scrollTop=messages.scrollHeight

})

/* ONLINE USERS */

socket.on("onlineUsers",(list)=>{

users=list

const box=document.getElementById("users")

box.innerHTML=""

list.forEach(u=>{

const div=document.createElement("div")

div.innerText=u.username

div.onclick=()=>startDM(u.username)

box.appendChild(div)

})

})

/* MENU TOGGLE */

document.getElementById("menuBtn").onclick=()=>{

const u=document.getElementById("users")

u.style.display=u.style.display==="none"?"block":"none"

}

/* DM */

function startDM(user){

const msg=prompt("DM to "+user)

socket.emit("dm",{

from:username,
to:user,
text:msg

})

}

socket.on("dm",(msg)=>{

inboxCount++

document.getElementById("count").innerText=inboxCount

alert("DM from "+msg.from+": "+msg.text)

})

/* FILE UPLOAD */

document.getElementById("file").addEventListener("change",async function(){

const file=this.files[0]

const form=new FormData()

form.append("file",file)

const res=await fetch("/upload",{

method:"POST",
body:form

})

const data=await res.json()

socket.emit("chat message",{

user:username,
text:data.url

})

})

</script>

</body>
</html>
