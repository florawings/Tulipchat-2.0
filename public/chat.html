<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tulip Chat</title><style>

body{
margin:0;
font-family:Arial;
display:flex;
height:100vh;
background:#0f0f0f;
color:white;
}

/* SIDEBAR */

#sidebar{
width:200px;
background:black;
padding:15px;
}

.room{
padding:10px;
background:#111;
border-radius:6px;
margin-bottom:10px;
cursor:pointer;
}

.room:hover{
background:#222;
}

/* CHAT AREA */

#chat{
flex:1;
display:flex;
flex-direction:column;
max-width:700px;
margin:auto;
}

#topbar{
background:#000;
padding:12px;
}

#messages{
flex:1;
overflow:auto;
padding:15px;
}

.msg{
background:#1f1f1f;
padding:10px;
border-radius:10px;
margin-bottom:10px;
}

.msg img{
max-width:220px;
border-radius:10px;
margin-top:5px;
}

/* INPUT */

#input{
display:flex;
padding:10px;
background:black;
}

#text{
flex:1;
padding:10px;
border-radius:20px;
border:none;
outline:none;
}

button{
margin-left:5px;
padding:10px;
border:none;
background:#ff4da6;
color:white;
border-radius:6px;
cursor:pointer;
}

#progress{
font-size:12px;
margin-left:10px;
}

</style></head><body><div id="sidebar"><h3 style="color:#ff4da6">Tulip Chat</h3><div class="room" onclick="joinRoom('normal')">
Normal Room
</div><div class="room" onclick="adultRoom()">
Adult Room
</div></div><div id="chat"><div id="topbar">
<span id="roomName">Normal Room</span>
</div><div id="messages"></div><div id="input"><input id="text" placeholder="Type message"><button onclick="send()">Send</button>

<input type="file" id="file" accept="image/*"><span id="progress"></span>

</div></div><script src="/socket.io/socket.io.js"></script><script>

const socket = io()

let username = localStorage.getItem("username")

if(!username){

username = prompt("Enter your name")

localStorage.setItem("username",username)

}

let room="normal"

socket.emit("join",{user:username,room})

function joinRoom(r){

room=r

document.getElementById("roomName").innerText=r+" room"

socket.emit("join",{user:username,room})

}

function adultRoom(){

let ok=confirm("18+ only. Continue?")

if(ok){
joinRoom("adult")
}

}

/* SEND TEXT */

function send(){

let text=document.getElementById("text").value

if(!text) return

socket.emit("message",{
user:username,
msg:text,
room
})

document.getElementById("text").value=""

}

/* RECEIVE MESSAGE */

socket.on("message",(data)=>{

let div=document.createElement("div")

div.className="msg"

div.innerHTML="<b>"+data.user+"</b>: "+data.msg

document.getElementById("messages").appendChild(div)

})

/* IMAGE / GIF UPLOAD */

document.getElementById("file").onchange=function(){

let file=this.files[0]

let form=new FormData()

form.append("file",file)

let xhr=new XMLHttpRequest()

xhr.open("POST","/upload")

xhr.upload.onprogress=(e)=>{

let percent=Math.round((e.loaded/e.total)*100)

document.getElementById("progress").innerText=percent+"%"

}

xhr.onload=()=>{

let res=JSON.parse(xhr.responseText)

socket.emit("message",{

user:username,

msg:'<img src="'+res.url+'">',

room

})

document.getElementById("progress").innerText=""

}

xhr.send(form)

}

</script></body></html>
