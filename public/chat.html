<!DOCTYPE html>
<html>

<head>

<title>Tulip Chat</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="/socket.io/socket.io.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#ffd6ea;
}

/* HEADER */

.top{
background:#ff2e93;
color:white;
padding:12px;
display:flex;
align-items:center;
}

#backBtn{
display:none;
margin-right:10px;
background:white;
border:none;
padding:4px 8px;
border-radius:6px;
}

/* LAYOUT */

.container{
display:flex;
height:calc(100vh - 60px);
}

/* USERS */

.users{
width:25%;
background:black;
color:white;
padding:10px;
overflow:auto;
}

.user{
padding:10px;
border-bottom:1px solid #333;
cursor:pointer;
position:relative;
}

/* DM notification dot */

.dot{
width:10px;
height:10px;
background:red;
border-radius:50%;
position:absolute;
right:10px;
top:15px;
display:none;
}

/* CHAT */

.chat{
flex:1;
display:flex;
flex-direction:column;
background:#eee;
}

#messages{
flex:1;
overflow:auto;
padding:10px;
}

/* MESSAGE DESIGN */

.msg{
padding:10px;
margin:6px 0;
border-radius:15px;
max-width:70%;
}

.me{
background:#ff2e93;
color:white;
margin-left:auto;
}

.other{
background:white;
}

/* INPUT */

.input{
display:flex;
padding:10px;
background:#ddd;
position:fixed;
bottom:0;
left:0;
right:0;
}

.input input{
flex:1;
padding:10px;
}

.send{
background:#ff2e93;
color:white;
padding:10px;
border:none;
margin-left:5px;
}

.cam{
background:#2196f3;
color:white;
padding:10px;
border:none;
margin-left:5px;
}

</style>

</head>

<body>

<div class="top">

<button id="backBtn" onclick="goBack()">⬅</button>

🌷 Tulip Chat

</div>

<div class="container">

<div class="users">

<h3>Online</h3>

<div id="online"></div>

</div>

<div class="chat">

<div id="messages"></div>

</div>

</div>

<div class="input">

<input id="msg" placeholder="message">

<button class="send" onclick="send()">Send</button>

<button class="cam" onclick="openGallery()">📷</button>

<input type="file" id="imageInput" accept="image/*" style="display:none">

</div>

<script>

let socket = io()

let username = prompt("Enter name")

socket.emit("join",{name:username})

let currentDM=null
let dmMessages={}
let notifications={}

let messages=document.getElementById("messages")

function add(text,type){

messages.innerHTML += `<div class="msg ${type}">${text}</div>`

messages.scrollTop=messages.scrollHeight

}

/* SEND */

function send(){

let text=msg.value

if(!text) return

if(currentDM){

socket.emit("dm",{to:currentDM,user:username,text:text})

dmMessages[currentDM].push({text:text,me:true})

renderDM()

}else{

socket.emit("message",{user:username,text:text})

add(text,"me")

}

msg.value=""

}

/* RECEIVE PUBLIC */

socket.on("message",(d)=>{

if(currentDM) return

add(d.user+": "+d.text,"other")

})

/* RECEIVE DM */

socket.on("dm",(d)=>{

if(!dmMessages[d.user]){
dmMessages[d.user]=[]
}

dmMessages[d.user].push({text:d.text,me:false})

if(currentDM===d.user){
renderDM()
}else{
notifications[d.user]=true
updateUsers()
}

})

/* DM OPEN */

function startDM(user){

currentDM=user

document.getElementById("backBtn").style.display="block"

notifications[user]=false

renderDM()

}

/* BACK */

function goBack(){

currentDM=null

document.getElementById("backBtn").style.display="none"

messages.innerHTML=""

}

/* RENDER DM */

function renderDM(){

messages.innerHTML=""

dmMessages[currentDM].forEach(m=>{

let type=m.me?"me":"other"

add(m.text,type)

})

}

/* USERS */

function updateUsers(){

let html=""

for(let u in notifications){

let dot=notifications[u]?"block":"none"

html+=`

<div class="user" onclick="startDM('${u}')">

${u}

<div class="dot" style="display:${dot}"></div>

</div>

`

}

online.innerHTML=html

}

socket.on("online",(users)=>{

notifications={}

for(let id in users){

if(users[id].name!==username){

notifications[users[id].name]=false

}

}

updateUsers()

})

/* IMAGE */

function openGallery(){

imageInput.click()

}

imageInput.addEventListener("change",function(){

let file=this.files[0]

let reader=new FileReader()

reader.onload=function(e){

add(`<img src="${e.target.result}">`,"me")

}

reader.readAsDataURL(file)

})

</script>

</body>

</html>
