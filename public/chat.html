<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Tulip Chat</title>

<script src="/socket.io/socket.io.js"></script>

<style>

body{
margin:0;
font-family:Arial;
height:100vh;
display:flex;
flex-direction:column;
background:linear-gradient(135deg,#ff6a8b,#ff8fab);
}

/* HEADER */

#header{
height:50px;
background:#ff2d5a;
color:white;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 15px;
}

/* CONTAINER */

#container{
flex:1;
display:flex;
}

/* SIDEBAR */

#sidebar{
position:fixed;
left:-220px;
top:0;
width:220px;
height:100%;
background:white;
overflow:auto;
transition:0.3s;
}

#sidebar.open{
left:0;
}

#onlineUsers div{
padding:10px;
border-bottom:1px solid #eee;
cursor:pointer;
}

/* CHAT */

#chatArea{
flex:1;
display:flex;
flex-direction:column;
}

#chat{
flex:1;
overflow:auto;
padding:10px;
}

/* MESSAGE */

.msg{
background:white;
padding:8px;
margin-bottom:8px;
border-radius:10px;
max-width:70%;
}

.msg img{
max-width:200px;
border-radius:10px;
}

/* SEND */

#sendBox{
display:flex;
gap:5px;
padding:10px;
background:white;
}

#msg{
flex:1;
padding:10px;
border-radius:20px;
border:1px solid #ddd;
}

button{
background:#ff2d5a;
color:white;
border:none;
padding:8px 12px;
border-radius:20px;
}

/* DM */

#dmPopup{
position:fixed;
right:10px;
bottom:80px;
width:250px;
background:white;
border-radius:10px;
display:none;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

#dmMessages{
height:200px;
overflow:auto;
padding:10px;
}

</style>

</head>

<body>

<div id="header">

<span id="menuBtn">☰</span>

<span>Tulip Chat</span>

<span id="dmBell">🔔</span>

</div>

<div id="sidebar">

<h3 style="padding:10px">Online Users</h3>

<div id="onlineUsers"></div>

</div>

<div id="chatArea">

<div id="chat"></div>

<div id="sendBox">

<input id="msg">

<button onclick="send()">Send</button>

<input type="file" id="imgFile">

<button onclick="sendImage()">GIF</button>

</div>

</div>

<div id="dmPopup">

<div id="dmMessages"></div>

<input id="dmUser" placeholder="username">

<input id="dmInput">

<button onclick="sendDM()">Send</button>

</div>

<script>

const socket=io()

let username=localStorage.getItem("username")

socket.emit("join",username)

/* CHAT */

function render(msg){

const div=document.createElement("div")

div.classList.add("msg")

if(msg.image){

div.innerHTML="<b>"+msg.user+"</b><br><img src='"+msg.image+"'>"

}else{

if(msg.user==="Lord_lucifer"){
div.innerHTML="👑 "+msg.user+": "+msg.text
}else{
div.innerHTML=msg.user+": "+msg.text
}

}

document.getElementById("chat").appendChild(div)

}

/* SEND */

function send(){

const msg=document.getElementById("msg").value

socket.emit("chat",{

user:username,
text:msg

})

document.getElementById("msg").value=""

}

/* IMAGE */

function sendImage(){

const file=document.getElementById("imgFile").files[0]

const reader=new FileReader()

reader.onload=function(){

socket.emit("chat",{

user:username,
image:reader.result

})

}

reader.readAsDataURL(file)

}

/* RECEIVE */

socket.on("chat",msg=>{

render(msg)

})

socket.on("chatHistory",msgs=>{

msgs.forEach(m=>render(m))

})

socket.on("clearChat",()=>{

document.getElementById("chat").innerHTML=""

})

/* ONLINE USERS */

socket.on("onlineUsers",users=>{

const box=document.getElementById("onlineUsers")

box.innerHTML=""

users.forEach(u=>{

const div=document.createElement("div")

div.innerText="🟢 "+u

div.onclick=()=>{

document.getElementById("dmUser").value=u
openDM()

}

box.appendChild(div)

})

})

/* DM */

function sendDM(){

const msg=document.getElementById("dmInput").value
const to=document.getElementById("dmUser").value

socket.emit("dm",{

from:username,
to:to,
text:msg

})

}

socket.on("dm",data=>{

document.getElementById("dmBell").innerText="🔔"

const div=document.createElement("div")

div.innerText=data.from+": "+data.text

document.getElementById("dmMessages").appendChild(div)

})

/* SIDEBAR */

document.getElementById("menuBtn").onclick=()=>{

document.getElementById("sidebar").classList.toggle("open")

}

/* DM TOGGLE */

document.getElementById("dmBell").onclick=openDM

function openDM(){

const box=document.getElementById("dmPopup")

if(box.style.display==="block"){
box.style.display="none"
}else{
box.style.display="block"
}

}

</script>

</body>
</html>
