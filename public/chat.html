<!DOCTYPE html><html>
<head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Tulip Chat</title><style>

html,body{
margin:0;
height:100%;
font-family:Arial;
background:#f5e3ea;
}

/* HEADER */

#header{
display:flex;
align-items:center;
justify-content:space-between;
background:#ff3d6e;
color:white;
padding:10px;
}

.topBtn{
background:none;
border:none;
color:white;
font-size:20px;
}

/* SIDEBAR */

#sidebar{
position:fixed;
left:-220px;
top:0;
width:200px;
height:100%;
background:white;
padding:15px;
transition:0.3s;
z-index:10;
}

#sidebar.open{
left:0;
}

/* CHAT */

#chatBox{
height:70vh;
overflow:auto;
padding:20px;
display:flex;
flex-direction:column;
gap:10px;
}

.msg{
background:#ff3d6e;
color:white;
padding:10px 16px;
border-radius:20px;
max-width:70%;
}

.msg img{
max-width:200px;
border-radius:10px;
}

/* INPUT */

#inputArea{
display:flex;
gap:6px;
padding:10px;
}

#text{
flex:1;
padding:10px;
border-radius:20px;
border:1px solid #ccc;
}

button{
background:#ff3d6e;
color:white;
border:none;
padding:10px 14px;
border-radius:10px;
}

</style></head><body><div id="header"><button class="topBtn" onclick="toggleMenu()">☰</button>

<div>Tulip Chat</div><div><button class="topBtn" onclick="refreshChat()">🔄</button>

<button class="topBtn" onclick="openInbox()">📥</button>

</div></div><div id="sidebar"><h3>Online Users</h3><div id="online">0 users</div><div id="users"></div></div><div id="chatBox"></div><div id="inputArea"><input id="text" placeholder="Type message"><button onclick="send()">Send</button>

<button onclick="gif()">GIF</button>

<input type="file" id="file" hidden><button onclick="pick()">📷</button>

</div><script src="/socket.io/socket.io.js"></script><script>

const socket = io()

let name = localStorage.getItem("username")
let gender = localStorage.getItem("gender")

if(!name){
location.href="login.html"
}

socket.emit("join",{name,gender})

function avatar(g){
return g==="female"?"👩":"👨"
}

/* SEND MESSAGE */

function send(){

let msg=text.value

socket.emit("message",{user:name,gender,msg})

text.value=""

}

/* RECEIVE MESSAGE */

socket.on("message",(d)=>{

let div=document.createElement("div")

div.className="msg"

let icon=avatar(d.gender)

if(d.msg && d.msg.startsWith("/uploads")){

div.innerHTML=icon+" "+d.user+"<br><img src='"+d.msg+"'>"

}else{

div.innerText=icon+" "+d.user+": "+d.msg

}

chatBox.appendChild(div)

chatBox.scrollTop=chatBox.scrollHeight

})

/* ONLINE USERS */

socket.on("online",(list)=>{

users.innerHTML=""

let count=0

for(let id in list){

count++

let u=document.createElement("div")

u.innerText=avatar(list[id].gender)+" "+list[id].name

u.onclick=()=>startDM(id)

users.appendChild(u)

}

online.innerText=count+" users"

})

/* DM */

function startDM(id){

let msg=prompt("Send DM")

if(msg){

socket.emit("dm",{to:id,from:name,msg})

}

}

/* GIF */

function gif(){

let url=prompt("Paste GIF link")

if(url){

socket.emit("message",{user:name,gender,msg:url})

}

}

/* FILE */

function pick(){

file.click()

}

file.onchange=()=>{

let f=file.files[0]

let fd=new FormData()

fd.append("file",f)

fetch("/upload",{method:"POST",body:fd})

.then(r=>r.json())

.then(d=>{

socket.emit("message",{user:name,gender,msg:d.url})

})

}

/* MENU */

function toggleMenu(){

sidebar.classList.toggle("open")

}

/* REFRESH */

function refreshChat(){

location.reload()

}

/* INBOX */

function openInbox(){

alert("Inbox feature next update")

}

</script></body>
</html>
