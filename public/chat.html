<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Tulip Chat</title>

<style>

body{
margin:0;
font-family:Arial;
background:#e6e6e6;
height:100vh;
display:flex;
flex-direction:column;
}

/* TOP BAR */

.topbar{

background:black;
color:white;
padding:12px;
display:flex;
align-items:center;
justify-content:space-between;

}

.logo{

font-size:18px;
font-weight:bold;

}

.icons{

font-size:18px;

}

.icons span{

margin-left:12px;
cursor:pointer;

}


/* CHAT AREA */

.chat{

flex:1;
overflow-y:auto;
padding:10px;

}

.msg{

display:flex;
margin-bottom:15px;

}

.avatar{

width:40px;
height:40px;
border-radius:50%;
background:#ccc;
margin-right:10px;

}

.text{

background:white;
padding:8px 12px;
border-radius:8px;
max-width:70%;

}

.name{

font-weight:bold;
font-size:14px;

}

.time{

font-size:11px;
color:#888;

}

/* INPUT AREA */

.inputbar{

background:white;
padding:10px;
display:flex;
align-items:center;

}

.inputbar input{

flex:1;
padding:10px;
border-radius:20px;
border:1px solid #ccc;
margin:0 8px;

}

.inputbar button{

background:black;
color:white;
border:none;
padding:10px 12px;
border-radius:8px;
cursor:pointer;

}

.iconbtn{

font-size:20px;
cursor:pointer;
margin:0 4px;

}

</style>

</head>

<body>


<!-- TOP BAR -->

<div class="topbar">

<div>☰</div>

<div class="logo">🌷 Tulip Chat</div>

<div class="icons">

<span>💬</span>
<span>👥</span>
<span>🔔</span>

</div>

</div>



<!-- CHAT AREA -->

<div class="chat" id="chat">

<div class="msg">

<div class="avatar"></div>

<div>

<div class="name">Rahul</div>

<div class="text">Hello everyone</div>

<div class="time">10:00</div>

</div>

</div>



<div class="msg">

<div class="avatar"></div>

<div>

<div class="name">Neha</div>

<div class="text">Hi Ravi</div>

<div class="time">10:01</div>

</div>

</div>


</div>



<!-- INPUT BAR -->

<div class="inputbar">

<span class="iconbtn">➕</span>

<span class="iconbtn">🙂</span>

<input id="msgInput" placeholder="Type message...">

<span class="iconbtn">🎤</span>

<button onclick="sendMsg()">➤</button>

</div>



<script>

function sendMsg(){

let input=document.getElementById("msgInput")

if(input.value=="") return

let chat=document.getElementById("chat")

let msg=document.createElement("div")

msg.className="msg"

msg.innerHTML=`

<div class="avatar"></div>

<div>

<div class="name">You</div>

<div class="text">${input.value}</div>

<div class="time">now</div>

</div>

`

chat.appendChild(msg)

input.value=""

chat.scrollTop=chat.scrollHeight

}

</script>


</body>
</html>
