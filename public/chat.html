<!DOCTYPE html><html>
<head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Tulip Chat</title><style>

html,body{
margin:0;
height:100%;
font-family:Arial;
background:#f5e3ea;
overflow:hidden;
}

/* HEADER */

#header{
height:50px;
background:#ff3d6e;
color:white;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 10px;
}

#leftIcons{
display:flex;
gap:10px;
align-items:center;
}

#rightIcons{
display:flex;
gap:12px;
align-items:center;
}

.icon{
font-size:20px;
cursor:pointer;
}

/* SIDEBAR */

#sidebar{
position:fixed;
top:50px;
left:-230px;
width:220px;
height:100%;
background:white;
padding:15px;
transition:.3s;
border-right:1px solid #ddd;
}

#sidebar.open{
left:0;
}

#logo{
font-size:20px;
color:#ff3d6e;
font-weight:bold;
margin-bottom:10px;
}

/* CHAT AREA */

#chatArea{
position:absolute;
top:50px;
bottom:60px;
left:0;
right:0;
overflow:auto;
padding:15px;
}

.msg{
background:#ff3d6e;
color:white;
padding:10px 14px;
border-radius:18px;
max-width:75%;
margin-bottom:8px;
}

.msg img{
max-width:220px;
border-radius:10px;
}

/* INPUT AREA */

#inputArea{
position:fixed;
bottom:0;
left:0;
right:0;
height:60px;
background:white;
display:flex;
align-items:center;
gap:6px;
padding:8px;
border-top:1px solid #ddd;
}

#text{
flex:1;
padding:10px;
border-radius:20px;
border:1px solid #ccc;
}

button{
background:#ff3d6e;
border:none;
color:white;
padding:10px 14px;
border-radius:10px;
}

</style></head><body><!-- HEADER --><div id="header"><div id="leftIcons"><span class="icon" onclick="toggleMenu()">☰</span>

<span class="icon" onclick="closePanels()">⬅</span>

</div><div>Tulip Chat</div><div id="rightIcons"><span class="icon">📥</span>

<span class="icon" onclick="refreshChat()">🔄</span>

</div></div><!-- SIDEBAR --><div id="sidebar"><div id="logo">🌷 Tulip Chat</div><div id="online">0 users online</div><div id="users"></div></div><!-- CHAT --><div id="chatArea"></div><!-- INPUT --><div id="inputArea"><input id="text" placeholder="Type message"><button onclick="send()">Send</button>

<input type="file" id="file" hidden><button onclick="pick()">📷</button>

</div><script src="/socket.io/socket.io.js"></script><script>

const socket=io()

let name=localStorage.getItem("username")
let gender=localStorage.getItem("gender")

if(!name){
location.href="login.html"
}

socket.emit("join",{name,gender})

function avatar(g){
return g==="female"?"👩":"👨"
}

/* MESSAGE SEND */

function send(){

let msg=text.value

socket.emit("message",{user:name,gender,msg})

text.value=""

}

/* RECEIVE */

socket.on("message",(d)=>{

let div=document.createElement("div")

div.className="msg"

let icon=avatar(d.gender)

if(d.msg && d.msg.startsWith("/uploads")){

div.innerHTML=icon+" "+d.user+"<br><img src='"+d.msg+"'>"

}else{

div.innerText=icon+" "+d.user+": "+d.msg

}

chatArea.appendChild(div)

chatArea.scrollTop=chatArea.scrollHeight

})

/* ONLINE USERS */

socket.on("online",(list)=>{

users.innerHTML=""

let count=0

for(let id in list){

count++

let u=document.createElement("div")

u.innerText=avatar(list[id].gender)+" "+list[id].name

users.appendChild(u)

}

online.innerText=count+" users online"

})

/* MENU TOGGLE */

function toggleMenu(){

sidebar.classList.toggle("open")

}

/* BACK BUTTON */

function closePanels(){

sidebar.classList.remove("open")

}

/* REFRESH */

function refreshChat(){

location.reload()

}

/* FILE PICK */

function pick(){
file.click()
}

/* UPLOAD */

file.onchange=()=>{

let f=file.files[0]

let fd=new FormData()

fd.append("file",f)

fetch("/upload",{method:"POST",body:fd})
.then(r=>r.json())
.then(d=>{

socket.emit("message",{user:name,gender,msg:d.url})

})

}

</script></body>
</html>
