<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Tulip Chat</title>

<style>

/* ===========================
GLOBAL STYLE
=========================== */

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial;
}

body{
height:100vh;
display:flex;
background:#f0f2f5;
overflow:hidden;
}

/* ===========================
SIDEBAR
=========================== */

#sidebar{
width:240px;
background:#1d1f2f;
color:white;
display:flex;
flex-direction:column;
}

#sidebarHeader{
padding:15px;
font-size:20px;
border-bottom:1px solid #333;
}

#users{
flex:1;
overflow:auto;
}

.user{
padding:12px;
border-bottom:1px solid #333;
cursor:pointer;
}

.user:hover{
background:#2a2c44;
}

/* ===========================
MAIN CHAT
=========================== */

#main{
flex:1;
display:flex;
flex-direction:column;
}

/* HEADER */

#header{
background:#ff2d6f;
color:white;
padding:15px;
display:flex;
justify-content:space-between;
}

/* MESSAGE AREA */

#messages{
flex:1;
overflow:auto;
padding:12px;
display:flex;
flex-direction:column;
}

.message{
padding:10px;
border-radius:8px;
margin-bottom:10px;
max-width:70%;
background:white;
}

.my{
background:#d4ffd4;
align-self:flex-end;
}

.system{
text-align:center;
color:#777;
margin:10px;
}

.timestamp{
font-size:11px;
color:#888;
margin-top:4px;
}

/* INPUT BAR */

#sendBar{
display:flex;
padding:10px;
gap:6px;
background:white;
border-top:1px solid #ddd;
}

#messageInput{
flex:1;
padding:10px;
border-radius:6px;
border:1px solid #ccc;
}

button{
background:#ff2d6f;
color:white;
border:none;
padding:10px 14px;
border-radius:6px;
cursor:pointer;
}

button:hover{
opacity:0.8;
}

/* IMAGE */

img{
max-width:220px;
border-radius:6px;
margin-top:6px;
}

/* DM WINDOW */

#dmWindow{
position:fixed;
right:10px;
bottom:10px;
width:320px;
background:white;
border-radius:10px;
box-shadow:0 0 12px rgba(0,0,0,0.3);
display:none;
flex-direction:column;
}

#dmHeader{
background:#ff2d6f;
color:white;
padding:10px;
}

#dmMessages{
flex:1;
height:200px;
overflow:auto;
padding:10px;
}

#dmInputBar{
display:flex;
padding:6px;
}

#dmInput{
flex:1;
padding:8px;
border:1px solid #ccc;
}

/* EMOJI PANEL */

#emojiPanel{
position:absolute;
bottom:60px;
right:120px;
background:white;
border:1px solid #ccc;
border-radius:6px;
display:none;
padding:6px;
max-width:200px;
flex-wrap:wrap;
}

.emoji{
cursor:pointer;
padding:4px;
font-size:20px;
}

/* DARK MODE */

.dark{
background:#111;
color:white;
}

.dark #messages{
background:#111;
}

.dark .message{
background:#333;
color:white;
}

.dark .my{
background:#2e6f3e;
}

/* TYPING */

#typing{
font-size:12px;
color:#888;
margin-left:10px;
}

</style>

</head>

<body>

<!-- SIDEBAR -->

<div id="sidebar">

<div id="sidebarHeader">Online</div>

<div id="users"></div>

</div>

<!-- MAIN -->

<div id="main">

<div id="header">

<div>🌷 Tulip Chat</div>

<div>

<button onclick="toggleDark()">Dark</button>

<button onclick="logout()">Logout</button>

</div>

</div>

<div id="messages"></div>

<div id="typing"></div>

<div id="sendBar">

<input id="messageInput" placeholder="message">

<button onclick="sendMessage()">Send</button>

<input type="file" id="imageUpload" hidden>

<button onclick="openImage()">📷</button>

<button onclick="sendGIF()">GIF</button>

<button onclick="toggleEmoji()">😊</button>

</div>

</div>

<div id="emojiPanel"></div>

<div id="dmWindow">

<div id="dmHeader"></div>

<div id="dmMessages"></div>

<div id="dmInputBar">

<input id="dmInput">

<button onclick="sendDM()">Send</button>

</div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket=io()

let username=localStorage.getItem("username")

if(!username){

username=prompt("Enter name")

localStorage.setItem("username",username)

}

/* JOIN */

socket.emit("join",username)

/* ELEMENTS */

const messages=document.getElementById("messages")
const usersDiv=document.getElementById("users")
const input=document.getElementById("messageInput")

/* ADD MESSAGE */

function addMessage(data){

let div=document.createElement("div")

if(data.type==="system"){

div.className="system"
div.innerText=data.text

}else{

div.className="message"

if(data.user===username) div.classList.add("my")

if(data.type==="image"){

div.innerHTML="<b>"+data.user+"</b><br><img src='"+data.text+"'>"

}else{

div.innerHTML="<b>"+data.user+"</b>: "+data.text

}

let time=document.createElement("div")
time.className="timestamp"
time.innerText=new Date().toLocaleTimeString()

div.appendChild(time)

}

messages.appendChild(div)

messages.scrollTop=messages.scrollHeight

}

/* RECEIVE */

socket.on("chat message",(data)=>{

addMessage(data)

saveLocal(data)

})

/* SEND */

function sendMessage(){

let text=input.value.trim()

if(!text) return

socket.emit("chat message",{

user:username,
text:text,
type:"text"

})

input.value=""

}

/* ENTER SEND */

input.addEventListener("keypress",e=>{

socket.emit("typing",username)

if(e.key==="Enter") sendMessage()

})

/* TYPING */

socket.on("typing",(name)=>{

document.getElementById("typing").innerText=name+" typing..."

setTimeout(()=>{

document.getElementById("typing").innerText=""

},2000)

})

/* IMAGE */

function openImage(){

document.getElementById("imageUpload").click()

}

document.getElementById("imageUpload").addEventListener("change",function(){

const file=this.files[0]

const reader=new FileReader()

reader.onload=function(){

socket.emit("chat message",{

user:username,
text:reader.result,
type:"image"

})

}

reader.readAsDataURL(file)

})

/* GIF */

function sendGIF(){

const url=prompt("Paste GIF link")

if(!url) return

socket.emit("chat message",{

user:username,
text:url,
type:"image"

})

}

/* USERS */

socket.on("users",(list)=>{

usersDiv.innerHTML=""

list.forEach(u=>{

let div=document.createElement("div")

div.className="user"
div.innerText=u

div.onclick=()=>openDM(u)

usersDiv.appendChild(div)

})

})

/* DM */

let currentDM=null

function openDM(user){

currentDM=user

document.getElementById("dmWindow").style.display="flex"

document.getElementById("dmHeader").innerText="DM : "+user

document.getElementById("dmMessages").innerHTML=""

}

function sendDM(){

let text=document.getElementById("dmInput").value

socket.emit("dm",{

to:currentDM,
from:username,
text:text

})

document.getElementById("dmInput").value=""

}

socket.on("dm",(data)=>{

if(data.from===currentDM){

let div=document.createElement("div")

div.innerText=data.from+": "+data.text

document.getElementById("dmMessages").appendChild(div)

}

})

/* LOCAL STORAGE */

function saveLocal(data){

let history=JSON.parse(localStorage.getItem("chatHistory")||"[]")

history.push(data)

localStorage.setItem("chatHistory",JSON.stringify(history))

}

window.onload=()=>{

let history=JSON.parse(localStorage.getItem("chatHistory")||"[]")

history.forEach(addMessage)

}

/* EMOJI */

const emojiPanel=document.getElementById("emojiPanel")

const emojis=["😀","😂","😍","😎","🔥","👍","🙏","🥳","💯","❤️"]

emojis.forEach(e=>{

let span=document.createElement("span")

span.className="emoji"

span.innerText=e

span.onclick=()=>{

input.value+=e

}

emojiPanel.appendChild(span)

})

function toggleEmoji(){

emojiPanel.style.display=emojiPanel.style.display==="flex"?"none":"flex"

}

/* DARK MODE */

function toggleDark(){

document.body.classList.toggle("dark")

}

/* LOGOUT */

function logout(){

localStorage.removeItem("username")

location.href="login.html"

}

</script>

</body>
</html>
