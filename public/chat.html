<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="top">
<span id="menuBtn">☰</span>
Tulip Chat
<button onclick="logout()">Logout</button>
</div>

<div id="sidebar">
<h3>Users</h3>
<div id="users"></div>
</div>

<div id="chat"></div>

<div class="input">
<input id="msg" placeholder="Type...">
<input type="file" id="file">
<span id="progress"></span>
<button onclick="send()">Send</button>
</div>

<div id="dmBox">
<div id="dmMsgs"></div>
<input id="dmInput">
<button onclick="sendDM()">Send</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>

const socket = io();
const user = localStorage.getItem("user");

if(!user) location="/";

socket.emit("join", user);

let dmTo = null;

// MESSAGE SEND
function send(){
  socket.emit("message", user+": "+msg.value);
  msg.value="";
}

// IMAGE + PROGRESS
file.onchange = () => {
  const f = file.files[0];
  const reader = new FileReader();

  reader.onprogress = (e)=>{
    if(e.lengthComputable){
      progress.innerText = Math.round((e.loaded/e.total)*100)+"%";
    }
  };

  reader.onload = ()=>{
    socket.emit("image", reader.result);
    progress.innerText="Done ✅";
  };

  reader.readAsDataURL(f);
};

// RECEIVE MESSAGE
socket.on("message", data=>{
  const d=document.createElement("div");
  d.className="msg";

  if(data.text){
    d.innerText=data.text;
  }else{
    d.innerHTML=`<img src="${data.img}">`;
  }

  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
});

// OLD MESSAGES
socket.on("oldMessages", msgs=>{
  msgs.forEach(m=>{
    socket.emit("message", m.text || m.img);
  });
});

// USERS
socket.on("onlineUsers", list=>{
  users.innerHTML="";
  list.forEach(u=>{
    const d=document.createElement("div");
    d.innerText=u;

    d.onclick=()=>{
      dmTo=u;
      dmBox.style.display="flex";
    };

    users.appendChild(d);
  });
});

// DM
function sendDM(){
  socket.emit("dm",{to:dmTo,msg:dmInput.value});
  dmInput.value="";
}

socket.on("dm", data=>{
  const d=document.createElement("div");
  d.innerText=data.from+": "+data.msg;
  dmMsgs.appendChild(d);
});

// CLEAR
socket.on("clearChat", ()=>{
  chat.innerHTML="";
});

// SIDEBAR FIX
const sidebar = document.getElementById("sidebar");
const menuBtn = document.getElementById("menuBtn");

menuBtn.onclick = (e)=>{
  e.stopPropagation();
  sidebar.classList.toggle("show");
};

document.addEventListener("click",(e)=>{
  if(sidebar.classList.contains("show")){
    if(!sidebar.contains(e.target)){
      sidebar.classList.remove("show");
    }
  }
});

function logout(){
  localStorage.clear();
  location="/";
}

</script>

</body>
</html>
