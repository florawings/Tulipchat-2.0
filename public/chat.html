<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Tulip Chat</title>

<style>

body{
font-family:Arial;
background:#ffd6df;
display:flex;
flex-direction:column;
height:100vh;
}

#main{
flex:1;
display:flex;
}

#chat{
width:70%;
overflow:auto;
padding:10px;
}

#users{
width:30%;
background:white;
overflow:auto;
}

.msg{
background:#ff2f6e;
color:white;
padding:8px;
margin:6px;
border-radius:8px;
}

</style>

</head>

<body>

<h2>🌷 Tulip Chat</h2>

<div id="main">

<div id="chat"></div>

<div id="users"></div>

</div>

<input id="text">
<button onclick="send()">Send</button>

<input type="file" id="file">
<button onclick="upload()">GIF/Image</button>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io()

let username=prompt("Enter name")

socket.emit("join",{username})

function send(){

let msg=text.value

socket.emit("message",{

username,
msg

})

text.value=""

}

socket.on("message",(d)=>{

let div=document.createElement("div")

div.className="msg"

div.innerText=d.username+" : "+d.msg

chat.appendChild(div)

})

/* UPLOAD */

async function upload(){

let file=document.getElementById("file").files[0]

let fd=new FormData()

fd.append("file",file)

let res=await fetch("/upload",{

method:"POST",
body:fd

})

let data=await res.json()

socket.emit("message",{

username,
msg:data.url

})

}

/* ONLINE USERS */

socket.on("onlineUsers",(users)=>{

usersDiv.innerHTML=""

users.forEach(u=>{

let div=document.createElement("div")

div.innerHTML=

u.username+

` <button onclick="dm('${u.username}')">DM</button>
<button onclick="friend('${u.username}')">Add</button>
<button onclick="report('${u.username}')">Report</button>`

users.appendChild(div)

})

})

/* DM */

function dm(user){

let msg=prompt("DM to "+user)

socket.emit("dm",{

from:username,
to:user,
msg

})

}

socket.on("dm",(d)=>{

alert("DM from "+d.from+": "+d.msg)

})

/* FRIEND */

function friend(user){

socket.emit("friendRequest",{

from:username,
to:user

})

}

/* REPORT */

function report(user){

socket.emit("reportUser",{

from:username,
target:user

})

alert("Reported")

}

</script>

</body>

</html>
