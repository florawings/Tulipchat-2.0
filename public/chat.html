<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Tulip Chat</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f2f2f2;
}

header{
background:#ff2d7a;
color:white;
padding:12px;
display:flex;
justify-content:space-between;
}

#chat{
padding:10px;
height:70vh;
overflow:auto;
}

.msg{
background:white;
margin:5px;
padding:10px;
border-radius:6px;
}

.system{
background:#ddd;
}

.bottom{
position:fixed;
bottom:0;
left:0;
right:0;
display:flex;
}

.bottom input{
flex:1;
padding:12px;
border:none;
}

button{
padding:12px;
border:none;
background:#ff2d7a;
color:white;
}

#userPopup{

display:none;
position:fixed;
top:60px;
right:10px;
background:white;
border:1px solid #ccc;
width:200px;
height:300px;
overflow:auto;
padding:10px;

}

img{
max-width:200px;
border-radius:6px;
}

</style>

</head>

<body>

<header>

<span>🌷 Tulip Chat</span>

<button onclick="toggleUsers()">👥</button>

</header>

<div id="userPopup"></div>

<div id="chat"></div>

<div id="typing"></div>

<div class="bottom">

<input id="msg" placeholder="message">

<button onclick="send()">Send</button>

<input type="file" id="file" hidden>

<button onclick="upload()">📷</button>

<button onclick="sendGIF()">GIF</button>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io()

let name = localStorage.getItem("name")

if(!name){

name = prompt("Enter name")

localStorage.setItem("name",name)

}

socket.emit("join",name)

let currentDM = null

function send(){

let text=msg.value

if(!text) return

socket.emit("message",{

name:name,
text:text

})

msg.value=""

}

socket.on("message",(data)=>{

addMsg(data.name+": "+data.text)

})

socket.on("system",(text)=>{

addMsg(text,true)

})

socket.on("image",(data)=>{

addImage(data.name,data.url)

})

socket.on("gif",(data)=>{

addImage(data.name,data.url)

})

function upload(){

file.click()

}

file.onchange=function(){

let reader=new FileReader()

reader.onload=function(){

socket.emit("image",{

name:name,
url:reader.result

})

}

reader.readAsDataURL(file.files[0])

}

function sendGIF(){

let url=prompt("Paste GIF URL")

socket.emit("gif",{

name:name,
url:url

})

}

function addMsg(text,system){

let div=document.createElement("div")

div.className="msg"

if(system) div.className+=" system"

div.innerText=text

chat.appendChild(div)

chat.scrollTop=chat.scrollHeight

}

function addImage(user,url){

let div=document.createElement("div")

div.className="msg"

div.innerHTML=user+"<br><img src='"+url+"'>"

chat.appendChild(div)

chat.scrollTop=chat.scrollHeight

}

socket.on("users",(list)=>{

let box=document.getElementById("userPopup")

box.innerHTML=""

for(let id in list){

let div=document.createElement("div")

div.innerText=list[id]

div.onclick=function(){

startDM(id,list[id])

}

box.appendChild(div)

}

})

function toggleUsers(){

let box=document.getElementById("userPopup")

box.style.display = box.style.display=="block" ? "none":"block"

}

function startDM(id,user){

currentDM=id

alert("DM started with "+user)

}

msg.oninput=function(){

if(currentDM){

socket.emit("typing",{

to:currentDM,
name:name

})

}

}

socket.on("typing",(user)=>{

typing.innerText=user+" typing..."

setTimeout(()=>{

typing.innerText=""

},2000)

})

socket.on("dm",(data)=>{

addMsg("(DM) "+data.name+": "+data.text)

socket.emit("seen",{

to:currentDM,
name:name

})

})

socket.on("seen",(user)=>{

console.log("Seen by "+user)

})

</script>

</body>
</html>
