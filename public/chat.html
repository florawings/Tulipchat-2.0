<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Tulip Chat</title>

<style>

body{
margin:0;
font-family:Arial;
display:flex;
height:100vh;
}

/* LEFT USERS PANEL */

#usersPanel{
width:120px;
background:#fafafa;
border-right:1px solid #ddd;
overflow-y:auto;
}

#usersPanel h3{
text-align:center;
font-size:14px;
}

.user{
padding:8px;
border-bottom:1px solid #eee;
cursor:pointer;
}

.user:hover{
background:#eee;
}

/* MAIN AREA */

#main{
flex:1;
display:flex;
flex-direction:column;
}

/* HEADER */

#header{
background:#ff2a6d;
color:white;
padding:12px;
display:flex;
justify-content:space-between;
}

/* CHAT */

#chat{
flex:1;
overflow-y:auto;
background:#f1f1f1;
padding:10px;
}

/* MESSAGE */

.msg{
background:white;
padding:8px;
border-radius:6px;
margin-bottom:6px;
max-width:80%;
}

/* IMAGE */

.msg img{
max-width:120px;
border-radius:6px;
cursor:pointer;
}

/* INPUT BAR */

#inputBar{
display:flex;
padding:8px;
border-top:1px solid #ddd;
background:white;
}

#message{
flex:1;
padding:10px;
border:1px solid #ccc;
border-radius:6px;
}

button{
margin-left:6px;
padding:10px 14px;
border:none;
background:#ff2a6d;
color:white;
border-radius:6px;
}

/* DM POPUP */

#dmPopup{
position:fixed;
top:10px;
left:50%;
transform:translateX(-50%);
background:#ff2a6d;
color:white;
padding:10px 16px;
border-radius:8px;
display:none;
z-index:999;
}

</style>

</head>

<body>

<div id="dmPopup"></div>

<div id="usersPanel">

<h3>Online</h3>

<div id="users"></div>

</div>

<div id="main">

<div id="header">
🌷 Tulip Chat
<button onclick="logout()">Logout</button>
</div>

<div id="chat"></div>

<div id="inputBar">

<input id="message" placeholder="message">

<button onclick="sendMsg()">Send</button>

<input type="file" id="imgInput" style="display:none" onchange="sendImage()">

<button onclick="document.getElementById('imgInput').click()">📷</button>

<button onclick="sendGif()">GIF</button>

</div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io()

const chat = document.getElementById("chat")

const usersDiv = document.getElementById("users")

const popup = document.getElementById("dmPopup")

let username = localStorage.getItem("name")

socket.emit("join",username)

/* SEND MESSAGE */

function sendMsg(){

let msg=document.getElementById("message").value

if(!msg) return

socket.emit("message",msg)

document.getElementById("message").value=""

}

/* RECEIVE MESSAGE */

socket.on("message",(data)=>{

let div=document.createElement("div")

div.className="msg"

div.innerText=data

chat.appendChild(div)

chat.scrollTop=chat.scrollHeight

})

/* USERS */

socket.on("users",(users)=>{

usersDiv.innerHTML=""

users.forEach(u=>{

let div=document.createElement("div")

div.className="user"

div.innerText=u

div.onclick=()=>startDM(u)

usersDiv.appendChild(div)

})

})

/* DM */

function startDM(user){

let msg=prompt("DM to "+user)

if(msg){

socket.emit("dm",{to:user,msg:msg})

}

}

socket.on("dm",(data)=>{

popup.style.display="block"

popup.innerText=data.from+" sent DM"

setTimeout(()=>{

popup.style.display="none"

},3000)

let div=document.createElement("div")

div.className="msg"

div.innerText="DM "+data.from+": "+data.msg

chat.prepend(div)

})

/* IMAGE */

function sendImage(){

let file=document.getElementById("imgInput").files[0]

let reader=new FileReader()

reader.onload=()=>{

socket.emit("image",reader.result)

}

reader.readAsDataURL(file)

}

socket.on("image",(data)=>{

let div=document.createElement("div")

div.className="msg"

let img=document.createElement("img")

img.src=data

img.onclick=()=>window.open(data)

div.appendChild(img)

chat.appendChild(div)

})

/* GIF */

function sendGif(){

let url=prompt("Enter GIF URL")

if(url){

socket.emit("gif",url)

}

}

socket.on("gif",(url)=>{

let div=document.createElement("div")

div.className="msg"

let img=document.createElement("img")

img.src=url

div.appendChild(img)

chat.appendChild(div)

})

/* LOGOUT */

function logout(){

localStorage.clear()

location.href="/"

}

</script>

</body>
</html>
