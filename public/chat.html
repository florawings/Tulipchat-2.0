<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tulip Chat</title>

<style>

body{
margin:0;
font-family:Arial;
background:#eee;
}

header{
background:#ff2d7a;
color:white;
padding:12px;
display:flex;
justify-content:space-between;
}

#chat{
height:72vh;
overflow:auto;
padding:10px;
}

.msg{
background:white;
padding:10px;
margin:6px;
border-radius:6px;
}

.system{
background:#ddd;
}

.bottom{
position:fixed;
bottom:0;
left:0;
right:0;
display:flex;
}

.bottom input{
flex:1;
padding:12px;
border:none;
}

button{
border:none;
padding:12px;
background:#ff2d7a;
color:white;
}

img{
max-width:220px;
border-radius:6px;
}

</style>

</head>

<body>

<header>

<span>🌷 Tulip Chat</span>

<button onclick="logout()">Logout</button>

</header>

<div id="chat"></div>

<div class="bottom">

<input id="msg" placeholder="message">

<button onclick="send()">Send</button>

<input type="file" id="imageInput" accept="image/*" hidden>
<button onclick="openGallery()">📷</button>

<input type="file" id="gifInput" accept="image/gif" hidden>
<button onclick="openGif()">GIF</button>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io()

let name = localStorage.getItem("name")

if(!name){

name = prompt("Enter name")

localStorage.setItem("name",name)

}

socket.emit("join",{name})

function send(){

let text = msg.value

if(!text) return

socket.emit("message",{name,text})

msg.value=""

}

socket.on("message",(data)=>{

addMsg(data.name+": "+data.text)

})

socket.on("system",(text)=>{

addMsg(text,true)

})

socket.on("image",(data)=>{

addImage(data.name,data.url)

})

function openGallery(){

document.getElementById("imageInput").click()

}

function openGif(){

document.getElementById("gifInput").click()

}

document.getElementById("imageInput").onchange=function(){

uploadFile(this.files[0],"Image")

}

document.getElementById("gifInput").onchange=function(){

uploadFile(this.files[0],"GIF")

}

function uploadFile(file,type){

let formData=new FormData()

formData.append("file",file)

let xhr=new XMLHttpRequest()

xhr.open("POST","/upload",true)

xhr.upload.onprogress=function(e){

let percent=Math.round((e.loaded/e.total)*100)

addMsg("Uploading "+type+" "+percent+"%",true)

}

xhr.onload=function(){

let data=JSON.parse(xhr.responseText)

socket.emit("image",{name,url:data.url})

}

xhr.send(formData)

}

function logout(){

localStorage.clear()

location.reload()

}

function addMsg(text,system){

let div=document.createElement("div")

div.className="msg"

if(system) div.className+=" system"

div.innerText=text

chat.appendChild(div)

chat.scrollTop=chat.scrollHeight

}

function addImage(user,url){

let div=document.createElement("div")

div.className="msg"

div.innerHTML=user+"<br><img src='"+url+"'>"

chat.appendChild(div)

chat.scrollTop=chat.scrollHeight

}

setInterval(()=>{

socket.emit("refresh")

},10000)

</script>

</body>

</html>
