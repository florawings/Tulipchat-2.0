<!DOCTYPE html><html>
<head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tulip Chat</title><style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
height:100vh;
display:flex;
flex-direction:column;
background:#f6dfe5;
overflow:hidden;
}

/* HEADER */

#header{
height:50px;
background:#ff3d6e;
color:white;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 15px;
font-size:18px;
}

/* MAIN LAYOUT */

#main{
flex:1;
display:flex;
}

/* CHAT */

#chatSection{
width:70%;
display:flex;
flex-direction:column;
border-right:1px solid #ddd;
}

#chat{
flex:1;
overflow-y:auto;
padding:10px;
display:flex;
flex-direction:column;
gap:8px;
}

/* MESSAGE */

.msg{
background:#ff3d6e;
color:white;
padding:10px 14px;
border-radius:18px;
max-width:75%;
font-size:14px;
word-wrap:break-word;
}

.msg img{
max-width:200px;
border-radius:10px;
margin-top:6px;
}

/* INPUT BAR */

#inputBar{
height:60px;
display:flex;
align-items:center;
gap:6px;
padding:6px;
background:white;
border-top:1px solid #ccc;
}

#text{
flex:1;
padding:8px;
border-radius:20px;
border:1px solid #ccc;
}

button{
background:#ff3d6e;
color:white;
border:none;
padding:8px 12px;
border-radius:10px;
cursor:pointer;
}

/* USERS */

#usersSection{
width:30%;
background:white;
display:flex;
flex-direction:column;
}

#usersHeader{
padding:10px;
background:#eee;
font-weight:bold;
}

#onlineList{
flex:1;
overflow-y:auto;
}

.userItem{
padding:8px;
border-bottom:1px solid #eee;
font-size:14px;
}

/* UPLOAD PROGRESS */

#progress{
font-size:12px;
color:#444;
}

</style></head><body><div id="header"><div>🌷 Tulip Chat</div><div><button onclick="clearChat()">🧹</button>

<button onclick="location.reload()">🔄</button>

</div></div><div id="main"><!-- CHAT --><div id="chatSection"><div id="chat"></div><div id="inputBar"><input id="text" placeholder="Type message"><button onclick="send()">Send</button>

<input type="file" id="file" hidden accept="image/*,.gif"><button onclick="upload()">GIF</button>

<span id="progress"></span>

</div></div><!-- USERS --><div id="usersSection"><div id="usersHeader">Active Members</div><div id="onlineList"></div></div></div><script src="/socket.io/socket.io.js"></script><script>

const socket = io()

let username = localStorage.getItem("username")
let gender = localStorage.getItem("gender")

if(!username){

location.href="/login.html"

}

/* JOIN */

socket.emit("join",{username,gender})

function avatar(g){

return g==="female"?"👩":"👨"

}

/* SEND MESSAGE */

function send(){

let msg = text.value.trim()

if(!msg) return

socket.emit("message",{

username,
gender,
msg

})

text.value=""

}

/* RECEIVE MESSAGE */

socket.on("message",(d)=>{

let div = document.createElement("div")

div.className="msg"

let icon = avatar(d.gender)

if(d.msg.includes("/uploads")){

div.innerHTML = icon+" "+d.username+"<br><img src='"+d.msg+"'>"

}else{

div.innerText = icon+" "+d.username+": "+d.msg

}

chat.appendChild(div)

chat.scrollTop = chat.scrollHeight

})

/* CLEAR CHAT */

function clearChat(){

socket.emit("message",{

username,
gender,
msg:"/clear"

})

}

socket.on("clearChat",()=>{

chat.innerHTML=""

})

/* ONLINE USERS */

socket.on("onlineUsers",(users)=>{

onlineList.innerHTML=""

users.forEach(u=>{

let div=document.createElement("div")

div.className="userItem"

div.innerText=(u.gender==="female"?"👩":"👨")+" "+u.username

onlineList.appendChild(div)

})

})

/* FILE UPLOAD */

function upload(){

file.click()

}

file.onchange=()=>{

let f=file.files[0]

let fd=new FormData()

fd.append("file",f)

let xhr=new XMLHttpRequest()

xhr.open("POST","/upload")

xhr.upload.onprogress=(e)=>{

let percent=Math.round((e.loaded/e.total)*100)

progress.innerText=percent+"%"

}

xhr.onload=()=>{

let res=JSON.parse(xhr.responseText)

socket.emit("message",{

username,
gender,
msg:res.url

})

progress.innerText=""

}

xhr.send(fd)

}

</script></body></html>
