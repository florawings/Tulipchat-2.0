<!DOCTYPE html>
<html>

<head>

<title>Tulip Chat</title>

<meta name="viewport" content="width=device-width,initial-scale=1">

<script src="/socket.io/socket.io.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
}

#topbar{
background:#020617;
padding:10px;
display:flex;
justify-content:space-between;
}

#main{
display:flex;
height:90vh;
}

#rooms{
width:120px;
background:#020617;
}

.room{
padding:12px;
cursor:pointer;
border-bottom:1px solid #111;
}

.room:hover{
background:#1e293b;
}

#chat{
flex:1;
display:flex;
flex-direction:column;
}

#messages{
flex:1;
overflow:auto;
padding:15px;
}

.msg{
background:#1e293b;
padding:10px;
border-radius:10px;
margin-bottom:8px;
}

#sendbox{
display:flex;
padding:8px;
background:#020617;
}

#msg{
flex:1;
padding:10px;
border:none;
border-radius:10px;
}

#send{
padding:10px;
background:#22c55e;
border:none;
color:white;
margin-left:5px;
border-radius:10px;
}

#users{
width:130px;
background:#020617;
}

.user{
padding:8px;
border-bottom:1px solid #111;
}

#search{
width:100%;
padding:6px;
border:none;
}

</style>

</head>

<body>

<div id="topbar">

<div>Tulip Chat</div>

<div id="username"></div>

</div>

<div id="main">

<div id="rooms">

<div class="room" onclick="joinRoom('main')">Main</div>
<div class="room" onclick="joinRoom('adult')">Adult</div>
<div class="room" onclick="joinRoom('quiz')">Quiz</div>
<div class="room" onclick="joinRoom('marathi')">Marathi</div>

</div>

<div id="chat">

<div id="messages"></div>

<div id="sendbox">

<input id="msg" placeholder="Type message">

<button id="send">Send</button>

</div>

</div>

<div id="users">

<input id="search" placeholder="Search">

<div id="userlist"></div>

</div>

</div>

<script>

const socket = io()

let username = localStorage.getItem("username")

if(!username){

location="index.html"

}

document.getElementById("username").innerText=username

let room="main"

socket.emit("join",{username,room})

function joinRoom(r){

room=r

document.getElementById("messages").innerHTML=""

socket.emit("join",{username,room})

}

document.getElementById("send").onclick=function(){

let text=document.getElementById("msg").value

if(text=="") return

socket.emit("chat message",{user:username,msg:text,room})

document.getElementById("msg").value=""

}

socket.on("chat message",(data)=>{

let div=document.createElement("div")

div.className="msg"

div.innerText=data.user+" : "+data.msg

document.getElementById("messages").appendChild(div)

})

/* SEARCH */

document.getElementById("search").onkeyup=function(){

let v=this.value.toLowerCase()

let users=document.querySelectorAll(".user")

users.forEach(u=>{

if(u.innerText.toLowerCase().includes(v)){
u.style.display="block"
}else{
u.style.display="none"
}

})

}

</script>

</body>

</html>
