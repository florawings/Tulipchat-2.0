<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tulip Chat</title>

<script src="/socket.io/socket.io.js"></script>

<style>

body{
margin:0;
font-family:Arial;
height:100vh;
display:flex;
flex-direction:column;
background:linear-gradient(135deg,#ff6a8b,#ff8fab);
}

/* HEADER */

#header{
height:55px;
background:#ff2d5a;
color:white;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 15px;
font-size:18px;
}

#menu{
cursor:pointer;
font-size:22px;
}

#logout{
background:white;
color:#ff2d5a;
border:none;
padding:6px 12px;
border-radius:20px;
}

/* MAIN */

#main{
flex:1;
display:flex;
overflow:hidden;
}

/* SIDEBAR */

#sidebar{
width:220px;
background:white;
overflow:auto;
transition:0.3s;
}

#sidebar.closed{
width:0;
}

#sidebar h3{
padding:10px;
margin:0;
border-bottom:1px solid #eee;
}

/* CHAT AREA */

#chatArea{
flex:1;
display:flex;
flex-direction:column;
}

/* CHAT MESSAGES */

#chat{
flex:1;
overflow:auto;
padding:10px;
}

.msg{
background:white;
padding:10px;
margin-bottom:8px;
border-radius:12px;
max-width:80%;
}

/* INPUT AREA */

#sendBox{
display:flex;
padding:10px;
gap:5px;
background:white;
}

#msg{
flex:1;
padding:12px;
border-radius:25px;
border:1px solid #ddd;
font-size:16px;
}

button{
background:#ff2d5a;
color:white;
border:none;
padding:10px 14px;
border-radius:25px;
}

/* IMAGE */

.msg img{
max-width:200px;
border-radius:10px;
}

</style>

</head>

<body>

<div id="header">

<span id="menu">☰</span>

<span>Tulip Chat</span>

<button id="logout">Logout</button>

</div>


<div id="main">

<div id="sidebar">

<h3>Online Users</h3>

<div id="onlineUsers"></div>

</div>


<div id="chatArea">

<div id="chat"></div>

<div id="sendBox">

<input id="msg" placeholder="Type message...">

<button onclick="send()">Send</button>

<input type="file" id="imgFile">

<button onclick="sendImage()">GIF</button>

</div>

</div>

</div>

<script>

const socket = io()

let username = localStorage.getItem("username")

if(!username){
window.location="login.html"
}

socket.emit("join",username)

/* MESSAGE RENDER */

function render(msg){

const div=document.createElement("div")

div.classList.add("msg")

if(msg.image){

div.innerHTML="<b>"+msg.user+"</b><br><img src='"+msg.image+"'>"

}else{

div.innerHTML="<b>"+msg.user+"</b>: "+msg.text

}

document.getElementById("chat").appendChild(div)

document.getElementById("chat").scrollTop=999999

}

/* SEND MESSAGE */

function send(){

let text=document.getElementById("msg").value

if(!text) return

socket.emit("chat",{
user:username,
text:text
})

document.getElementById("msg").value=""

}

/* SEND IMAGE / GIF */

function sendImage(){

const file=document.getElementById("imgFile").files[0]

if(!file) return

const reader=new FileReader()

reader.onload=function(){

socket.emit("chat",{
user:username,
image:reader.result
})

}

reader.readAsDataURL(file)

}

/* RECEIVE CHAT */

socket.on("chat",msg=>render(msg))

socket.on("chatHistory",msgs=>{
msgs.forEach(m=>render(m))
})

socket.on("clearChat",()=>{
document.getElementById("chat").innerHTML=""
})

/* ONLINE USERS */

socket.on("onlineUsers",users=>{

const box=document.getElementById("onlineUsers")

box.innerHTML=""

users.forEach(u=>{

const div=document.createElement("div")

div.innerHTML="🟢 "+u

box.appendChild(div)

})

})

/* MENU TOGGLE */

document.getElementById("menu").onclick=()=>{

document.getElementById("sidebar").classList.toggle("closed")

}

/* LOGOUT */

document.getElementById("logout").onclick=()=>{

localStorage.removeItem("username")

window.location="login.html"

}

</script>

</body>
</html>
