<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tulip Pro | Professional Layout</title>
    <style>
        :root { --main: #f43f5e; --bg: #0f172a; --card: rgba(30, 41, 59, 0.8); --text: #f8fafc; }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        
        body { 
            /* Background Image Setup (Tulipchat jaisa look) */
            background: url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?ixlib=rb-1.2.1&auto=format&fit=crop&w=1351&q=80'); 
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- HEADER --- */
        header { 
            height: 60px; background: rgba(15, 23, 42, 0.9); 
            display: flex; align-items: center; padding: 0 15px; 
            justify-content: space-between; border-bottom: 1px solid rgba(244, 63, 94, 0.3);
            backdrop-filter: blur(10px);
        }
        .logout-link { color: #ef4444; font-weight: bold; text-decoration: none; font-size: 14px; cursor: pointer; }

        /* --- CHAT AREA --- */
        #chat-scroller { 
            flex: 1; overflow-y: auto; padding: 15px; 
            display: flex; flex-direction: column; gap: 10px;
            background: rgba(0, 0, 0, 0.4); /* Chat readability ke liye halka black overlay */
        }
        
        .msg { max-width: 75%; padding: 8px 12px; border-radius: 15px; font-size: 14px; color: white; line-height: 1.4; }
        .msg.me { align-self: flex-end; background: var(--main); border-bottom-right-radius: 2px; }
        .msg.other { align-self: flex-start; background: var(--card); border-bottom-left-radius: 2px; backdrop-filter: blur(5px); }
        .tag { font-size: 11px; font-weight: bold; color: #fbbf24; margin-bottom: 3px; display: block; }

        /* --- IMAGE THUMBNAIL (Chota Size) --- */
        .chat-img-thumb { 
            width: 150px; /* Chota size */
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
            margin-top: 5px;
            cursor: pointer;
            border: 2px solid rgba(255,255,255,0.1);
            transition: 0.2s;
        }
        .chat-img-thumb:hover { transform: scale(1.05); }

        /* --- IMAGE MODAL (Full Screen Popup) --- */
        #imgModal {
            display: none; position: fixed; z-index: 2000; inset: 0;
            background: rgba(0,0,0,0.9); align-items: center; justify-content: center;
        }
        #imgModal img { max-width: 95%; max-height: 90%; border-radius: 5px; }
        #closeModal { position: absolute; top: 20px; right: 20px; color: white; font-size: 30px; cursor: pointer; }

        /* --- INPUT BOX --- */
        .bottom-nav { padding: 12px; background: rgba(15, 23, 42, 0.9); border-top: 1px solid rgba(244, 63, 94, 0.2); }
        .input-wrap { display: flex; align-items: center; background: rgba(255,255,255,0.1); padding: 5px 15px; border-radius: 25px; gap: 10px; }
        #msgIn { flex: 1; background: none; border: none; color: white; padding: 10px; outline: none; }
        .icon-btn { font-size: 20px; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <div style="display:flex; align-items:center; gap:10px;">
        <span onclick="toggleSidebar()" style="font-size:22px; cursor:pointer;">☰</span>
        <span style="font-weight:bold; color:var(--main);">TULIP PRO</span>
    </div>
    <div class="logout-link" onclick="logout()">🚪 LOGOUT</div>
</header>

<div id="chat-scroller"></div>

<div id="imgModal">
    <span id="closeModal" onclick="closeImg()">&times;</span>
    <img id="fullImg" src="">
</div>

<div class="bottom-nav">
    <div class="input-wrap">
        <span class="icon-btn" onclick="document.getElementById('fileIn').click()">🖼️</span>
        <input type="file" id="fileIn" hidden onchange="uploadMedia()">
        <input type="text" id="msgIn" placeholder="Aa" onkeypress="if(event.key==='Enter') send()">
        <span style="color:var(--main); font-weight:bold;" onclick="send()">SEND</span>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    const params = new URLSearchParams(window.location.search);
    const username = params.get('username') || "Guest";
    const gender = params.get('gender') || "Male";

    socket.emit('join', { username, gender });

    function logout() {
        if(confirm("Exit Chat?")) window.location.href = 'index.html';
    }

    // Image Modal Functions
    function openImg(src) {
        document.getElementById('fullImg').src = src;
        document.getElementById('imgModal').style.display = 'flex';
    }
    function closeImg() {
        document.getElementById('imgModal').style.display = 'none';
    }

    function render(data) {
        const box = document.getElementById('chat-scroller');
        const div = document.createElement('div');
        const isMe = data.user === username;
        div.className = `msg ${isMe ? 'me' : 'other'}`;
        
        let name = `<span class="tag">${data.user}</span>`;
        let content = data.type === 'file' 
            ? `<img src="${data.text}" class="chat-img-thumb" onclick="openImg(this.src)">` 
            : `<div>${data.text}</div>`;

        div.innerHTML = name + content;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    socket.on('newMessage', (data) => render(data));
    socket.on('loadHistory', (history) => {
        box.innerHTML = '';
        history.forEach(m => render(m));
    });

    function send() {
        const input = document.getElementById('msgIn');
        if(input.value.trim()) {
            socket.emit('sendMessage', { message: input.value, type: 'text' });
            input.value = '';
        }
    }

    function uploadMedia() {
        const file = document.getElementById('fileIn').files[0];
        const fd = new FormData();
        fd.append('chatFile', file);
        
        fetch('/upload', { method: 'POST', body: fd })
        .then(res => res.json())
        .then(data => {
            socket.emit('sendMessage', { message: data.url, type: 'file' });
        });
    }
</script>
</body>
</html>
