<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tulip Pro | Ultimate</title>
    <style>
        :root { --main: #f43f5e; --bg: #0f172a; --card: rgba(30, 41, 59, 0.7); --text: #f8fafc; }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        
        body { 
            background: url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1200&q=80'); 
            background-size: cover; background-position: center; height: 100vh; display: flex; flex-direction: column; 
        }

        /* --- HEADER --- */
        header { 
            height: 60px; background: rgba(15, 23, 42, 0.85); display: flex; 
            align-items: center; padding: 0 15px; justify-content: space-between;
            backdrop-filter: blur(10px); z-index: 100; border-bottom: 1px solid rgba(244,63,94,0.3);
        }
        .logout-btn { color: #ef4444; font-weight: bold; cursor: pointer; font-size: 14px; }

        /* --- SIDEBAR --- */
        #sidebar {
            position: fixed; left: -280px; width: 280px; height: 100%;
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(15px);
            transition: 0.3s; z-index: 1001; padding: 20px; border-right: 1px solid rgba(255,255,255,0.1);
        }
        #sidebar.open { left: 0; }
        .sidebar-close { font-size: 30px; position: absolute; right: 20px; cursor: pointer; }
        #online-list { margin-top: 40px; }

        /* --- CHAT AREA --- */
        #chat-scroller { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; background: rgba(0,0,0,0.3); }
        .msg { max-width: 80%; padding: 10px 14px; border-radius: 18px; font-size: 14px; line-height: 1.4; color: white; }
        .msg.me { align-self: flex-end; background: var(--main); border-bottom-right-radius: 4px; }
        .msg.other { align-self: flex-start; background: var(--card); border-bottom-left-radius: 4px; backdrop-filter: blur(5px); }
        .tag { font-size: 11px; font-weight: bold; color: #fbbf24; margin-bottom: 4px; display: block; }

        /* --- IMAGE FIT & MODAL --- */
        .chat-img-thumb { width: 140px; height: 100px; object-fit: cover; border-radius: 10px; margin-top: 5px; cursor: pointer; border: 2px solid rgba(255,255,255,0.1); }
        #imgModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; align-items: center; justify-content: center; }
        #imgModal img { max-width: 95%; max-height: 90%; border-radius: 8px; }

        /* --- INPUT --- */
        .bottom-nav { padding: 10px; background: rgba(15, 23, 42, 0.9); }
        .input-wrap { display: flex; align-items: center; background: rgba(255,255,255,0.1); padding: 5px 15px; border-radius: 30px; gap: 10px; }
        #msgIn { flex: 1; background: none; border: none; color: white; padding: 12px; outline: none; }
    </style>
</head>
<body>

<div id="sidebar">
    <span class="sidebar-close" onclick="toggleMenu()">×</span>
    <h3 style="color:var(--main); margin-bottom:15px;">Online Users</h3>
    <div id="online-list"></div>
</div>

<header>
    <div onclick="toggleMenu()" style="font-size:24px; cursor:pointer;">☰</div>
    <div style="font-weight:bold; color:white;">TULIP <span style="color:var(--main)">PRO</span></div>
    <div class="logout-btn" onclick="logout()">LOGOUT</div>
</header>

<div id="chat-scroller"></div>

<div id="imgModal" onclick="this.style.display='none'">
    <img id="fullImg" src="">
</div>

<div class="bottom-nav">
    <div class="input-wrap">
        <span onclick="document.getElementById('fileIn').click()" style="cursor:pointer; font-size:20px;">🖼️</span>
        <input type="file" id="fileIn" hidden onchange="uploadMedia()">
        <input type="text" id="msgIn" placeholder="Type message..." autocomplete="off">
        <span onclick="send()" style="color:var(--main); font-weight:bold; cursor:pointer;">SEND</span>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    const params = new URLSearchParams(window.location.search);
    const username = params.get('username') || "Guest";
    const gender = params.get('gender') || "Male";

    socket.emit('join', { username, gender });

    function toggleMenu() { document.getElementById('sidebar').classList.toggle('open'); }
    function logout() { if(confirm("Logout?")) window.location.href = 'index.html'; }
    function openImg(src) { document.getElementById('fullImg').src = src; document.getElementById('imgModal').style.display='flex'; }

    function render(data) {
        const box = document.getElementById('chat-scroller');
        const div = document.createElement('div');
        const isMe = data.user === username;
        div.className = `msg ${isMe ? 'me' : 'other'}`;
        
        let ava = data.gender === 'Female' ? '👩' : '👨';
        let nameTag = `<span class="tag">${ava} ${data.user || 'Guest'}</span>`;
        
        if(data.type === 'file') {
            div.innerHTML = `${nameTag}<img src="${data.text}" class="chat-img-thumb" onclick="openImg(this.src)">`;
        } else {
            div.innerHTML = `${nameTag}<div>${data.text}</div>`;
        }
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    socket.on('newMessage', (m) => render(m));
    socket.on('updateUserList', (users) => {
        document.getElementById('online-list').innerHTML = users.map(u => `
            <div style="display:flex; align-items:center; gap:10px; margin-bottom:12px;">
                <div style="width:8px; height:8px; background:#22c55e; border-radius:50%;"></div>
                <span style="color:white; font-size:14px;">${u.gender==='Female'?'👩':'👨'} ${u.username}</span>
            </div>
        `).join('');
    });

    function send() {
        const input = document.getElementById('msgIn');
        if(input.value.trim()) {
            socket.emit('sendMessage', { message: input.value, type: 'text', gender: gender });
            input.value = '';
        }
    }
    document.getElementById('msgIn').addEventListener('keypress', (e) => { if(e.key === 'Enter') send(); });

    function uploadMedia() {
        const file = document.getElementById('fileIn').files[0];
        const fd = new FormData();
        fd.append('chatFile', file);
        fetch('/upload', { method: 'POST', body: fd })
        .then(r => r.json()).then(d => {
            socket.emit('sendMessage', { message: d.url, type: 'file', gender: gender });
        });
    }
</script>
</body>
</html>
