<!DOCTYPE html><html>
<head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tulip Chat</title><style>

body{
margin:0;
font-family:Arial;
background:#f2dce3;
height:100vh;
display:flex;
flex-direction:column;
}

/* HEADER */

#header{
background:#ff3d6e;
color:white;
padding:10px;
display:flex;
justify-content:space-between;
align-items:center;
}

#header button{
background:none;
border:none;
color:white;
font-size:18px;
}

/* CHAT AREA */

#chat{
flex:1;
overflow-y:auto;
padding:15px;
display:flex;
flex-direction:column;
gap:10px;
}

/* MESSAGE */

.msg{
background:#ff3d6e;
color:white;
padding:10px 15px;
border-radius:20px;
max-width:75%;
}

.msg img{
max-width:200px;
border-radius:10px;
}

/* INPUT AREA */

#input{
display:flex;
padding:10px;
gap:5px;
background:white;
}

#text{
flex:1;
padding:10px;
border-radius:20px;
border:1px solid #ccc;
}

button{
background:#ff3d6e;
color:white;
border:none;
padding:10px 12px;
border-radius:10px;
}

</style></head><body><div id="header"><button onclick="toggleMenu()">☰</button>

<div>Tulip Chat</div><div>
<button onclick="location.reload()">🔄</button>
<button onclick="openInbox()">📥</button>
</div></div><div id="chat"></div><div id="input"><input id="text" placeholder="Type message"><button onclick="send()">Send</button>

<input type="file" id="file" hidden accept="image/*,.gif"><button onclick="upload()">📷</button>

</div><script src="/socket.io/socket.io.js"></script><script>

const socket = io()

let username = localStorage.getItem("username")
let gender = localStorage.getItem("gender")

if(!username){

username = prompt("Enter name")
gender = prompt("male / female")

localStorage.setItem("username",username)
localStorage.setItem("gender",gender)

}

socket.emit("join",{username,gender})

function avatar(g){

return g==="female" ? "👩" : "👨"

}

/* SEND MESSAGE */

function send(){

let msg=text.value

if(!msg) return

socket.emit("chat",{username,gender,msg})

text.value=""

}

/* RECEIVE */

socket.on("chat",(d)=>{

let div=document.createElement("div")

div.className="msg"

let icon=avatar(d.gender)

if(d.msg.includes("/uploads")){

div.innerHTML=icon+" "+d.username+"<br><img src='"+d.msg+"'>"

}else{

div.innerText=icon+" "+d.username+": "+d.msg

}

chat.appendChild(div)

chat.scrollTop=chat.scrollHeight

})

/* UPLOAD IMAGE OR GIF */

function upload(){

file.click()

}

file.onchange=()=>{

let f=file.files[0]

let fd=new FormData()

fd.append("file",f)

fetch("/upload",{

method:"POST",
body:fd

})
.then(r=>r.json())
.then(d=>{

socket.emit("chat",{

username,
gender,
msg:d.url

})

})

}

/* MENU */

function toggleMenu(){

alert("online users panel next update")

}

function openInbox(){

alert("DM inbox coming")

}

</script></body>
</html>
