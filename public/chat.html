<!DOCTYPE html><html>
<head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tulip Chat</title><style>

body{
margin:0;
font-family:Arial;
display:flex;
height:100vh;
background:black;
color:white;
overflow:hidden;
}

/* SIDEBAR */

#sidebar{
width:220px;
background:#000;
padding:15px;
}

.room{
padding:10px;
background:#111;
border-radius:6px;
margin-bottom:8px;
cursor:pointer;
}

.room:hover{
background:#222;
}

/* CHAT AREA */

#chat{
flex:1;
display:flex;
flex-direction:column;
background:url("https://images.unsplash.com/photo-1518199266791-5375a83190b7") center/cover;
}

#topbar{
height:50px;
background:#111;
display:flex;
align-items:center;
padding-left:15px;
}

/* MESSAGES */

#messages{
flex:1;
overflow:auto;
padding:15px;
}

.msg{
background:rgba(0,0,0,0.6);
padding:10px;
border-radius:10px;
margin-bottom:10px;
max-width:70%;
}

.system{
text-align:center;
color:#aaa;
margin:10px 0;
}

.msg img{
max-width:220px;
border-radius:10px;
margin-top:6px;
}

/* INPUT */

#inputBar{
display:flex;
padding:10px;
background:black;
}

#text{
flex:1;
padding:10px;
border-radius:20px;
border:none;
outline:none;
}

button{
margin-left:6px;
padding:10px;
border:none;
border-radius:6px;
background:#ff4da6;
color:white;
cursor:pointer;
}

#progress{
margin-left:10px;
font-size:12px;
}

/* ADULT WARNING */

#adultWarning{
position:fixed;
top:0;
left:0;
right:0;
bottom:0;
background:rgba(0,0,0,0.9);
display:none;
align-items:center;
justify-content:center;
}

#adultBox{
background:#111;
padding:25px;
border-radius:10px;
text-align:center;
}

</style></head><body><div id="sidebar"><h3 style="color:#ff4da6">Tulip Chat</h3><div class="room" onclick="joinRoom('normal')">Normal Room</div><div class="room" onclick="adultCheck()">Adult Room</div></div><div id="chat"><div id="topbar">
<span id="roomName">Normal Room</span>
</div><div id="messages"></div><div id="inputBar"><input id="text" placeholder="Type message"><button onclick="sendMsg()">Send</button>

<input type="file" id="file" accept="image/*"><span id="progress"></span>

</div></div><div id="adultWarning"><div id="adultBox"><h3>🔞 Adult Room</h3><p>You must be 18+ to enter</p><button onclick="enterAdult()">I am 18+</button>

<button onclick="closeAdult()">Cancel</button>

</div></div><script src="/socket.io/socket.io.js"></script><script>

const socket = io()

let username = localStorage.getItem("username")

if(!username){

username = prompt("Enter your name")

localStorage.setItem("username",username)

}

let room="normal"

socket.emit("join",{user:username,room})

addSystem(username+" joined the room")

function joinRoom(r){

room=r

document.getElementById("roomName").innerText=r+" room"

socket.emit("join",{user:username,room})

addSystem(username+" joined the room")

}

function adultCheck(){

document.getElementById("adultWarning").style.display="flex"

}

function enterAdult(){

document.getElementById("adultWarning").style.display="none"

joinRoom("adult")

}

function closeAdult(){

document.getElementById("adultWarning").style.display="none"

}

/* MESSAGE SEND */

function sendMsg(){

let text=document.getElementById("text").value

if(!text) return

socket.emit("message",{user:username,msg:text,room})

document.getElementById("text").value=""

}

/* RECEIVE MESSAGE */

socket.on("message",(data)=>{

let box=document.createElement("div")

box.className="msg"

box.innerHTML="<b>"+data.user+"</b>: "+data.msg

document.getElementById("messages").appendChild(box)

})

/* SYSTEM MSG */

function addSystem(msg){

let div=document.createElement("div")

div.className="system"

div.innerText=msg

document.getElementById("messages").appendChild(div)

}

/* IMAGE / GIF UPLOAD */

document.getElementById("file").onchange=function(){

let file=this.files[0]

let form=new FormData()

form.append("file",file)

let xhr=new XMLHttpRequest()

xhr.open("POST","/upload")

xhr.upload.onprogress=(e)=>{

let percent=Math.round((e.loaded/e.total)*100)

document.getElementById("progress").innerText=percent+"%"

}

xhr.onload=()=>{

let res=JSON.parse(xhr.responseText)

socket.emit("message",{user:username,msg:'<img src="'+res.url+'">',room})

document.getElementById("progress").innerText=""

}

xhr.send(form)

}

</script></body></html>
