<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tulip Pro | Master Fix</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #f43f5e; --owner: #fbbf24; --glass: rgba(15, 23, 42, 0.95); }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; margin: 0; padding: 0; }
        
        body { 
            height: 100dvh; display: flex; flex-direction: column; 
            background: #000 url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1200') center/cover no-repeat;
            overflow: hidden; 
        }

        /* --- HEADER --- */
        header { 
            height: 50px; background: var(--glass); display: flex; 
            align-items: center; justify-content: space-between; padding: 0 15px; 
            border-bottom: 1px solid rgba(255,255,255,0.1); z-index: 1001; 
        }

        /* --- CHAT SECTION --- */
        #chat-container { flex: 1; position: relative; overflow: hidden; display: flex; flex-direction: column; }
        #chat-scroller { 
            flex: 1; overflow-y: auto; padding: 15px; 
            display: flex; flex-direction: column; gap: 12px;
            padding-bottom: 100px; /* Space for input bar */
        }

        .msg { padding: 10px 14px; border-radius: 15px; color: white; max-width: 80%; line-height: 1.4; position: relative; }
        .msg.me { align-self: flex-end; background: var(--primary); border-bottom-right-radius: 2px; }
        .msg.other { align-self: flex-start; background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); border-bottom-left-radius: 2px; }
        .msg img { max-width: 100%; border-radius: 8px; margin-top: 5px; display: block; }

        /* --- INPUT BAR --- */
        .input-wrapper { 
            position: fixed; bottom: 0; width: 100%; background: var(--glass); 
            padding: 12px; z-index: 1000; border-top: 1px solid rgba(255,255,255,0.1);
        }
        .input-row { display: flex; align-items: center; gap: 10px; max-width: 100%; }
        
        #msgIn { 
            flex: 1; padding: 10px 15px; border-radius: 25px; border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05); color: white; outline: none; font-size: 14px;
        }

        /* --- PROGRESS BAR --- */
        #upload-progress { 
            display: none; height: 3px; background: rgba(255,255,255,0.1); 
            margin-bottom: 8px; border-radius: 2px; overflow: hidden;
        }
        #progress-fill { height: 100%; width: 0%; background: var(--primary); transition: width 0.2s; }
        #progress-text { font-size: 10px; color: var(--primary); text-align: center; display: block; margin-bottom: 4px; }

        /* --- SIDEBAR --- */
        #sidebar { 
            position: fixed; left: -280px; top: 0; width: 280px; height: 100%; 
            background: #0f172a; transition: 0.3s ease; z-index: 2000; padding: 20px; 
        }
        #sidebar.open { left: 0; box-shadow: 10px 0 50px rgba(0,0,0,0.8); }
        #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1500; }
        
        .u-info { font-size: 10px; font-weight: 600; margin-bottom: 2px; display: block; }
        .u-info.owner { color: var(--owner); }
    </style>
</head>
<body>

<div id="overlay" onclick="toggleSidebar()"></div>

<header>
    <div onclick="toggleSidebar()" style="cursor:pointer; font-size:20px; color:white;">☰</div>
    <div style="color:white; font-weight:600;">TULIP <span style="color:var(--primary)">PRO</span></div>
    <div id="active-chat" style="font-size:10px; color:var(--owner)">GLOBAL</div>
</header>

<div id="sidebar">
    <h3 style="color:white; margin-bottom:20px;">Online Users</h3>
    <div id="user-list"></div>
</div>

<div id="chat-container">
    <div id="chat-scroller"></div>
    
    <div class="input-wrapper">
        <div id="upload-status" style="display:none;">
            <span id="progress-text">Uploading: 0%</span>
            <div id="upload-progress"><div id="progress-fill"></div></div>
        </div>
        
        <div class="input-row">
            <label for="file-upload" style="cursor:pointer; font-size:22px;">🖼️</label>
            <input type="file" id="file-upload" hidden accept="image/*">
            
            <input type="text" id="msgIn" placeholder="Type message..." autocomplete="off">
            <button onclick="sendMsg()" style="background:var(--primary); border:none; color:white; padding:10px 20px; border-radius:20px; font-weight:600; cursor:pointer;">Send</button>
        </div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    const params = new URLSearchParams(window.location.search);
    const myUser = params.get('username') || "Guest_" + Math.floor(Math.random()*1000);
    const myRole = params.get('role') || "user";
    const myGender = params.get('gender') || "Male";
    
    let currentReceiver = 'all';

    socket.emit('join', { username: myUser, role: myRole, gender: myGender });

    function toggleSidebar() {
        const sb = document.getElementById('sidebar');
        const ov = document.getElementById('overlay');
        sb.classList.toggle('open');
        ov.style.display = sb.classList.contains('open') ? 'block' : 'none';
    }

    // --- UPLOAD LOGIC WITH % ---
    document.getElementById('file-upload').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if(!file) return;

        const reader = new FileReader();
        const statusDiv = document.getElementById('upload-status');
        const fill = document.getElementById('progress-fill');
        const txt = document.getElementById('progress-text');

        reader.onprogress = (ev) => {
            if (ev.lengthComputable) {
                const percent = Math.round((ev.loaded / ev.total) * 100);
                statusDiv.style.display = 'block';
                fill.style.width = percent + '%';
                txt.innerText = `Uploading: ${percent}%`;
            }
        };

        reader.onload = () => {
            socket.emit('sendMessage', { 
                type: 'image', 
                text: reader.result, 
                to: currentReceiver,
                user: myUser, 
                role: myRole 
            });
            setTimeout(() => { statusDiv.style.display = 'none'; fill.style.width = '0%'; }, 1000);
        };
        reader.readAsDataURL(file);
    });

    socket.on('newMessage', (data) => {
        // FIX: Agar data undefined hai toh default values use karein
        const sender = data.user || "System";
        const content = data.text || "";
        const role = data.role || "user";
        
        const div = document.createElement('div');
        div.className = `msg ${sender === myUser ? 'me' : 'other'}`;
        
        let html = `<span class="u-info ${role === 'owner' ? 'owner' : ''}">${sender}</span>`;
        if(data.type === 'image') {
            html += `<img src="${content}">`;
        } else {
            html += `<span>${content}</span>`;
        }
        
        div.innerHTML = html;
        const scroller = document.getElementById('chat-scroller');
        scroller.appendChild(div);
        scroller.scrollTop = scroller.scrollHeight;
    });

    socket.on('updateUserList', (users) => {
        document.getElementById('user-list').innerHTML = users.map(u => `
            <div onclick="setDM('${u.username}')" style="padding:10px; color:white; border-bottom:1px solid #222; cursor:pointer">
                ${u.gender === 'Female' ? '👩' : '👨'} ${u.username}
            </div>
        `).join('') + `<div onclick="setDM('all')" style="color:var(--primary); margin-top:15px; cursor:pointer; font-weight:600;">🌍 Public Room</div>`;
    });

    function setDM(user) {
        currentReceiver = user;
        document.getElementById('active-chat').innerText = user === 'all' ? "GLOBAL" : "DM: " + user;
        toggleSidebar();
    }

    function sendMsg() {
        const input = document.getElementById('msgIn');
        if(input.value.trim()) {
            socket.emit('sendMessage', { 
                type: 'text', 
                text: input.value, 
                to: currentReceiver,
                user: myUser,
                role: myRole
            });
            input.value = '';
        }
    }

    document.getElementById('msgIn').addEventListener('keypress', (e) => { if(e.key === 'Enter') sendMsg(); });
</script>
</body>
</html>
