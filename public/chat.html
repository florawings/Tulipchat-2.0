<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tulip Pro | Multi-Device</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #f43f5e;
            --owner-gold: #fbbf24;
            --glass: rgba(15, 23, 42, 0.85);
            --text: #f8fafc;
        }

        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #000 url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1200') no-repeat center center fixed;
            background-size: cover;
            overflow: hidden;
            color: var(--text);
        }

        /* --- HEADER --- */
        header {
            height: 60px;
            background: var(--glass);
            backdrop-filter: blur(15px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 1px solid rgba(244, 63, 94, 0.3);
            z-index: 1100;
        }

        .brand { font-weight: 600; font-size: 20px; letter-spacing: 1px; }
        .brand span { color: var(--primary); }

        /* --- MAIN LAYOUT (The Responsive Part) --- */
        #main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        /* --- SIDEBAR --- */
        #sidebar {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2000;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        /* --- CHAT SECTION --- */
        #chat-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(0,0,0,0.3);
            position: relative;
        }

        #chat-scroller {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* --- RESPONSIVE ADJUSTMENTS --- */
        
        /* Mobile Version (< 768px) */
        @media screen and (max-width: 767px) {
            #sidebar {
                position: fixed;
                left: -100%;
                width: 80%;
                height: 100%;
            }
            #sidebar.open { left: 0; }
            #sidebar-toggle { display: block; }
            .msg { max-width: 85%; }
        }

        /* PC & Tablet Version (>= 768px) */
        @media screen and (min-width: 768px) {
            #sidebar {
                position: static;
                width: 300px;
                left: 0;
                border-right: 1px solid rgba(255,255,255,0.1);
            }
            #sidebar-toggle { display: none; }
            .msg { max-width: 60%; }
            #overlay { display: none !important; }
        }

        /* --- CHAT BUBBLES --- */
        .msg {
            padding: 10px 15px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.4;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .msg.me {
            align-self: flex-end;
            background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
            border-bottom-right-radius: 4px;
        }

        .msg.other {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.15);
            border-bottom-left-radius: 4px;
            backdrop-filter: blur(5px);
        }

        .u-name { font-size: 10px; font-weight: bold; margin-bottom: 3px; display: block; }
        .u-name.owner { color: var(--owner-gold); }

        /* --- INPUT AREA --- */
        .input-area {
            padding: 15px;
            background: var(--glass);
            display: flex;
            gap: 10px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        #msgIn {
            flex: 1;
            padding: 12px 18px;
            border-radius: 25px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05);
            color: white;
            outline: none;
        }

        #sendBtn {
            background: var(--primary);
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            color: white;
            cursor: pointer;
        }

        /* Online List Styling */
        .user-item {
            padding: 12px;
            margin-bottom: 8px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .user-item.owner-border { border-left: 3px solid var(--owner-gold); }

        #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1500; }
    </style>
</head>
<body>

<div id="overlay" onclick="toggleSidebar()"></div>

<header>
    <div id="sidebar-toggle" onclick="toggleSidebar()" style="font-size:24px; cursor:pointer;">☰</div>
    <div class="brand">TULIP <span>PRO</span></div>
    <div id="status" style="font-size:11px; color:var(--owner-gold);">Public Room</div>
</header>

<div id="main-container">
    <div id="sidebar">
        <h3 style="color:var(--primary); margin-top:0;">Online</h3>
        <div id="online-list" style="flex:1; overflow-y:auto;"></div>
        <button onclick="location.href='index.html'" style="margin-top:10px; width:100%; padding:10px; background:rgba(255,0,0,0.2); color:white; border:none; border-radius:8px;">Logout</button>
    </div>

    <div id="chat-section">
        <div id="chat-scroller"></div>
        <div class="input-area">
            <input type="text" id="msgIn" placeholder="Type a message..." autocomplete="off">
            <button id="sendBtn" onclick="send()">➤</button>
        </div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    const urlParams = new URLSearchParams(window.location.search);
    const username = urlParams.get('username') || "Guest";
    const gender = urlParams.get('gender') || "Male";
    const role = urlParams.get('role') || "user";

    let selectedUser = 'all';

    socket.emit('join', { username, gender, role });

    function toggleSidebar() {
        const sb = document.getElementById('sidebar');
        const ov = document.getElementById('overlay');
        sb.classList.toggle('open');
        ov.style.display = sb.classList.contains('open') ? 'block' : 'none';
    }

    // --- RENDER USERS ---
    socket.on('updateUserList', (users) => {
        const list = document.getElementById('online-list');
        list.innerHTML = users.map(u => `
            <div class="user-item ${u.role === 'owner' ? 'owner-border' : ''}" onclick="startDM('${u.username}')">
                <span>${u.gender === 'Female' ? '👩' : '👨'}</span>
                <span style="color:${u.role === 'owner' ? 'var(--owner-gold)' : 'white'}">${u.username}</span>
            </div>
        `).join('') + `<div onclick="startDM('all')" class="user-item" style="opacity:0.6; margin-top:15px;">🌍 Public Room</div>`;
    });

    function startDM(user) {
        selectedUser = user;
        document.getElementById('status').innerText = (user === 'all') ? "Public Room" : "DM: " + user;
        document.getElementById('msgIn').placeholder = (user === 'all') ? "Type a message..." : "Private msg to " + user + "...";
        if(window.innerWidth < 768) toggleSidebar();
    }

    // --- MESSAGE HANDLING ---
    socket.on('newMessage', (data) => {
        const div = document.createElement('div');
        const isMe = data.user === username;
        div.className = `msg ${isMe ? 'me' : 'other'}`;
        
        const nameStyle = data.role === 'owner' ? 'u-name owner' : 'u-name';
        const icon = data.gender === 'Female' ? '👩' : '👨';
        const dmTag = data.to !== 'all' ? '<span style="color:var(--owner-gold); font-size:9px;"> [PVT]</span>' : '';

        div.innerHTML = `<span class="${nameStyle}">${icon} ${data.user}${dmTag}</span>${data.text}`;
        
        const box = document.getElementById('chat-scroller');
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    });

    socket.on('clearScreen', () => {
        document.getElementById('chat-scroller').innerHTML = '<div style="text-align:center; color:gray;">Room cleared</div>';
    });

    function send() {
        const input = document.getElementById('msgIn');
        const val = input.value.trim();
        if(!val) return;

        if(val === '/clear' && role === 'owner') {
            socket.emit('adminClear');
        } else {
            socket.emit('sendMessage', { message: val, to: selectedUser });
        }
        input.value = '';
    }

    document.getElementById('msgIn').addEventListener('keypress', (e) => { if(e.key === 'Enter') send(); });
</script>
</body>
</html>
