<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tulip Pro</title>
    <style>
        :root { --main: #f43f5e; --dark: #0f172a; --card: #1e293b; --text: #f8fafc; }
        body { margin: 0; background: var(--dark); color: var(--text); font-family: sans-serif; overflow: hidden; height: 100vh; }
        #wrapper { display: flex; height: 100%; position: relative; }
        #sidebar { position: absolute; left: -280px; width: 280px; height: 100%; background: var(--card); transition: 0.3s; z-index: 1001; }
        #sidebar.open { left: 0; }
        header { height: 60px; padding: 0 15px; display: flex; align-items: center; background: rgba(0,0,0,0.3); border-bottom: 1px solid rgba(255,255,255,0.1); }
        #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 80%; padding: 10px; border-radius: 12px; font-size: 14px; background: var(--card); align-self: flex-start; }
        .msg.me { align-self: flex-end; background: var(--main); }
        .input-area { padding: 15px; border-top: 1px solid rgba(255,255,255,0.1); display: flex; gap: 10px; }
        #bar-container { display: none; height: 4px; background: #333; }
        #bar-fill { height: 100%; background: var(--main); width: 0%; }
    </style>
</head>
<body>
    <div id="wrapper">
        <div id="sidebar" class="sidebar">
            <h3 style="padding:20px;">Online Users</h3>
            <div id="user-list"></div>
        </div>
        <div style="flex:1; display:flex; flex-direction:column;">
            <header>
                <div onclick="document.getElementById('sidebar').classList.toggle('open')" style="font-size:24px; cursor:pointer;">☰</div>
                <div style="margin-left:20px; font-weight:bold;">Tulip Chat Pro</div>
            </header>
            <div id="chat-box"></div>
            <div id="bar-container"><div id="bar-fill"></div></div>
            <div class="input-area">
                <button onclick="document.getElementById('file').click()">🖼️</button>
                <input type="file" id="file" hidden onchange="upload()">
                <input type="text" id="msgInput" placeholder="Type..." style="flex:1; padding:10px; border-radius:20px; border:none; outline:none;">
                <button onclick="send()" style="background:var(--main); color:white; border:none; padding:10px 20px; border-radius:20px;">Send</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const params = new URLSearchParams(window.location.search);
        const user = params.get('username') || "Guest";
        const gender = params.get('gender') || "Male";

        socket.emit('join', { username: user, gender: gender });

        function send() {
            const input = document.getElementById('msgInput');
            if(input.value) { socket.emit('sendMessage', { message: input.value }); input.value = ''; }
        }

        socket.on('newMessage', (data) => {
            const box = document.getElementById('chat-box');
            const div = document.createElement('div');
            const isMe = data.user === user;
            div.className = `msg ${isMe ? 'me' : ''}`;
            const avatar = data.gender === 'Female' ? '👩‍🦰' : '👨‍🦱';
            
            if(data.type === 'file') {
                div.innerHTML = `<b>${avatar} ${data.user}:</b><br><img src="${data.text}" style="max-width:200px; border-radius:10px;">`;
            } else {
                div.innerHTML = `<b>${avatar} ${data.user}:</b> ${data.text}`;
            }
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        });

        socket.on('updateUserList', (users) => {
            document.getElementById('user-list').innerHTML = users.map(u => `<div style="padding:15px; border-bottom:1px solid #333;">${u.gender==='Female'?'👩‍🦰':'👨‍🦱'} ${u.username}</div>`).join('');
        });

        function upload() {
            const file = document.getElementById('file').files[0];
            const fd = new FormData(); fd.append('chatFile', file);
            const xhr = new XMLHttpRequest();
            document.getElementById('bar-container').style.display = 'block';
            xhr.upload.onprogress = (e) => { document.getElementById('bar-fill').style.width = (e.loaded/e.total)*100 + '%'; };
            xhr.onload = () => {
                const res = JSON.parse(xhr.responseText);
                socket.emit('sendMessage', { message: res.url, type: 'file' });
                document.getElementById('bar-container').style.display = 'none';
            };
            xhr.open('POST', '/upload'); xhr.send(fd);
        }
    </script>
</body>
</html>
