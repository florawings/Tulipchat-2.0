<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Tulip Chat</title>

<style>

body{
margin:0;
font-family:Arial;
background:#eee;
}

header{
background:#ff2d7a;
color:white;
padding:12px;
display:flex;
justify-content:space-between;
}

#chat{
height:68vh;
overflow:auto;
padding:10px;
}

.msg{
background:white;
padding:10px;
margin:6px;
border-radius:6px;
}

.bottom{
position:fixed;
bottom:0;
left:0;
right:0;
display:flex;
}

.bottom input{
flex:1;
padding:12px;
border:none;
}

button{
border:none;
padding:12px;
background:#ff2d7a;
color:white;
}

.chat-img{
max-width:150px;
border-radius:6px;
cursor:pointer;
}

/* online user popup */

#usersPopup{

display:none;

position:fixed;

top:70px;

right:10px;

background:white;

border-radius:8px;

box-shadow:0 0 10px rgba(0,0,0,0.3);

padding:10px;

width:180px;

}

.user{

padding:6px;

border-bottom:1px solid #eee;

cursor:pointer;

}

/* fullscreen viewer */

#viewer{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.9);
justify-content:center;
align-items:center;
}

#viewer img{
max-width:95%;
max-height:95%;
}

</style>

</head>

<body>

<header>

<span>🌷 Tulip Chat</span>

<div>

<button onclick="toggleUsers()">Online</button>

<button onclick="logout()">Logout</button>

</div>

</header>

<div id="usersPopup"></div>

<div id="chat"></div>

<div class="bottom">

<input id="msg" placeholder="message">

<button onclick="send()">Send</button>

<input type="file" id="fileInput" hidden accept="image/*">

<button onclick="fileInput.click()">📷</button>

</div>

<div id="viewer">
<img id="viewerImg">
</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io()

const chat=document.getElementById("chat")
const msg=document.getElementById("msg")

let name=localStorage.getItem("tulip_user")

if(!name){

name=prompt("Enter name")

localStorage.setItem("tulip_user",name)

}

socket.emit("join",name)

/* load old chat */

fetch("/messages")

.then(r=>r.json())

.then(data=>{

data.forEach(addMsg)

})

/* send text */

function send(){

if(!msg.value) return

socket.emit("message",{

name:name,

text:msg.value

})

msg.value=""

}

/* receive text */

socket.on("message",(data)=>{

addMsg(data)

})

/* receive image */

socket.on("image",(data)=>{

addMsg(data)

})

function addMsg(data){

let div=document.createElement("div")

div.className="msg"

if(data.text){

div.innerText=data.name+": "+data.text

}

if(data.url){

div.innerHTML=data.name+

"<br><img class='chat-img' src='"+data.url+"' onclick=\"openViewer('"+data.url+"')\">"

}

chat.appendChild(div)

chat.scrollTop=chat.scrollHeight

}

/* users */

socket.on("users",(list)=>{

let html=""

list.forEach(u=>{

if(u!==name){

html+=`<div class="user" onclick="openDM('${u}')">${u}</div>`

}

})

document.getElementById("usersPopup").innerHTML=html

})

function toggleUsers(){

let box=document.getElementById("usersPopup")

box.style.display=

box.style.display==="block"?"none":"block"

}

/* DM */

function openDM(user){

window.open("/dm.html?user="+user,"dm","width=400,height=600")

}

/* image upload */

fileInput.onchange=function(){

let file=fileInput.files[0]

let formData=new FormData()

formData.append("file",file)

fetch("/upload",{method:"POST",body:formData})

.then(r=>r.json())

.then(data=>{

socket.emit("image",{

name:name,

url:data.url

})

})

}

/* fullscreen image */

function openViewer(src){

document.getElementById("viewer").style.display="flex"

document.getElementById("viewerImg").src=src

}

document.getElementById("viewer").onclick=function(){

this.style.display="none"

}

/* logout */

function logout(){

localStorage.removeItem("tulip_user")

location.reload()

}

</script>

</body>

</html>
