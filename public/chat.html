<!DOCTYPE html><html>
<head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tulip Chat</title><style>

body{
margin:0;
font-family:Arial;
display:flex;
height:100vh;
overflow:hidden;
background:black;
color:white;
}

#sidebar{
width:220px;
background:#000;
padding:15px;
}

.room{
padding:10px;
background:#111;
margin-bottom:8px;
border-radius:6px;
cursor:pointer;
}

.room:hover{
background:#222;
}

#chat{
flex:1;
display:flex;
flex-direction:column;
background:url("https://images.unsplash.com/photo-1518199266791-5375a83190b7") center/cover;
}

#topbar{
height:50px;
background:#111;
display:flex;
align-items:center;
padding-left:15px;
}

#messages{
flex:1;
overflow:auto;
padding:15px;
}

.msg{
background:rgba(0,0,0,0.6);
padding:10px;
margin-bottom:10px;
border-radius:10px;
max-width:70%;
}

.msg img{
max-width:200px;
border-radius:10px;
margin-top:5px;
}

#inputBar{
display:flex;
padding:10px;
background:#000;
}

#text{
flex:1;
padding:10px;
border-radius:20px;
border:none;
outline:none;
}

button{
margin-left:6px;
padding:10px;
border:none;
border-radius:6px;
background:#ff4da6;
color:white;
cursor:pointer;
}

#progress{
margin-left:10px;
font-size:12px;
}

</style></head><body><div id="sidebar"><h3 style="color:#ff4da6">Tulip Chat</h3><div class="room" onclick="joinRoom('normal')">Normal Room</div><div class="room" onclick="joinRoom('adult')">Adult Room</div></div><div id="chat"><div id="topbar">
<span id="roomName">Normal Room</span>
</div><div id="messages"></div><div id="inputBar"><input id="text" placeholder="Type message"><button onclick="sendMsg()">Send</button>

<button onclick="sendGIF()">GIF</button>

<input type="file" id="file"><span id="progress"></span>

</div></div><script src="/socket.io/socket.io.js"></script><script>

const socket = io()

let username = localStorage.getItem("username")

if(!username){

username = prompt("Enter your name")

localStorage.setItem("username",username)

}

let room="normal"

socket.emit("join",{user:username,room})

function joinRoom(r){

room=r

document.getElementById("roomName").innerText=r+" room"

socket.emit("join",{user:username,room})

}

function sendMsg(){

let text=document.getElementById("text").value

if(!text) return

socket.emit("message",{user:username,msg:text,room})

document.getElementById("text").value=""

}

socket.on("message",(data)=>{

let box=document.createElement("div")

box.className="msg"

box.innerHTML="<b>"+data.user+"</b>: "+data.msg

document.getElementById("messages").appendChild(box)

})

function sendGIF(){

let link=prompt("Paste GIF link")

if(!link) return

socket.emit("message",{user:username,msg:'<img src="'+link+'">',room})

}

document.getElementById("file").onchange=function(){

let file=this.files[0]

let form=new FormData()

form.append("file",file)

let xhr=new XMLHttpRequest()

xhr.open("POST","/upload")

xhr.upload.onprogress=(e)=>{

let percent=Math.round((e.loaded/e.total)*100)

document.getElementById("progress").innerText=percent+"%"

}

xhr.onload=()=>{

let res=JSON.parse(xhr.responseText)

socket.emit("message",{user:username,msg:'<img src="'+res.url+'">',room})

document.getElementById("progress").innerText=""

}

xhr.send(form)

}

</script></body></html>
