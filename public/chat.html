<!DOCTYPE html><html>
<head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tulip Chat</title><style>

body{
margin:0;
font-family:system-ui;
background:#120014;
color:white;
height:100vh;
overflow:hidden;
}

/* TOP BAR */

#topbar{
background:linear-gradient(90deg,#ff4da6,#c44dff);
padding:12px;
display:flex;
align-items:center;
gap:10px;
font-weight:bold;
}

#menu{
font-size:22px;
cursor:pointer;
}

/* SIDEBAR */

#sidebar{
position:fixed;
left:-260px;
top:0;
width:260px;
height:100%;
background:#1b001b;
padding:15px;
transition:0.3s;
overflow:auto;
}

#sidebar.open{
left:0;
}

.user{
padding:10px;
border-radius:8px;
margin-bottom:6px;
background:#300030;
cursor:pointer;
}

.user:hover{
background:#520052;
}

/* CHAT AREA */

#messages{
height:calc(100vh - 120px);
overflow:auto;
padding:10px;
display:flex;
flex-direction:column;
gap:8px;
}

/* BUBBLES */

.msg{
padding:10px 14px;
border-radius:16px;
max-width:70%;
word-wrap:break-word;
}

.me{
background:linear-gradient(90deg,#ff4da6,#c44dff);
align-self:flex-end;
}

.other{
background:#2c2c2c;
align-self:flex-start;
}

/* INPUT */

#inputbar{
position:fixed;
bottom:0;
width:100%;
background:#1a001a;
padding:10px;
display:flex;
gap:6px;
}

#text{
flex:1;
padding:10px;
border:none;
border-radius:20px;
background:#2c002c;
color:white;
}

button{
padding:10px 16px;
border:none;
border-radius:20px;
background:linear-gradient(90deg,#ff4da6,#c44dff);
color:white;
cursor:pointer;
}

#progress{
font-size:12px;
padding-left:6px;
}

/* DM MODAL */

#dmModal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
display:none;
flex-direction:column;
}

#dmTop{
background:#ff4da6;
padding:10px;
display:flex;
justify-content:space-between;
}

#dmMessages{
flex:1;
overflow:auto;
padding:10px;
}

#dmInput{
display:flex;
padding:10px;
gap:6px;
background:#1a001a;
}

</style></head><body><div id="topbar">
<span id="menu">☰</span>
Tulip Chat
</div><div id="sidebar"><h3>Online Users</h3><div id="users"></div></div><div id="messages"></div><div id="inputbar"><input id="text" placeholder="Type message"><button onclick="send()">Send</button>

<input type="file" id="file"><span id="progress"></span>

</div><!-- DM WINDOW --><div id="dmModal"><div id="dmTop"><span id="dmUser"></span>

<button onclick="closeDM()">X</button>

</div><div id="dmMessages"></div><div id="dmInput"><input id="dmText" placeholder="DM message"><button onclick="sendDM()">Send</button>

</div></div><script src="/socket.io/socket.io.js"></script><script>

const socket=io()

let username=localStorage.getItem("username")
let gender=localStorage.getItem("gender")
let age=localStorage.getItem("age")

/* LOGIN */

if(!username){

 username=prompt("Enter name")
 age=prompt("Enter age")
 gender=prompt("Gender (Male/Female)")

 localStorage.setItem("username",username)
 localStorage.setItem("age",age)
 localStorage.setItem("gender",gender)

}

socket.emit("join",{name:username,gender})

/* SIDEBAR */

const menu=document.getElementById("menu")
const sidebar=document.getElementById("sidebar")

menu.onclick=()=>{
 sidebar.classList.toggle("open")
}

/* SEND PUBLIC MESSAGE */

function send(){

 let text=document.getElementById("text").value
 if(!text)return

 socket.emit("message",{user:username,msg:text})

 document.getElementById("text").value=""

}

/* RECEIVE MESSAGE */

socket.on("message",(data)=>{

 let div=document.createElement("div")

 div.className="msg "+(data.user===username?"me":"other")

 div.innerText=data.user+": "+data.msg

 document.getElementById("messages").appendChild(div)

})

/* ONLINE USERS */

socket.on("online",(list)=>{

 let box=document.getElementById("users")
 box.innerHTML=""

 for(let id in list){

  let u=document.createElement("div")

  u.className="user"

  u.innerText=list[id].name+" ("+list[id].gender+")"

  u.onclick=()=>{
   openDM(id,list[id].name)
  }

  box.appendChild(u)

 }

})

/* DM */

let currentDM=null

function openDM(id,name){

 currentDM=id

 document.getElementById("dmModal").style.display="flex"

 document.getElementById("dmUser").innerText=name

 document.getElementById("dmMessages").innerHTML=""

}

function closeDM(){

 document.getElementById("dmModal").style.display="none"

}

function sendDM(){

 let text=document.getElementById("dmText").value

 socket.emit("dm",{to:currentDM,msg:text,user:username})

 document.getElementById("dmText").value=""

}

/* RECEIVE DM */

socket.on("dm",(data)=>{

 let div=document.createElement("div")

 div.className="msg "+(data.user===username?"me":"other")

 div.innerText=data.user+": "+data.msg

 document.getElementById("dmMessages").appendChild(div)

})

/* FILE UPLOAD */

document.getElementById("file").onchange=async function(){

 let file=this.files[0]

 let form=new FormData()

 form.append("file",file)

 let xhr=new XMLHttpRequest()

 xhr.open("POST","/upload")

 xhr.upload.onprogress=(e)=>{

  let percent=Math.round((e.loaded/e.total)*100)

  document.getElementById("progress").innerText=percent+"%"

 }

 xhr.onload=()=>{

  let res=JSON.parse(xhr.response)

  socket.emit("message",{user:username,msg:res.url})

 }

 xhr.send(form)

}

</script></body>
</html>
