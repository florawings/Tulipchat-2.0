<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tulip Pro | 18+ Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #f43f5e; --owner: #fbbf24; --glass: rgba(15, 23, 42, 0.95); }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; margin: 0; padding: 0; touch-action: manipulation; }
        
        body { 
            height: 100dvh; width: 100vw; display: flex; flex-direction: column; 
            background: #000 url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1200') center/cover no-repeat fixed;
            overflow: hidden; position: fixed; 
        }

        header { height: 50px; background: var(--glass); display: flex; align-items: center; justify-content: space-between; padding: 0 15px; z-index: 1001; border-bottom: 1px solid rgba(255,255,255,0.1); }

        #chat-container { flex: 1; position: relative; overflow: hidden; display: flex; flex-direction: column; }
        #chat-scroller { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; padding-bottom: 120px; }

        /* Bubble Style */
        .msg { padding: 10px 14px; border-radius: 18px; color: white; max-width: 85%; font-size: 14px; word-wrap: break-word; position: relative; }
        .msg.me { align-self: flex-end; background: linear-gradient(135deg, #f43f5e, #e11d48); border-bottom-right-radius: 2px; }
        .msg.other { align-self: flex-start; background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); border-bottom-left-radius: 2px; }
        
        /* Image/Adult Content Container */
        .msg img { max-width: 100%; border-radius: 12px; margin-top: 8px; display: block; border: 1px solid rgba(255,255,255,0.1); }
        .private-tag { font-size: 9px; color: #fbbf24; background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 10px; margin-bottom: 4px; display: inline-block; }

        .input-wrapper { position: absolute; bottom: 0; width: 100%; background: var(--glass); padding: 12px; z-index: 1000; }
        .input-row { display: flex; align-items: center; gap: 12px; }
        
        #msgIn { flex: 1; padding: 12px 18px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); color: white; outline: none; font-size: 16px; }

        /* Progress Bar for high-quality images */
        #upload-box { display: none; margin-bottom: 8px; }
        .p-bar { height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; }
        .p-fill { height: 100%; width: 0%; background: var(--primary); transition: 0.2s; }

        #sidebar { position: fixed; left: -280px; top: 0; width: 280px; height: 100%; background: #0f172a; transition: 0.3s; z-index: 2000; padding: 20px; }
        #sidebar.open { left: 0; }
        #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1500; }
    </style>
</head>
<body>

<div id="overlay" onclick="toggleSidebar()"></div>

<header>
    <div onclick="toggleSidebar()" style="cursor:pointer; font-size:24px; color:white;">☰</div>
    <div style="color:white; font-weight:600; letter-spacing:1px;">TULIP <span style="color:var(--primary)">PRO</span></div>
    <div id="chat-mode" style="font-size:10px; color:var(--owner); font-weight:bold;">GLOBAL</div>
</header>

<div id="sidebar">
    <h3 style="color:white; margin-bottom:20px;">Users Around You</h3>
    <div id="user-list"></div>
</div>

<div id="chat-container">
    <div id="chat-scroller"></div>
    
    <div class="input-wrapper">
        <div id="upload-box">
            <div style="display:flex; justify-content:space-between; font-size:10px; color:var(--primary); margin-bottom:4px;">
                <span>Sending media...</span><span id="p-val">0%</span>
            </div>
            <div class="p-bar"><div id="p-fill" class="p-fill"></div></div>
        </div>
        
        <div class="input-row">
            <label for="adult-media" style="cursor:pointer; font-size:24px;" title="Send Photo/GIF">🔞</label>
            <input type="file" id="adult-media" hidden accept="image/*">
            <input type="text" id="msgIn" placeholder="Write something hot..." autocomplete="off">
            <button onclick="sendMsg()" style="background:var(--primary); border:none; color:white; width:45px; height:45px; border-radius:50%; font-size:20px;">➤</button>
        </div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    const params = new URLSearchParams(window.location.search);
    const myName = params.get('username') || "Stranger";
    const myRole = params.get('role') || "user";
    let targetUser = 'all';

    socket.emit('join', { username: myName, role: myRole, gender: params.get('gender') });

    function toggleSidebar() {
        const sb = document.getElementById('sidebar');
        const ov = document.getElementById('overlay');
        sb.classList.toggle('open');
        ov.style.display = sb.classList.contains('open') ? 'block' : 'none';
    }

    // --- FIX: TEXT AND IMAGE RENDERING ---
    socket.on('newMessage', (data) => {
        const div = document.createElement('div');
        div.className = `msg ${data.user === myName ? 'me' : 'other'}`;
        
        const isPrivate = data.to !== 'all';
        const senderName = data.user || "System";
        const messageText = data.text || ""; // Fix for undefined

        let html = '';
        if(isPrivate) html += `<span class="private-tag">PRIVATE 🔒</span><br>`;
        html += `<small style="display:block; font-size:10px; font-weight:bold; opacity:0.8;">${senderName}</small>`;
        
        if(data.type === 'image') {
            html += `<img src="${messageText}">`;
        } else {
            html += `<span>${messageText}</span>`; // Full message rendering
        }
        
        div.innerHTML = html;
        const sc = document.getElementById('chat-scroller');
        sc.appendChild(div);
        sc.scrollTop = sc.scrollHeight;
    });

    // --- FILE UPLOAD WITH PROGRESS ---
    document.getElementById('adult-media').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if(!file) return;

        const reader = new FileReader();
        document.getElementById('upload-box').style.display = 'block';

        reader.onprogress = (ev) => {
            if (ev.lengthComputable) {
                const pct = Math.round((ev.loaded / ev.total) * 100);
                document.getElementById('p-fill').style.width = pct + '%';
                document.getElementById('p-val').innerText = pct + '%';
            }
        };

        reader.onload = () => {
            socket.emit('sendMessage', { 
                type: 'image', text: reader.result, to: targetUser, user: myName, role: myRole 
            });
            setTimeout(() => { document.getElementById('upload-box').style.display = 'none'; }, 1000);
        };
        reader.readAsDataURL(file);
    });

    socket.on('updateUserList', (users) => {
        document.getElementById('user-list').innerHTML = users.map(u => `
            <div onclick="setTarget('${u.username}')" style="padding:15px; border-bottom:1px solid #222; color:white; cursor:pointer; display:flex; justify-content:space-between;">
                <span>${u.username}</span>
                <span style="font-size:10px; color:#4ade80;">Online</span>
            </div>
        `).join('') + `<div onclick="setTarget('all')" style="padding:15px; color:var(--primary); font-weight:bold; cursor:pointer; text-align:center;">🌍 ENTER PUBLIC LOUNGE</div>`;
    });

    function setTarget(u) {
        targetUser = u;
        document.getElementById('chat-mode').innerText = u === 'all' ? "GLOBAL" : "CHAT WITH: " + u;
        toggleSidebar();
    }

    function sendMsg() {
        const inp = document.getElementById('msgIn');
        if(inp.value.trim()) {
            socket.emit('sendMessage', { 
                type: 'text', text: inp.value, to: targetUser, user: myName, role: myRole 
            });
            inp.value = '';
        }
    }
    document.getElementById('msgIn').addEventListener('keypress', (e) => { if(e.key==='Enter') sendMsg(); });
</script>
</body>
</html>
