<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Tulip Chat</title>

<style>

body{
margin:0;
font-family:Arial;
display:flex;
height:100vh;
}

/* left users */

#users{
width:120px;
background:#f2f2f2;
overflow:auto;
border-right:1px solid #ddd;
}

.user{
padding:10px;
cursor:pointer;
border-bottom:1px solid #ddd;
}

/* chat */

#main{
flex:1;
display:flex;
flex-direction:column;
}

header{
background:#ff2d7a;
color:white;
padding:12px;
display:flex;
justify-content:space-between;
}

#chat{
flex:1;
overflow:auto;
padding:10px;
background:#eee;
}

.msg{
background:white;
padding:8px;
margin:6px;
border-radius:6px;
}

.bottom{
display:flex;
}

.bottom input{
flex:1;
padding:10px;
border:none;
}

button{
border:none;
padding:10px;
background:#ff2d7a;
color:white;
}

.chat-img{
max-width:140px;
border-radius:6px;
}

</style>

</head>

<body>

<div id="users"></div>

<div id="main">

<header>

🌷 Tulip Chat

<button onclick="logout()">Logout</button>

</header>

<div id="chat"></div>

<div class="bottom">

<input id="msg" placeholder="message">

<button onclick="send()">Send</button>

<input type="file" id="file" hidden>

<button onclick="file.click()">📷</button>

</div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io()

let name = localStorage.getItem("tulip_user")

if(!name){

name = prompt("Enter name")

localStorage.setItem("tulip_user",name)

}

socket.emit("join",name)

const chat=document.getElementById("chat")

/* load old chat */

fetch("/messages")

.then(r=>r.json())

.then(data=>{

data.forEach(addMsg)

})

function send(){

const text=msg.value

socket.emit("message",{name,text})

msg.value=""

}

socket.on("message",addMsg)

socket.on("image",addMsg)

function addMsg(data){

let div=document.createElement("div")

div.className="msg"

if(data.text){

div.innerText=data.name+": "+data.text

}

if(data.url){

div.innerHTML=data.name+"<br><img src='"+data.url+"' class='chat-img'>"

}

chat.appendChild(div)

chat.scrollTop=chat.scrollHeight

}

/* online users */

socket.on("users",(list)=>{

let html=""

list.forEach(u=>{

if(u!==name){

html+=`<div class="user" onclick="openDM('${u}')">${u}</div>`

}

})

users.innerHTML=html

})

/* DM */

function openDM(user){

window.open("/dm.html?user="+user,"dm","width=400,height=600")

}

/* image */

file.onchange=()=>{

let fd=new FormData()

fd.append("file",file.files[0])

fetch("/upload",{method:"POST",body:fd})

.then(r=>r.json())

.then(d=>{

socket.emit("image",{name,url:d.url})

})

}

/* logout */

function logout(){

localStorage.removeItem("tulip_user")

location.reload()

}

</script>

</body>

</html>
