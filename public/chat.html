<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Tulip Chat</title>

<script src="/socket.io/socket.io.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#e6e6e6;
height:100vh;
display:flex;
flex-direction:column;
}

/* TOP BAR */

.topbar{
background:black;
color:white;
padding:12px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:18px;
font-weight:bold;
}

/* CHAT */

.chat{
flex:1;
overflow-y:auto;
padding:10px;
}

.msg{
margin-bottom:15px;
}

.bubble{
background:white;
padding:10px;
border-radius:10px;
max-width:80%;
}

.actions{
font-size:12px;
margin-top:5px;
}

.actions span{
margin-right:10px;
cursor:pointer;
}

/* INPUT BAR */

.inputbar{
display:flex;
align-items:center;
background:white;
padding:8px;
}

.inputbar input{
flex:1;
padding:10px;
border-radius:20px;
border:1px solid #ccc;
margin:0 5px;
}

.btn{
font-size:20px;
cursor:pointer;
margin:0 5px;
}

/* ONLINE PANEL */

.online{
position:fixed;
right:-200px;
top:50px;
width:180px;
background:black;
color:white;
height:100%;
padding:10px;
font-size:14px;
overflow:auto;
transition:0.3s;
}

.online.show{
right:0;
}

</style>

</head>

<body>


<div class="topbar">

<div onclick="toggleUsers()">☰</div>

<div class="logo">🌷 Tulip Chat</div>

<div>🔔</div>

</div>



<div class="chat" id="chat"></div>



<div class="online">

<b>Online</b>

<div id="online"></div>

</div>



<div class="inputbar">

<span class="btn" onclick="uploadImage()">🖼</span>

<span class="btn" onclick="sendGIF()">🎞</span>

<span class="btn" onclick="youtube()">▶</span>

<span class="btn" onclick="uploadVideo()">🎥</span>

<span class="btn" onclick="voiceTyping()">🎤</span>

<input id="msgInput" placeholder="Type message...">

<span class="btn" onclick="sendMsg()">➤</span>

</div>



<input type="file" id="imgFile" accept="image/*" style="display:none">

<input type="file" id="videoFile" accept="video/*" style="display:none">



<script>


/* SOCKET */

let socket = io()

let username = prompt("Enter name")

socket.emit("join",username)



/* MENU TOGGLE */

function toggleUsers(){

let panel=document.querySelector(".online")

panel.classList.toggle("show")

}



/* SEND MESSAGE */

function sendMsg(){

let input=document.getElementById("msgInput")

if(input.value=="") return

socket.emit("message",{

user:username,

text:input.value

})

input.value=""

}



/* RECEIVE MESSAGE */

socket.on("message",(data)=>{

let chat=document.getElementById("chat")

let id=Date.now()

chat.innerHTML+=`

<div class="msg" id="msg${id}">

<div class="bubble">

<b>${data.user}</b><br>

${data.text}

<div class="actions">

<span onclick="deleteMsg('msg${id}')">🗑</span>

<span onclick="reportMsg('${data.text}')">🚩</span>

</div>

</div>

</div>

`

chat.scrollTop=chat.scrollHeight

})



/* DELETE */

function deleteMsg(id){

if(confirm("Delete message?")){

document.getElementById(id).remove()

}

}



/* REPORT */

function reportMsg(text){

let reason=prompt("Report reason")

if(!reason) return

console.log("REPORT:",text,reason)

alert("Reported to staff")

}



/* ONLINE USERS */

socket.on("onlineUsers",(list)=>{

let box=document.getElementById("online")

box.innerHTML=""

list.forEach(u=>{

box.innerHTML+=`<div>${u}</div>`

})

})



/* IMAGE SHARE */

function uploadImage(){

let file=document.getElementById("imgFile")

file.click()

file.onchange=function(){

let reader=new FileReader()

reader.onload=function(e){

let chat=document.getElementById("chat")

chat.innerHTML+=`

<div class="msg">

<img src="${e.target.result}" width="200">

</div>

`

}

reader.readAsDataURL(file.files[0])

}

}



/* GIF SHARE */

function sendGIF(){

let url=prompt("Paste GIF URL")

if(!url) return

let chat=document.getElementById("chat")

chat.innerHTML+=`

<div class="msg">

<img src="${url}" width="200">

</div>

`

}



/* YOUTUBE VIDEO */

function youtube(){

let link=prompt("Paste YouTube link")

if(!link) return

let id=link.split("v=")[1]

let embed="https://www.youtube.com/embed/"+id

let chat=document.getElementById("chat")

chat.innerHTML+=`

<iframe width="250" height="150"

src="${embed}"

frameborder="0"

allowfullscreen>

</iframe>

`

}



/* VIDEO UPLOAD */

function uploadVideo(){

let file=document.getElementById("videoFile")

file.click()

file.onchange=function(){

let url=URL.createObjectURL(file.files[0])

let chat=document.getElementById("chat")

chat.innerHTML+=`

<video width="250" controls>

<source src="${url}">

</video>

`

}

}



/* VOICE TYPING */

function voiceTyping(){

let speech=new webkitSpeechRecognition()

speech.lang="en-US"

speech.start()

speech.onresult=function(event){

document.getElementById("msgInput").value=

event.results[0][0].transcript

}

}

</script>

</body>
</html>
