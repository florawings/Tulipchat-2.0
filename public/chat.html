<!DOCTYPE html>
<html>

<head>

<title>Tulip Chat</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="/socket.io/socket.io.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#ffd6ea;
}

/* HEADER */

.top{
background:#ff2e93;
color:white;
padding:12px;
font-size:18px;
}

/* LAYOUT */

.container{
display:flex;
height:calc(100vh - 60px);
}

/* USERS */

.users{
width:25%;
background:black;
color:white;
padding:10px;
overflow:auto;
}

.user{
padding:8px;
border-bottom:1px solid #333;
cursor:pointer;
}

/* CHAT */

.chat{
flex:1;
display:flex;
flex-direction:column;
background:white;
}

#messages{
flex:1;
overflow:auto;
padding:10px;
}

.msg{
background:#f1f1f1;
padding:10px;
margin-bottom:8px;
border-radius:8px;
max-width:80%;
}

.msg img{
max-width:200px;
border-radius:8px;
}

/* INPUT */

.input{
display:flex;
padding:10px;
background:#eee;
position:fixed;
bottom:0;
left:0;
right:0;
}

.input input{
flex:1;
padding:10px;
}

.input button{
margin-left:5px;
padding:10px;
border:none;
border-radius:6px;
}

.send{background:#ff2e93;color:white;}
.cam{background:#2196f3;color:white;}

</style>

</head>

<body>

<div class="top">🌷 Tulip Chat</div>

<div class="container">

<div class="users">

<h3>Online</h3>

<div id="online"></div>

</div>

<div class="chat">

<div id="messages"></div>

</div>

</div>

<div class="input">

<input id="msg" placeholder="message">

<button class="send" onclick="send()">Send</button>

<button class="cam" onclick="openGallery()">📷</button>

<input type="file" id="imageInput" accept="image/*" style="display:none">

</div>

<script>

let socket = io()

let username = prompt("Enter name")

socket.emit("join",{name:username})

let currentDM = null
let dmMessages = {}

let messages = document.getElementById("messages")

function add(html){

messages.innerHTML += "<div class='msg'>"+html+"</div>"
messages.scrollTop = messages.scrollHeight

}

/* SEND MESSAGE */

function send(){

let text = msg.value
if(!text) return

if(currentDM){

socket.emit("dm",{
to:currentDM,
user:username,
text:text
})

if(!dmMessages[currentDM]){
dmMessages[currentDM] = []
}

dmMessages[currentDM].push("<b>You:</b> "+text)

renderDM()

}else{

socket.emit("message",{
user:username,
text:text
})

add("<b>"+username+"</b>: "+text)

}

msg.value=""

}

/* RECEIVE PUBLIC */

socket.on("message",(d)=>{

if(currentDM) return

add("<b>"+d.user+"</b>: "+d.text)

})

/* RECEIVE DM */

socket.on("dm",(d)=>{

if(!dmMessages[d.user]){
dmMessages[d.user] = []
}

dmMessages[d.user].push("<b>"+d.user+"</b>: "+d.text)

if(currentDM === d.user){
renderDM()
}

})

/* DM OPEN */

function startDM(user){

currentDM = user

if(!dmMessages[user]){
dmMessages[user] = []
}

renderDM()

}

/* RENDER DM */

function renderDM(){

messages.innerHTML=""

let list = dmMessages[currentDM]

list.forEach(m=>{
messages.innerHTML += "<div class='msg'>"+m+"</div>"
})

}

/* ONLINE USERS */

socket.on("online",(users)=>{

let html=""

for(let id in users){

html += `
<div class="user" onclick="startDM('${users[id].name}')">
${users[id].name}
</div>
`

}

document.getElementById("online").innerHTML = html

})

/* IMAGE */

function openGallery(){
imageInput.click()
}

imageInput.addEventListener("change",function(){

let file=this.files[0]

let reader=new FileReader()

reader.onload=function(e){

let img = "<img src='"+e.target.result+"'>"

if(currentDM){

dmMessages[currentDM].push("<b>You</b><br>"+img)

renderDM()

socket.emit("dm",{
to:currentDM,
user:username,
image:e.target.result
})

}else{

add("<b>"+username+"</b><br>"+img)

socket.emit("image",{
user:username,
url:e.target.result
})

}

}

reader.readAsDataURL(file)

})

</script>

</body>

</html>
