<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="/socket.io/socket.io.js"></script>

<style>

body{
margin:0;
font-family:sans-serif;
background:#e5e5e5;
display:flex;
flex-direction:column;
height:100vh;
}

.header{

background:#111;
color:white;
display:flex;
align-items:center;
justify-content:space-between;
padding:10px;

}

.header span{
margin-left:10px;
}

#chatbox{
flex:1;
overflow-y:auto;
padding:10px;
}

.msg{
display:flex;
margin-bottom:12px;
}

.avatar{

width:40px;
height:40px;
background:#ccc;
border-radius:50%;
margin-right:10px;

}

.msgcontent{

background:white;
padding:8px 12px;
border-radius:8px;

}

.username{
font-weight:bold;
font-size:14px;
}

.time{
font-size:10px;
color:#777;
}

.inputbar{

display:flex;
align-items:center;
background:white;
padding:8px;

}

.inputbar input{

flex:1;
border:none;
padding:10px;

}

.inputbar button{

background:black;
color:white;
border:none;
padding:10px;

}

</style>

</head>

<body>

<div class="header">

<span>☰</span>

<span>🌷 Tulip Chat</span>

<div>

<span>💬</span>
<span>👥</span>
<span>🔔</span>

</div>

</div>


<div id="chatbox"></div>


<div class="inputbar">

<span>➕</span>

<input id="msg" placeholder="Type here...">

<span>😊</span>

<span>🎤</span>

<button onclick="send()">➤</button>

</div>


<script>

const socket=io()

let user=localStorage.getItem("user")

socket.emit("join",user)

socket.on("msg",(m)=>{

let time=new Date().toLocaleTimeString()

let div=document.createElement("div")

div.className="msg"

div.innerHTML=`

<div class="avatar"></div>

<div>

<div class="username">${m}</div>

<div class="time">${time}</div>

</div>

`

chatbox.appendChild(div)

chatbox.scrollTop=chatbox.scrollHeight

})

function send(){

let text=msg.value

if(text==="")return

socket.emit("chat",{user,text})

msg.value=""

}

</script>

</body>

</html>
