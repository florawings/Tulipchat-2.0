<!DOCTYPE html><html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tulip Chat</title><style>

*{margin:0;padding:0;box-sizing:border-box;}

body{
height:100vh;
display:flex;
flex-direction:column;
font-family:Arial;
color:white;

background:
linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.65)),
url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee");

background-size:cover;
}

/* header */

#header{
height:55px;
background:#000;
display:flex;
align-items:center;
padding:0 15px;
}

#menuBtn{
font-size:22px;
cursor:pointer;
margin-right:10px;
}

#title{flex:1}

#online{font-size:14px}

/* sidebar */

#sidebar{
position:fixed;
left:-220px;
top:55px;
bottom:0;
width:220px;
background:#111;
transition:.3s;
padding:10px;
}

#sidebar.show{
left:0;
}

.menuItem{
padding:12px;
border-bottom:1px solid #333;
cursor:pointer;
}

/* messages */

#messages{
flex:1;
overflow-y:auto;
padding:15px;
}

.message{
background:#1c1c1c;
padding:10px;
border-radius:10px;
margin-bottom:10px;
max-width:80%;
}

.system{
opacity:.7;
font-style:italic;
}

.media{
max-width:220px;
border-radius:10px;
}

/* input */

#inputBar{
display:flex;
padding:10px;
background:#000;
gap:6px;
}

#msgInput{
flex:1;
padding:10px;
border-radius:20px;
border:none;
}

button{
padding:10px;
border:none;
background:#ff2e63;
color:white;
border-radius:8px;
}

#typing{
font-size:12px;
opacity:.7;
padding-left:15px;
}

</style></head><body><div id="header"><div id="menuBtn" onclick="toggleMenu()">☰</div><div id="title">Tulip Chat</div><div id="online">Online: 0</div></div><div id="sidebar"><div class="menuItem">Adult room</div>
<div class="menuItem">Normal room</div>
<div class="menuItem">Private room</div></div><div id="messages"></div><div id="typing"></div><div id="inputBar"><input id="msgInput" placeholder="Type message"><button onclick="sendMsg()">Send</button>

<button onclick="emoji()">😀</button>

<input type="file" id="fileInput" style="display:none"><button onclick="fileInput.click()">📷</button>

</div><script src="/socket.io/socket.io.js"></script><script>

const socket = io()

let username = localStorage.getItem("username")

if(!username){

 username = prompt("Enter username")

 localStorage.setItem("username",username)

}

socket.emit("join",username)

/* menu */

function toggleMenu(){

 sidebar.classList.toggle("show")

}

/* messages */

function addMsg(html,type){

let div=document.createElement("div")

div.className="message "+(type||"")

div.innerHTML=html

messages.appendChild(div)

messages.scrollTop=messages.scrollHeight

}

function sendMsg(){

let msg=msgInput.value

if(!msg) return

socket.emit("chat message",{user:username,msg:msg})

msgInput.value=""

}

socket.on("chat message",(data)=>{

addMsg("<b>"+data.user+"</b><br>"+data.msg)

})

socket.on("system",(msg)=>{

addMsg(msg,"system")

})

socket.on("online",(list)=>{

online.innerText="Online: "+list.length

})

/* typing */

msgInput.addEventListener("input",()=>{

socket.emit("typing",username)

})

socket.on("typing",(msg)=>{

typing.innerText=msg

setTimeout(()=>typing.innerText="",1000)

})

/* emoji */

function emoji(){

msgInput.value+="😊"

}

/* upload */

fileInput.onchange=function(){

let file=this.files[0]

let form=new FormData()

form.append("file",file)

fetch("/upload",{method:"POST",body:form})
.then(r=>r.json())
.then(data=>{

let url=data.url

let ext=url.split('.').pop()

let media=""

if(ext==="mp4"){

media=`<video class="media" controls autoplay loop src="${url}"></video>`

}else{

media=`<img class="media" src="${url}">`

}

socket.emit("chat message",{

user:username,
msg:media

})

})

}

</script></body>
</html>
