<!DOCTYPE html>
<html>

<head>

<title>Tulip Chat</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="/socket.io/socket.io.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#ffd6ea;
}

/* HEADER */

.top{
background:#ff2e93;
color:white;
padding:12px;
font-size:18px;
}

/* CONTACT OWNER BAR */

.ownerBar{
background:#fff3cd;
padding:8px;
text-align:center;
font-size:14px;
}

/* LAYOUT */

.container{
display:flex;
height:calc(100vh - 100px);
}

/* USERS */

.users{
width:22%;
background:black;
color:white;
padding:10px;
overflow:auto;
}

.user{
display:flex;
align-items:center;
padding:8px;
border-bottom:1px solid #333;
cursor:pointer;
}

.user img{
width:30px;
height:30px;
border-radius:50%;
margin-right:6px;
}

/* CHAT */

.chat{
flex:1;
display:flex;
flex-direction:column;
background:white;
}

#messages{
flex:1;
overflow:auto;
padding:10px;
}

.msg{
background:#f1f1f1;
padding:10px;
margin-bottom:8px;
border-radius:8px;
max-width:80%;
position:relative;
}

.msg img{
max-width:220px;
border-radius:8px;
margin-top:5px;
}

/* DELETE */

.delete{
position:absolute;
top:5px;
right:5px;
font-size:12px;
cursor:pointer;
color:red;
}

/* INPUT */

.input{
display:flex;
padding:10px;
background:#eee;
position:fixed;
bottom:0;
left:0;
right:0;
}

.input input{
flex:1;
padding:12px;
font-size:16px;
border-radius:6px;
border:1px solid #ccc;
}

.input button{
padding:12px 14px;
margin-left:6px;
font-size:16px;
border:none;
border-radius:6px;
}

.send{background:#ff2e93;color:white;}
.cam{background:#2196f3;color:white;}
.gif{background:#ff9800;color:white;}

.adBtn{
position:fixed;
bottom:70px;
right:10px;
background:#ff2e93;
color:white;
padding:10px;
border:none;
border-radius:8px;
}

</style>

</head>

<body>

<div class="top">🌷 Tulip Chat</div>

<div class="ownerBar">
Want to promote your product here?
<b>Contact Owner</b>
<button onclick="startDM('Ravi')">Message Owner</button>
</div>

<div class="container">

<div class="users">

<h3>Online</h3>

<div id="online"></div>

</div>

<div class="chat">

<div id="messages"></div>

</div>

</div>

<div class="input">

<input id="msg" placeholder="message">

<button class="send" onclick="send()">Send</button>

<button class="cam" onclick="openGallery()">📷</button>

<button class="gif" onclick="sendGif()">GIF</button>

<input type="file" id="imageInput" accept="image/*" style="display:none">

</div>

<button class="adBtn" onclick="startDM('Ravi')">
📢 Advertise Here
</button>

<script>

let socket = io()

let name = prompt("Enter name")

let avatar = prompt("Profile photo URL (optional)")

let dmUser=null

socket.emit("join",{name:name,avatar:avatar})

let messages = document.getElementById("messages")

function add(html,id){

messages.innerHTML += `
<div class="msg" id="${id}">
<span class="delete" onclick="deleteMsg('${id}')">✖</span>
${html}
</div>`

messages.scrollTop = messages.scrollHeight

}

function send(){

let text = document.getElementById("msg").value
if(!text) return

let id="msg"+Date.now()

socket.emit("message",{user:name,text:text,id:id,to:dmUser})

add("<b>"+name+"</b>: "+text,id)

msg.value=""

}

function deleteMsg(id){

document.getElementById(id)?.remove()

socket.emit("delete",id)

}

/* IMAGE */

function openGallery(){
document.getElementById("imageInput").click()
}

document.getElementById("imageInput").addEventListener("change",function(){

let file=this.files[0]

let reader=new FileReader()

reader.onload=function(e){

let id="msg"+Date.now()

socket.emit("image",{user:name,url:e.target.result,id:id,to:dmUser})

add("<b>"+name+"</b><br><img src='"+e.target.result+"'>",id)

}

reader.readAsDataURL(file)

})

/* GIF */

function sendGif(){

let url=prompt("Paste GIF link")

if(!url) return

let id="msg"+Date.now()

socket.emit("image",{user:name,url:url,id:id,to:dmUser})

add("<b>"+name+"</b><br><img src='"+url+"'>",id)

}

/* RECEIVE */

socket.on("message",(d)=>{

if(d.user===name) return

add("<b>"+d.user+"</b>: "+d.text,d.id)

})

socket.on("image",(d)=>{

if(d.user===name) return

add("<b>"+d.user+"</b><br><img src='"+d.url+"'>",d.id)

})

socket.on("delete",(id)=>{

document.getElementById(id)?.remove()

})

socket.on("system",(t)=>{

add("<i>"+t+"</i>","sys"+Date.now())

})

/* USERS */

socket.on("online",(users)=>{

let html=""

for(let id in users){

let avatar = users[id].avatar || "https://cdn-icons-png.flaticon.com/512/149/149071.png"

let badge=""

if(users[id].name.toLowerCase()=="ravi"){
badge=" ⭐ OWNER"
}

html += `
<div class="user" onclick="startDM('${users[id].name}')">
<img src="${avatar}">
${users[id].name}${badge}
</div>
`

}

document.getElementById("online").innerHTML = html

})

function startDM(user){

dmUser=user

add("<i>Private chat with "+user+"</i>","sys"+Date.now())

}

</script>

</body>

</html>
