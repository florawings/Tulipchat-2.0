<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tulip Chat</title>

<style>

body{
margin:0;
font-family:Arial;
background:#eee;
}

header{
background:#ff2d7a;
color:white;
padding:12px;
font-size:18px;
}

#chat{
height:80vh;
overflow:auto;
padding:10px;
}

.msg{
background:white;
padding:10px;
margin:6px 0;
border-radius:8px;
}

.me{
background:#ff2d7a;
color:white;
text-align:right;
}

.bottom{
position:fixed;
bottom:0;
width:100%;
display:flex;
}

input{
flex:1;
padding:12px;
border:none;
}

button{
padding:12px;
background:#ff2d7a;
color:white;
border:none;
}

</style>
</head>

<body>

<header>🌷 Tulip Chat</header>

<div id="chat"></div>

<div class="bottom">
<input id="msg" placeholder="message">
<button onclick="send()">Send</button>
</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io()

// name login page से आएगा
let name = localStorage.getItem("name")

// अगर login नहीं हुआ तो वापस login page
if(!name){
window.location="index.html"
}

socket.emit("join",name)

socket.on("msg",(data)=>{

let div=document.createElement("div")

div.className="msg"

if(data.name==name){
div.classList.add("me")
}

div.innerText=data.name+": "+data.text

document.getElementById("chat").appendChild(div)

})

function send(){

let text=document.getElementById("msg").value

socket.emit("msg",{
name:name,
text:text
})

document.getElementById("msg").value=""

}

</script>

</body>
</html>
