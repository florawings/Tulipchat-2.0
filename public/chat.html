<!DOCTYPE html><html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Tulip Chat</title><style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial;
}

body{

height:100dvh;
display:flex;
flex-direction:column;

background:
linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),
url("https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2");

background-size:cover;
background-position:center;

color:white;

}

/* header */

#header{

height:55px;
display:flex;
align-items:center;

background:#ff3b6b;

padding:0 15px;

font-weight:bold;

}

/* menu button */

#menuBtn{

font-size:22px;
margin-right:10px;
cursor:pointer;

}

/* sidebar */

#sidebar{

position:fixed;
left:-240px;
top:0;

width:240px;
height:100%;

background:rgba(0,0,0,0.8);

padding:20px;

transition:0.3s;

z-index:10;

}

#sidebar.show{
left:0;
}

#userList{
list-style:none;
margin-top:15px;
}

#userList li{
padding:6px;
border-radius:6px;
cursor:pointer;
}

#userList li:hover{
background:rgba(255,255,255,0.15);
}

/* chat */

#messages{

flex:1;
overflow-y:auto;
padding:15px;

}

/* message */

.message{

max-width:75%;
padding:10px 14px;
border-radius:14px;
margin-bottom:10px;

background:rgba(255,255,255,0.2);

}

.me{

background:#ff3b6b;
margin-left:auto;

}

/* image / gif */

.chatMedia{

max-width:240px;
border-radius:10px;
margin-top:6px;

}

/* input area */

#inputArea{

display:flex;
padding:10px;
background:rgba(0,0,0,0.7);

}

#msgInput{

flex:1;
padding:10px;
border:none;
border-radius:20px;
outline:none;

}

button{

margin-left:6px;
padding:9px 12px;

border:none;

background:#ff3b6b;

color:white;

border-radius:8px;

cursor:pointer;

}

#uploadStatus{
font-size:12px;
padding-left:15px;
}

</style></head><body><div id="sidebar"><h3>Online Users</h3><p id="onlineCount">0 users online</p><ul id="userList"></ul></div><div id="header"><span id="menuBtn" onclick="toggleMenu()">☰</span>

Tulip Chat

</div><div id="messages"></div><div id="uploadStatus"></div><div id="inputArea"><input id="msgInput" placeholder="Type message"><button onclick="sendMsg()">Send</button>

<input type="file" id="fileInput" accept="image/*,image/gif" style="display:none"><button onclick="fileInput.click()">📷 / GIF</button>

</div><script src="/socket.io/socket.io.js"></script><script>

const socket = io()

let username = localStorage.getItem("username")

if(!username){

username = prompt("Enter your name")

localStorage.setItem("username",username)

}

socket.emit("join",username)

/* toggle sidebar */

function toggleMenu(){

sidebar.classList.toggle("show")

}

/* add message */

function addMessage(html,type=""){

let div=document.createElement("div")

div.className="message "+type

div.innerHTML=html

messages.appendChild(div)

messages.scrollTop=messages.scrollHeight

}

/* send text */

function sendMsg(){

let msg=msgInput.value

if(msg=="") return

socket.emit("chat message",{

user:username,
msg:msg

})

msgInput.value=""

}

/* receive text */

socket.on("chat message",(data)=>{

let type=""

if(data.user===username){
type="me"
}

addMessage("<b>"+data.user+":</b> "+data.msg,type)

})

/* join / leave system */

socket.on("system",(msg)=>{

addMessage("<i>"+msg+"</i>")

})

/* online users */

socket.on("user list",(users)=>{

onlineCount.innerText=users.length+" users online"

userList.innerHTML=""

users.forEach(u=>{

let li=document.createElement("li")

li.innerText=u

userList.appendChild(li)

})

})

/* upload image / gif */

fileInput.addEventListener("change",function(){

let file=this.files[0]

if(!file) return

let form=new FormData()

form.append("image",file)

let xhr=new XMLHttpRequest()

xhr.open("POST","/upload")

xhr.upload.onprogress=function(e){

if(e.lengthComputable){

let percent=Math.round((e.loaded/e.total)*100)

uploadStatus.innerText="Uploading "+percent+"%"

}

}

xhr.onload=function(){

uploadStatus.innerText=""

let data=JSON.parse(xhr.responseText)

/* gif automatically plays */

socket.emit("chat message",{

user:username,
msg:"<img class='chatMedia' src='"+data.url+"'>"

})

}

xhr.send(form)

})

</script></body>
</html>
