<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Tulip Chat</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{

height:100vh;
display:flex;
flex-direction:column;
background:#ffd6df;

}

/* HEADER */

#header{

height:50px;
background:#ff2f6e;
color:white;
display:flex;
align-items:center;
justify-content:space-between;
padding:10px;

}

/* MAIN */

#main{

flex:1;
display:flex;

}

/* CHAT */

#chatSection{

width:70%;
display:flex;
flex-direction:column;

}

#chat{

flex:1;
overflow:auto;
padding:10px;

}

/* MESSAGE */

.msg{

background:#ff2f6e;
color:white;
padding:8px;
margin-bottom:8px;
border-radius:10px;
max-width:80%;

}

/* INPUT BAR */

#inputBar{

display:flex;
gap:6px;
padding:8px;
background:white;

}

#text{

flex:1;
padding:8px;

}

/* USERS */

#usersSection{

width:30%;
background:white;
border-left:1px solid #ccc;

}

#onlineList{

padding:10px;

}

.user{

padding:6px;
border-bottom:1px solid #eee;

}

</style>

</head>

<body>

<div id="header">

<div>🌷 Tulip Chat</div>

<div>

<button onclick="clearChat()">🧹</button>

</div>

</div>

<div id="main">

<!-- CHAT -->

<div id="chatSection">

<div id="chat"></div>

<div id="inputBar">

<input id="text" placeholder="Type message">

<button onclick="send()">Send</button>

</div>

</div>

<!-- USERS -->

<div id="usersSection">

<h3 style="padding:10px">Online</h3>

<div id="onlineList"></div>

</div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io()

let username = localStorage.getItem("username")
let role = localStorage.getItem("role")
let gender = localStorage.getItem("gender")

if(!username){

location.href="/login.html"

}

/* BADGE */

function badge(r){

if(r==="owner") return "👑"

if(r==="superadmin") return "⭐"

return "👤"

}

/* JOIN */

socket.emit("join",{

username,
role,
gender

})

/* SEND */

function send(){

let msg = document.getElementById("text").value

if(!msg) return

socket.emit("message",{

username,
role,
msg

})

document.getElementById("text").value=""

}

/* RECEIVE */

socket.on("message",(data)=>{

let div=document.createElement("div")

div.className="msg"

div.innerText= badge(data.role)+" "+data.username+" : "+data.msg

chat.appendChild(div)

chat.scrollTop=chat.scrollHeight

})

/* ONLINE USERS */

socket.on("onlineUsers",(users)=>{

onlineList.innerHTML=""

users.forEach(u=>{

let div=document.createElement("div")

div.className="user"

div.innerText= badge(u.role)+" "+u.username

onlineList.appendChild(div)

})

})

/* CLEAR */

function clearChat(){

socket.emit("message",{

username,
role,
msg:"/clear"

})

}

socket.on("clearChat",()=>{

chat.innerHTML=""

})

</script>

</body>

</html>
