<!DOCTYPE html>
<html>

<head>

<title>Tulip Chat</title>

<script src="/socket.io/socket.io.js"></script>

<style>

body{
margin:0;
font-family:Arial;
display:flex;
height:100vh;
}

#users{
width:200px;
background:#111;
color:white;
padding:10px;
}

#chat{
flex:1;
display:flex;
flex-direction:column;
}

#messages{
flex:1;
overflow:auto;
padding:10px;
}

#sendBox{
display:flex;
}

input{
flex:1;
padding:10px;
}

button{
padding:10px;
}

</style>

</head>

<body>

<div id="users">

<h3>Online</h3>

<ul id="userList"></ul>

</div>

<div id="chat">

<div id="messages"></div>

<div id="sendBox">

<input id="msg">

<button onclick="send()">Send</button>

</div>

</div>

<script>

const socket=io()

let username=localStorage.getItem("username")

if(!username){

location="/login.html"

}

socket.emit("join",username)

socket.on("chat message",(data)=>{

let div=document.createElement("div")

div.innerText=data.username+": "+data.msg

document.getElementById("messages").appendChild(div)

})

socket.on("onlineUsers",(users)=>{

let list=document.getElementById("userList")

list.innerHTML=""

users.forEach(u=>{

let li=document.createElement("li")

li.innerText=u

list.appendChild(li)

})

})

function send(){

let msg=document.getElementById("msg").value

socket.emit("chat message",{

username,
msg

})

document.getElementById("msg").value=""

}

</script>

</body>
</html>
