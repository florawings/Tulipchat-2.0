<!DOCTYPE html>
<html>

<head>

<title>Chat</title>

<script src="/socket.io/socket.io.js"></script>

<style>

body{
font-family:Arial;
margin:0;
background:#eee;
}

#users{
background:#222;
color:white;
padding:10px;
}

.user{
cursor:pointer;
padding:5px;
}

#messages{
height:70vh;
overflow:auto;
padding:10px;
}

.msg{
background:#ddd;
margin:5px;
padding:8px;
border-radius:5px;
}

#sendbox{
display:flex;
position:fixed;
bottom:0;
width:100%;
}

#msg{
flex:1;
padding:10px;
border:none;
}

#send{
background:green;
color:white;
border:none;
padding:10px 20px;
}

</style>

</head>

<body>

<div id="users"></div>

<div id="messages"></div>

<div id="sendbox">

<input id="msg">

<button id="send">Send</button>

</div>

<script>

const socket = io();

let username = localStorage.getItem("username");

if(!username){
location="login.html";
}

let currentChat="";

socket.emit("join",username);

socket.on("users",(list)=>{

let div=document.getElementById("users");

div.innerHTML="";

list.forEach(u=>{

if(u!=username){

let d=document.createElement("div");

d.className="user";

d.innerText=u;

d.onclick=function(){

currentChat=u;

};

div.appendChild(d);

}

});

});

document.getElementById("send").onclick=function(){

let text=document.getElementById("msg").value;

if(currentChat=="") return;

socket.emit("private message",{

from:username,
to:currentChat,
msg:text

});

addMsg(username,text);

document.getElementById("msg").value="";

};

socket.on("private message",(data)=>{

addMsg(data.from,data.msg);

});

function addMsg(user,msg){

let div=document.createElement("div");

div.className="msg";

div.innerText=user+" : "+msg;

document.getElementById("messages").appendChild(div);

}

</script>

</body>

</html>
