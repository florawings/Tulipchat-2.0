<!DOCTYPE html>
<html>

<head>

<title>Tulip Chat</title>

<script src="/socket.io/socket.io.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#f5f5f5;
}

/* TOP BAR */

#topbar{
background:#111;
color:white;
padding:12px;
display:flex;
align-items:center;
justify-content:space-between;
}

/* MAIN LAYOUT */

#container{
display:flex;
height:90vh;
}

/* LEFT MENU */

#menu{
width:220px;
background:white;
border-right:1px solid #ddd;
padding:10px;
}

.room{
padding:10px;
border-bottom:1px solid #eee;
cursor:pointer;
}

/* CHAT AREA */

#chat{
flex:1;
display:flex;
flex-direction:column;
}

#messages{
flex:1;
overflow:auto;
padding:10px;
}

.msg{
background:#ddd;
padding:8px;
margin:6px 0;
border-radius:6px;
}

/* USERS PANEL */

#users{
width:200px;
background:white;
border-left:1px solid #ddd;
overflow:auto;
}

.user{
padding:10px;
border-bottom:1px solid #eee;
}

/* MESSAGE BOX */

#sendbox{
display:flex;
border-top:1px solid #ddd;
}

#msg{
flex:1;
padding:12px;
border:none;
}

#send{
background:#22c55e;
color:white;
border:none;
padding:12px 20px;
}

</style>

</head>

<body>

<div id="topbar">

<div>Tulip Chat</div>

<div id="user"></div>

</div>

<div id="container">

<!-- ROOMS -->

<div id="menu">

<h3>Rooms</h3>

<div class="room">Main room</div>
<div class="room">Adult room</div>
<div class="room">Quiz room</div>
<div class="room">Marathi room</div>

</div>

<!-- CHAT -->

<div id="chat">

<div id="messages"></div>

<div id="sendbox">

<input id="msg" placeholder="Type message">

<button id="send">Send</button>

</div>

</div>

<!-- ONLINE USERS -->

<div id="users">

<h3 style="padding:10px;">Online</h3>

</div>

</div>

<script>

const socket = io()

let username = localStorage.getItem("username")

if(!username){

location="index.html"

}

document.getElementById("user").innerText=username

socket.emit("join",username)

document.getElementById("send").onclick=function(){

let text=document.getElementById("msg").value

socket.emit("chat message",{

user:username,
msg:text

})

document.getElementById("msg").value=""

}

socket.on("chat message",(data)=>{

let div=document.createElement("div")

div.className="msg"

div.innerText=data.user+" : "+data.msg

document.getElementById("messages").appendChild(div)

})

socket.on("users",(list)=>{

let box=document.getElementById("users")

box.innerHTML="<h3 style='padding:10px'>Online</h3>"

list.forEach(u=>{

let d=document.createElement("div")

d.className="user"

d.innerText=u

box.appendChild(d)

})

})

</script>

</body>

</html>
