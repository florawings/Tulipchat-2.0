<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tulip Pro</title>
    <style>
        :root { --main: #f43f5e; --bg: #0f172a; }
        body { margin: 0; background: #000 url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1200') center/cover; height: 100vh; display: flex; flex-direction: column; font-family: sans-serif; }
        
        header { height: 60px; background: rgba(15,23,42,0.9); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; color: white; border-bottom: 1px solid var(--main); z-index: 1000; }
        
        /* Sidebar Fix */
        #sidebar { position: fixed; left: -280px; width: 280px; height: 100%; background: rgba(15,23,42,0.98); transition: 0.3s; z-index: 2000; padding: 20px; box-shadow: 5px 0 15px rgba(0,0,0,0.5); }
        #sidebar.open { left: 0; }
        .user-item { display: flex; align-items: center; gap: 10px; padding: 10px; color: white; border-bottom: 1px solid rgba(255,255,255,0.1); }

        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 75%; padding: 10px; border-radius: 15px; color: white; position: relative; }
        .msg.me { align-self: flex-end; background: var(--main); }
        .msg.other { align-self: flex-start; background: rgba(255,255,255,0.1); backdrop-filter: blur(5px); }
        .u-name { font-size: 10px; font-weight: bold; color: #fbbf24; margin-bottom: 3px; display: block; }

        .input-area { padding: 15px; background: rgba(15,23,42,0.9); display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 25px; border: none; outline: none; background: rgba(255,255,255,0.1); color: white; }
        .chat-img { width: 100%; max-width: 200px; border-radius: 10px; margin-top: 5px; }
    </style>
</head>
<body>

<div id="sidebar">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3 style="color:var(--main)">Online Members</h3>
        <span onclick="toggleSidebar()" style="cursor:pointer; font-size:24px; color:white;">×</span>
    </div>
    <div id="online-list" style="margin-top:20px;"></div>
</div>

<header>
    <div onclick="toggleSidebar()" style="font-size:24px; cursor:pointer;">☰</div>
    <div style="font-weight:bold;">TULIP <span style="color:var(--main)">PRO</span></div>
    <div onclick="location.href='index.html'" style="color:var(--main); font-size:12px;">LOGOUT</div>
</header>

<div id="chat-box"></div>

<div class="input-area">
    <input type="text" id="msgIn" placeholder="Type a message...">
    <button onclick="send()" style="background:var(--main); color:white; border:none; padding:10px 20px; border-radius:20px;">Send</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    const urlParams = new URLSearchParams(window.location.search);
    const username = urlParams.get('username') || "Guest";
    const gender = urlParams.get('gender') || "Male";

    socket.emit('join', { username, gender });

    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }

    socket.on('updateUserList', (users) => {
        document.getElementById('online-list').innerHTML = users.map(u => `
            <div class="user-item">
                <span>${u.gender === 'Female' ? '👩' : '👨'}</span>
                <span>${u.username}</span>
            </div>
        `).join('');
    });

    socket.on('newMessage', (data) => {
        const div = document.createElement('div');
        div.className = `msg ${data.user === username ? 'me' : 'other'}`;
        div.innerHTML = `<span class="u-name">${data.gender==='Female'?'👩':'👨'} ${data.user}</span>${data.text}`;
        document.getElementById('chat-box').appendChild(div);
        document.getElementById('chat-box').scrollTop = document.getElementById('chat-box').scrollHeight;
    });

    function send() {
        const input = document.getElementById('msgIn');
        if(input.value) {
            socket.emit('sendMessage', { message: input.value });
            input.value = '';
        }
    }
</script>
</body>
</html>
