<!DOCTYPE html>
<html>
<head>
<title>Tulip Chat</title>

<style>

body{
font-family:Arial;
margin:0;
background:#eee;
}

header{
background:#ff2d7a;
color:white;
padding:10px;
display:flex;
justify-content:space-between;
}

#chat{
height:70vh;
overflow:auto;
padding:10px;
}

.msg{
background:white;
margin:6px;
padding:10px;
border-radius:6px;
}

.bottom{
position:fixed;
bottom:0;
left:0;
right:0;
display:flex;
}

input{
flex:1;
padding:10px;
border:none;
}

button{
padding:10px;
background:#ff2d7a;
color:white;
border:none;
}

#usersWindow{
position:fixed;
right:10px;
top:60px;
background:white;
border-radius:6px;
padding:10px;
display:none;
}

.user{
padding:5px;
cursor:pointer;
}

</style>

</head>

<body>

<header>

🌷 Tulip Chat

<div>

<button onclick="toggleUsers()">Online</button>

<button onclick="logout()">Logout</button>

</div>

</header>

<div id="chat"></div>

<div id="usersWindow"></div>

<div class="bottom">

<input id="msg">

<button onclick="send()">Send</button>

<input type="file" id="file" hidden>

<button onclick="file.click()">📷</button>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io()

let name = localStorage.getItem("tulip_name")

if(!name){

name = prompt("name")

localStorage.setItem("tulip_name",name)

}

socket.emit("join",name)

const chat = document.getElementById("chat")

/* load old chat */

fetch("/messages")

.then(res=>res.json())

.then(data=>{

data.forEach(addMsg)

})

function send(){

const text = msg.value

socket.emit("message",{name,text})

msg.value=""

}

socket.on("message",addMsg)

socket.on("image",addMsg)

function addMsg(data){

let div = document.createElement("div")

div.className="msg"

if(data.text){

div.innerText=data.name+": "+data.text

}

if(data.url){

div.innerHTML=data.name+"<br><img src='"+data.url+"' width='150'>"

}

chat.appendChild(div)

chat.scrollTop=chat.scrollHeight

}

/* users */

socket.on("users",(list)=>{

let html=""

list.forEach(u=>{

html+=`<div class="user" onclick="openDM('${u}')">${u}</div>`

})

usersWindow.innerHTML=html

})

function toggleUsers(){

usersWindow.style.display=

usersWindow.style.display=="block"?"none":"block"

}

/* DM */

function openDM(user){

window.open("/dm.html?user="+user,"dm")

}

file.onchange=()=>{

let fd=new FormData()

fd.append("file",file.files[0])

fetch("/upload",{method:"POST",body:fd})

.then(r=>r.json())

.then(d=>{

socket.emit("image",{name,url:d.url})

})

}

/* logout */

function logout(){

localStorage.clear()

location.reload()

}

</script>

</body>
</html>
