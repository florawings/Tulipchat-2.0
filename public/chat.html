<!DOCTYPE html>
<html>

<head>

<title>Tulip Chat</title>

<link rel="stylesheet" href="style.css">

<script src="/socket.io/socket.io.js"></script>

</head>

<body>

<div class="top">

🌷 Tulip Chat

<span id="count"></span>

</div>

<div class="container">

<!-- USERS PANEL -->

<div class="users">

<h3>Online</h3>

<div id="list"></div>

</div>

<!-- CHAT AREA -->

<div class="chat">

<div id="messages"></div>

<div class="input">

<input id="msg" placeholder="message">

<button onclick="send()">Send</button>

<button onclick="sendImage()">📷</button>

</div>

</div>

</div>

<script>

/* SOCKET */

let socket = io()

/* USER */

let user = localStorage.getItem("user")

if(!user){

user = prompt("Enter username")

localStorage.setItem("user",user)

}

socket.emit("join",user)

/* DM VARIABLES */

let dmTarget = null
let dmName = null

/* MESSAGE BOX */

let messages = document.getElementById("messages")

function add(text){

messages.innerHTML += "<div class='msg'>"+text+"</div>"

messages.scrollTop = messages.scrollHeight

}

/* SEND MESSAGE */

function send(){

let m = document.getElementById("msg").value

if(!m) return

if(dmTarget){

socket.emit("dm",{
from:user,
to:dmTarget,
text:m
})

add("<b>You → "+dmName+"</b>: "+m)

}else{

socket.emit("message",{
user:user,
text:m
})

}

msg.value=""

}

/* IMAGE SEND */

function sendImage(){

let url = prompt("Image URL")

if(!url) return

socket.emit("image",{
user:user,
url:url
})

}

/* START DM */

function startDM(id,name){

dmTarget = id
dmName = name

add("<i>DM started with "+name+"</i>")

}

/* PUBLIC MESSAGE RECEIVE */

socket.on("message",(d)=>{

add("<b>"+d.user+"</b>: "+d.text)

})

/* IMAGE RECEIVE */

socket.on("image",(d)=>{

add("<b>"+d.user+"</b><br><img src='"+d.url+"' width='200'>")

})

/* SYSTEM MESSAGE */

socket.on("system",(t)=>{

add("<i>"+t+"</i>")

})

/* DM RECEIVE */

socket.on("dm",(d)=>{

add("<b>"+d.from+" (DM)</b>: "+d.text)

})

/* ONLINE USERS */

socket.on("online",(u)=>{

document.getElementById("count").innerText="Online "+Object.keys(u).length

let html=""

for(let id in u){

html += `<div onclick="startDM('${id}','${u[id]}')">${u[id]}</div>`

}

document.getElementById("list").innerHTML = html

})

</script>

</body>
</html>
