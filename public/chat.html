<!DOCTYPE html><html>
<head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tulip Chat</title><style>

body{
margin:0;
font-family:Arial;
background:#ececec;
}

/* TOP BAR */

.topbar{
background:black;
color:white;
padding:12px;
display:flex;
justify-content:space-between;
align-items:center;
}

/* MENU */

.menu{
position:fixed;
left:-260px;
top:0;
width:260px;
height:100%;
background:white;
transition:0.3s;
z-index:10;
}

.menu.show{
left:0;
}

.menu div{
padding:15px;
border-bottom:1px solid #eee;
cursor:pointer;
}

/* USERS */

.users{
position:fixed;
right:-220px;
top:0;
width:220px;
height:100%;
background:#111;
color:white;
transition:0.3s;
}

.users.show{
right:0;
}

.userItem{
padding:10px;
border-bottom:1px solid #333;
cursor:pointer;
}

/* CHAT */

.chat{
height:70vh;
overflow:auto;
padding:10px;
}

.msg{
background:white;
padding:8px;
margin-bottom:6px;
border-radius:5px;
}

/* INPUT */

.inputbar{
display:flex;
padding:8px;
background:white;
position:fixed;
bottom:0;
width:100%;
}

.inputbar input{
flex:1;
padding:10px;
}

.inputbar button{
padding:10px;
margin-left:4px;
}

/* PANELS */

.panel{
position:fixed;
bottom:120px;
left:10px;
background:white;
padding:10px;
border:1px solid #ccc;
display:none;
}

</style></head><body><div class="topbar"><div onclick="toggleMenu()">☰</div><div>🌷 Tulip Chat</div><div onclick="toggleUsers()">👥</div></div><!-- MENU --><div class="menu" id="menu"><div onclick="joinRoom('public')">🌐 Public Chat</div><div onclick="createRoom()">➕ Create Room</div><div onclick="openNews()">📰 News Board</div><div onclick="openLeaderboard()">🏆 Leaderboard</div></div><!-- USERS --><div class="users" id="users"><h3 style="padding:10px">Online</h3><div id="userList"></div></div><!-- CHAT --><div class="chat" id="chat"></div><!-- INPUT --><div class="inputbar"><input id="msgInput" placeholder="Type message"><button onclick="sendMsg()">Send</button>

<button onclick="sendImage()">📷</button>

<button onclick="sendGif()">GIF</button>

</div><!-- OWNER PANEL --><div class="panel" id="ownerPanel"><b>Owner Tools</b>

<br><br>

<button onclick="kickUser()">Kick</button>

<button onclick="banUser()">Ban</button>

<button onclick="muteUser()">Mute</button>

<button onclick="promoteUser()">Promote</button>

</div><script>

let username=localStorage.getItem("name")

if(!username){

username=prompt("Enter username")

localStorage.setItem("name",username)

}

let role="user"

let room="public"

let dmUser=null

let coins=0

let banned=[]

let muted=[]

let users=["Rahul","Neha","Aman","Ravi"]


/* OWNER LOGIN */

if(username==="Lord_lucifer"){

let p=prompt("Owner password")

if(p==="766521"){

role="owner"

document.getElementById("ownerPanel").style.display="block"

}

}


/* MENU */

function toggleMenu(){

menu.classList.toggle("show")

}


/* USERS PANEL */

function toggleUsers(){

document.getElementById("users").classList.toggle("show")

}


/* MESSAGE */

function sendMsg(){

let text=msgInput.value

if(!text) return

if(muted.includes(username)){

alert("You are muted")

return

}

if(dmUser){

addMsg("DM "+username+" → "+dmUser+": "+text)

}else{

addMsg(username+": "+text)

}

coins++

msgInput.value=""

}


/* IMAGE */

function sendImage(){

let url=prompt("Image URL")

addMsg(username+": <img src='"+url+"' width='200'>")

}


/* GIF */

function sendGif(){

let url=prompt("GIF URL")

addMsg(username+": <img src='"+url+"' width='200'>")

}


/* ADD MESSAGE */

function addMsg(text){

chat.innerHTML+=`

<div class="msg">

${text}

<br>

<button onclick="deleteMsg(this)">Delete</button>

<button onclick="reportMsg()">Report</button>

</div>

`

chat.scrollTop=chat.scrollHeight

}


/* DELETE */

function deleteMsg(btn){

btn.parentElement.remove()

}


/* REPORT */

function reportMsg(){

alert("Message reported")

}


/* ROOMS */

function createRoom(){

let r=prompt("Room name")

alert("Room '"+r+"' created")

}


/* JOIN ROOM */

function joinRoom(r){

room=r

chat.innerHTML=""

addMsg("Joined room: "+r)

}


/* USER LIST */

function refreshUsers(){

let html=""

users.forEach(u=>{

html+=`<div class="userItem" onclick="openDM('${u}')">${u}</div>`

})

userList.innerHTML=html

}

refreshUsers()


/* DM */

function openDM(u){

dmUser=u

chat.innerHTML=""

addMsg("Private chat with "+u)

}


/* OWNER TOOLS */

function kickUser(){

let u=prompt("User")

alert(u+" kicked")

}

function banUser(){

let u=prompt("User")

banned.push(u)

alert(u+" banned")

}

function muteUser(){

let u=prompt("User")

muted.push(u)

alert(u+" muted")

}

function promoteUser(){

let u=prompt("User")

alert(u+" promoted to superadmin")

}


/* NEWS */

function openNews(){

alert("Community news board")

}


/* LEADERBOARD */

function openLeaderboard(){

alert("Your TulipCoins: "+coins)

}

</script></body>
</html>
