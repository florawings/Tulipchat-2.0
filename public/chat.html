<!DOCTYPE html><html>
<head><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tulip Chat</title><style>

body{
margin:0;
font-family:system-ui;
background:#140014;
color:white;
height:100vh;
display:flex;
flex-direction:column;
overflow:hidden;
}

/* TOPBAR */

#topbar{
height:55px;
background:linear-gradient(90deg,#ff4da6,#c44dff);
display:flex;
align-items:center;
padding:0 12px;
font-weight:bold;
}

#menu{
font-size:22px;
margin-right:10px;
cursor:pointer;
}

/* SIDEBAR */

#sidebar{
position:fixed;
top:0;
left:-260px;
width:260px;
height:100%;
background:#1a001a;
padding:15px;
transition:0.3s;
overflow:auto;
z-index:10;
}

#sidebar.open{
left:0;
}

.user{
background:#2c002c;
padding:10px;
border-radius:8px;
margin-bottom:6px;
cursor:pointer;
}

.user:hover{
background:#500050;
}

/* CHAT */

#messages{
flex:1;
overflow:auto;
padding:10px;
display:flex;
flex-direction:column;
gap:8px;
}

/* BUBBLES */

.msg{
padding:10px 14px;
border-radius:16px;
max-width:70%;
word-wrap:break-word;
}

.me{
background:linear-gradient(90deg,#ff4da6,#c44dff);
align-self:flex-end;
}

.other{
background:#333;
align-self:flex-start;
}

/* INPUT BAR */

#inputbar{
height:60px;
background:#1a001a;
display:flex;
align-items:center;
padding:0 8px;
gap:6px;
}

#text{
flex:1;
padding:10px;
border:none;
border-radius:20px;
background:#2c002c;
color:white;
}

button{
padding:10px 14px;
border:none;
border-radius:20px;
background:linear-gradient(90deg,#ff4da6,#c44dff);
color:white;
cursor:pointer;
}

#progress{
font-size:12px;
}

/* DM WINDOW */

#dmWindow{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#0a000a;
display:none;
flex-direction:column;
z-index:20;
}

#dmTop{
background:#ff4da6;
padding:10px;
display:flex;
justify-content:space-between;
}

#dmMessages{
flex:1;
overflow:auto;
padding:10px;
display:flex;
flex-direction:column;
gap:8px;
}

#dmInput{
height:60px;
display:flex;
padding:10px;
gap:6px;
background:#1a001a;
}

</style></head><body><div id="topbar">
<span id="menu">☰</span>
Tulip Chat
</div><div id="sidebar"><h3>Online Users</h3><div id="users"></div></div><div id="messages"></div><div id="inputbar"><input id="text" placeholder="Type message"><button onclick="send()">Send</button>

<input type="file" id="file"><span id="progress"></span>

</div><!-- DM --><div id="dmWindow"><div id="dmTop"><span id="dmUser"></span>

<button onclick="closeDM()">Back</button>

</div><div id="dmMessages"></div><div id="dmInput"><input id="dmText" placeholder="DM message"><button onclick="sendDM()">Send</button>

</div></div><script src="/socket.io/socket.io.js"></script><script>

const socket=io()

let username=localStorage.getItem("username")
let gender=localStorage.getItem("gender")
let age=localStorage.getItem("age")

if(!username){

username=prompt("Enter name")
age=prompt("Enter age")
gender=prompt("Gender (Male/Female)")

localStorage.setItem("username",username)
localStorage.setItem("age",age)
localStorage.setItem("gender",gender)

}

socket.emit("join",{name:username,gender})

/* SIDEBAR */

const menu=document.getElementById("menu")
const sidebar=document.getElementById("sidebar")

menu.onclick=()=>{

sidebar.classList.toggle("open")

}

/* PUBLIC MESSAGE */

function send(){

let text=document.getElementById("text").value

if(!text)return

socket.emit("message",{user:username,msg:text})

document.getElementById("text").value=""

}

/* RECEIVE */

socket.on("message",(data)=>{

let div=document.createElement("div")

div.className="msg "+(data.user===username?"me":"other")

div.innerText=data.user+": "+data.msg

document.getElementById("messages").appendChild(div)

document.getElementById("messages").scrollTop=999999

})

/* ONLINE USERS */

socket.on("online",(list)=>{

let box=document.getElementById("users")

box.innerHTML=""

for(let id in list){

let u=document.createElement("div")

u.className="user"

u.innerText=list[id].name+" ("+list[id].gender+")"

u.onclick=()=>openDM(id,list[id].name)

box.appendChild(u)

}

})

/* DM */

let currentDM=null

function openDM(id,name){

currentDM=id

document.getElementById("dmWindow").style.display="flex"

document.getElementById("dmUser").innerText=name

document.getElementById("dmMessages").innerHTML=""

}

function closeDM(){

document.getElementById("dmWindow").style.display="none"

}

function sendDM(){

let text=document.getElementById("dmText").value

if(!text)return

socket.emit("dm",{to:currentDM,user:username,msg:text})

document.getElementById("dmText").value=""

}

socket.on("dm",(data)=>{

let div=document.createElement("div")

div.className="msg "+(data.user===username?"me":"other")

div.innerText=data.user+": "+data.msg

document.getElementById("dmMessages").appendChild(div)

})

/* FILE UPLOAD */

document.getElementById("file").onchange=function(){

let file=this.files[0]

let form=new FormData()

form.append("file",file)

let xhr=new XMLHttpRequest()

xhr.open("POST","/upload")

xhr.upload.onprogress=(e)=>{

let percent=Math.round((e.loaded/e.total)*100)

document.getElementById("progress").innerText=percent+"%"

}

xhr.onload=()=>{

let res=JSON.parse(xhr.response)

socket.emit("message",{user:username,msg:res.url})

}

xhr.send(form)

}

</script></body>
</html>
