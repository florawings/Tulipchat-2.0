<!DOCTYPE html><html>
<head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tulip Chat</title><style>

body{
margin:0;
font-family:Arial;
background:#f5e3ea;
display:flex;
height:100vh;
}

/* SIDEBAR */

#sidebar{
width:260px;
background:white;
border-right:1px solid #ddd;
padding:20px;
}

#logo{
font-size:20px;
font-weight:bold;
color:#ff3d6e;
margin-bottom:20px;
}

#logout{
background:#ff3d6e;
color:white;
border:none;
padding:8px 14px;
border-radius:8px;
cursor:pointer;
margin-bottom:20px;
}

.user{
margin-top:10px;
padding:6px;
cursor:pointer;
}

/* CHAT AREA */

#chatArea{
flex:1;
display:flex;
flex-direction:column;
align-items:center;
}

/* HEADER */

#header{
width:100%;
background:#ff3d6e;
color:white;
padding:12px;
font-weight:bold;
}

/* CHAT BOX */

#chatBox{
background:#f7dce5;
width:80%;
max-width:600px;
height:70vh;
margin-top:20px;
border-radius:14px;
padding:20px;
overflow:auto;
display:flex;
flex-direction:column;
gap:10px;
}

/* MESSAGE */

.msg{
background:#ff3d6e;
color:white;
padding:10px 16px;
border-radius:20px;
width:fit-content;
max-width:70%;
}

/* INPUT AREA */

#inputArea{
display:flex;
width:80%;
max-width:600px;
margin-top:10px;
gap:6px;
}

#text{
flex:1;
padding:10px;
border-radius:20px;
border:1px solid #ccc;
}

button{
background:#ff3d6e;
color:white;
border:none;
padding:10px 14px;
border-radius:10px;
cursor:pointer;
}

#camera{
font-size:18px;
}

#progress{
font-size:12px;
}

/* DM WINDOW */

#dmWindow{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#f5e3ea;
display:none;
flex-direction:column;
}

#dmHeader{
background:#ff3d6e;
color:white;
padding:12px;
display:flex;
justify-content:space-between;
}

#dmMessages{
flex:1;
overflow:auto;
padding:20px;
}

#dmInput{
display:flex;
padding:10px;
gap:6px;
}

</style></head><body><div id="sidebar"><div id="logo">🌷 Tulip Chat</div><button id="logout">Logout</button>

<div id="online">0 users online</div><div id="users"></div></div><div id="chatArea"><div id="header">Tulip Chat</div><div id="chatBox"></div><div id="inputArea"><input id="text" placeholder="Type message"><button onclick="send()">Send</button>

<button onclick="sendGif()">GIF</button>

<label id="camera">
📷
<input type="file" id="file" hidden>
</label><span id="progress"></span>

</div></div><!-- DM WINDOW --><div id="dmWindow"><div id="dmHeader"><span id="dmUser"></span>

<button onclick="closeDM()">Back</button>

</div><div id="dmMessages"></div><div id="dmInput"><input id="dmText" placeholder="DM message"><button onclick="sendDM()">Send</button>

</div></div><script src="/socket.io/socket.io.js"></script><script>

const socket=io()

let username=localStorage.getItem("username")

if(!username){

username=prompt("Enter your name")

localStorage.setItem("username",username)

}

socket.emit("join",{name:username})

/* PUBLIC MESSAGE */

function send(){

let text=document.getElementById("text").value

if(!text)return

socket.emit("message",{user:username,msg:text})

document.getElementById("text").value=""

}

/* RECEIVE */

socket.on("message",(data)=>{

let div=document.createElement("div")

div.className="msg"

div.innerText=data.user+": "+data.msg

document.getElementById("chatBox").appendChild(div)

document.getElementById("chatBox").scrollTop=999999

})

/* ONLINE USERS */

socket.on("online",(list)=>{

let box=document.getElementById("users")

box.innerHTML=""

let count=0

for(let id in list){

count++

let u=document.createElement("div")

u.className="user"

u.innerText=list[id]

u.onclick=()=>openDM(id,list[id])

box.appendChild(u)

}

document.getElementById("online").innerText=count+" users online"

})

/* DM */

let currentDM=null

function openDM(id,name){

currentDM=id

document.getElementById("dmWindow").style.display="flex"

document.getElementById("dmUser").innerText=name

document.getElementById("dmMessages").innerHTML=""

}

function closeDM(){

document.getElementById("dmWindow").style.display="none"

}

function sendDM(){

let text=document.getElementById("dmText").value

socket.emit("dm",{to:currentDM,user:username,msg:text})

document.getElementById("dmText").value=""

}

socket.on("dm",(data)=>{

let div=document.createElement("div")

div.className="msg"

div.innerText=data.user+": "+data.msg

document.getElementById("dmMessages").appendChild(div)

})

/* GIF */

function sendGif(){

let url=prompt("Paste GIF link")

if(url){

socket.emit("message",{user:username,msg:url})

}

}

/* FILE UPLOAD */

document.getElementById("file").onchange=function(){

let file=this.files[0]

let form=new FormData()

form.append("file",file)

let xhr=new XMLHttpRequest()

xhr.open("POST","/upload")

xhr.upload.onprogress=(e)=>{

let percent=Math.round((e.loaded/e.total)*100)

document.getElementById("progress").innerText=percent+"%"

}

xhr.onload=()=>{

let res=JSON.parse(xhr.response)

socket.emit("message",{user:username,msg:res.url})

document.getElementById("progress").innerText=""

}

xhr.send(form)

}

</script></body>
</html>
