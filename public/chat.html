<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tulip Chat</title><link rel="stylesheet" href="style.css"><style>

body{
margin:0;
font-family:Arial;
background:#0e0e0e;
color:white;
display:flex;
height:100vh;
overflow:hidden;
}

/* sidebar */

#sidebar{
width:230px;
background:#000;
padding:15px;
transition:0.3s;
}

#sidebar.closed{
margin-left:-230px;
}

#sidebar h2{
color:#ff4da6;
}

.room{
padding:10px;
margin-bottom:5px;
background:#111;
border-radius:6px;
cursor:pointer;
}

.room:hover{
background:#222;
}

/* topbar */

#topbar{
height:50px;
background:#111;
display:flex;
align-items:center;
padding:0 10px;
}

#menu{
font-size:22px;
cursor:pointer;
margin-right:10px;
}

/* chat area */

#chatArea{
flex:1;
display:flex;
flex-direction:column;
background:url("https://images.unsplash.com/photo-1518199266791-5375a83190b7") center/cover;
}

#messages{
flex:1;
overflow:auto;
padding:20px;
}

/* message */

.msg{
background:#222;
padding:10px;
border-radius:10px;
margin-bottom:10px;
max-width:70%;
}

.msg img{
max-width:200px;
border-radius:8px;
}

.msg video{
max-width:220px;
}

/* input */

#inputBar{
display:flex;
background:#111;
padding:10px;
}

#text{
flex:1;
padding:10px;
border:none;
border-radius:20px;
outline:none;
}

button{
margin-left:6px;
padding:10px;
border:none;
border-radius:8px;
background:#ff4da6;
color:white;
cursor:pointer;
}

/* online users */

#onlinePanel{
position:fixed;
left:0;
top:0;
height:100%;
width:200px;
background:#111;
padding:10px;
display:none;
overflow:auto;
}

.user{
padding:6px;
cursor:pointer;
border-bottom:1px solid #333;
}

/* dm */

#dmBox{
position:fixed;
right:20px;
bottom:20px;
width:250px;
background:#111;
border-radius:10px;
display:none;
flex-direction:column;
}

#dmHeader{
background:#ff4da6;
padding:10px;
}

#dmMessages{
height:200px;
overflow:auto;
padding:10px;
}

#dmInput{
display:flex;
padding:10px;
}

#dmText{
flex:1;
padding:8px;
border:none;
border-radius:10px;
}

/* progress */

#progress{
font-size:12px;
margin-left:8px;
}

</style></head><body><div id="sidebar"><h2>Tulip Chat</h2><div class="room" onclick="joinRoom('normal')">Normal Room</div><div class="room" onclick="joinRoom('adult')">Adult Room</div><h3>Online Users</h3><div id="online"></div></div><div id="chatArea"><div id="topbar"><span id="menu" onclick="toggleSidebar()">☰</span>

<span id="roomName">Normal Room</span>

</div><div id="messages"></div><div id="inputBar"><input id="text" placeholder="Type message"><button onclick="sendMsg()">Send</button>

<input type="file" id="file"><span id="progress"></span>

</div></div><div id="onlinePanel"></div><div id="dmBox"><div id="dmHeader"></div><div id="dmMessages"></div><div id="dmInput"><input id="dmText"><button onclick="sendDM()">Send</button>

</div></div><script src="/socket.io/socket.io.js"></script><script>

let socket=io()

let room="normal"

let username=localStorage.getItem("user")||prompt("username")

function toggleSidebar(){

document.getElementById("sidebar").classList.toggle("closed")

}

function joinRoom(r){

room=r

document.getElementById("roomName").innerText=r+" room"

socket.emit("join",r)

}

function addMsg(html){

let div=document.createElement("div")

div.className="msg"

div.innerHTML=html

document.getElementById("messages").appendChild(div)

}

function sendMsg(){

let text=document.getElementById("text").value

if(text==="")return

socket.emit("msg",{room,text,user:username})

document.getElementById("text").value=""

}

socket.on("msg",data=>{

addMsg("<b>"+data.user+":</b> "+data.text)

})

/* upload */

document.getElementById("file").onchange=function(){

let file=this.files[0]

let form=new FormData()

form.append("file",file)

let xhr=new XMLHttpRequest()

xhr.open("POST","/upload")

xhr.upload.onprogress=e=>{

let p=Math.round((e.loaded/e.total)*100)

document.getElementById("progress").innerText=p+"%"

}

xhr.onload=()=>{

let url=xhr.responseText

if(file.type.startsWith("image"))

socket.emit("msg",{room,user:username,text:"<img src='"+url+"'>"})

else if(file.type.startsWith("video"))

socket.emit("msg",{room,user:username,text:"<video controls src='"+url+"'></video>"})

}

xhr.send(form)

}

/* online users */

socket.on("users",list=>{

let html=""

list.forEach(u=>{

html+="<div class='user' onclick='openDM(\""+u+"\")'>"+u+"</div>"

})

document.getElementById("online").innerHTML=html

})

/* dm */

function openDM(user){

document.getElementById("dmBox").style.display="flex"

document.getElementById("dmHeader").innerText=user

}

function sendDM(){

let msg=document.getElementById("dmText").value

let to=document.getElementById("dmHeader").innerText

socket.emit("dm",{to,msg})

document.getElementById("dmText").value=""

}

</script></body></html>
