<!DOCTYPE html>
<html>
<head>

<title>Tulip Chat</title>

<link rel="stylesheet" href="style.css">

<script src="/socket.io/socket.io.js"></script>

</head>

<body>

<div class="top">

🌷 Tulip Chat

<span id="count"></span>

</div>

<div class="container">

<div class="users">

<h3>Online</h3>

<div id="list"></div>

</div>

<div class="chat">

<div id="messages"></div>

<div class="input">

<input id="msg" placeholder="message">

<button onclick="send()">Send</button>

<button onclick="img()">📷</button>

</div>

</div>

</div>

<script>

let socket=io()

let user=localStorage.getItem("user")

socket.emit("join",user)

let messages=document.getElementById("messages")

function add(t){

messages.innerHTML+=`<div class=msg>${t}</div>`

messages.scrollTop=messages.scrollHeight

}

/* send text */

function send(){

let m=document.getElementById("msg").value

socket.emit("message",{user:user,text:m})

msg.value=""

}

/* image */

function img(){

let url=prompt("Image URL")

socket.emit("image",{user:user,url:url})

}

/* events */

socket.on("message",(d)=>{

add("<b>"+d.user+"</b>: "+d.text)

})

socket.on("image",(d)=>{

add("<b>"+d.user+"</b><br><img src='"+d.url+"' width=200>")

})

socket.on("system",(t)=>{

add("<i>"+t+"</i>")

})

socket.on("online",(u)=>{

document.getElementById("count").innerText="Online "+u.length

let html=""

u.forEach(x=>{

html+="<div>"+x+"</div>"

})

document.getElementById("list").innerHTML=html

})

</script>

</body>
</html>
