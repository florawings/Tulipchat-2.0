<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tulip Pro | Fixed</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #f43f5e; --owner: #fbbf24; --glass: rgba(15, 23, 42, 0.9); }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            margin: 0; height: 100vh; display: flex; flex-direction: column;
            background: #000 url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1200') no-repeat center center fixed;
            background-size: cover; overflow: hidden;
        }

        /* --- HEADER --- */
        header {
            height: 55px; background: var(--glass); display: flex; 
            align-items: center; justify-content: space-between; padding: 0 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1); z-index: 1001;
        }

        /* --- SIDEBAR --- */
        #sidebar {
            position: fixed; left: -280px; top: 0; width: 280px; height: 100%;
            background: #0f172a; transition: 0.3s; z-index: 2000; padding: 20px;
        }
        #sidebar.open { left: 0; box-shadow: 10px 0 50px rgba(0,0,0,0.8); }

        /* --- CHAT SECTION (Main Fix) --- */
        #chat-container {
            flex: 1; display: flex; flex-direction: column; 
            position: relative; overflow: hidden;
        }

        #chat-scroller {
            flex: 1; overflow-y: auto; padding: 15px;
            display: flex; flex-direction: column; gap: 10px;
            padding-bottom: 80px; /* Space for input box */
        }

        .msg { padding: 10px 15px; border-radius: 18px; color: white; max-width: 80%; }
        .msg.me { align-self: flex-end; background: var(--primary); border-bottom-right-radius: 2px; }
        .msg.other { align-self: flex-start; background: rgba(255,255,255,0.2); backdrop-filter: blur(10px); border-bottom-left-radius: 2px; }

        /* --- INPUT BOX (Ye gayab tha) --- */
        .input-box {
            position: absolute; bottom: 0; left: 0; width: 100%;
            padding: 15px; background: var(--glass); backdrop-filter: blur(10px);
            display: flex; gap: 10px; z-index: 1000;
        }

        #msgIn {
            flex: 1; padding: 12px 20px; border-radius: 30px; 
            border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1);
            color: white; outline: none;
        }

        #sendBtn {
            background: var(--primary); border: none; width: 45px; height: 45px;
            border-radius: 50%; color: white; cursor: pointer; font-size: 20px;
        }

        #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1500; }
        .owner-tag { color: var(--owner); font-weight: bold; font-size: 10px; display: block; }
    </style>
</head>
<body>

<div id="overlay" onclick="toggleSidebar()"></div>

<header>
    <div onclick="toggleSidebar()" style="font-size:24px; cursor:pointer; color:white;">☰</div>
    <div style="color:white; font-weight:600;">TULIP <span style="color:var(--primary)">PRO</span></div>
    <div id="status" style="color:var(--owner); font-size:10px;">ONLINE</div>
</header>

<div id="sidebar">
    <div style="display:flex; justify-content:space-between; color:white;">
        <h3>Online Users</h3>
        <span onclick="toggleSidebar()" style="font-size:24px; cursor:pointer;">&times;</span>
    </div>
    <div id="online-list" style="margin-top:20px; color:white;"></div>
    
    <div id="admin-panel" style="display:none; margin-top:20px; border-top:1px solid #444; padding-top:15px;">
        <p style="color:var(--owner)">👑 Lord Panel</p>
        <button onclick="socket.emit('adminClear')" style="width:100%; padding:10px; background:var(--owner); border:none; border-radius:5px;">Clear Chat</button>
    </div>

    <button onclick="location.href='/'" style="position:absolute; bottom:20px; width:85%; padding:10px; background:rgba(244,63,94,0.2); color:white; border:1px solid var(--primary); border-radius:10px;">Logout</button>
</div>

<div id="chat-container">
    <div id="chat-scroller"></div>
    <div class="input-box">
        <input type="text" id="msgIn" placeholder="Type message..." autocomplete="off">
        <button id="sendBtn" onclick="send()">➤</button>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    const params = new URLSearchParams(window.location.search);
    const username = params.get('username') || "Guest";
    const role = params.get('role') || "user";
    const gender = params.get('gender') || "Male";

    socket.emit('join', { username, gender, role });

    function toggleSidebar() {
        const sb = document.getElementById('sidebar');
        const ov = document.getElementById('overlay');
        sb.classList.toggle('open');
        ov.style.display = sb.classList.contains('open') ? 'block' : 'none';
    }

    if(role === 'owner') document.getElementById('admin-panel').style.display = 'block';

    socket.on('updateUserList', (users) => {
        const list = document.getElementById('online-list');
        list.innerHTML = users.map(u => `<div style="padding:8px; margin-bottom:5px; background:rgba(255,255,255,0.05); border-radius:8px;">
            ${u.gender==='Female'?'👩':'👨'} <span style="color:${u.role==='owner'?'#fbbf24':'white'}">${u.username}</span>
        </div>`).join('');
    });

    socket.on('newMessage', (data) => {
        const div = document.createElement('div');
        div.className = `msg ${data.user === username ? 'me' : 'other'}`;
        div.innerHTML = `<span class="owner-tag">${data.role==='owner'?'👑 Lord':''}</span>
                         <small style="font-size:10px; opacity:0.8;">${data.user}</small><br>${data.text}`;
        const sc = document.getElementById('chat-scroller');
        sc.appendChild(div);
        sc.scrollTop = sc.scrollHeight;
    });

    function send() {
        const input = document.getElementById('msgIn');
        if(input.value.trim()) {
            socket.emit('sendMessage', { message: input.value, to: 'all' });
            input.value = '';
        }
    }

    socket.on('clearScreen', () => { document.getElementById('chat-scroller').innerHTML = ''; });
    document.getElementById('msgIn').addEventListener('keypress', (e) => { if(e.key === 'Enter') send(); });
</script>
</body>
</html>
