<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tulip Chat</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
height:100vh;
display:flex;
flex-direction:column;
background:#f5d9e0;
overflow:hidden;
}

/* HEADER */

#header{
height:50px;
background:#ff2f6e;
color:white;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 10px;
font-size:18px;
}

#header button{
margin-left:6px;
}

/* MAIN */

#main{
flex:1;
display:flex;
}

/* CHAT */

#chatSection{
width:70%;
display:flex;
flex-direction:column;
border-right:1px solid #ccc;
}

#chat{
flex:1;
overflow-y:auto;
padding:10px;
display:flex;
flex-direction:column;
gap:8px;
}

/* MESSAGE */

.msg{
background:#ff2f6e;
color:white;
padding:10px;
border-radius:12px;
max-width:75%;
}

.msg img{
max-width:200px;
margin-top:6px;
border-radius:10px;
}

/* INPUT */

#inputBar{
height:60px;
display:flex;
gap:6px;
padding:6px;
background:white;
border-top:1px solid #ccc;
}

#text{
flex:1;
padding:8px;
border-radius:20px;
border:1px solid #ccc;
}

/* USERS */

#usersSection{
width:30%;
background:white;
display:flex;
flex-direction:column;
}

#usersHeader{
padding:10px;
background:#eee;
font-weight:bold;
}

#onlineList{
flex:1;
overflow-y:auto;
}

.userItem{
padding:8px;
border-bottom:1px solid #eee;
display:flex;
align-items:center;
gap:6px;
cursor:pointer;
}

/* PROFILE */

.avatar{
width:28px;
height:28px;
border-radius:50%;
object-fit:cover;
}

/* DM */

#dmBox{
position:fixed;
bottom:70px;
right:20px;
width:280px;
height:320px;
background:white;
border:1px solid #ccc;
display:none;
flex-direction:column;
}

#dmMessages{
flex:1;
overflow:auto;
padding:8px;
}

#dmInput{
display:flex;
border-top:1px solid #ccc;
}

#dmText{
flex:1;
padding:6px;
border:none;
}

/* FRIEND REQUEST */

#friendRequests{
position:fixed;
top:60px;
right:20px;
width:250px;
background:white;
border:1px solid #ccc;
display:none;
}

.request{
padding:8px;
border-bottom:1px solid #eee;
}

</style>

</head>

<body>

<div id="header">

<div>🌷 Tulip Chat</div>

<div>

<button onclick="openInbox()">📥</button>

<button onclick="clearChat()">🧹</button>

<button onclick="location.reload()">🔄</button>

</div>

</div>

<div id="main">

<div id="chatSection">

<div id="chat"></div>

<div id="inputBar">

<input id="text" placeholder="Type message">

<button onclick="send()">Send</button>

<input type="file" id="file" hidden accept="image/*,.gif">

<button onclick="upload()">📷</button>

<span id="progress"></span>

</div>

</div>

<div id="usersSection">

<div id="usersHeader">Online Users</div>

<div id="onlineList"></div>

</div>

</div>

<!-- DM BOX -->

<div id="dmBox">

<div style="background:#ff2f6e;color:white;padding:6px">
DM Chat
<button onclick="closeDM()" style="float:right">X</button>
</div>

<div id="dmMessages"></div>

<div id="dmInput">

<input id="dmText">

<button onclick="sendDM()">Send</button>

</div>

</div>

<!-- FRIEND REQUESTS -->

<div id="friendRequests"></div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io()

let username = localStorage.getItem("username")
let gender = localStorage.getItem("gender")
let role = localStorage.getItem("role")

let avatar = localStorage.getItem("avatar")

if(!avatar){
avatar="https://i.imgur.com/7k12EPD.png"
}

/* BADGE */

function badge(r){

if(r==="owner") return "👑"

if(r==="superadmin") return "⭐"

return "👤"

}

/* JOIN */

socket.emit("join",{

username,
gender,
role,
avatar

})

/* SEND MESSAGE */

function send(){

let msg=text.value.trim()

if(!msg) return

socket.emit("message",{

username,
gender,
role,
avatar,
msg

})

text.value=""

}

/* RECEIVE */

socket.on("message",(d)=>{

let div=document.createElement("div")

div.className="msg"

if(d.msg.includes("/uploads")){

div.innerHTML=badge(d.role)+" "+d.username+"<br><img src='"+d.msg+"'>"

}else{

div.innerText=badge(d.role)+" "+d.username+": "+d.msg

}

chat.appendChild(div)

chat.scrollTop=chat.scrollHeight

})

/* UPLOAD */

function upload(){

file.click()

}

file.onchange=()=>{

let f=file.files[0]

let fd=new FormData()

fd.append("file",f)

let xhr=new XMLHttpRequest()

xhr.open("POST","/upload")

xhr.upload.onprogress=(e)=>{

let p=Math.round((e.loaded/e.total)*100)

progress.innerText=p+"%"

}

xhr.onload=()=>{

let res=JSON.parse(xhr.responseText)

socket.emit("message",{

username,
gender,
role,
avatar,
msg:res.url

})

progress.innerText=""

}

xhr.send(fd)

}

/* CLEAR */

function clearChat(){

socket.emit("message",{

username,
gender,
role,
msg:"/clear"

})

}

socket.on("clearChat",()=>{

chat.innerHTML=""

})

/* ONLINE USERS */

socket.on("onlineUsers",(users)=>{

onlineList.innerHTML=""

users.forEach(u=>{

let div=document.createElement("div")

div.className="userItem"

div.innerHTML=
"<img class='avatar' src='"+u.avatar+"'>"+
badge(u.role)+" "+u.username

div.onclick=()=>openDM(u.username)

onlineList.appendChild(div)

})

})

/* DM */

let currentDM=""

function openDM(user){

currentDM=user

dmBox.style.display="flex"

}

function closeDM(){

dmBox.style.display="none"

}

function sendDM(){

let msg=dmText.value

socket.emit("dm",{

from:username,
to:currentDM,
msg

})

dmText.value=""

}

socket.on("dm",(d)=>{

let div=document.createElement("div")

div.innerText=d.from+": "+d.msg

dmMessages.appendChild(div)

})

/* FRIEND REQUEST */

function sendFriend(user){

socket.emit("friendRequest",{

from:username,
to:user

})

}

socket.on("friendRequest",(d)=>{

let div=document.createElement("div")

div.className="request"

div.innerHTML=
d.from+" wants to add friend"+
"<button onclick='acceptFriend(\""+d.from+"\")'>Accept</button>"

friendRequests.appendChild(div)

})

function openInbox(){

friendRequests.style.display="block"

}

function acceptFriend(user){

alert("You are now friends with "+user)

}

</script>

</body>

  </html>
