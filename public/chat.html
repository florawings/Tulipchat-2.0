<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Tulip Chat</title>

<style>

body{
margin:0;
font-family:Arial;
background:#ececec;
}

.topbar{
background:black;
color:white;
padding:12px;
display:flex;
justify-content:space-between;
align-items:center;
}

.menu{
position:fixed;
left:-260px;
top:0;
width:260px;
height:100%;
background:white;
transition:0.3s;
z-index:10;
}

.menu.show{
left:0;
}

.menu div{
padding:15px;
border-bottom:1px solid #eee;
cursor:pointer;
}

.users{
position:fixed;
right:-220px;
top:0;
width:220px;
height:100%;
background:#111;
color:white;
transition:0.3s;
}

.users.show{
right:0;
}

.userItem{
padding:10px;
border-bottom:1px solid #333;
cursor:pointer;
}

.chat{
height:70vh;
overflow:auto;
padding:10px;
}

.msg{
background:white;
padding:8px;
margin-bottom:6px;
border-radius:5px;
}

.inputbar{
display:flex;
padding:8px;
background:white;
position:fixed;
bottom:0;
width:100%;
}

.inputbar input{
flex:1;
padding:10px;
}

.inputbar button{
padding:10px;
margin-left:4px;
}

.panel{
position:fixed;
bottom:120px;
left:10px;
background:white;
padding:10px;
border:1px solid #ccc;
display:none;
}

</style>

</head>

<body>

<div class="topbar">

<div onclick="toggleMenu()">☰</div>

<div>🌷 Tulip Chat</div>

<div onclick="toggleUsers()">👥</div>

</div>

<!-- MENU -->

<div class="menu" id="menu">

<div onclick="joinRoom('public')">🌐 Public Chat</div>

<div onclick="createRoom()">➕ Create Room</div>

<div onclick="showCoins()">🪙 My Coins</div>

<div onclick="closeMenu()">❌ Close</div>

</div>

<!-- USERS -->

<div class="users" id="users">

<h3 style="padding:10px">Online</h3>

<div id="userList"></div>

</div>

<!-- CHAT -->

<div class="chat" id="chat"></div>

<!-- INPUT -->

<div class="inputbar">

<input id="msgInput" placeholder="Type message">

<button onclick="sendMsg()">Send</button>

<button onclick="sendImage()">📷</button>

<button onclick="sendGif()">GIF</button>

</div>

<!-- OWNER PANEL -->

<div class="panel" id="ownerPanel">

<b>Owner Panel</b>

<br><br>

<button onclick="kickUser()">Kick</button>

<button onclick="banUser()">Ban</button>

<button onclick="muteUser()">Mute</button>

<button onclick="createRoom()">Create Room</button>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io()

let username = localStorage.getItem("name")

let role = "guest"

let isOwner = false

if(!username){

username = prompt("Enter username")

localStorage.setItem("name",username)

}

/* OWNER LOGIN */

if(username === "Lord_lucifer"){

let p = prompt("Owner password")

if(p === "766521"){

isOwner = true

role = "owner"

document.getElementById("ownerPanel").style.display="block"

}

}

let room="public"

let users=["Rahul","Neha","Aman"]

socket.emit("joinRoom",{room:room})

/* MENU */

function toggleMenu(){

document.getElementById("menu").classList.toggle("show")

}

function closeMenu(){

document.getElementById("menu").classList.remove("show")

}

/* USERS */

function toggleUsers(){

document.getElementById("users").classList.toggle("show")

}

/* MESSAGE */

function sendMsg(){

let text=msgInput.value

if(!text) return

socket.emit("chatMessage",{

username:username,
room:room,
message:text

})

msgInput.value=""

}

/* RECEIVE */

socket.on("message",(data)=>{

addMsg(data.username+": "+data.message)

})

/* IMAGE */

function sendImage(){

let url=prompt("Image URL")

socket.emit("chatMessage",{

username:username,
room:room,
message:"<img src='"+url+"' width='200'>"

})

}

/* GIF */

function sendGif(){

let url=prompt("GIF URL")

socket.emit("chatMessage",{

username:username,
room:room,
message:"<img src='"+url+"' width='200'>"

})

}

/* ADD MESSAGE */

function addMsg(text){

chat.innerHTML+=`

<div class="msg">

${text}

<br>

<button onclick="deleteMsg(this)">Delete</button>

<button onclick="reportMsg()">Report</button>

</div>

`

chat.scrollTop=chat.scrollHeight

}

/* DELETE */

function deleteMsg(btn){

btn.parentElement.remove()

}

/* REPORT */

function reportMsg(){

alert("Message reported")

}

/* ROOMS */

function createRoom(){

let r=prompt("Room name")

alert("Room '"+r+"' created")

}

/* OWNER TOOLS */

function kickUser(){

if(!isOwner) return alert("Owner only")

let u=prompt("User to kick")

socket.emit("ownerKick",u)

}

function banUser(){

if(!isOwner) return alert("Owner only")

let u=prompt("User to ban")

socket.emit("ownerBan",u)

}

function muteUser(){

if(!isOwner) return alert("Owner only")

let u=prompt("User to mute")

socket.emit("ownerMute",u)

}

/* USERS LIST */

function refreshUsers(){

let html=""

users.forEach(u=>{

html+=`<div class="userItem">${u}</div>`

})

userList.innerHTML=html

}

refreshUsers()

/* COINS */

function showCoins(){

alert("TulipCoins coming soon")

}

</script>

</body>
</html>
