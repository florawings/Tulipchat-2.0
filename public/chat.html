<!DOCTYPE html><html>
<head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tulip Chat</title><style>

*{box-sizing:border-box;}

body{
margin:0;
font-family:Arial;
height:100vh;
display:flex;
background:#0f0f0f;
color:white;
overflow:hidden;
}

/* sidebar */

#sidebar{
width:230px;
background:black;
padding:15px;
transition:0.3s;
}

#sidebar.hide{
margin-left:-230px;
}

#sidebar h2{
color:#ff4da6;
margin-top:0;
}

.room{
padding:10px;
margin-bottom:8px;
background:#111;
border-radius:6px;
cursor:pointer;
}

.room:hover{
background:#222;
}

/* top bar */

#topbar{
height:45px;
background:#111;
display:flex;
align-items:center;
padding:0 10px;
}

#menu{
font-size:22px;
cursor:pointer;
margin-right:10px;
}

/* chat */

#chat{
flex:1;
display:flex;
flex-direction:column;
background:url("https://images.unsplash.com/photo-1518199266791-5375a83190b7") center/cover;
}

/* messages */

#messages{
flex:1;
overflow-y:auto;
padding:15px;
}

.msg{
background:rgba(0,0,0,0.6);
padding:10px;
border-radius:10px;
margin-bottom:10px;
max-width:70%;
}

.msg img{
max-width:200px;
border-radius:10px;
}

.msg video{
max-width:220px;
border-radius:10px;
}

/* typing */

#typing{
font-size:12px;
color:#ccc;
padding-left:15px;
}

/* input bar */

#inputBar{
display:flex;
padding:10px;
background:black;
}

#text{
flex:1;
padding:10px;
border:none;
border-radius:20px;
outline:none;
}

button{
margin-left:6px;
padding:10px;
border:none;
border-radius:8px;
background:#ff4da6;
color:white;
cursor:pointer;
}

/* dm */

#dmBox{
position:fixed;
right:20px;
bottom:20px;
width:260px;
background:#111;
border-radius:10px;
display:none;
flex-direction:column;
}

#dmHeader{
background:#ff4da6;
padding:10px;
}

#dmMessages{
height:200px;
overflow:auto;
padding:10px;
}

#dmInput{
display:flex;
padding:10px;
}

#dmText{
flex:1;
padding:8px;
border:none;
border-radius:10px;
}

/* emoji */

#emojiBox{
position:absolute;
bottom:60px;
background:#222;
padding:10px;
border-radius:10px;
display:none;
}

#emojiBox span{
font-size:20px;
cursor:pointer;
margin:3px;
}

</style></head><body><div id="sidebar"><h2>Tulip Chat</h2><div class="room" onclick="joinRoom('normal')">Normal Room</div><div class="room" onclick="joinRoom('adult')">Adult Room</div><h3>Online Users</h3><div id="online"></div></div><div id="chat"><div id="topbar"><span id="menu" onclick="toggleMenu()">☰</span>

<span id="roomName">Normal Room</span>

</div><div id="messages"></div><div id="typing"></div><div id="inputBar"><input id="text" placeholder="Type message"><button onclick="sendMsg()">Send</button>

<button onclick="toggleEmoji()">😊</button>

<button onclick="sendGif()">GIF</button>

<input type="file" id="file"><span id="progress"></span>

</div></div><div id="emojiBox"><span onclick="emoji('😀')">😀</span>
<span onclick="emoji('❤️')">❤️</span>
<span onclick="emoji('🔥')">🔥</span>
<span onclick="emoji('😂')">😂</span>
<span onclick="emoji('😍')">😍</span>

</div><div id="dmBox"><div id="dmHeader">DM</div><div id="dmMessages"></div><div id="dmInput"><input id="dmText"><button onclick="sendDM()">Send</button>

</div></div><script src="/socket.io/socket.io.js"></script><script src="client.js"></script><script>

function toggleMenu(){
document.getElementById("sidebar").classList.toggle("hide")
}

function toggleEmoji(){
let box=document.getElementById("emojiBox")
box.style.display=box.style.display==="block"?"none":"block"
}

function emoji(e){
document.getElementById("text").value+=e
}

function sendGif(){

let url=prompt("Paste GIF link")

socket.emit("message",{
room:room,
user:username,
msg:"<img src='"+url+"'>"
})

}

</script></body>
  </html>
