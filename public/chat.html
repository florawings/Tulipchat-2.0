<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Tulip Chat</title>

<style>

body{
margin:0;
font-family:Arial;
background:#eee;
}

header{
background:#ff2d7a;
color:white;
padding:12px;
display:flex;
justify-content:space-between;
}

#chat{
height:72vh;
overflow:auto;
padding:10px;
}

.msg{
background:white;
padding:10px;
margin:6px;
border-radius:6px;
}

.system{
background:#ddd;
}

.bottom{
position:fixed;
bottom:0;
left:0;
right:0;
display:flex;
}

.bottom input{
flex:1;
padding:12px;
border:none;
}

button{
border:none;
padding:12px;
background:#ff2d7a;
color:white;
}

img{
max-width:220px;
border-radius:6px;
}

</style>

</head>

<body>

<header>

<span>🌷 Tulip Chat</span>

<button onclick="logout()">Logout</button>

</header>

<div id="chat"></div>

<div class="bottom">

<input id="msg" placeholder="message">

<button onclick="send()">Send</button>

<input type="file" id="imageInput" hidden accept="image/*">
<button onclick="openGallery()">📷</button>

<input type="file" id="gifInput" hidden accept="image/gif">
<button onclick="openGif()">GIF</button>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io()

const chat = document.getElementById("chat")

const msg = document.getElementById("msg")

let name = localStorage.getItem("name")

if(!name){

name = prompt("Enter name")

localStorage.setItem("name",name)

}

socket.emit("join",{name})

let uploadMsg=null

/* send text */

function send(){

if(!msg.value) return

socket.emit("message",{name,text:msg.value})

msg.value=""

}

/* history */

socket.on("history",(data)=>{

chat.innerHTML=""

data.forEach(m=>{

if(m.system){

addMsg(m.text,true)

}

else if(m.text){

addMsg(m.name+": "+m.text)

}

else if(m.image){

addImage(m.name,m.image)

}

})

})

/* live events */

socket.on("message",(data)=>{

addMsg(data.name+": "+data.text)

})

socket.on("system",(text)=>{

addMsg(text,true)

})

socket.on("image",(data)=>{

addImage(data.name,data.url)

})

/* open gallery */

function openGallery(){

document.getElementById("imageInput").click()

}

function openGif(){

document.getElementById("gifInput").click()

}

imageInput.onchange=function(){

uploadFile(this.files[0],"Image")

}

gifInput.onchange=function(){

uploadFile(this.files[0],"GIF")

}

/* upload */

function uploadFile(file,type){

let formData=new FormData()

formData.append("file",file)

let xhr=new XMLHttpRequest()

xhr.open("POST","/upload",true)

xhr.upload.onprogress=function(e){

let percent=Math.round((e.loaded/e.total)*100)

if(!uploadMsg){

uploadMsg=document.createElement("div")

uploadMsg.className="msg system"

chat.appendChild(uploadMsg)

}

uploadMsg.innerText="Uploading "+type+" "+percent+"%"

}

xhr.onload=function(){

let data=JSON.parse(xhr.responseText)

uploadMsg.remove()

uploadMsg=null

socket.emit("image",{
name:name,
url:data.url
})

}

xhr.send(formData)

}

/* logout */

function logout(){

localStorage.clear()

location.reload()

}

/* ui */

function addMsg(text,system){

let div=document.createElement("div")

div.className="msg"

if(system) div.className+=" system"

div.innerText=text

chat.appendChild(div)

chat.scrollTop=chat.scrollHeight

}

function addImage(user,url){

let div=document.createElement("div")

div.className="msg"

div.innerHTML=user+"<br><img src='"+url+"'>"

chat.appendChild(div)

chat.scrollTop=chat.scrollHeight

}

</script>

</body>

</html>
