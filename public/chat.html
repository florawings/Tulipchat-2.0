<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tulip Chat</title>

<style>

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#0f1022;
font-family:Arial;
color:white;
}

.box{
background:#1e1f38;
padding:30px;
border-radius:12px;
width:260px;
text-align:center;
}

input{
width:100%;
padding:10px;
margin-bottom:10px;
border:none;
border-radius:6px;
}

button{
width:100%;
padding:10px;
border:none;
border-radius:6px;
background:#4a7cff;
color:white;
cursor:pointer;
margin-bottom:8px;
}

.small{
font-size:12px;
color:#aaa;
}

</style>

</head>

<body>

<div class="box">

<h2>Tulip Chat</h2>

<input id="username" placeholder="Username">

<input id="email" placeholder="Email (optional)">

<input id="password" type="password" placeholder="Password (optional)">

<button onclick="login()">Login</button>

<button onclick="register()">Register</button>

<button onclick="guestLogin()">Guest Login</button>

<div class="small">
Guest login requires only username
</div>

</div>


<script>

function login(){

let name=document.getElementById("username").value
let email=document.getElementById("email").value

if(!name){
alert("Enter username")
return
}

localStorage.setItem("username",name)
localStorage.setItem("email",email)

window.location="chat.html"

}

function register(){

let name=document.getElementById("username").value
let email=document.getElementById("email").value
let pass=document.getElementById("password").value

if(!name || !email || !pass){
alert("Fill all fields")
return
}

let user={
name:name,
email:email,
password:pass
}

localStorage.setItem("userAccount",JSON.stringify(user))

alert("Registration successful")

localStorage.setItem("username",name)

window.location="chat.html"

}

function guestLogin(){

let name=document.getElementById("username").value

if(!name){
alert("Enter guest name")
return
}

localStorage.setItem("username","Guest-"+name)

window.location="chat.html"

}

</script>

</body>
</html>
