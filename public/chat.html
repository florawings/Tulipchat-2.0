<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Tulip Chat</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f2f2f2;
}

header{
background:#ff2d7a;
color:white;
padding:12px;
font-size:18px;
}

#chat{
height:70vh;
overflow:auto;
padding:10px;
}

.msg{
background:white;
padding:10px;
margin:6px 0;
border-radius:6px;
}

img{
max-width:200px;
border-radius:8px;
}

.bottom{
position:fixed;
bottom:0;
width:100%;
display:flex;
background:white;
border-top:1px solid #ccc;
}

.bottom input{
flex:1;
padding:12px;
border:none;
}

button{
border:none;
padding:12px;
background:#ff2d7a;
color:white;
}

#progress{
height:4px;
background:green;
width:0%;
}

#gifPanel{
position:fixed;
bottom:60px;
left:0;
right:0;
height:300px;
background:white;
overflow:auto;
display:none;
padding:10px;
}

#gifPanel img{
width:100px;
margin:5px;
cursor:pointer;
}

</style>

</head>

<body>

<header>🌷 Tulip Chat</header>

<div id="progress"></div>

<div id="chat"></div>

<div id="gifPanel">

<input id="gifSearch" placeholder="search gif">

<button onclick="searchGIF()">Search</button>

<div id="gifResults"></div>

</div>

<div class="bottom">

<input id="msg" placeholder="message">

<button onclick="send()">Send</button>

<input type="file" id="file" hidden>

<button onclick="upload()">📷</button>

<button onclick="toggleGIF()">GIF</button>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io()

let name = localStorage.getItem("name")

if(!name){
name = prompt("Enter name")
localStorage.setItem("name",name)
}

socket.emit("join",name)

socket.on("message",(data)=>{

addText(data.name+": "+data.text)

})

socket.on("image",(data)=>{

addImage(data.name,data.url)

})

socket.on("gif",(data)=>{

addImage(data.name,data.url)

})

function send(){

let text = msg.value

socket.emit("message",{

name:name,
text:text

})

msg.value=""

}

function upload(){

file.click()

}

file.onchange=function(){

let reader = new FileReader()

reader.onprogress=function(e){

let percent = Math.round((e.loaded/e.total)*100)

progress.style.width = percent+"%"

}

reader.onload=function(){

socket.emit("image",{

name:name,
url:reader.result

})

progress.style.width="0%"

}

reader.readAsDataURL(file.files[0])

}

function toggleGIF
