<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tulip Chat</title>

<style>

body{
margin:0;
font-family:Arial;
background:#e6e6e6;
height:100vh;
display:flex;
flex-direction:column;
}

/* TOP BAR */

.topbar{
background:black;
color:white;
padding:12px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:18px;
font-weight:bold;
}

/* CHAT AREA */

.chat{
flex:1;
overflow-y:auto;
padding:10px;
}

.msg{
margin-bottom:15px;
}

.bubble{
background:white;
padding:10px;
border-radius:8px;
max-width:80%;
}

/* INPUT AREA */

.inputbar{
display:flex;
align-items:center;
background:white;
padding:8px;
}

.inputbar input{
flex:1;
padding:10px;
border-radius:20px;
border:1px solid #ccc;
margin:0 5px;
}

.btn{
font-size:20px;
cursor:pointer;
margin:0 5px;
}

</style>

</head>

<body>

<div class="topbar">

<div>☰</div>
<div class="logo">🌷 Tulip Chat</div>
<div>🔔</div>

</div>



<div class="chat" id="chat"></div>



<div class="inputbar">

<span class="btn" onclick="uploadImage()">🖼</span>

<span class="btn" onclick="sendGIF()">🎞</span>

<span class="btn" onclick="youtube()">▶</span>

<span class="btn" onclick="uploadVideo()">🎥</span>

<input id="msgInput" placeholder="Type message...">

<span class="btn" onclick="sendMsg()">➤</span>

</div>


<input type="file" id="imgFile" accept="image/*" style="display:none">

<input type="file" id="videoFile" accept="video/*" style="display:none">


<script>

/* TEXT MESSAGE */

function sendMsg(){

let input=document.getElementById("msgInput")

if(input.value=="") return

let chat=document.getElementById("chat")

chat.innerHTML+=`
<div class="msg">
<div class="bubble">${input.value}</div>
</div>
`

input.value=""

chat.scrollTop=chat.scrollHeight

}



/* IMAGE SHARE */

function uploadImage(){

let file=document.getElementById("imgFile")

file.click()

file.onchange=function(){

let reader=new FileReader()

reader.onload=function(e){

let chat=document.getElementById("chat")

chat.innerHTML+=`
<div class="msg">
<img src="${e.target.result}" width="200">
</div>
`

}

reader.readAsDataURL(file.files[0])

}

}



/* GIF SHARE */

function sendGIF(){

let url=prompt("Paste GIF URL")

if(!url) return

let chat=document.getElementById("chat")

chat.innerHTML+=`
<div class="msg">
<img src="${url}" width="200">
</div>
`

}



/* YOUTUBE VIDEO */

function youtube(){

let link=prompt("Paste YouTube link")

if(!link) return

let id=link.split("v=")[1]

let embed="https://www.youtube.com/embed/"+id

let chat=document.getElementById("chat")

chat.innerHTML+=`
<iframe width="250" height="150"
src="${embed}"
frameborder="0"
allowfullscreen>
</iframe>
`

}



/* VIDEO SHARE */

function uploadVideo(){

let file=document.getElementById("videoFile")

file.click()

file.onchange=function(){

let url=URL.createObjectURL(file.files[0])

let chat=document.getElementById("chat")

chat.innerHTML+=`
<video width="250" controls>
<source src="${url}">
</video>
`

}

}

</script>

</body>
</html>
