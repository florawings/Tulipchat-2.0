<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tulip Pro | Ultimate</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #f43f5e;
            --owner-gold: #fbbf24;
            --glass: rgba(15, 23, 42, 0.8);
            --text: #f8fafc;
        }

        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            /* Dynamic Background Fix */
            background: #000 url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1200') no-repeat center center fixed;
            background-size: cover;
            overflow: hidden;
            color: var(--text);
        }

        /* --- GLOSSY HEADER --- */
        header {
            height: 65px;
            background: var(--glass);
            backdrop-filter: blur(15px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            border-bottom: 1px solid rgba(244, 63, 94, 0.3);
            z-index: 1000;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .brand { font-weight: 600; font-size: 20px; letter-spacing: 1px; text-shadow: 0 0 10px rgba(244,63,94,0.5); }
        .brand span { color: var(--primary); }

        /* --- PREMIUM SIDEBAR --- */
        #sidebar {
            position: fixed;
            left: -100%;
            width: 80%;
            max-width: 320px;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(25px);
            transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2000;
            padding: 25px;
            box-shadow: 15px 0 50px rgba(0,0,0,0.8);
            border-right: 1px solid rgba(244, 63, 94, 0.2);
        }
        #sidebar.open { left: 0; }

        .user-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            transition: 0.3s;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .user-item:active { transform: scale(0.95); background: rgba(244, 63, 94, 0.2); }
        .user-item.is-owner { border-left: 4px solid var(--owner-gold); background: rgba(251, 191, 36, 0.1); }

        /* --- CHAT AREA --- */
        #chat-scroller {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: rgba(0,0,0,0.3);
            scroll-behavior: smooth;
        }

        .msg {
            max-width: 85%;
            padding: 12px 18px;
            border-radius: 20px;
            position: relative;
            animation: fadeIn 0.3s ease;
            backdrop-filter: blur(5px);
            font-size: 15px;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .msg.me {
            align-self: flex-end;
            background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(244, 63, 94, 0.3);
        }

        .msg.other {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.12);
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .msg.dm { border: 2px dashed var(--owner-gold); }

        .u-name { font-size: 11px; font-weight: 600; margin-bottom: 5px; display: block; }
        .u-name.owner { color: var(--owner-gold); text-shadow: 0 0 5px rgba(251,191,36,0.5); }

        /* --- INPUT AREA --- */
        .input-wrap {
            padding: 15px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            display: flex;
            gap: 12px;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        #msgIn {
            flex: 1;
            padding: 14px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05);
            color: white;
            outline: none;
            font-size: 15px;
        }

        #sendBtn {
            background: var(--primary);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            color: white;
            font-size: 22px;
            box-shadow: 0 4px 15px rgba(244, 63, 94, 0.4);
        }

        /* --- NOTIFICATIONS & OVERLAY --- */
        #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1500; }
        .dm-alert { background: var(--owner-gold); color: black; padding: 2px 8px; border-radius: 5px; font-size: 10px; margin-left: 5px; }
    </style>
</head>
<body>

<div id="overlay" onclick="toggleSidebar()"></div>

<div id="sidebar">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
        <h2 style="color:var(--primary); margin:0;">Active Soul</h2>
        <span onclick="toggleSidebar()" style="font-size:35px; cursor:pointer;">&times;</span>
    </div>
    <div id="online-list"></div>
    <div style="position:absolute; bottom:30px; width:calc(100% - 50px);">
        <button onclick="location.href='index.html'" style="width:100%; padding:15px; background:rgba(239,68,68,0.2); border:1px solid #ef4444; color:#ef4444; border-radius:12px; font-weight:600;">🚪 LOGOUT</button>
    </div>
</div>

<header>
    <div onclick="toggleSidebar()" style="font-size:26px; cursor:pointer;">☰</div>
    <div class="brand">TULIP <span>PRO</span></div>
    <div id="dm-status" style="font-size:12px; color:var(--owner-gold); font-weight:bold;">Public Room</div>
</header>

<div id="chat-scroller"></div>

<div class="input-area">
    <div class="input-wrap">
        <input type="text" id="msgIn" placeholder="Type a message..." autocomplete="off">
        <button id="sendBtn" onclick="send()">🚀</button>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    const urlParams = new URLSearchParams(window.location.search);
    const username = urlParams.get('username') || "Guest";
    const gender = urlParams.get('gender') || "Male";
    const role = urlParams.get('role') || "user";
    
    let selectedUser = 'all';

    socket.emit('join', { username, gender, role });

    function toggleSidebar() {
        const sb = document.getElementById('sidebar');
        const ov = document.getElementById('overlay');
        sb.classList.toggle('open');
        ov.style.display = sb.classList.contains('open') ? 'block' : 'none';
    }

    // --- DM LOGIC ---
    function startDM(targetUser) {
        if(targetUser === username) {
            selectedUser = 'all';
            document.getElementById('dm-status').innerText = "Public Room";
            document.getElementById('msgIn').placeholder = "Type a message...";
        } else {
            selectedUser = targetUser;
            document.getElementById('dm-status').innerText = "DM: " + targetUser;
            document.getElementById('msgIn').placeholder = "Private message to " + targetUser + "...";
        }
        toggleSidebar();
    }

    // --- RENDER USERS ---
    socket.on('updateUserList', (users) => {
        const list = document.getElementById('online-list');
        list.innerHTML = users.map(u => `
            <div class="user-item ${u.role === 'owner' ? 'is-owner' : ''}" onclick="startDM('${u.username}')">
                <span style="font-size:24px;">${u.gender === 'Female' ? '👩' : '👨'}</span>
                <div style="display:flex; flex-direction:column;">
                    <span style="font-weight:600; color:${u.role === 'owner' ? 'var(--owner-gold)' : 'white'}">
                        ${u.username} ${u.role === 'owner' ? '👑' : ''}
                    </span>
                    <span style="font-size:10px; color:#22c55e;">● Online</span>
                </div>
            </div>
        `).join('') + `<div class="user-item" onclick="startDM('${username}')" style="margin-top:20px; opacity:0.6;">🌍 Public Room</div>`;
    });

    // --- CHAT LOGIC ---
    socket.on('newMessage', (data) => {
        const div = document.createElement('div');
        const isMe = data.user === username;
        const isDM = data.to !== 'all';
        
        div.className = `msg ${isMe ? 'me' : 'other'} ${isDM ? 'dm' : ''}`;
        
        const nameClass = data.role === 'owner' ? 'u-name owner' : 'u-name';
        const icon = data.gender === 'Female' ? '👩' : '👨';
        const dmTag = isDM ? '<span class="dm-alert">PRIVATE</span>' : '';

        div.innerHTML = `
            <span class="${nameClass}">${icon} ${data.user} ${dmTag}</span>
            <div>${data.text}</div>
        `;
        
        const box = document.getElementById('chat-scroller');
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    });

    socket.on('clearScreen', () => {
        document.getElementById('chat-scroller').innerHTML = '<div style="text-align:center; padding:20px; color:rgba(255,255,255,0.4)">✨ Room cleared by Owner</div>';
    });

    function send() {
        const input = document.getElementById('msgIn');
        const val = input.value.trim();
        
        if(!val) return;

        // Owner Special Command
        if(val === '/clear' && role === 'owner') {
            socket.emit('adminClear');
            input.value = '';
            return;
        }

        socket.emit('sendMessage', { 
            message: val, 
            to: selectedUser 
        });
        input.value = '';
    }

    document.getElementById('msgIn').addEventListener('keypress', (e) => { if(e.key === 'Enter') send(); });
</script>
</body>
</html>
