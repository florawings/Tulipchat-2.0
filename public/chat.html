<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<style>

body{
font-family:sans-serif;
margin:0;
}

.header{
background:black;
color:white;
padding:10px;
text-align:center;
}

.chat{
height:70vh;
overflow:auto;
padding:10px;
background:#eee;
}

</style>

</head>

<body>

<div class="header">

🌷 Tulip Chat

</div>

<div id="chat" class="chat"></div>

<input id="text" placeholder="Type message">

<button onclick="send()">Send</button>

<script>

let user = localStorage.getItem("user")

async function send(){

let msg=text.value

await fetch("/send",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
user,
msg
})

})

text.value=""

}

async function load(){

let r = await fetch("/messages")

let data = await r.json()

chat.innerHTML=""

data.forEach(m=>{

let div=document.createElement("div")

div.innerHTML="<b>"+m.user+":</b> "+m.msg

chat.appendChild(div)

})

}

setInterval(load,2000)

</script>

</body>

</html>
