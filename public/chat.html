<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<style>

body{
margin:0;
font-family:sans-serif;
}

.header{
background:black;
color:white;
padding:10px;
display:flex;
justify-content:space-between;
}

.chat{
height:70vh;
overflow:auto;
background:#eee;
padding:10px;
}

input{
width:75%;
padding:10px;
}

button{
padding:10px;
}

</style>

</head>

<body>

<div class="header">

<span onclick="menu()">☰</span>

<span>🌷 Tulip Chat</span>

<div>

<span onclick="privateMsg()">💬</span>
<span onclick="users()">👥</span>
<span onclick="bell()">🔔</span>

</div>

</div>

<div id="chat" class="chat"></div>

<input id="text" placeholder="Type message">

<button onclick="send()">Send</button>

<script>

let user=localStorage.getItem("user")

async function send(){

let msg=text.value

await fetch("/send",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
user,msg
})

})

text.value=""

}

async function load(){

let r=await fetch("/messages")

let data=await r.json()

chat.innerHTML=""

data.forEach(m=>{

let div=document.createElement("div")

div.innerHTML="<b>"+m.user+":</b> "+m.msg

chat.appendChild(div)

})

}

setInterval(load,2000)

function privateMsg(){

let to=prompt("Send message to:")

let msg=prompt("Message:")

fetch("/private",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
from:user,
to,
msg
})

})

}

function bell(){

fetch("/notifications/"+user)

.then(r=>r.json())

.then(data=>{

if(data.length==0){
alert("No notifications")
return
}

let txt="Notifications:\n"

data.forEach(n=>{
txt+=n.text+"\n"
})

alert(txt)

})

}

function users(){

alert("Online users system next update")

}

function menu(){

let c=prompt("1 Logout")

if(c=="1"){

localStorage.clear()

location="index.html"

}

}

</script>

</body>

</html>
