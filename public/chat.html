<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Tulip Chat</title>

<style>

body{
margin:0;
font-family:sans-serif;
height:100vh;
display:flex;
flex-direction:column;
background:linear-gradient(#ff6a8b,#ff8fab);
}

/* HEADER */

#header{
background:#ff2d5a;
color:white;
padding:10px;
display:flex;
justify-content:space-between;
align-items:center;
}

/* SIDEBAR */

#sidebar{
position:fixed;
left:-200px;
top:0;
width:200px;
height:100%;
background:white;
transition:0.3s;
padding:10px;
}

#sidebar.open{
left:0;
}

/* CHAT */

#chat{
flex:1;
overflow:auto;
padding:10px;
}

/* MESSAGE */

.msg{
background:white;
padding:8px;
border-radius:10px;
margin-bottom:5px;
max-width:70%;
}

/* INPUT */

#sendBox{
display:flex;
gap:5px;
padding:8px;
background:white;
}

#msg{
flex:1;
padding:10px;
border-radius:20px;
border:1px solid #ddd;
}

button{
background:#ff2d5a;
color:white;
border:none;
padding:10px;
border-radius:20px;
}

/* DM */

#dmPopup{
position:fixed;
bottom:70px;
right:10px;
background:white;
padding:10px;
border-radius:10px;
display:none;
}

</style>

</head>

<body>

<div id="header">

<span onclick="toggleMenu()">☰</span>

<span>Tulip Chat</span>

<span id="dmBell" onclick="openDM()">🔔</span>

</div>

<div id="sidebar">

<h3>Online Users</h3>

<div id="onlineUsers"></div>

</div>

<div id="chat"></div>

<div id="sendBox">

<input id="msg">

<button onclick="send()">Send</button>

<input type="file" id="imgFile">

<button onclick="sendImage()">GIF</button>

</div>

<div id="dmPopup">

<input id="dmUser">

<div id="dmMessages"></div>

<input id="dmInput">

<button onclick="sendDM()">Send</button>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="client.js"></script>

<script>

function toggleMenu(){
document.getElementById("sidebar").classList.toggle("open")
}

function openDM(){

const box=document.getElementById("dmPopup")

if(box.style.display==="block"){
box.style.display="none"
}else{
box.style.display="block"
}

}

</script>

</body>

</html>
