<!DOCTYPE html><html>
<head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tulip Chat</title><style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial;
background:#0f0f0f;
color:white;
height:100vh;
display:flex;
}

/* sidebar */

#sidebar{
width:200px;
background:black;
padding:15px;
display:flex;
flex-direction:column;
}

#sidebar h3{
color:#ff4da6;
margin-top:0;
}

.room{
padding:8px;
cursor:pointer;
border-radius:6px;
margin-bottom:6px;
}

.room:hover{
background:#333;
}

/* chat container */

#chat{
flex:1;
display:flex;
flex-direction:column;
height:100vh;
background:url("https://images.unsplash.com/photo-1518199266791-5375a83190b7") center/cover no-repeat;
}

/* messages */

#messages{
flex:1;
overflow-y:auto;
padding:20px;
backdrop-filter:blur(3px);
}

.message{
background:rgba(0,0,0,0.6);
padding:10px;
border-radius:10px;
margin-bottom:10px;
max-width:70%;
}

/* input bar */

#inputBar{
display:flex;
padding:10px;
background:black;
}

#text{
flex:1;
padding:10px;
border:none;
border-radius:20px;
outline:none;
}

button{
margin-left:6px;
padding:10px 15px;
border:none;
border-radius:8px;
background:#ff4da6;
color:white;
cursor:pointer;
}

#file{
margin-left:6px;
}

</style></head><body><div id="sidebar"><h3>Tulip Chat</h3><div class="room">Normal Room</div>
<div class="room">Adult Room</div>
<div class="room">Private Room</div><h4>Online Users</h4><div id="online"></div></div><div id="chat"><div id="messages"></div><div id="inputBar"><input id="text" placeholder="Type message"><button onclick="send()">Send</button>

<input type="file" id="file"></div></div><script src="/socket.io/socket.io.js"></script><script src="client.js"></script></body>
</html>
