<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tulip Chat</title>

<style>

body{
margin:0;
font-family:Arial;
display:flex;
height:100vh;
background:#f1f1f1;
}

#users{
width:28%;
background:black;
color:white;
padding:10px;
overflow:auto;
}

#users div{
padding:8px;
border-bottom:1px solid #444;
cursor:pointer;
}

#chatbox{
flex:1;
display:flex;
flex-direction:column;
}

header{
background:#ff2d7a;
color:white;
padding:12px;
font-size:18px;
}

#chat{
flex:1;
overflow:auto;
padding:10px;
display:flex;
flex-direction:column;
}

.msg{
max-width:70%;
padding:10px;
margin:6px;
border-radius:10px;
}

.me{
background:#ff2d7a;
color:white;
align-self:flex-end;
}

.other{
background:white;
align-self:flex-start;
}

.system{
background:#ddd;
align-self:center;
font-size:13px;
}

.bottom{
display:flex;
border-top:1px solid #ccc;
}

.bottom input{
flex:1;
padding:12px;
border:none;
}

.bottom button{
padding:12px;
border:none;
background:#ff2d7a;
color:white;
}

</style>

</head>

<body>

<div id="users"></div>

<div id="chatbox">

<header>🌷 Tulip Chat</header>

<div id="chat"></div>

<div class="bottom">

<input id="msg" placeholder="Type message">

<button onclick="send()">Send</button>

</div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket=io()

let name=localStorage.getItem("name")

let currentDM=null

socket.emit("join",name)

socket.on("users",(list)=>{

let usersDiv=document.getElementById("users")

usersDiv.innerHTML=""

for(let id in list){

let u=document.createElement("div")

u.innerText=list[id]

u.onclick=()=>{

currentDM=id

}

usersDiv.appendChild(u)

}

})

socket.on("msg",(data)=>{

let div=document.createElement("div")

div.classList.add("msg")

if(data.name=="System"){

div.classList.add("system")
div.innerText=data.text

}

else if(data.name==name){

div.classList.add("me")
div.innerText=data.text

}

else{

div.classList.add("other")
div.innerText=data.name+": "+data.text

}

document.getElementById("chat").appendChild(div)

document.getElementById("chat").scrollTop=
document.getElementById("chat").scrollHeight

})

function send(){

let text=document.getElementById("msg").value

if(text=="") return

if(currentDM){

socket.emit("dm",{
to:currentDM,
name:name,
text:text
})

}else{

socket.emit("msg",{
name:name,
text:text
})

}

document.getElementById("msg").value=""

}

</script>

</body>
</html>
