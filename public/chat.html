<!DOCTYPE html>
<html>

<head>

<title>Tulip Chat</title>

<script src="/socket.io/socket.io.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#ffd6ea;
}

.top{
background:#ff2e93;
color:white;
padding:12px;
}

.container{
display:flex;
height:90vh;
}

.users{
width:20%;
background:black;
color:white;
padding:10px;
overflow:auto;
}

.chat{
flex:1;
display:flex;
flex-direction:column;
background:white;
}

#messages{
flex:1;
overflow:auto;
padding:10px;
}

.msg{
background:#f1f1f1;
padding:10px;
margin-bottom:8px;
border-radius:6px;
}

.input{
display:flex;
padding:8px;
background:#eee;
}

.input input{
flex:1;
padding:10px;
}

</style>

</head>

<body>

<div class="top">🌷 Tulip Chat</div>

<div class="container">

<div class="users">

<h3>Online</h3>

<div id="online"></div>

</div>

<div class="chat">

<div id="messages"></div>

<div class="input">

<input id="msg" placeholder="message">

<button onclick="send()">Send</button>

<button onclick="sendImage()">📷</button>

</div>

</div>

</div>

<script>

let socket = io()

let name = prompt("Enter name")

socket.emit("join",{name:name})

let messages = document.getElementById("messages")

function add(text){

messages.innerHTML += "<div class='msg'>" + text + "</div>"

messages.scrollTop = messages.scrollHeight

}

function send(){

let text = document.getElementById("msg").value

if(!text) return

socket.emit("message",{

user:name,
text:text

})

msg.value=""

}

function sendImage(){

let url = prompt("Image URL")

socket.emit("image",{

user:name,
url:url

})

}

socket.on("message",(d)=>{

add("<b>"+d.user+"</b>: "+d.text)

})

socket.on("image",(d)=>{

add("<b>"+d.user+"</b><br><img src='"+d.url+"' width='200'>")

})

socket.on("system",(t)=>{

add("<i>"+t+"</i>")

})

socket.on("online",(users)=>{

let html=""

for(let id in users){

html += "<div>"+users[id].name+"</div>"

}

document.getElementById("online").innerHTML = html

})

</script>

</body>

</html>
