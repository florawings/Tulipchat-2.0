<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tulip Pro | Adult Elite</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --hot-pink: #ff2d55;
            --neon-red: #ff073a;
            --dark-bg: #0a0a0c;
            --glass: rgba(18, 18, 22, 0.96);
            --gold: #ffcc00;
        }

        /* Essential Reset for Mobile */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Lexend', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body, html {
            height: 100dvh; width: 100vw; overflow: hidden; position: fixed;
            background-color: var(--dark-bg); color: #fff;
        }

        /* X-Rated Background Engine */
        .sexy-bg {
            position: fixed; inset: 0;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), 
                        url('https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?q=80&w=1470&auto=format&fit=crop') center/cover no-repeat;
            z-index: -1; filter: saturate(1.5);
        }

        /* Layout Structure */
        .main-app { display: flex; flex-direction: column; height: 100%; width: 100%; }

        /* Neon Header */
        header {
            height: 65px; background: var(--glass); display: flex; align-items: center;
            justify-content: space-between; padding: 0 18px; z-index: 1000;
            border-bottom: 2px solid var(--neon-red); box-shadow: 0 0 20px rgba(255, 7, 58, 0.3);
        }
        .brand { font-weight: 800; font-size: 22px; text-transform: uppercase; letter-spacing: 2px; }
        .brand span { color: var(--neon-red); text-shadow: 0 0 10px var(--neon-red); }

        /* Chat Scroller Fix: Messages won't hide anymore */
        #chat-scroller {
            flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column;
            gap: 12px; padding-bottom: 220px; /* Space for input & panels */
            scrollbar-width: none; -webkit-overflow-scrolling: touch;
        }

        /* Sophisticated Message Bubbles */
        .msg-container { display: flex; flex-direction: column; width: 100%; max-width: 85%; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .msg-me { align-self: flex-end; }
        .msg-other { align-self: flex-start; }

        .sender-tag { font-size: 11px; font-weight: 600; margin-bottom: 3px; color: #aaa; text-transform: capitalize; }
        .msg-me .sender-tag { text-align: right; color: var(--hot-pink); }

        .bubble {
            padding: 12px 16px; border-radius: 22px; font-size: 15px; line-height: 1.4;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4); word-wrap: break-word;
        }
        .msg-me .bubble { background: linear-gradient(135deg, var(--neon-red), #b00020); border-bottom-right-radius: 4px; color: #fff; }
        .msg-other .bubble { background: #1e1e24; border-bottom-left-radius: 4px; border: 1px solid #333; color: #eee; }

        .msg-img { max-width: 100%; border-radius: 12px; margin-top: 8px; border: 2px solid rgba(255,255,255,0.1); display: block; }

        /* Input Control Station (Heavy Duty) */
        .input-dock {
            position: fixed; bottom: 0; width: 100%; background: var(--glass);
            border-top: 1px solid rgba(255,255,255,0.1); padding: 12px; z-index: 2000;
        }

        /* Real-time Progress Monitor */
        #progress-wrapper { display: none; margin-bottom: 10px; }
        .bar-container { height: 8px; background: #222; border-radius: 10px; overflow: hidden; }
        .bar-fill { height: 100%; width: 0%; background: var(--neon-red); transition: width 0.3s cubic-bezier(0.1, 0.7, 1.0, 0.1); }

        /* Spicy Sticker Grid */
        #spicy-grid {
            display: none; grid-template-columns: repeat(4, 1fr); gap: 10px;
            background: #121216; padding: 15px; border-radius: 15px;
            margin-bottom: 15px; border: 1px solid var(--neon-red);
            max-height: 250px; overflow-y: auto;
        }
        .sticker { width: 100%; border-radius: 10px; cursor: pointer; border: 1px solid #333; }
        .sticker:active { transform: scale(0.9); }

        .input-row { display: flex; align-items: center; gap: 10px; }
        .icon-btn { 
            width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;
            background: #1e1e24; border-radius: 50%; color: #fff; font-size: 20px; border: 1px solid #333;
        }
        .icon-btn.active { color: var(--neon-red); border-color: var(--neon-red); box-shadow: 0 0 10px var(--neon-red); }

        #text-input {
            flex: 1; height: 48px; background: #1e1e24; border: 1px solid #333;
            padding: 0 20px; border-radius: 25px; color: #fff; font-size: 16px; outline: none;
        }
        #text-input:focus { border-color: var(--neon-red); }

        .send-pill {
            background: var(--neon-red); border: none; padding: 0 20px; height: 48px;
            border-radius: 25px; color: #fff; font-weight: 700; font-size: 14px;
        }

        /* User List Sidebar */
        #sidebar {
            position: fixed; right: -320px; top: 0; width: 300px; height: 100%;
            background: var(--dark-bg); z-index: 3000; transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding: 25px; border-left: 2px solid var(--neon-red);
        }
        #sidebar.active { right: 0; }
        .user-card { 
            padding: 12px; background: #1e1e24; border-radius: 12px; margin-bottom: 10px;
            display: flex; align-items: center; gap: 12px; border: 1px solid #333;
        }
        .online-dot { width: 10px; height: 10px; background: #4ade80; border-radius: 50%; box-shadow: 0 0 5px #4ade80; }
    </style>
</head>
<body>

<div class="sexy-bg"></div>

<div class="main-app">
    <header>
        <div class="brand">TULIP <span>HOT</span></div>
        <div style="display:flex; gap:15px;">
            <i class="fas fa-users" onclick="toggleMenu()" style="font-size:22px; color:var(--neon-red);"></i>
        </div>
    </header>

    <main id="chat-scroller"></main>

    <div class="input-dock">
        <div id="progress-wrapper">
            <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:5px;">
                <span id="status-txt">Uploading...</span>
                <span id="pct-txt">0%</span>
            </div>
            <div class="bar-container"><div id="bar-fill" class="bar-fill"></div></div>
        </div>

        <div id="spicy-grid">
            <img class="sticker" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHRreXJleG52Y2R4dzN5YmNnZ3R6Z3R6Z3R6Z3R6Z3R6Z3R6/3o7TKMGpxx87Z4I6T6/giphy.gif" onclick="sendSpicy(this.src)">
            <img class="sticker" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHRreXJleG52Y2R4dzN5YmNnZ3R6Z3R6Z3R6Z3R6/l41lTfO3vD04A7088/giphy.gif" onclick="sendSpicy(this.src)">
            <img class="sticker" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHRreXJleG52Y2R4dzN5YmNnZ3R6Z3R6Z3R6Z3R6/3o7TKVUn7iM8FMEU24/giphy.gif" onclick="sendSpicy(this.src)">
            <div class="sticker" style="background:var(--neon-red); height:60px; display:flex; align-items:center; justify-content:center; font-size:24px;" onclick="sendSpicy('🎁 SEXY GIFT 🎁')">🎁</div>
        </div>

        <div class="input-row">
            <label for="img-input" class="icon-btn"><i class="fas fa-plus"></i></label>
            <input type="file" id="img-input" hidden accept="image/*">
            
            <div class="icon-btn" id="fire-toggle" onclick="toggleSpicy()"><i class="fas fa-fire"></i></div>
            
            <input type="text" id="text-input" placeholder="Say something dirty..." autocomplete="off">
            
            <button class="send-pill" onclick="sendChat()">SEND</button>
        </div>
    </div>
</div>

<div id="sidebar">
    <h2 style="color:var(--neon-red); margin-bottom:20px;">Hookup Room</h2>
    <div id="user-container"></div>
    <div onclick="setGlobal()" style="margin-top:20px; padding:15px; background:var(--neon-red); border-radius:10px; text-align:center; font-weight:700;">PUBLIC LOBBY</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    const query = new URLSearchParams(window.location.search);
    const ME = {
        name: query.get('username') || "Stranger",
        role: query.get('role') || "user",
        target: 'all'
    };

    // Join Server
    socket.emit('join', { username: ME.name, role: ME.role });

    // --- MESSAGE RENDERING ENGINE (THE FIX) ---
    socket.on('newMessage', (data) => {
        const scroller = document.getElementById('chat-scroller');
        
        // Critical: Validate all data points
        const senderName = data.user || "Unknown";
        const contentBody = data.text || "";
        const isMyMsg = data.user === ME.name;

        const container = document.createElement('div');
        container.className = `msg-container ${isMyMsg ? 'msg-me' : 'msg-other'}`;

        let contentHTML = `<span class="sender-tag">${senderName} ${data.role === 'owner' ? '👑' : ''}</span>`;
        contentHTML += `<div class="bubble">`;

        if(data.type === 'image') {
            // Check if it's a URL or Base64
            contentHTML += `<img src="${contentBody}" class="msg-img" onload="scrollToBottom()">`;
        } else {
            // Text Content
            contentHTML += `<span>${contentBody}</span>`;
        }

        contentHTML += `</div>`;
        container.innerHTML = contentHTML;
        
        scroller.appendChild(container);
        scrollToBottom();
    });

    // --- CORE FUNCTIONS ---
    function sendChat() {
        const input = document.getElementById('text-input');
        const val = input.value.trim();
        if(!val) return;

        socket.emit('sendMessage', {
            type: 'text',
            text: val,
            to: ME.target,
            user: ME.name,
            role: ME.role
        });
        input.value = '';
    }

    function sendSpicy(url) {
        socket.emit('sendMessage', {
            type: 'image',
            text: url,
            to: ME.target,
            user: ME.name,
            role: ME.role
        });
        toggleSpicy();
    }

    // --- IMAGE UPLOAD + PROGRESS ENGINE ---
    document.getElementById('img-input').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if(!file) return;

        const reader = new FileReader();
        const wrap = document.getElementById('progress-wrapper');
        const fill = document.getElementById('bar-fill');
        const txt = document.getElementById('pct-txt');

        wrap.style.display = 'block';

        reader.onprogress = (ev) => {
            if(ev.lengthComputable) {
                const pct = Math.round((ev.loaded / ev.total) * 100);
                fill.style.width = pct + '%';
                txt.innerText = pct + '%';
            }
        };

        reader.onload = () => {
            socket.emit('sendMessage', {
                type: 'image',
                text: reader.result,
                to: ME.target,
                user: ME.name,
                role: ME.role
            });
            setTimeout(() => { wrap.style.display = 'none'; fill.style.width = '0%'; }, 1000);
        };
        reader.readAsDataURL(file);
    });

    // --- UI HELPERS ---
    function toggleMenu() { document.getElementById('sidebar').classList.toggle('active'); }
    function toggleSpicy() { 
        const grid = document.getElementById('spicy-grid');
        const btn = document.getElementById('fire-toggle');
        grid.style.display = (grid.style.display === 'grid') ? 'none' : 'grid';
        btn.classList.toggle('active');
    }
    function scrollToBottom() {
        const scroller = document.getElementById('chat-scroller');
        scroller.scrollTop = scroller.scrollHeight;
    }
    function setGlobal() {
        ME.target = 'all';
        toggleMenu();
    }

    socket.on('updateUserList', (users) => {
        const container = document.getElementById('user-container');
        container.innerHTML = users.map(u => `
            <div class="user-card" onclick="ME.target='${u.username}'; toggleMenu()">
                <div class="online-dot"></div>
                <span style="font-weight:600;">${u.username}</span>
            </div>
        `).join('');
    });

    // Enter Key Fix
    document.getElementById('text-input').addEventListener('keypress', (e) => { if(e.key === 'Enter') sendChat(); });
</script>
</body>
</html>
