<!DOCTYPE html><html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tulip Chat</title><style>

body{
margin:0;
height:100vh;
display:flex;
flex-direction:column;
font-family:Arial;
background:#f2dce3;
overflow:hidden;
}

/* HEADER */

#header{
height:50px;
background:#ff3d6e;
color:white;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 12px;
}

#header button{
background:none;
border:none;
color:white;
font-size:18px;
}

/* USERS */

#usersPanel{
position:fixed;
left:-240px;
top:50px;
width:220px;
height:100%;
background:white;
transition:.3s;
overflow:auto;
padding:10px;
}

#usersPanel.open{
left:0;
}

/* CHAT */

#chat{
flex:1;
overflow-y:auto;
padding:10px;
display:flex;
flex-direction:column;
gap:8px;
}

/* MESSAGE */

.msg{
background:#ff3d6e;
color:white;
padding:8px 14px;
border-radius:20px;
max-width:75%;
font-size:14px;
}

.msg img{
max-width:200px;
border-radius:10px;
margin-top:4px;
}

/* INPUT */

#input{
height:60px;
display:flex;
gap:6px;
padding:6px;
background:white;
}

#text{
flex:1;
border-radius:20px;
border:1px solid #ccc;
padding:8px;
}

button{
background:#ff3d6e;
color:white;
border:none;
padding:8px 12px;
border-radius:8px;
}

#progress{
font-size:12px;
color:#333;
}

</style></head><body><div id="header"><button onclick="toggleUsers()">☰</button>

<div>Tulip Chat</div><div>
<button onclick="location.reload()">🔄</button>
</div></div><div id="usersPanel"><h3>Online</h3><div id="onlineList"></div></div><div id="chat"></div><div id="input"><input id="text" placeholder="Type message"><button onclick="send()">Send</button>

<input type="file" id="file" hidden accept="image/*,.gif"><button onclick="upload()">GIF</button>

<span id="progress"></span>

</div><script src="/socket.io/socket.io.js"></script><script>

const socket = io()

let username = prompt("Enter name")
let gender = prompt("male / female")

socket.emit("join",{username,gender})

/* SEND */

function send(){

let msg=text.value.trim()

if(!msg)return

socket.emit("message",{username,gender,msg})

text.value=""

}

/* RECEIVE */

socket.on("message",(d)=>{

let div=document.createElement("div")

div.className="msg"

let icon = d.gender==="female"?"👩":"👨"

if(d.msg.includes("/uploads")){

div.innerHTML=icon+" "+d.username+"<br><img src='"+d.msg+"'>"

}else{

div.innerText=icon+" "+d.username+": "+d.msg

}

chat.appendChild(div)

chat.scrollTop=chat.scrollHeight

})

/* ONLINE USERS */

socket.on("onlineUsers",(users)=>{

onlineList.innerHTML=""

users.forEach(u=>{

let div=document.createElement("div")

div.innerText=(u.gender==="female"?"👩":"👨")+" "+u.username

onlineList.appendChild(div)

})

})

/* PANEL */

function toggleUsers(){

usersPanel.classList.toggle("open")

}

/* FILE UPLOAD */

function upload(){

file.click()

}

file.onchange=()=>{

let f=file.files[0]

let fd=new FormData()

fd.append("file",f)

let xhr=new XMLHttpRequest()

xhr.open("POST","/upload")

xhr.upload.onprogress=(e)=>{

let percent=Math.round((e.loaded/e.total)*100)

progress.innerText=percent+"%"

}

xhr.onload=()=>{

let res=JSON.parse(xhr.responseText)

socket.emit("message",{

username,
gender,
msg:res.url

})

progress.innerText=""

}

xhr.send(fd)

}

</script></body>
</html>
