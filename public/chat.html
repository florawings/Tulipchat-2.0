<!DOCTYPE html>
<html>

<head>

<title>Tulip Chat</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div style="display:flex;height:100vh">

<!-- SIDEBAR -->

<div style="width:200px;background:black;color:white;padding:10px">

<h3>Tulip Chat</h3>

<div onclick="joinRoom('normal')">Normal Room</div>

<div onclick="joinRoom('adult')">Adult Room</div>

<div onclick="joinRoom('private')">Private Room</div>

<h4>Online Users</h4>

<div id="online"></div>

</div>

<!-- CHAT -->

<div style="flex:1;padding:10px">

<div id="messages" style="height:80vh;overflow:auto"></div>

<input id="text">

<button onclick="sendMessage()">Send</button>

</div>

</div>

<!-- DM WINDOW -->

<div id="dmBox" style="position:fixed;right:10px;bottom:10px;width:300px;background:white;color:black;display:none">

<h4 id="dmUser"></h4>

<div id="dmMessages" style="height:200px;overflow:auto"></div>

<input id="dmText">

<button onclick="sendDM()">Send</button>

</div>

<script src="/socket.io/socket.io.js"></script>

<script src="client.js"></script>

</body>

</html>
