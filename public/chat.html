<!DOCTYPE html><html>
<head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tulip Chat</title><style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial;
background:#0f0f0f;
color:white;
display:flex;
height:100vh;
overflow:hidden;
}

/* SIDEBAR */

#sidebar{
width:240px;
background:black;
padding:15px;
display:flex;
flex-direction:column;
}

#sidebar h2{
color:#ff4da6;
margin-top:0;
}

.room{
padding:10px;
background:#111;
border-radius:6px;
margin-bottom:8px;
cursor:pointer;
}

.room:hover{
background:#222;
}

/* ONLINE USERS */

#online{
flex:1;
overflow:auto;
margin-top:10px;
}

.user{
padding:6px;
border-bottom:1px solid #333;
cursor:pointer;
}

/* CHAT AREA */

#chat{
flex:1;
display:flex;
flex-direction:column;
background:url("https://images.unsplash.com/photo-1518199266791-5375a83190b7") center/cover no-repeat;
}

/* TOP BAR */

#topbar{
height:50px;
background:#111;
display:flex;
align-items:center;
padding:0 15px;
}

#roomName{
font-weight:bold;
}

/* MESSAGES */

#messages{
flex:1;
overflow-y:auto;
padding:20px;
}

.msg{
background:rgba(0,0,0,0.6);
padding:10px;
border-radius:12px;
margin-bottom:12px;
max-width:70%;
}

/* IMAGE */

.msg img{
max-width:220px;
border-radius:10px;
margin-top:5px;
}

/* INPUT BAR */

#inputBar{
display:flex;
padding:10px;
background:black;
}

#text{
flex:1;
padding:10px;
border:none;
border-radius:20px;
outline:none;
}

button{
margin-left:6px;
padding:10px 14px;
border:none;
border-radius:8px;
background:#ff4da6;
color:white;
cursor:pointer;
}

button:hover{
background:#ff2e8c;
}

#progress{
margin-left:10px;
font-size:12px;
color:#ccc;
}

/* EMOJI BAR */

#emojiBar{
padding:6px;
background:#111;
text-align:center;
}

#emojiBar span{
font-size:20px;
margin:4px;
cursor:pointer;
}

/* DM POPUP */

#dmBox{
position:fixed;
right:20px;
bottom:20px;
width:260px;
background:#111;
border-radius:10px;
display:none;
flex-direction:column;
}

#dmHeader{
background:#ff4da6;
padding:10px;
border-radius:10px 10px 0 0;
}

#dmMessages{
height:200px;
overflow:auto;
padding:10px;
}

#dmInput{
display:flex;
padding:10px;
}

#dmText{
flex:1;
padding:8px;
border:none;
border-radius:10px;
}

</style></head><body><div id="sidebar"><h2>Tulip Chat</h2><div class="room" onclick="joinRoom('normal')">Normal Room</div><div class="room" onclick="joinRoom('adult')">🔞 Adult Room</div><h3>Online Users</h3><div id="online"></div></div><div id="chat"><div id="topbar"><span id="roomName">Normal Room</span>

</div><div id="messages"></div><div id="emojiBar"><span onclick="emoji('😀')">😀</span>
<span onclick="emoji('😂')">😂</span>
<span onclick="emoji('❤️')">❤️</span>
<span onclick="emoji('🔥')">🔥</span>
<span onclick="emoji('😍')">😍</span>

</div><div id="inputBar"><input id="text" placeholder="Type message"><button onclick="sendMsg()">Send</button>

<input type="file" id="file"><span id="progress"></span>

</div></div><div id="dmBox"><div id="dmHeader">Private Chat</div><div id="dmMessages"></div><div id="dmInput"><input id="dmText"><button onclick="sendDM()">Send</button>

</div></div><script src="/socket.io/socket.io.js"></script><script src="client.js"></script><script>

function emoji(e){

document.getElementById("text").value += e

}

</script></body>
</html>
