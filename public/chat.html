<!DOCTYPE html>
<html>
<head>

<title>Tulip Chat</title>

<script src="/socket.io/socket.io.js"></script>

<style>

body{
margin:0;
font-family:Arial;
display:flex;
height:100vh;
background:#0f1330;
color:white;
}

/* sidebar */

#sidebar{
width:220px;
background:black;
padding:10px;
}

.user{
padding:6px;
cursor:pointer;
border-bottom:1px solid #222;
}

/* chat */

#chat{
flex:1;
display:flex;
flex-direction:column;
}

#messages{
flex:1;
overflow:auto;
padding:20px;
}

.msg{
background:#3b4fff;
padding:8px;
margin:6px 0;
border-radius:6px;
}

/* input */

#inputArea{
display:flex;
padding:10px;
background:#111;
}

#msg{
flex:1;
padding:10px;
border:none;
border-radius:6px;
}

button{
margin-left:6px;
padding:10px;
border:none;
background:#4b6fff;
color:white;
border-radius:6px;
}

#typing{
font-size:12px;
opacity:0.7;
margin-left:10px;
}

/* DM */

#dmBox{
position:fixed;
right:20px;
bottom:20px;
width:250px;
background:#1e2145;
border-radius:10px;
display:none;
flex-direction:column;
}

#dmHeader{
padding:8px;
background:#4b6fff;
}

#dmMessages{
height:150px;
overflow:auto;
padding:8px;
}

#dmInput{
display:flex;
padding:8px;
}

#dmInput input{
flex:1;
}

</style>

</head>

<body>

<div id="sidebar">

<h3>🌷 Tulip Chat</h3>

<button onclick="logout()">Logout</button>

<h4 id="onlineCount">0 users</h4>

<div id="users"></div>

</div>

<div id="chat">

<div id="messages"></div>

<div id="typing"></div>

<div id="inputArea">

<input id="msg" placeholder="Type message" oninput="typing()">

<button onclick="sendMsg()">Send</button>

<button onclick="gif()">GIF</button>

<button onclick="photo()">📷</button>

</div>

</div>

<div id="dmBox">

<div id="dmHeader">DM</div>

<div id="dmMessages"></div>

<div id="dmInput">

<input id="dmText">

<button onclick="sendDM()">Send</button>

</div>

</div>

<script>

const socket = io()

let username = localStorage.getItem("username")

if(!username){
location="/login.html"
}

socket.emit("join",username)

/* receive message */

socket.on("chat message",(data)=>{

let div=document.createElement("div")

div.className="msg"

div.innerText=data.username+": "+data.msg

document.getElementById("messages").appendChild(div)

scroll()

})

/* online users */

socket.on("onlineUsers",(users)=>{

let list=document.getElementById("users")

list.innerHTML=""

document.getElementById("onlineCount").innerText=
users.length+" users online"

users.forEach(u=>{

let d=document.createElement("div")

d.className="user"

d.innerText=u

d.onclick=()=>openDM(u)

list.appendChild(d)

})

})

/* send message */

function sendMsg(){

let msg=document.getElementById("msg").value

socket.emit("chat message",{

username,
msg

})

document.getElementById("msg").value=""

}

/* typing */

function typing(){

socket.emit("typing",username)

}

socket.on("typing",(u)=>{

document.getElementById("typing").innerText=u+" typing..."

setTimeout(()=>{

document.getElementById("typing").innerText=""

},1500)

})

/* scroll */

function scroll(){

let m=document.getElementById("messages")

m.scrollTop=m.scrollHeight

}

/* GIF */

function gif(){

let link=prompt("Paste GIF link")

if(link){

socket.emit("chat message",{
username,
msg:link
})

}

}

/* photo */

function photo(){

let input=document.createElement("input")

input.type="file"

input.onchange=e=>{

let file=e.target.files[0]

let reader=new FileReader()

reader.onload=function(){

socket.emit("chat message",{
username,
msg:reader.result
})

}

reader.readAsDataURL(file)

}

input.click()

}

/* DM */

let dmUser=""

function openDM(user){

dmUser=user

document.getElementById("dmBox").style.display="flex"

document.getElementById("dmHeader").innerText="DM : "+user

}

function sendDM(){

let txt=document.getElementById("dmText").value

socket.emit("dm",{

to:dmUser,
from:username,
msg:txt

})

document.getElementById("dmText").value=""

}

socket.on("dm",(data)=>{

let div=document.createElement("div")

div.innerText=data.from+": "+data.msg

document.getElementById("dmMessages").appendChild(div)

})

/* logout */

function logout(){

localStorage.removeItem("username")

location="/login.html"

}

</script>

</body>
</html>
