<!DOCTYPE html><html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Tulip Chat</title><style>

*{box-sizing:border-box;}

body{
margin:0;
font-family:Arial;
display:flex;
height:100vh;
background:#0f0f0f;
color:white;
overflow:hidden;
}

/* sidebar */

#sidebar{
width:220px;
background:black;
padding:15px;
}

#sidebar h2{
color:#ff4da6;
margin-top:0;
}

.room{
padding:10px;
background:#111;
margin-bottom:8px;
border-radius:6px;
cursor:pointer;
}

.room:hover{
background:#222;
}

/* chat */

#chat{
flex:1;
display:flex;
flex-direction:column;
background:url("https://images.unsplash.com/photo-1518199266791-5375a83190b7") center/cover;
}

/* messages */

#messages{
flex:1;
overflow-y:auto;
padding:15px;
}

.msg{
background:rgba(0,0,0,0.6);
padding:10px;
border-radius:10px;
margin-bottom:10px;
max-width:70%;
}

.msg img{
max-width:200px;
border-radius:10px;
}

/* input */

#inputBar{
display:flex;
padding:10px;
background:black;
}

#text{
flex:1;
padding:10px;
border:none;
border-radius:20px;
outline:none;
}

button{
margin-left:6px;
padding:10px;
border:none;
border-radius:8px;
background:#ff4da6;
color:white;
cursor:pointer;
}

#progress{
margin-left:10px;
font-size:12px;
}

</style></head><body><div id="sidebar"><h2>Tulip Chat</h2><div class="room" onclick="joinRoom('normal')">Normal Room</div><div class="room" onclick="joinRoom('adult')">Adult Room</div><h3>Online Users</h3><div id="online"></div></div><div id="chat"><div id="messages"></div><div id="inputBar"><input id="text" placeholder="Type message"><button onclick="sendMsg()">Send</button>

<input type="file" id="file"><span id="progress"></span>

</div></div><script src="/socket.io/socket.io.js"></script><script src="client.js"></script></body>
</html>
