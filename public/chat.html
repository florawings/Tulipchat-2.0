<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tulip Chat</title>

<link rel="stylesheet" href="style.css">

<style>

body{
margin:0;
font-family:Arial;
background:#f4f4f4;
display:flex;
height:100vh;
overflow:hidden;
}

#sidebar{
width:220px;
background:#ffffff;
border-right:1px solid #ddd;
overflow:auto;
}

#sidebar h3{
padding:10px;
margin:0;
background:#f1f1f1;
}

#onlineUsers div{
padding:8px;
border-bottom:1px solid #eee;
cursor:pointer;
}

#onlineUsers div:hover{
background:#f7f7f7;
}

#main{
flex:1;
display:flex;
flex-direction:column;
}

#header{
background:#ff2d6f;
color:white;
padding:15px;
font-size:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

#messages{
flex:1;
overflow:auto;
padding:10px;
}

.message{
background:white;
padding:8px;
margin-bottom:8px;
border-radius:5px;
max-width:80%;
}

.system{
text-align:center;
color:#777;
}

#sendBar{
display:flex;
padding:10px;
background:white;
border-top:1px solid #ddd;
position:sticky;
bottom:0;
}

#messageInput{
flex:1;
padding:10px;
font-size:16px;
border:1px solid #ccc;
border-radius:5px;
}

button{
margin-left:6px;
padding:10px 14px;
border:none;
background:#ff2d6f;
color:white;
border-radius:5px;
font-size:16px;
cursor:pointer;
}

button:hover{
opacity:0.9;
}

img.chatImage{
max-width:200px;
border-radius:6px;
margin-top:5px;
cursor:pointer;
}

</style>

</head>

<body>

<div id="sidebar">

<h3>Online</h3>

<div id="onlineUsers"></div>

</div>

<div id="main">

<div id="header">

<div>🌷 Tulip Chat</div>

<div onclick="logout()" style="cursor:pointer">Logout</div>

</div>

<div id="messages"></div>

<div id="sendBar">

<input id="messageInput" placeholder="message">

<button onclick="sendMessage()">Send</button>

<input type="file" id="imageUpload" style="display:none">

<button onclick="uploadImage()">📷</button>

<button onclick="sendGIF()">GIF</button>

</div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="client.js"></script>

<script>

function logout(){

localStorage.removeItem("username");

window.location="login.html";

}

function uploadImage(){

document.getElementById("imageUpload").click();

}

document.getElementById("imageUpload").addEventListener("change", function(){

const file=this.files[0];

const reader=new FileReader();

reader.onload=function(){

socket.emit("message",{
user:username,
text:reader.result,
type:"image"
});

};

reader.readAsDataURL(file);

});

function sendGIF(){

const url=prompt("Paste GIF link");

if(!url) return;

socket.emit("message",{
user:username,
text:url,
type:"image"
});

}

</script>

</body>

</html>
