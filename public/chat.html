<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tulip Pro | X-Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #f43f5e; --owner: #fbbf24; --glass: rgba(15, 23, 42, 0.95); }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; margin: 0; padding: 0; touch-action: manipulation; }
        
        body { 
            height: 100dvh; width: 100vw; display: flex; flex-direction: column; 
            background: #000 url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1200') center/cover no-repeat fixed;
            overflow: hidden; position: fixed; 
        }

        header { height: 50px; background: var(--glass); display: flex; align-items: center; justify-content: space-between; padding: 0 15px; z-index: 1001; border-bottom: 1px solid rgba(255,255,255,0.1); }

        #chat-scroller { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; padding-bottom: 140px; }

        /* Bubble Styles */
        .msg { padding: 10px 14px; border-radius: 18px; color: white; max-width: 85%; font-size: 14px; word-wrap: break-word; position: relative; }
        .msg.me { align-self: flex-end; background: linear-gradient(135deg, #f43f5e, #e11d48); border-bottom-right-radius: 2px; }
        .msg.other { align-self: flex-start; background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); border-bottom-left-radius: 2px; }
        .msg img { max-width: 100%; border-radius: 12px; margin-top: 8px; display: block; }

        /* GIF/Sticker Panel */
        #media-panel { 
            display: none; position: absolute; bottom: 70px; left: 10px; right: 10px; 
            background: var(--glass); border-radius: 15px; padding: 10px; 
            grid-template-columns: repeat(4, 1fr); gap: 8px; z-index: 2000;
            max-height: 200px; overflow-y: auto; border: 1px solid var(--primary);
        }
        .media-item { width: 100%; cursor: pointer; border-radius: 8px; transition: 0.2s; }
        .media-item:active { transform: scale(0.9); }

        /* Input Area */
        .input-wrapper { position: absolute; bottom: 0; width: 100%; background: var(--glass); padding: 12px; z-index: 1000; }
        .input-row { display: flex; align-items: center; gap: 10px; }
        #msgIn { flex: 1; padding: 12px 18px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); color: white; outline: none; font-size: 16px; }

        /* Sidebar & Overlay */
        #sidebar { position: fixed; left: -280px; top: 0; width: 280px; height: 100%; background: #0f172a; transition: 0.3s; z-index: 3000; padding: 20px; }
        #sidebar.open { left: 0; }
        #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2500; }
    </style>
</head>
<body>

<div id="overlay" onclick="toggleSidebar()"></div>

<header>
    <div onclick="toggleSidebar()" style="cursor:pointer; font-size:24px; color:white;">☰</div>
    <div style="color:white; font-weight:600;">TULIP <span style="color:var(--primary)">PRO</span></div>
    <div id="target-ui" style="font-size:10px; color:var(--owner);">GLOBAL</div>
</header>

<div id="sidebar">
    <h3 style="color:white; margin-bottom:20px;">Users Online</h3>
    <div id="user-list"></div>
</div>

<div id="chat-container" style="flex:1; position:relative; overflow:hidden;">
    <div id="chat-scroller"></div>
    
    <div id="media-panel">
        <img class="media-item" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJqZ3R6Z3R6Z3R6Z3R6/3o7TKMGpxx87Z4I6T6/giphy.gif" onclick="sendMedia(this.src)">
        <img class="media-item" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJqZ3R6Z3R6Z3R6Z3R6/l41lTfO3vD04A7088/giphy.gif" onclick="sendMedia(this.src)">
        <div class="media-item" style="background:#333; height:60px; display:flex; align-items:center; justify-content:center; border-radius:8px;" onclick="sendMedia('🎁 SEX GIFT 🎁')">🎁</div>
    </div>

    <div class="input-wrapper">
        <div class="input-row">
            <span onclick="toggleMedia()" style="cursor:pointer; font-size:24px;">🔥</span>
            <input type="text" id="msgIn" placeholder="Type something..." autocomplete="off">
            <button onclick="sendMsg()" style="background:var(--primary); border:none; color:white; width:45px; height:45px; border-radius:50%; font-size:20px;">➤</button>
        </div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    const params = new URLSearchParams(window.location.search);
    const myName = params.get('username') || "Stranger";
    let activeTarget = 'all';

    socket.emit('join', { username: myName, role: params.get('role'), gender: params.get('gender') });

    function toggleSidebar() {
        const sb = document.getElementById('sidebar');
        const ov = document.getElementById('overlay');
        sb.classList.toggle('open');
        ov.style.display = sb.classList.contains('open') ? 'block' : 'none';
    }

    function toggleMedia() {
        const panel = document.getElementById('media-panel');
        panel.style.display = (panel.style.display === 'grid') ? 'none' : 'grid';
    }

    function sendMedia(url) {
        socket.emit('sendMessage', { type: 'image', text: url, to: activeTarget, user: myName });
        toggleMedia();
    }

    socket.on('newMessage', (data) => {
        const div = document.createElement('div');
        div.className = `msg ${data.user === myName ? 'me' : 'other'}`;
        
        // Fix for undefined content
        const sender = data.user || "System";
        const content = data.text || "";

        let html = `<small style="display:block; font-size:10px; opacity:0.7;">${sender}</small>`;
        if(data.type === 'image') {
            if(content.includes('giphy') || content.includes('http')) {
                html += `<img src="${content}">`;
            } else {
                html += `<div style="padding:10px; background:rgba(0,0,0,0.2); border-radius:10px;">${content}</div>`;
            }
        } else {
            html += `<span>${content}</span>`;
        }
        
        div.innerHTML = html;
        document.getElementById('chat-scroller').appendChild(div);
        document.getElementById('chat-scroller').scrollTop = document.getElementById('chat-scroller').scrollHeight;
    });

    socket.on('updateUserList', (users) => {
        document.getElementById('user-list').innerHTML = users.map(u => `
            <div onclick="setTarget('${u.username}')" style="padding:12px; color:white; border-bottom:1px solid #222; cursor:pointer;">${u.username}</div>
        `).join('') + `<div onclick="setTarget('all')" style="padding:12px; color:var(--primary); cursor:pointer;">🌍 GLOBAL</div>`;
    });

    function setTarget(u) {
        activeTarget = u;
        document.getElementById('target-ui').innerText = u === 'all' ? "GLOBAL" : "DM: " + u;
        toggleSidebar();
    }

    function sendMsg() {
        const inp = document.getElementById('msgIn');
        if(inp.value.trim()) {
            socket.emit('sendMessage', { type: 'text', text: inp.value, to: activeTarget, user: myName });
            inp.value = '';
        }
    }
</script>
</body>
</html>
