<!DOCTYPE html><html>
<head>
<meta charset="UTF-8">
<title>Tulip Chat</title><style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:'Segoe UI',sans-serif;
display:flex;
height:100vh;
background:linear-gradient(135deg,#ffd6e7,#ffe9f3,#f5e6ff);
}

/* sidebar */

#sidebar{
width:230px;
background:rgba(255,255,255,0.6);
backdrop-filter:blur(10px);
padding:15px;
box-shadow:2px 0 10px rgba(0,0,0,0.1);
}

#sidebar h3{
margin-top:0;
color:#ff4d8d;
}

#sidebar button{
background:#ff4d8d;
border:none;
padding:8px 12px;
color:white;
border-radius:6px;
cursor:pointer;
margin-bottom:10px;
}

/* chat area */

#chatArea{
flex:1;
display:flex;
flex-direction:column;
}

/* messages */

#messages{
flex:1;
overflow-y:auto;
padding:20px;
}

/* chat bubble */

.message{
background:white;
padding:10px 14px;
border-radius:18px;
margin-bottom:10px;
max-width:70%;
box-shadow:0 3px 8px rgba(0,0,0,0.08);
}

.me{
background:#ff4d8d;
color:white;
margin-left:auto;
}

/* input area */

#inputArea{
display:flex;
padding:12px;
background:rgba(255,255,255,0.7);
backdrop-filter:blur(6px);
}

#msgInput{
flex:1;
padding:10px;
border-radius:20px;
border:1px solid #ddd;
outline:none;
font-size:14px;
}

/* buttons */

button{
margin-left:6px;
padding:8px 12px;
border:none;
background:#ff4d8d;
color:white;
border-radius:10px;
cursor:pointer;
}

button:hover{
background:#ff2f78;
}

/* images */

img.chatImg{
max-width:200px;
border-radius:10px;
margin-top:5px;
}

</style></head><body><div id="sidebar"><h3>🌷 Tulip Chat</h3><button onclick="logout()">Logout</button>

<p id="onlineCount">0 users online</p><ul id="userList"></ul></div><div id="chatArea"><div id="messages"></div><div id="inputArea"><input id="msgInput" placeholder="Type message"><button onclick="sendMsg()">Send</button>

<input type="file" id="imgInput" style="display:none"><button onclick="document.getElementById('imgInput').click()">📷</button>

<button onclick="sendGif()">GIF</button>

</div></div><script src="/socket.io/socket.io.js"></script><script>

const socket = io()

let username = localStorage.getItem("username")

if(!username){
location.href="/"
}

function addMessage(html,type=""){

const box=document.createElement("div")

box.className="message "+type

box.innerHTML=html

document.getElementById("messages").appendChild(box)

document.getElementById("messages").scrollTop=
document.getElementById("messages").scrollHeight

}

function sendMsg(){

let input=document.getElementById("msgInput")

if(input.value.trim()=="") return

socket.emit("chat message",{
user:username,
msg:input.value
})

addMessage("<b>You:</b> "+input.value,"me")

input.value=""

}

socket.on("chat message",(data)=>{

addMessage("<b>"+data.user+":</b> "+data.msg)

})


document.getElementById("msgInput")
.addEventListener("keypress",(e)=>{

if(e.key==="Enter") sendMsg()

})


function sendGif(){

let url=prompt("Paste GIF URL")

if(!url) return

socket.emit("chat message",{
user:username,
msg:"<img class='chatImg' src='"+url+"'>"
})

}


document.getElementById("imgInput")
.addEventListener("change",async function(){

let file=this.files[0]

let form=new FormData()

form.append("image",file)

let res=await fetch("/upload",{
method:"POST",
body:form
})

let data=await res.json()

socket.emit("chat message",{
user:username,
msg:"<img class='chatImg' src='"+data.url+"'>"
})

})


function logout(){

localStorage.removeItem("username")

location.href="/"

}


socket.emit("join",username)


socket.on("user list",(users)=>{

document.getElementById("onlineCount").innerText=
users.length+" users online"

let ul=document.getElementById("userList")

ul.innerHTML=""

users.forEach(u=>{

let li=document.createElement("li")

li.innerText=u

ul.appendChild(li)

})

})

</script></body>
</html>
