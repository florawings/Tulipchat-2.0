<!DOCTYPE html><html><head><title>Tulip Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1"><script src="/socket.io/socket.io.js"></script><style>

/* PAGE */

body{
margin:0;
font-family:Arial;

background-image:url("https://images.unsplash.com/photo-1528459801416-a9e53bbf4e17");
background-size:cover;
background-position:center;

height:100vh;
display:flex;
flex-direction:column;
}

/* TOP BAR */

#topbar{
background:#111;
color:white;
padding:10px;

display:flex;
justify-content:space-between;
align-items:center;
}

#icons span{
margin-left:15px;
cursor:pointer;
font-size:18px;
}

/* MAIN LAYOUT */

#main{
flex:1;
display:flex;
}

/* ROOMS */

#rooms{
width:120px;
background:white;
border-right:1px solid #ddd;
}

.room{
padding:12px;
border-bottom:1px solid #eee;
cursor:pointer;
}

.room:hover{
background:#f3f3f3;
}

/* CHAT AREA */

#chat{
flex:1;
display:flex;
flex-direction:column;

background:rgba(255,255,255,0.9);
}

#messages{
flex:1;
overflow:auto;
padding:12px;
}

/* MESSAGE */

.msg{
background:white;
padding:10px;
border-radius:10px;
margin-bottom:8px;

box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

/* SEND BOX */

#sendbox{
display:flex;
background:white;
border-top:1px solid #ddd;
padding:6px;
}

#msg{
flex:1;
border:none;
padding:10px;
border-radius:20px;
background:#f1f1f1;
}

#send{
background:#22c55e;
color:white;
border:none;

padding:8px 18px;
border-radius:20px;
margin-left:6px;

cursor:pointer;
}

/* USERS */

#users{
width:120px;
background:white;
border-left:1px solid #ddd;
}

.user{
padding:10px;
border-bottom:1px solid #eee;
}

</style></head><body><!-- TOP BAR --><div id="topbar"><div><span onclick="toggleMenu()">☰</span>
<b style="margin-left:10px">Tulip Chat</b>

</div><div id="icons"><span onclick="refreshPage()">🔄</span>
<span onclick="openMessages()">✉️</span>
<span onclick="addFriend()">➕</span>
<span onclick="showNotifications()">🔔</span>

<span id="username"></span>

</div></div><!-- MAIN --><div id="main"><!-- ROOMS --><div id="rooms"><div class="room" onclick="joinRoom('main')">Main</div>
<div class="room" onclick="joinRoom('adult')">Adult</div>
<div class="room" onclick="joinRoom('quiz')">Quiz</div>
<div class="room" onclick="joinRoom('marathi')">Marathi</div></div><!-- CHAT --><div id="chat"><div id="messages"></div><div id="sendbox"><input id="msg" placeholder="Type message"><button id="send">Send</button>

</div></div><!-- USERS --><div id="users"><div style="padding:10px;font-weight:bold">Online</div><div id="userlist"></div></div></div><script>

const socket = io()

let username = localStorage.getItem("username")

if(!username){

location="index.html"

}

document.getElementById("username").innerText=username

let room="main"

socket.emit("join",{username,room})

/* ROOM CHANGE */

function joinRoom(newRoom){

room=newRoom

document.getElementById("messages").innerHTML=""

socket.emit("join",{username,room})

}

/* SEND MESSAGE */

document.getElementById("send").onclick=function(){

let text=document.getElementById("msg").value

if(text=="") return

socket.emit("chat message",{user:username,msg:text,room})

document.getElementById("msg").value=""

}

/* RECEIVE MESSAGE */

socket.on("chat message",(data)=>{

let div=document.createElement("div")

div.className="msg"

div.innerText=data.user+" : "+data.msg

document.getElementById("messages").appendChild(div)

})

/* TOPBAR ACTIONS */

function refreshPage(){
location.reload()
}

function openMessages(){
alert("Private messages coming soon")
}

function addFriend(){
alert("Friend system coming soon")
}

function showNotifications(){
alert("No notifications")
}

function toggleMenu(){
alert("Menu coming soon")
}

</script></body></html>
