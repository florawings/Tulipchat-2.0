<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Tulip Chat</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f2f2f2;
}

header{
background:#ff2d7a;
color:white;
padding:12px;
}

#users{
position:fixed;
left:0;
top:50px;
bottom:0;
width:120px;
background:black;
color:white;
overflow:auto;
}

#chat{
margin-left:120px;
padding:10px;
height:80vh;
overflow:auto;
}

.msg{
background:white;
padding:10px;
margin:5px;
border-radius:6px;
}

.system{
background:#ddd;
}

img{
max-width:200px;
border-radius:6px;
}

.bottom{
position:fixed;
bottom:0;
left:120px;
right:0;
display:flex;
}

.bottom input{
flex:1;
padding:12px;
border:none;
}

button{
border:none;
padding:12px;
background:#ff2d7a;
color:white;
}

</style>

</head>

<body>

<header>🌷 Tulip Chat</header>

<div id="users"></div>

<div id="chat"></div>

<div class="bottom">

<input id="msg" placeholder="message">

<button onclick="send()">Send</button>

<input type="file" id="file" hidden>

<button onclick="upload()">📷</button>

<button onclick="gif()">GIF</button>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io()

let name = localStorage.getItem("name")

if(!name){

name = prompt("Enter name")

localStorage.setItem("name",name)

}

socket.emit("join",name)

socket.on("chat",(data)=>{

if(data.type=="join" || data.type=="left"){

addText(data.text,true)

}

if(data.type=="text"){

addText(data.name+": "+data.text)

}

if(data.type=="image" || data.type=="gif"){

addImage(data.name,data.url)

}

})

socket.on("users",(list)=>{

users.innerHTML=""

for(let id in list){

let div=document.createElement("div")

div.innerText=list[id]

users.appendChild(div)

}

})

function send(){

let text=msg.value

socket.emit("message",{

name:name,
text:text

})

msg.value=""

}

function upload(){

file.click()

}

file.onchange=function(){

let reader=new FileReader()

reader.onload=function(){

socket.emit("image",{

name:name,
url:reader.result

})

}

reader.readAsDataURL(file.files[0])

}

function gif(){

let url=prompt("Paste GIF link")

socket.emit("gif",{

name:name,
url:url

})

}

function addText(text,system){

let div=document.createElement("div")

div.className="msg"

if(system) div.className+=" system"

div.innerText=text

chat.appendChild(div)

chat.scrollTop=chat.scrollHeight

}

function addImage(name,url){

let div=document.createElement("div")

div.className="msg"

div.innerHTML=name+"<br><img src='"+url+"'>"

chat.appendChild(div)

chat.scrollTop=chat.scrollHeight

}

</script>

</body>
</html>
