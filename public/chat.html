<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tulip Chat</title>

<script src="/socket.io/socket.io.js"></script>

<style>

/* ---------- GLOBAL ---------- */

body{
margin:0;
font-family:Arial;
background:#0f1226;
color:white;
height:100vh;
display:flex;
overflow:hidden;
}

/* ---------- SIDEBAR ---------- */

#sidebar{
width:250px;
background:#050505;
padding:10px;
display:flex;
flex-direction:column;
}

#logo{
font-size:20px;
text-align:center;
margin-bottom:10px;
}

#profile{
text-align:center;
margin-bottom:15px;
}

#profile img{
width:70px;
height:70px;
border-radius:50%;
object-fit:cover;
}

#onlineCount{
margin:10px 0;
font-size:14px;
}

#users{
flex:1;
overflow-y:auto;
}

.user{
padding:6px;
cursor:pointer;
border-bottom:1px solid #222;
}

.user:hover{
background:#111;
}

/* ---------- CHAT AREA ---------- */

#chatArea{
flex:1;
display:flex;
flex-direction:column;
background:#15193a;
}

#messages{
flex:1;
overflow-y:auto;
padding:15px;
}

.msg{
background:#2c2f5b;
padding:8px;
margin:6px 0;
border-radius:8px;
max-width:70%;
}

.mymsg{
background:#4b6fff;
margin-left:auto;
}

/* ---------- INPUT ---------- */

#inputBar{
display:flex;
padding:10px;
background:#11143a;
}

#msg{
flex:1;
padding:10px;
border:none;
border-radius:6px;
}

button{
margin-left:6px;
padding:10px;
border:none;
background:#4b6fff;
color:white;
border-radius:6px;
cursor:pointer;
}

/* ---------- DM POPUP ---------- */

#dmBox{
position:fixed;
right:20px;
bottom:20px;
width:250px;
background:#1c1f4d;
border-radius:10px;
display:none;
flex-direction:column;
}

#dmHeader{
padding:8px;
background:#4b6fff;
}

#dmMessages{
height:150px;
overflow-y:auto;
padding:8px;
}

#dmInput{
display:flex;
padding:8px;
}

#dmInput input{
flex:1;
}

</style>
</head>

<body>

<!-- ---------- SIDEBAR ---------- -->

<div id="sidebar">

<div id="logo">🌷 Tulip Chat</div>

<div id="profile">

<img id="avatar" src="https://i.imgur.com/7k12EPD.png">

<br>

<input type="file" id="uploadPic">

</div>

<div id="onlineCount">0 users online</div>

<div id="users"></div>

</div>

<!-- ---------- CHAT ---------- -->

<div id="chatArea">

<div id="messages"></div>

<div id="inputBar">

<input id="msg" placeholder="Type message">

<button onclick="sendMsg()">Send</button>

<button onclick="emoji()">😊</button>

<button onclick="gift()">🎁</button>

</div>

</div>

<!-- ---------- DM POPUP ---------- -->

<div id="dmBox">

<div id="dmHeader"></div>

<div id="dmMessages"></div>

<div id="dmInput">

<input id="dmText">

<button onclick="sendDM()">Send</button>

</div>

</div>

<script>

/* ---------- SOCKET ---------- */

const socket = io()

let username = localStorage.getItem("username")

if(!username){

location="/login.html"

}

socket.emit("join",username)

/* ---------- MESSAGE RECEIVE ---------- */

socket.on("chat message",(data)=>{

let box=document.createElement("div")

box.className="msg"

if(data.username===username){

box.classList.add("mymsg")

}

box.innerText=data.username + ": " + data.msg

document.getElementById("messages").appendChild(box)

scrollBottom()

})

/* ---------- ONLINE USERS ---------- */

socket.on("onlineUsers",(users)=>{

let list=document.getElementById("users")

list.innerHTML=""

document.getElementById("onlineCount").innerText=
users.length + " users online"

users.forEach(u=>{

let div=document.createElement("div")

div.className="user"

div.innerText=u

div.onclick=()=>openDM(u)

list.appendChild(div)

})

})

/* ---------- SEND MESSAGE ---------- */

function sendMsg(){

let text=document.getElementById("msg").value

if(text==="") return

socket.emit("chat message",{

username:username,
msg:text

})

document.getElementById("msg").value=""

}

/* ---------- SCROLL ---------- */

function scrollBottom(){

let m=document.getElementById("messages")

m.scrollTop=m.scrollHeight

}

/* ---------- EMOJI ---------- */

function emoji(){

document.getElementById("msg").value += "😊"

}

/* ---------- GIFT ---------- */

function gift(){

document.getElementById("msg").value += "🎁"

}

/* ---------- PROFILE PIC ---------- */

document.getElementById("uploadPic")
.addEventListener("change",(e)=>{

let file=e.target.files[0]

let reader=new FileReader()

reader.onload=function(){

document.getElementById("avatar").src=reader.result

}

reader.readAsDataURL(file)

})

/* ---------- DM SYSTEM ---------- */

let dmUser=""

function openDM(user){

dmUser=user

document.getElementById("dmBox").style.display="flex"

document.getElementById("dmHeader").innerText="DM : "+user

document.getElementById("dmMessages").innerHTML=""

}

function sendDM(){

let txt=document.getElementById("dmText").value

if(txt==="") return

let div=document.createElement("div")

div.innerText="Me: "+txt

document.getElementById("dmMessages").appendChild(div)

document.getElementById("dmText").value=""

}

/* ---------- KEEP ALIVE ---------- */

setInterval(()=>{

socket.emit("ping")

},20000)

</script>

</body>
</html>
