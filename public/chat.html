<!DOCTYPE html><html><head>
<title>Tulip Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1"><script src="/socket.io/socket.io.js"></script><style>

body{
margin:0;
font-family:Arial;
background-image:url("https://images.unsplash.com/photo-1528459801416-a9e53bbf4e17");
background-size:cover;
background-position:center;
height:100vh;
display:flex;
flex-direction:column;
}

/* TOP BAR */

#topbar{
background:#111;
color:white;
padding:10px;
display:flex;
justify-content:space-between;
align-items:center;
}

#icons span{
margin-left:15px;
cursor:pointer;
font-size:18px;
}

/* MENU */

#menu{
position:fixed;
left:-220px;
top:0;
width:220px;
height:100%;
background:white;
box-shadow:2px 0 10px rgba(0,0,0,0.2);
transition:0.3s;
z-index:5;
}

.menuItem{
padding:15px;
border-bottom:1px solid #eee;
cursor:pointer;
}

/* MAIN */

#main{
flex:1;
display:flex;
}

/* ROOMS */

#rooms{
width:120px;
background:white;
border-right:1px solid #ddd;
}

.room{
padding:12px;
border-bottom:1px solid #eee;
cursor:pointer;
}

.room:hover{
background:#f3f3f3;
}

/* CHAT */

#chat{
flex:1;
display:flex;
flex-direction:column;
background:rgba(255,255,255,0.9);
}

#messages{
flex:1;
overflow:auto;
padding:12px;
}

/* MESSAGE */

.msg{
background:white;
padding:10px;
border-radius:10px;
margin-bottom:8px;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

/* SEND */

#sendbox{
display:flex;
background:white;
border-top:1px solid #ddd;
padding:6px;
}

#msg{
flex:1;
border:none;
padding:10px;
border-radius:20px;
background:#f1f1f1;
}

#send{
background:#22c55e;
color:white;
border:none;
padding:8px 18px;
border-radius:20px;
margin-left:6px;
cursor:pointer;
}

/* USERS */

#users{
width:120px;
background:white;
border-left:1px solid #ddd;
}

.user{
padding:10px;
border-bottom:1px solid #eee;
}

/* NOTIFICATION */

#toast{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:#333;
color:white;
padding:10px 20px;
border-radius:20px;
display:none;
}

</style></head><body><!-- SLIDE MENU --><div id="menu"><div class="menuItem">Profile</div>
<div class="menuItem">Friends</div>
<div class="menuItem">Settings</div>
<div class="menuItem">Help</div></div><!-- TOP BAR --><div id="topbar"><div>
<span onclick="toggleMenu()">☰</span>
<b style="margin-left:10px">Tulip Chat</b>
</div><div id="icons">
<span onclick="refreshPage()">🔄</span>
<span onclick="openMessages()">✉️</span>
<span onclick="addFriend()">➕</span>
<span onclick="showNotifications()">🔔</span>
<span id="username"></span>
</div></div><div id="main"><!-- ROOMS --><div id="rooms"><div class="room" onclick="joinRoom('main')">Main</div>
<div class="room" onclick="joinRoom('adult')">Adult</div>
<div class="room" onclick="joinRoom('quiz')">Quiz</div>
<div class="room" onclick="joinRoom('marathi')">Marathi</div></div><!-- CHAT --><div id="chat"><div id="messages"></div><div id="sendbox"><input id="msg" placeholder="Type message"><button id="send">Send</button>

</div></div><!-- USERS --><div id="users"><div style="padding:10px;font-weight:bold">Online</div>
<div id="userlist"></div></div></div><div id="toast"></div><script>

const socket = io()

let username = localStorage.getItem("username")

if(!username){
location="index.html"
}

document.getElementById("username").innerText=username

let room="main"

socket.emit("join",{username,room})

function joinRoom(newRoom){

room=newRoom
document.getElementById("messages").innerHTML=""
socket.emit("join",{username,room})

}

/* SEND */

document.getElementById("send").onclick=function(){

let text=document.getElementById("msg").value

if(text=="") return

socket.emit("chat message",{user:username,msg:text,room})

document.getElementById("msg").value=""

}

/* RECEIVE */

socket.on("chat message",(data)=>{

let div=document.createElement("div")
div.className="msg"
div.innerText=data.user+" : "+data.msg

document.getElementById("messages").appendChild(div)

})

/* MENU */

function toggleMenu(){

let menu=document.getElementById("menu")

if(menu.style.left=="0px"){
menu.style.left="-220px"
}else{
menu.style.left="0px"
}

}

/* TOAST */

function showToast(text){

let toast=document.getElementById("toast")

toast.innerText=text
toast.style.display="block"

setTimeout(()=>{
toast.style.display="none"
},2000)

}

/* ICONS */

function refreshPage(){
location.reload()
}

function openMessages(){
showToast("Private messages coming soon")
}

function addFriend(){
showToast("Friend system coming soon")
}

function showNotifications(){
showToast("No notifications")
}

</script></body>
</html>
