<!DOCTYPE html>
<html>

<head>

<title>Tulip Chat</title>

<link rel="stylesheet" href="style.css">

<script src="/socket.io/socket.io.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#eee;
}

.top{
background:black;
color:white;
padding:10px;
font-size:18px;
display:flex;
justify-content:space-between;
}

.container{
display:flex;
height:90vh;
}

/* USERS */

.users{
width:22%;
background:#111;
color:white;
overflow:auto;
padding:10px;
}

.userItem{
padding:8px;
border-bottom:1px solid #333;
cursor:pointer;
}

.userItem:hover{
background:#222;
}

/* CHAT */

.chat{
flex:1;
display:flex;
flex-direction:column;
}

#messages{
flex:1;
overflow:auto;
padding:10px;
}

.msg{
background:white;
margin-bottom:8px;
padding:10px;
border-radius:8px;
max-width:85%;
}

/* INPUT */

.input{
display:flex;
padding:8px;
background:white;
}

.input input{
flex:1;
padding:10px;
}

.input button{
margin-left:5px;
}

</style>

</head>

<body>

<div class="top">

<div>🌷 Tulip Chat <span id="count"></span></div>

<div id="dmInfo"></div>

</div>

<div class="container">

<!-- USERS -->

<div class="users">

<h3>Online</h3>

<div id="list"></div>

</div>

<!-- CHAT -->

<div class="chat">

<div id="messages"></div>

<div class="input">

<input id="msg" placeholder="message">

<button onclick="send()">Send</button>

<button onclick="sendImage()">📷</button>

<button onclick="stopDM()">Public</button>

</div>

</div>

</div>

<script>

/* SOCKET */

let socket = io()

/* USER */

let user = localStorage.getItem("user")

if(!user){

user = prompt("Enter username")

localStorage.setItem("user",user)

}

socket.emit("join",user)

/* DM */

let dmTarget=null
let dmName=null

/* MESSAGE BOX */

let messages=document.getElementById("messages")

function add(text){

messages.innerHTML += "<div class='msg'>"+text+"</div>"

messages.scrollTop = messages.scrollHeight

}

/* SEND MESSAGE */

function send(){

let m=document.getElementById("msg").value

if(!m) return

if(dmTarget){

socket.emit("dm",{

from:user,
to:dmTarget,
text:m

})

add("<b>You → "+dmName+"</b>: "+m)

}else{

socket.emit("message",{

user:user,
text:m

})

}

msg.value=""

}

/* IMAGE */

function sendImage(){

let url=prompt("Image URL")

if(!url) return

socket.emit("image",{

user:user,
url:url

})

}

/* START DM */

function startDM(id,name){

dmTarget=id
dmName=name

document.getElementById("dmInfo").innerText="DM: "+name

add("<i>DM started with "+name+"</i>")

}

/* STOP DM */

function stopDM(){

dmTarget=null
dmName=null

document.getElementById("dmInfo").innerText="Public chat"

}

/* RECEIVE PUBLIC */

socket.on("message",(d)=>{

add("<b>"+d.user+"</b>: "+d.text)

})

/* RECEIVE IMAGE */

socket.on("image",(d)=>{

add("<b>"+d.user+"</b><br><img src='"+d.url+"' width='200'>")

})

/* SYSTEM */

socket.on("system",(t)=>{

add("<i>"+t+"</i>")

})

/* RECEIVE DM */

socket.on("dm",(d)=>{

add("<b>"+d.from+" (DM)</b>: "+d.text)

})

/* ONLINE USERS */

socket.on("online",(u)=>{

let count = Object.keys(u || {}).length

document.getElementById("count").innerText="Online "+count

let html=""

for(let id in u){

html += `<div class="userItem" onclick="startDM('${id}','${u[id]}')">🟢 ${u[id]}</div
