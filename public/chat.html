<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<style>

body{
margin:0;
font-family:sans-serif;
}

.header{
background:black;
color:white;
padding:10px;
display:flex;
justify-content:space-between;
}

.chat{
height:70vh;
overflow:auto;
padding:10px;
}

width:70%;
padding:10px;
}

button{
padding:10px;
}

</head>

<body>

<div class="header">

<div>

<span onclick="msg()">💬</span>
<span onclick="friends()">👥</span>
<span onclick="bell()">🔔</span>

</div>

</div>

<div id="chat" class="chat"></div>

<input id="text" placeholder="Type message">

<button onclick="send()">Send</button>

<script>

let user=localStorage.getItem("user")

function send(){

let msg=text.value

let div=document.createElement("div")

div.innerHTML="<b>"+user+":</b> "+msg

chat.appendChild(div)

text.value=""

}

}

function msg(){

alert("Private message coming soon")

}

function friends(){

alert("Friend system coming soon")

}

function bell(){

alert("No notifications")

}

</script>

</body>

</html>
