<!DOCTYPE html>
<html>

<head>

<title>Tulip Chat</title>

<style>

body{
font-family:sans-serif;
margin:0;
display:flex;
height:100vh;
}

/* SIDEBAR */

#sidebar{
width:200px;
background:#f1f1f1;
padding:10px;
display:none;
}

/* CHAT AREA */

#main{
flex:1;
display:flex;
flex-direction:column;
}

#chat{
flex:1;
overflow:auto;
padding:10px;
}

/* MESSAGE BOX */

#sendBox{
display:flex;
padding:10px;
background:#eee;
}

#msg{
flex:1;
padding:8px;
}

/* DM POPUP */

#dmPopup{
position:fixed;
right:10px;
bottom:10px;
background:white;
border:1px solid #ccc;
padding:10px;
display:none;
}

</style>

</head>

<body>

<div id="sidebar">

<h3>Online Users</h3>

<div id="onlineUsers"></div>

</div>

<div id="main">

<div style="background:#ff4f7a;color:white;padding:10px">

<button onclick="toggleMenu()">☰</button>

Tulip Chat

<span id="dmBell">🔔</span>

</div>

<div id="chat"></div>

<div id="sendBox">

<input id="msg" placeholder="Type message">

<button onclick="send()">Send</button>

<input type="file" id="imgFile">

<button onclick="sendImage()">Image/GIF</button>

</div>

</div>

<div id="dmPopup">

<input id="dmUser" placeholder="User">

<div id="dmMessages"></div>

<input id="dmInput">

<button onclick="sendDM()">Send DM</button>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="client.js"></script>

</body>

</html>
