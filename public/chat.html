<!DOCTYPE html><html><head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tulip Chat</title><script src="/socket.io/socket.io.js"></script><style>

body{
margin:0;
font-family:Arial;
background:#e6e6e6;
height:100vh;
display:flex;
flex-direction:column;
overflow:hidden;
}

/* TOP BAR */

.topbar{
background:black;
color:white;
padding:12px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-weight:bold;
}

/* CHAT */

.chat{
flex:1;
overflow-y:auto;
padding:10px;
}

.msg{
margin-bottom:12px;
}

.bubble{
background:white;
padding:10px;
border-radius:8px;
display:inline-block;
max-width:80%;
}

/* USER TAG */

.tag{
font-size:11px;
color:gray;
margin-left:6px;
}

/* INPUT */

.inputbar{
display:flex;
align-items:center;
background:white;
padding:8px;
}

.inputbar input{
flex:1;
padding:10px;
border-radius:20px;
border:1px solid #ccc;
margin:0 5px;
}

.btn{
font-size:20px;
cursor:pointer;
margin:0 5px;
}

/* LEFT MENU */

.menu{
position:fixed;
left:-260px;
top:0;
width:260px;
height:100%;
background:white;
box-shadow:2px 0 10px rgba(0,0,0,0.3);
transition:0.3s;
z-index:100;
overflow:auto;
}

.menu.show{
left:0;
}

.menu-header{
padding:20px;
background:#f3f3f3;
font-weight:bold;
}

.menu-item{
padding:15px;
border-bottom:1px solid #eee;
cursor:pointer;
}

.menu-item:hover{
background:#f0f0f0;
}

/* FRIENDS PANEL */

.friends{
position:fixed;
right:-260px;
bottom:0;
width:260px;
height:60%;
background:white;
box-shadow:-2px 0 10px rgba(0,0,0,0.3);
transition:0.3s;
z-index:100;
overflow:auto;
border-top-left-radius:10px;
}

.friends.show{
right:0;
}

.friends-header{
padding:15px;
background:#f3f3f3;
font-weight:bold;
}

/* FRIEND BUTTON */

.friendbtn{
position:fixed;
bottom:10px;
right:10px;
background:black;
color:white;
padding:10px 15px;
border-radius:10px;
font-size:20px;
cursor:pointer;
z-index:200;
}

</style></head><body><!-- LEFT MENU --><div class="menu" id="menu"><div class="menu-header">
🌷 Tulip Chat
</div><div class="menu-item">🏠 Room List</div>
<div class="menu-item">📰 News Feed</div>
<div class="menu-item">📈 Promote System</div>
<div class="menu-item">🎮 Mini Games</div>
<div class="menu-item">🏆 Leaderboards</div>
<div class="menu-item">📜 Rules</div>
<div class="menu-item">💎 Buy VIP</div>
<div class="menu-item">🎫 Support Ticket</div>
<div class="menu-item">👤 Profile</div></div><!-- FRIEND LIST --><div class="friends" id="friends"><div class="friends-header">
👥 Friends List
</div><div style="padding:10px"><div>👨 Rahul 🟢</div>
<div>👩 Neha 🟢</div>
<div>👨 Yash ⚫</div>
<div>👩 Ananya 🟢</div></div></div><!-- TOP BAR --><div class="topbar"><div onclick="toggleMenu()">☰</div><div class="logo">🌷 Tulip Chat</div><div>🔔</div></div><!-- CHAT AREA --><div class="chat" id="chat"></div><!-- INPUT BAR --><div class="inputbar"><span class="btn" onclick="uploadImage()">🖼</span>
<span class="btn" onclick="sendGIF()">🎞</span>
<span class="btn" onclick="youtube()">▶</span>
<span class="btn" onclick="uploadVideo()">🎥</span>
<span class="btn" onclick="voiceTyping()">🎤</span>

<input id="msgInput" placeholder="Type message"><span class="btn" onclick="sendMsg()">➤</span>

</div><!-- FRIEND BUTTON --><div class="friendbtn" onclick="toggleFriends()">≡</div><input type="file" id="imgFile" accept="image/*" style="display:none">
<input type="file" id="videoFile" accept="video/*" style="display:none"><script>

/* MENU TOGGLE */

function toggleMenu(){
document.getElementById("menu").classList.toggle("show")
}

/* FRIEND LIST TOGGLE */

function toggleFriends(){
document.getElementById("friends").classList.toggle("show")
}


/* SOCKET */

let socket = io()

let username = localStorage.getItem("name")
let type = localStorage.getItem("type")

socket.emit("join",{name:username,type:type})


/* SEND MESSAGE */

function sendMsg(){

let input=document.getElementById("msgInput")

if(input.value=="") return

socket.emit("message",input.value)

input.value=""

}


/* RECEIVE MESSAGE */

socket.on("message",(data)=>{

let chat=document.getElementById("chat")

let badge=""

if(data.type=="guest"){
badge="👻 Guest"
}

if(data.type=="registered"){
badge="✔ Registered"
}

chat.innerHTML+=`

<div class="msg">

<div class="bubble">

<b>${data.user}</b>

<span class="tag">${badge}</span>

<br>

${data.text}

</div>

</div>

`

chat.scrollTop=chat.scrollHeight

})


/* IMAGE */

function uploadImage(){

let file=document.getElementById("imgFile")

file.click()

file.onchange=function(){

let reader=new FileReader()

reader.onload=function(e){

document.getElementById("chat").innerHTML+=`
<div class="msg">
<img src="${e.target.result}" width="200">
</div>
`

}

reader.readAsDataURL(file.files[0])

}

}


/* GIF */

function sendGIF(){

let url=prompt("Paste GIF URL")

if(!url) return

document.getElementById("chat").innerHTML+=`

<div class="msg">

<img src="${url}" width="200">

</div>

`

}


/* YOUTUBE */

function youtube(){

let link=prompt("Paste YouTube link")

if(!link) return

let id=link.split("v=")[1]

let embed="https://www.youtube.com/embed/"+id

document.getElementById("chat").innerHTML+=`

<iframe width="250" height="150"
src="${embed}"
frameborder="0"
allowfullscreen>
</iframe>

`

}


/* VIDEO */

function uploadVideo(){

let file=document.getElementById("videoFile")

file.click()

file.onchange=function(){

let url=URL.createObjectURL(file.files[0])

document.getElementById("chat").innerHTML+=`

<video width="250" controls>

<source src="${url}">

</video>

`

}

}


/* VOICE TYPING */

function voiceTyping(){

let speech=new webkitSpeechRecognition()

speech.lang="en-US"

speech.start()

speech.onresult=function(event){

document.getElementById("msgInput").value=
event.results[0][0].transcript

}

}

</script></body>
</html>
