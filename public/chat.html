<!DOCTYPE html><html>
<head><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tulip Chat</title><style>

/* GLOBAL */

body{
margin:0;
font-family:Arial;
background:#f2f2f2;
}

/* HEADER */

.header{
background:#ff4f7b;
color:white;
padding:12px;
display:flex;
align-items:center;
justify-content:space-between;
}

.menu{
font-size:22px;
cursor:pointer;
}

/* SIDEBAR */

#sidebar{
position:fixed;
left:-260px;
top:0;
width:260px;
height:100%;
background:white;
border-right:1px solid #ddd;
padding:10px;
transition:0.3s;
overflow:auto;
}

#sidebar.open{
left:0;
}

.user{
padding:10px;
border-bottom:1px solid #eee;
cursor:pointer;
}

/* CHAT WINDOW */

#chat{
height:70vh;
overflow:auto;
background:white;
padding:10px;
}

.msg{
padding:6px;
margin-bottom:8px;
border-bottom:1px solid #eee;
}

/* INPUT AREA */

#inputArea{
display:flex;
padding:10px;
background:#eee;
}

#msg{
flex:1;
padding:8px;
}

button{
padding:8px;
margin-left:5px;
}

/* DM POPUP */

#dmPopup{
position:fixed;
right:10px;
bottom:10px;
width:260px;
background:white;
border:1px solid #ccc;
display:none;
}

#dmMessages{
height:160px;
overflow:auto;
padding:8px;
}

</style></head><body><!-- HEADER --><div class="header"><span class="menu" onclick="toggleSidebar()">☰</span>

<span>Tulip Chat</span>

<div><span id="dmBell">🔔</span>

<a id="ownerPanel"
href="/admin.html"
style="display:none;color:white;margin-left:10px">
Owner Panel
</a>

</div></div><!-- SIDEBAR --><div id="sidebar"><h3>Online Users</h3><div id="onlineUsers"></div></div><!-- CHAT --><div id="chat"></div><!-- MESSAGE INPUT --><div id="inputArea"><input id="msg" placeholder="Type message"><button onclick="send()">Send</button>

<input type="file" id="imgFile"><button onclick="sendImage()">Image</button>

</div><!-- DM POPUP --><div id="dmPopup"><div id="dmMessages"></div><input id="dmInput" placeholder="DM message"><button onclick="sendDM()">Send</button>

<button onclick="closeDM()">Close</button>

</div><!-- SOCKET --><script src="/socket.io/socket.io.js"></script><!-- CLIENT LOGIC --><script src="client.js"></script><!-- UI SCRIPT --><script>

function toggleSidebar(){

document.getElementById("sidebar")
.classList.toggle("open")

}

function openDM(){

document.getElementById("dmPopup")
.style.display="block"

}

function closeDM(){

document.getElementById("dmPopup")
.style.display="none"

}

</script></body>
</html>
