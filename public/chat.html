<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Tulip Chat</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f4f4f4;
display:flex;
flex-direction:column;
height:100vh;
}

#header{
background:#ff2d6f;
color:white;
padding:15px;
font-size:20px;
display:flex;
justify-content:space-between;
}

#messages{
flex:1;
overflow-y:auto;
padding:10px;
display:flex;
flex-direction:column;
}

.message{
background:white;
padding:10px;
border-radius:6px;
margin-bottom:8px;
max-width:80%;
}

.system{
text-align:center;
color:#666;
}

#sendBar{
display:flex;
gap:6px;
padding:10px;
background:white;
border-top:1px solid #ddd;
}

#messageInput{
flex:1;
padding:10px;
border:1px solid #ccc;
border-radius:6px;
font-size:16px;
}

button{
padding:10px 14px;
background:#ff2d6f;
color:white;
border:none;
border-radius:6px;
font-size:16px;
}

img{
max-width:200px;
border-radius:6px;
margin-top:5px;
}

</style>

</head>

<body>

<div id="header">

<div>🌷 Tulip Chat</div>

<div onclick="logout()" style="cursor:pointer">Logout</div>

</div>

<div id="messages"></div>

<div id="sendBar">

<input id="messageInput" placeholder="message">

<button onclick="sendMessage()">Send</button>

<input type="file" id="imageUpload" hidden>

<button onclick="openImage()">📷</button>

<button onclick="sendGIF()">GIF</button>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

let username = localStorage.getItem("username");

if(!username){
username = prompt("Enter name");
localStorage.setItem("username",username);
}

socket.emit("join",username);

const messages = document.getElementById("messages");
const input = document.getElementById("messageInput");

function addMessage(data){

let div = document.createElement("div");

if(data.type==="system"){

div.className="system";
div.innerHTML=data.text;

}

else if(data.type==="image"){

div.className="message";
div.innerHTML="<b>"+data.user+":</b><br><img src='"+data.text+"'>";

}

else{

div.className="message";
div.innerHTML="<b>"+data.user+":</b> "+data.text;

}

messages.appendChild(div);

messages.scrollTop=messages.scrollHeight;

}

socket.on("message",(data)=>{

addMessage(data);

});

function sendMessage(){

let text=input.value.trim();

if(!text) return;

socket.emit("message",{

user:username,
text:text,
type:"text"

});

input.value="";

}

input.addEventListener("keypress",(e)=>{

if(e.key==="Enter") sendMessage();

});

function openImage(){

document.getElementById("imageUpload").click();

}

document.getElementById("imageUpload").addEventListener("change",function(){

const file=this.files[0];

const reader=new FileReader();

reader.onload=function(){

socket.emit("message",{

user:username,
text:reader.result,
type:"image"

});

};

reader.readAsDataURL(file);

});

function sendGIF(){

const url=prompt("Paste GIF link");

if(!url) return;

socket.emit("message",{

user:username,
text:url,
type:"image"

});

}

function logout(){

localStorage.removeItem("username");

location.href="login.html";

}

</script>

</body>
</html>
