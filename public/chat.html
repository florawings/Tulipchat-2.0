<!DOCTYPE html><html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Tulip Chat</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;font-family:Arial;background:#f5e3ea}/* HEADER */
#header{
display:flex;align-items:center;justify-content:space-between;
background:#ff3d6e;color:white;padding:10px
}
#leftHead{display:flex;align-items:center;gap:8px}
#title{font-weight:bold}
.topBtn{background:none;border:none;color:white;font-size:20px}

/* SIDEBAR */
#sidebar{
position:fixed;left:-220px;top:0;width:200px;height:100%;
background:white;padding:15px;transition:.3s;z-index:10;border-right:1px solid #ddd
}
#sidebar.open{left:0}
#users .u{padding:6px 0;border-bottom:1px solid #eee;cursor:pointer}

/* CHAT */
#chatBox{
height:68vh;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px
}
.msg{
background:#ff3d6e;color:white;padding:10px 14px;border-radius:18px;max-width:75%
}
.msg img{max-width:200px;border-radius:10px}

/* INPUT */
#inputArea{display:flex;gap:6px;padding:10px}
#text{flex:1;padding:10px;border-radius:20px;border:1px solid #ccc}
.btn{background:#ff3d6e;color:white;border:none;padding:10px 14px;border-radius:10px}

/* INBOX BADGE */
#inboxWrap{position:relative}
#dmCount{
position:absolute;right:-6px;top:-6px;background:red;color:white;
font-size:11px;padding:2px 6px;border-radius:10px
}
</style>

</head>
<body><div id="header">
  <div id="leftHead">
    <button class="topBtn" onclick="toggleMenu()">☰</button>
    <div id="title">🌷 Tulip Chat</div>
  </div>
  <div style="display:flex;gap:8px">
    <button class="topBtn" onclick="goBack()">⬅</button>
    <span id="inboxWrap">
      <button class="topBtn" onclick="openInbox()">📥</button>
      <span id="dmCount">0</span>
    </span>
    <button class="topBtn" onclick="refreshChat()">🔄</button>
  </div>
</div><div id="sidebar">
  <h3>Online Users</h3>
  <div id="online">0 users online</div>
  <div id="users"></div>
</div><div id="chatBox"></div><div id="inputArea">
  <input id="text" placeholder="Type message">
  <button class="btn" onclick="send()">Send</button>
  <input type="file" id="file" hidden>
  <button class="btn" onclick="pick()">📷</button>
</div><script src="/socket.io/socket.io.js"></script><script>
const socket=io()

const name=localStorage.getItem("username")
const gender=localStorage.getItem("gender")

if(!name){ location.href="login.html" }

let dmCount=0

function avatar(g){ return g==="female"?"👩":"👨" }

socket.emit("join",{name,gender})

function send(){
const msg=document.getElementById("text").value
if(!msg) return
socket.emit("message",{user:name,gender,msg})
text.value=""
}

socket.on("message",(d)=>{
const div=document.createElement("div")
div.className="msg"
const icon=avatar(d.gender)
if(d.msg && d.msg.startsWith("/uploads")){
div.innerHTML=icon+" "+d.user+"<br><img src='"+d.msg+"'>"
}else{
div.innerText=icon+" "+d.user+": "+d.msg
}
chatBox.appendChild(div)
chatBox.scrollTop=chatBox.scrollHeight
})

socket.on("clearChat",()=>{ chatBox.innerHTML="" })

socket.on("online",(list)=>{
users.innerHTML=""
let count=0
for(let id in list){
count++
const u=document.createElement("div")
u.className="u"
u.innerText=avatar(list[id].gender)+" "+list[id].name
u.onclick=()=>startDM(id,list[id].name)
users.appendChild(u)
}
online.innerText=count+" users online"
})

function startDM(id,name){
socket.emit("openDM",{to:id,name})
}

socket.on("dm",(data)=>{
dmCount++
document.getElementById("dmCount").innerText=dmCount
})

function openInbox(){ location.href="dm.html" }

function pick(){ file.click() }

file.onchange=()=>{
const f=file.files[0]
const fd=new FormData()
fd.append("file",f)
fetch("/upload",{method:"POST",body:fd})
.then(r=>r.json())
.then(d=>{
socket.emit("message",{user:name,gender,msg:d.url})
})
}

function toggleMenu(){ sidebar.classList.toggle("open") }

function refreshChat(){ location.reload() }

function goBack(){ sidebar.classList.remove("open") }
</script></body>
</html>
