<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Tulip Chat</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="sidebar">

<h2>Tulip Chat</h2>

<div onclick="joinRoom('normal')">Normal Room</div>

<div onclick="joinRoom('adult')">Adult Room</div>

<div onclick="joinRoom('private')">Private Room</div>

<h3>Online Users</h3>

<div id="online"></div>

</div>

<div id="chat">

<div id="messages"></div>

<div id="typing"></div>

<div id="input">

<input id="text" placeholder="Type message">

<button onclick="send()">Send</button>

<input type="file" id="file">

</div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io()

let username = localStorage.getItem("username")

if(!username){

username = prompt("Enter username")

localStorage.setItem("username",username)

}

let room="normal"

socket.emit("join",{username,room})

function joinRoom(r){

room=r

messages.innerHTML=""

setTheme(r)

socket.emit("join",{username,room})

}

function setTheme(r){

if(r=="normal"){

document.body.className="normal"

}

if(r=="adult"){

document.body.className="adult"

}

if(r=="private"){

document.body.className="private"

}

}

function add(html,type){

let div=document.createElement("div")

div.className="msg "+(type||"")

div.innerHTML=html

messages.appendChild(div)

messages.scrollTop=messages.scrollHeight

}

function send(){

let text=document.getElementById("text").value

if(!text)return

socket.emit("message",{user:username,msg:text,room})

text.value=""

}

socket.on("message",(data)=>{

add("<b>"+data.user+"</b> ["+data.room+"]<br>"+data.msg)

})

socket.on("system",(msg)=>{

add(msg,"system")

})

socket.on("online",(list)=>{

online.innerHTML="Online: "+list.length+"<br>"+list.join("<br>")

})

file.onchange=function(){

let f=this.files[0]

let reader=new FileReader()

reader.onload=function(){

let url=reader.result

let ext=f.name.split(".").pop()

let media=""

if(ext=="mp4"){

media=`<video src="${url}" controls width="200"></video>`

}

else{

media=`<img src="${url}" width="200">`

}

socket.emit("message",{user:username,msg:media,room})

}

reader.readAsDataURL(f)

}

</script>

</body>

</html>
