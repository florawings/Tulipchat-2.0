<!DOCTYPE html>
<html>
<head>
<title>Tulip Chat 3.0</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="/socket.io/socket.io.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#f2f2f2;
}

/* HEADER */

.header{
background:#ff2e93;
color:white;
padding:12px;
display:flex;
align-items:center;
}

#back{
display:none;
margin-right:10px;
background:white;
border:none;
border-radius:6px;
padding:4px 8px;
}

/* LAYOUT */

.container{
display:flex;
height:calc(100vh - 60px);
}

/* USERS */

.users{
width:28%;
background:black;
color:white;
overflow:auto;
}

.user{
padding:12px;
border-bottom:1px solid #333;
cursor:pointer;
position:relative;
}

.dot{
width:10px;
height:10px;
background:red;
border-radius:50%;
position:absolute;
right:10px;
top:15px;
display:none;
}

/* CHAT */

.chat{
flex:1;
display:flex;
flex-direction:column;
}

#messages{
flex:1;
overflow:auto;
padding:10px;
}

/* MESSAGE BUBBLES */

.msg{
max-width:70%;
padding:10px;
margin:6px 0;
border-radius:16px;
}

.me{
background:#ff2e93;
color:white;
margin-left:auto;
}

.other{
background:white;
}

/* INPUT */

.input{
display:flex;
padding:10px;
background:#ddd;
}

.input input{
flex:1;
padding:10px;
}

.btn{
padding:10px;
border:none;
margin-left:6px;
border-radius:6px;
}

.send{background:#ff2e93;color:white;}
.cam{background:#2196f3;color:white;}

</style>
</head>

<body>

<div class="header">

<button id="back" onclick="goBack()">⬅</button>

<span id="title">🌷 Tulip Chat</span>

</div>

<div class="container">

<div class="users" id="userList"></div>

<div class="chat">

<div id="messages"></div>

<div class="input">

<input id="msg" placeholder="message">

<button class="btn send" onclick="send()">Send</button>

<button class="btn cam" onclick="openGallery()">📷</button>

<input type="file" id="file" accept="image/*" style="display:none">

</div>

</div>

</div>

<script>

const socket = io()

let username = prompt("Enter name")

socket.emit("join",{name:username})

let currentDM=null
let dmStore={}
let notifications={}

const messages=document.getElementById("messages")

function add(text,type){

messages.innerHTML+=`<div class="msg ${type}">${text}</div>`

messages.scrollTop=messages.scrollHeight

}

/* SEND MESSAGE */

function send(){

let text=msg.value
if(!text)return

if(currentDM){

socket.emit("dm",{to:currentDM,user:username,text:text})

dmStore[currentDM].push({text:text,me:true})

renderDM()

}else{

socket.emit("message",{user:username,text:text})

add(text,"me")

}

msg.value=""

}

/* RECEIVE PUBLIC */

socket.on("message",(d)=>{

if(currentDM)return

add(d.user+": "+d.text,"other")

})

/* RECEIVE DM */

socket.on("dm",(d)=>{

if(!dmStore[d.user])dmStore[d.user]=[]

dmStore[d.user].push({text:d.text,me:false})

if(currentDM===d.user){

renderDM()

}else{

notifications[d.user]=true
renderUsers()

}

})

/* OPEN DM */

function openDM(user){

currentDM=user

if(!dmStore[user])dmStore[user]=[]

notifications[user]=false

document.getElementById("title").innerText="DM with "+user
document.getElementById("back").style.display="block"

renderDM()

}

/* RENDER DM */

function renderDM(){

messages.innerHTML=""

dmStore[currentDM].forEach(m=>{

let type=m.me?"me":"other"

add(m.text,type)

})

}

/* BACK */

function goBack(){

currentDM=null

document.getElementById("title").innerText="🌷 Tulip Chat"
document.getElementById("back").style.display="none"

messages.innerHTML=""

}

/* USER LIST */

function renderUsers(){

let html=""

for(let u in notifications){

let show=notifications[u]?"block":"none"

html+=`
<div class="user" onclick="openDM('${u}')">
${u}
<div class="dot" style="display:${show}"></div>
</div>
`

}

userList.innerHTML=html

}

socket.on("online",(users)=>{

notifications={}

for(let id in users){

let name=users[id].name

if(name!==username){

notifications[name]=false

}

}

renderUsers()

})

/* IMAGE */

function openGallery(){

file.click()

}

file.addEventListener("change",function(){

let f=this.files[0]

let reader=new FileReader()

reader.onload=function(e){

add(`<img src="${e.target.result}" width="150">`,"me")

}

reader.readAsDataURL(f)

})

</script>

</body>
</html>
