<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Tulip Chat</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="sidebar">

<h2>Online</h2>

<div id="users"></div>

</div>

<div id="main">

<div id="header">

🌷 Tulip Chat

</div>

<div id="messages"></div>

<div id="typing"></div>

<div id="sendBar">

<input id="msgInput" placeholder="message">

<button onclick="sendMsg()">Send</button>

<input type="file" id="imageUpload" hidden accept="image/*">
<button onclick="openImage()">📷</button>

<input type="file" id="gifUpload" hidden accept="image/gif">
<button onclick="openGif()">GIF</button>

<button onclick="toggleEmoji()">😊</button>

</div>

</div>

<div id="emojiPanel">

<span onclick="addEmoji('😀')">😀</span>
<span onclick="addEmoji('😂')">😂</span>
<span onclick="addEmoji('❤️')">❤️</span>
<span onclick="addEmoji('🔥')">🔥</span>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="client.js"></script>

</body>
</html>
