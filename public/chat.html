<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Tulip Chat</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f2f2f2;
}

header{
background:#ff2d7a;
color:white;
padding:12px;
display:flex;
justify-content:space-between;
}

#chat{
padding:10px;
height:70vh;
overflow:auto;
}

.msg{
background:white;
padding:10px;
margin:5px;
border-radius:6px;
}

.system{
background:#ddd;
}

.bottom{
position:fixed;
bottom:0;
left:0;
right:0;
display:flex;
}

.bottom input{
flex:1;
padding:12px;
border:none;
}

button{
border:none;
padding:12px;
background:#ff2d7a;
color:white;
}

img{
max-width:200px;
border-radius:6px;
}

#usersBox{

display:none;
position:fixed;
right:10px;
top:60px;
width:200px;
background:white;
border:1px solid #ccc;
padding:10px;
max-height:300px;
overflow:auto;

}

</style>

</head>

<body>

<header>

<span>🌷 Tulip Chat</span>

<div>

<button onclick="toggleUsers()">👥</button>
<button onclick="logout()">Logout</button>

</div>

</header>

<div id="usersBox"></div>

<div id="chat"></div>

<div class="bottom">

<input id="msg" placeholder="message">

<button onclick="send()">Send</button>

<input type="file" id="file" hidden>

<button onclick="upload()">📷</button>

<input type="file" id="giffile" accept="image/gif" hidden>

<button onclick="gifUpload()">GIF</button>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io()

let name = localStorage.getItem("name")

if(!name){

name = prompt("Enter name")

localStorage.setItem("name",name)

}

socket.emit("join",name)

function send(){

let text=msg.value

if(!text) return

socket.emit("message",{

name:name,
text:text

})

msg.value=""

}

socket.on("message",(data)=>{

addMsg(data.name+": "+data.text)

})

socket.on("system",(text)=>{

addMsg(text,true)

})

socket.on("image",(data)=>{

addImage(data.name,data.url)

})

socket.on("gif",(data)=>{

addImage(data.name,data.url)

})

function upload(){

file.click()

}

file.onchange=function(){

let reader=new FileReader()

reader.onload=function(){

socket.emit("image",{

name:name,
url:reader.result

})

}

reader.readAsDataURL(file.files[0])

}

function gifUpload(){

giffile.click()

}

giffile.onchange=function(){

let reader=new FileReader()

reader.onload=function(){

socket.emit("gif",{

name:name,
url:reader.result

})

}

reader.readAsDataURL(giffile.files[0])

}

function logout(){

socket.emit("leave",name)

localStorage.removeItem("name")

location.reload()

}

function addMsg(text,system){

let div=document.createElement("div")

div.className="msg"

if(system) div.className+=" system"

div.innerText=text

chat.appendChild(div)

chat.scrollTop=chat.scrollHeight

}

function addImage(user,url){

let div=document.createElement("div")

div.className="msg"

div.innerHTML=user+"<br><img src='"+url+"'>"

chat.appendChild(div)

chat.scrollTop=chat.scrollHeight

}

function toggleUsers(){

let box=document.getElementById("usersBox")

box.style.display = box.style.display==="block" ? "none":"block"

}

socket.on("users",(list)=>{

let box=document.getElementById("usersBox")

box.innerHTML="<b>Online Users</b><hr>"

for(let id in list){

let div=document.createElement("div")

div.innerText=list[id]

box.appendChild(div)

}

})

</script>

</body>
</html>
