<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Tulip Chat</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
height:100vh;
display:flex;
flex-direction:column;
background:#f6dbe0;
overflow:hidden;
}

/* HEADER */

#header{
height:50px;
background:#ff2f6e;
color:white;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 10px;
font-size:18px;
}

/* MAIN */

#main{
flex:1;
display:flex;
}

/* CHAT */

#chatSection{
width:70%;
display:flex;
flex-direction:column;
border-right:1px solid #ccc;
}

#chat{
flex:1;
overflow-y:auto;
padding:10px;
display:flex;
flex-direction:column;
gap:8px;
}

/* MESSAGE */

.msg{
background:#ff2f6e;
color:white;
padding:10px;
border-radius:12px;
max-width:75%;
font-size:14px;
}

/* INPUT */

#inputBar{
height:60px;
display:flex;
gap:6px;
padding:6px;
background:white;
border-top:1px solid #ccc;
}

#text{
flex:1;
padding:8px;
border-radius:20px;
border:1px solid #ccc;
}

/* USERS */

#usersSection{
width:30%;
background:white;
display:flex;
flex-direction:column;
}

#usersHeader{
padding:10px;
background:#eee;
font-weight:bold;
}

#onlineList{
flex:1;
overflow:auto;
}

.userItem{
padding:8px;
border-bottom:1px solid #eee;
display:flex;
justify-content:space-between;
align-items:center;
font-size:14px;
}

/* ADMIN BUTTON */

.adminBtn{
margin-left:4px;
font-size:11px;
padding:2px 4px;
}

</style>

</head>

<body>

<div id="header">

<div>🌷 Tulip Chat</div>

<div>

<button onclick="clearChat()">🧹</button>

<button onclick="location.reload()">🔄</button>

</div>

</div>

<div id="main">

<!-- CHAT -->

<div id="chatSection">

<div id="chat"></div>

<div id="inputBar">

<input id="text" placeholder="Type message">

<button onclick="send()">Send</button>

</div>

</div>

<!-- USERS -->

<div id="usersSection">

<div id="usersHeader">Online Users</div>

<div id="onlineList"></div>

</div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io()

let username = localStorage.getItem("username")
let gender = localStorage.getItem("gender")
let role = localStorage.getItem("role")

let blockedUsers = []

if(!username){

location.href="/login.html"

}

/* BADGE */

function badge(r){

if(r==="owner") return "👑"

if(r==="superadmin") return "⭐"

return "👤"

}

/* JOIN */

socket.emit("join",{

username,
gender,
role

})

/* SEND MESSAGE */

function send(){

let msg = text.value.trim()

if(!msg) return

socket.emit("message",{

username,
gender,
role,
msg

})

text.value=""

}

/* RECEIVE MESSAGE */

socket.on("message",(d)=>{

if(blockedUsers.includes(d.username)) return

let div=document.createElement("div")

div.className="msg"

div.innerText = badge(d.role)+" "+d.username+": "+d.msg

chat.appendChild(div)

chat.scrollTop = chat.scrollHeight

})

/* CLEAR COMMAND */

function clearChat(){

socket.emit("message",{

username,
gender,
role,
msg:"/clear"

})

}

socket.on("clearChat",()=>{

chat.innerHTML=""

})

/* BLOCK USER */

function blockUser(user){

blockedUsers.push(user)

socket.emit("blockUser",{

blocker:username,
target:user

})

alert(user+" blocked")

}

/* ADMIN ACTIONS */

function banUser(user){

socket.emit("banUser",{

target:user,
role:role

})

}

function muteUser(user){

socket.emit("muteUser",{

target:user,
role:role

})

}

function kickUser(user){

socket.emit("kickUser",{

target:user,
role:role

})

}

/* ONLINE USERS */

socket.on("onlineUsers",(users)=>{

onlineList.innerHTML=""

users.forEach(u=>{

let div=document.createElement("div")

div.className="userItem"

let left = document.createElement("span")

left.innerText = badge(u.role)+" "+u.username

div.appendChild(left)

let controls = document.createElement("span")

/* BLOCK */

let block=document.createElement("button")

block.innerText="🚫"

block.className="adminBtn"

block.onclick=()=>blockUser(u.username)

controls.appendChild(block)

/* OWNER / ADMIN OPTIONS */

if(role==="owner" || role==="superadmin"){

let ban=document.createElement("button")

ban.innerText="Ban"

ban.className="adminBtn"

ban.onclick=()=>banUser(u.username)

controls.appendChild(ban)

let mute=document.createElement("button")

mute.innerText="Mute"

mute.className="adminBtn"

mute.onclick=()=>muteUser(u.username)

controls.appendChild(mute)

let kick=document.createElement("button")

kick.innerText="Kick"

kick.className="adminBtn"

kick.onclick=()=>kickUser(u.username)

controls.appendChild(kick)

}

div.appendChild(controls)

onlineList.appendChild(div)

})

})

</script>

</body>

</html>
