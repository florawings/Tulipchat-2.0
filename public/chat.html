<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Tulip Chat</title>

<style>

body{
font-family:Arial;
background:#ffd6df;
display:flex;
flex-direction:column;
height:100vh;
}

#main{
flex:1;
display:flex;
}

#chat{
width:70%;
overflow:auto;
padding:10px;
}

#users{
width:30%;
background:white;
overflow:auto;
}

.msg{
background:#ff2f6e;
color:white;
padding:8px;
margin:6px;
border-radius:8px;
}

.user{
padding:8px;
border-bottom:1px solid #eee;
}

</style>

</head>

<body>

<h2>Tulip Chat</h2>

<div id="main">

<div id="chat"></div>

<div id="users"></div>

</div>

<input id="text">

<button onclick="send()">Send</button>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io()

let username = prompt("Enter name")

let role="user"

if(username==="Lord_lucifer") role="owner"
if(username==="Garima") role="superadmin"

socket.emit("join",{username})

function badge(r){

if(r==="owner") return "👑"
if(r==="superadmin") return "⭐"
return "👤"

}

/* SEND */

function send(){

let msg=text.value

socket.emit("message",{

username,
msg

})

text.value=""

}

/* RECEIVE */

socket.on("message",(d)=>{

let div=document.createElement("div")

div.className="msg"

div.innerText=badge(d.role)+" "+d.username+" : "+d.msg

chat.appendChild(div)

})

/* SYSTEM */

socket.on("system",(msg)=>{

let div=document.createElement("div")

div.innerText="⚠ "+msg

chat.appendChild(div)

})

/* ONLINE USERS */

socket.on("onlineUsers",(users)=>{

usersDiv.innerHTML=""

users.forEach(u=>{

let div=document.createElement("div")

div.className="user"

div.innerHTML=

badge(u.role)+" "+u.username+

` <button onclick="ban('${u.username}')">Ban</button>
<button onclick="mute('${u.username}')">Mute</button>
<button onclick="kick('${u.username}')">Kick</button>`

users.appendChild(div)

})

})

function ban(user){

socket.emit("banUser",user)

}

function mute(user){

socket.emit("muteUser",user)

}

function kick(user){

socket.emit("kickUser",user)

}

</script>

</body>

</html>
