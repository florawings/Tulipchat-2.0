<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tulip Chat</title>

<style>

body{
margin:0;
font-family:Arial;
background:#eee;
}

header{
background:#ff2d7a;
color:white;
padding:12px;
display:flex;
justify-content:space-between;
}

#users{
background:#fff;
padding:8px;
font-size:14px;
}

#chat{
height:68vh;
overflow:auto;
padding:10px;
}

.msg{
background:white;
padding:10px;
margin:6px;
border-radius:6px;
}

.system{
background:#ddd;
}

.bottom{
position:fixed;
bottom:0;
left:0;
right:0;
display:flex;
}

.bottom input{
flex:1;
padding:12px;
border:none;
}

button{
border:none;
padding:12px;
background:#ff2d7a;
color:white;
}

/* thumbnail */

.chat-img{
max-width:150px;
border-radius:6px;
cursor:pointer;
}

/* fullscreen viewer */

#viewer{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.9);
justify-content:center;
align-items:center;
z-index:1000;
}

#viewer img{
max-width:95%;
max-height:95%;
}

</style>

</head>

<body>

<header>

<span>🌷 Tulip Chat</span>

<button onclick="logout()">Logout</button>

</header>

<div id="users">Online:</div>

<div id="chat"></div>

<div class="bottom">

<input id="msg" placeholder="message">

<button onclick="send()">Send</button>

<input type="file" id="imageInput" hidden accept="image/*">
<button onclick="openGallery()">📷</button>

<input type="file" id="gifInput" hidden accept="image/gif">
<button onclick="openGif()">GIF</button>

</div>

<!-- fullscreen viewer -->

<div id="viewer">
<img id="viewerImg">
</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io()

const chat = document.getElementById("chat")
const msg = document.getElementById("msg")

let name = localStorage.getItem("name")

if(!name){

name = prompt("Enter name")

localStorage.setItem("name",name)

}

socket.emit("join",{name})

/* send message */

function send(){

if(!msg.value) return

socket.emit("message",{
name:name,
text:msg.value
})

msg.value=""

}

/* receive text */

socket.on("message",(data)=>{

addMsg(data.name+": "+data.text)

})

/* system message */

socket.on("system",(text)=>{

addMsg(text,true)

})

/* online users */

socket.on("users",(list)=>{

document.getElementById("users").innerText =
"Online: "+list.join(", ")

})

/* receive image */

socket.on("image",(data)=>{

let div=document.createElement("div")

div.className="msg"

div.innerHTML=data.name+
"<br><img class='chat-img' src='"+data.url+"' onclick=\"openViewer('"+data.url+"')\">"

chat.appendChild(div)

chat.scrollTop=chat.scrollHeight

})

/* open gallery */

function openGallery(){

document.getElementById("imageInput").click()

}

function openGif(){

document.getElementById("gifInput").click()

}

imageInput.onchange=function(){

uploadFile(this.files[0])

}

gifInput.onchange=function(){

uploadFile(this.files[0])

}

/* upload */

function uploadFile(file){

let formData=new FormData()

formData.append("file",file)

let xhr=new XMLHttpRequest()

xhr.open("POST","/upload",true)

xhr.onload=function(){

let data=JSON.parse(xhr.responseText)

socket.emit("image",{
name:name,
url:data.url
})

}

xhr.send(formData)

}

/* add message */

function addMsg(text,system){

let div=document.createElement("div")

div.className="msg"

if(system) div.className+=" system"

div.innerText=text

chat.appendChild(div)

chat.scrollTop=chat.scrollHeight

}

/* fullscreen viewer */

function openViewer(src){

let viewer=document.getElementById("viewer")
let img=document.getElementById("viewerImg")

img.src=src

viewer.style.display="flex"

}

document.getElementById("viewer").onclick=function(){

this.style.display="none"

}

function logout(){

localStorage.clear()

location.reload()

}

</script>

</body>

</html>
