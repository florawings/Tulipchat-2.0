<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tulip Pro</title>
    <style>
        :root { --main: #f43f5e; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; }
        * { box-sizing: border-box; font-family: sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        header { height: 60px; background: var(--card); display: flex; align-items: center; padding: 0 15px; justify-content: space-between; border-bottom: 1px solid #334155; }
        #chat-scroller { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        
        .msg { max-width: 80%; padding: 10px; border-radius: 12px; font-size: 14px; position: relative; }
        .msg.me { align-self: flex-end; background: var(--main); border-bottom-right-radius: 2px; }
        .msg.other { align-self: flex-start; background: var(--card); border-bottom-left-radius: 2px; }
        .tag { font-size: 10px; font-weight: bold; display: block; margin-bottom: 4px; opacity: 0.7; }
        .chat-img { max-width: 100%; border-radius: 8px; margin-top: 5px; }

        #prog-container { display: none; width: 100%; height: 20px; background: #000; position: fixed; bottom: 70px; border-top: 1px solid var(--main); }
        #prog-bar { height: 100%; background: var(--main); width: 0%; text-align: center; font-size: 12px; line-height: 20px; font-weight: bold; }

        .bottom-nav { padding: 10px; background: var(--bg); border-top: 1px solid #334155; }
        .input-wrap { display: flex; align-items: center; background: var(--card); padding: 5px 15px; border-radius: 25px; gap: 10px; }
        #msgIn { flex: 1; background: none; border: none; color: white; padding: 10px; outline: none; }
        .icon-btn { font-size: 20px; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <div onclick="location.reload()">🔄 Refresh</div>
    <div style="font-weight:bold;">TULIP PRO</div>
    <div id="uName"></div>
</header>

<div id="chat-scroller"></div>

<div id="prog-container"><div id="prog-bar">0%</div></div>

<div class="bottom-nav">
    <div class="input-wrap">
        <span onclick="document.getElementById('fileIn').click()">🖼️</span>
        <input type="file" id="fileIn" hidden onchange="uploadFile()">
        <input type="text" id="msgIn" placeholder="Type message...">
        <span style="color:var(--main)" onclick="send()">🚀</span>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    const params = new URLSearchParams(window.location.search);
    const username = params.get('username') || "User";
    const gender = params.get('gender') || "Male";
    document.getElementById('uName').innerText = username;

    socket.emit('join', { username, gender });

    function send() {
        const input = document.getElementById('msgIn');
        if(input.value.trim()) {
            socket.emit('sendMessage', { message: input.value, type: 'text' });
            input.value = '';
        }
    }

    socket.on('loadHistory', (msgs) => {
        msgs.forEach(m => renderMsg(m));
    });

    socket.on('newMessage', (m) => renderMsg(m));

    function renderMsg(data) {
        const box = document.getElementById('chat-scroller');
        const div = document.createElement('div');
        div.className = `msg ${data.user === username ? 'me' : 'other'}`;
        let html = `<span class="tag">${data.user}</span>`;
        if(data.type === 'file') html += `<img src="${data.text}" class="chat-img">`;
        else html += `<div>${data.text}</div>`;
        div.innerHTML = html;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    function uploadFile() {
        const file = document.getElementById('fileIn').files[0];
        const fd = new FormData();
        fd.append('chatFile', file);
        const xhr = new XMLHttpRequest();
        document.getElementById('prog-container').style.display = 'block';
        xhr.upload.onprogress = (e) => {
            let p = Math.round((e.loaded/e.total)*100);
            document.getElementById('prog-bar').style.width = p+'%';
            document.getElementById('prog-bar').innerText = p+'% UPLOADING...';
        };
        xhr.onload = () => {
            const res = JSON.parse(xhr.responseText);
            socket.emit('sendMessage', { message: res.url, type: 'file' });
            document.getElementById('prog-container').style.display = 'none';
        };
        xhr.open('POST', '/upload');
        xhr.send(fd);
    }
</script>
</body>
</html>
