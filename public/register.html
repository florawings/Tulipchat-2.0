<!DOCTYPE html>
<html>

<head>
<title>Register</title>

<style>

body{
font-family:Arial;
background:#111827;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:white;
padding:30px;
border-radius:10px;
width:250px;
}

input{
width:100%;
padding:10px;
margin:5px 0;
}

button{
width:100%;
padding:10px;
background:#22c55e;
border:none;
color:white;
}

</style>

</head>

<body>

<div class="box">

<h3>Register</h3>

<input id="user" placeholder="Username">

<input id="pass" type="password" placeholder="Password">

<button onclick="register()">Create Account</button>

</div>

<script>

function register(){

let u=document.getElementById("user").value
let p=document.getElementById("pass").value

let users=JSON.parse(localStorage.getItem("users")||"{}")

users[u]=p

localStorage.setItem("users",JSON.stringify(users))

alert("Account created")

location="login.html"

}

</script>

</body>

</html>
