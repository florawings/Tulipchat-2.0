<!DOCTYPE html>
<html>
<head>
<title>Tulip Chat</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="login">

<h2>🌷 Tulip Chat</h2>

<input id="name" placeholder="Enter username">

<button onclick="go()">Enter Chat</button>

</div>

<script>

function go(){

let n=document.getElementById("name").value

localStorage.setItem("user",n)

location="chat.html"

}

</script>

</body>
</html>
