<div class="app-container">
    <aside class="sidebar" id="user-list">
        <h3>Online Users</h3>
        </aside>

    <main class="global-area">
        <div id="global-messages"></div>
        <div class="input-box">
            <input type="text" id="global-input" placeholder="Message to everyone...">
            <button onclick="sendGlobal()">Send</button>
        </div>
    </main>

    <section class="dm-panel" id="dm-section">
        <h4 id="dm-target-name">Private Chat</h4>
        <div id="private-messages"></div>
        <div class="input-box">
            <input type="text" id="private-input" placeholder="Reply...">
            <button onclick="sendPrivate()">➤</button>
        </div>
    </section>
</div>
