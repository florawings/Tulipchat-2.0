<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tulip Chat</title>

<style>

body{
font-family:Arial;
background:#f5f5f5;
text-align:center;
margin-top:80px;
}

.box{
background:white;
padding:25px;
width:90%;
max-width:350px;
margin:auto;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input,select{
width:100%;
padding:10px;
margin:8px 0;
border-radius:6px;
border:1px solid #ccc;
}

button{
width:100%;
padding:12px;
background:#ff2d7a;
color:white;
border:none;
border-radius:6px;
font-size:16px;
}

h2{
color:#ff2d7a;
}

</style>

</head>

<body>

<div class="box">

<h2>🌷 Tulip Chat</h2>

<input id="name" placeholder="Username">

<select id="gender">
<option value="">Select Gender</option>
<option>Male</option>
<option>Female</option>
</select>

<input type="date" id="dob">

<button onclick="enter()">Enter Chat</button>

</div>

<script>

function enter(){

let name=document.getElementById("name").value
let gender=document.getElementById("gender").value
let dob=document.getElementById("dob").value

if(!name || !gender || !dob){
alert("Fill all fields")
return
}

let birth=new Date(dob)
let today=new Date()

let age=today.getFullYear()-birth.getFullYear()

if(age<18){
alert("18+ only allowed")
return
}

localStorage.setItem("name",name)
localStorage.setItem("gender",gender)

window.location="chat.html"

}

</script>

</body>
</html>
