<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
margin:0;
font-family:sans-serif;
background:url("https://images.unsplash.com/photo-1529156069898-49953e39b3ac") center/cover;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

.card{
background:white;
padding:30px;
border-radius:10px;
width:300px;
text-align:center;
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:5px;
font-size:16px;
}

.login{background:#4caf50;color:white;}
.guest{background:black;color:white;}
.register{background:#2196f3;color:white;}

input{
width:100%;
padding:10px;
margin-top:10px;
}

</style>

</head>

<body>

<div class="card">

<h2>🌷 Tulip Chat</h2>

<input id="user" placeholder="Username">

<input id="pass" type="password" placeholder="Password">

<button class="login" onclick="login()">Login</button>

<button class="guest" onclick="guest()">Guest Login</button>

<button class="register" onclick="window.location='register.html'">Register</button>

</div>

<script>

function login(){

let u=document.getElementById("user").value

localStorage.setItem("user",u)

window.location="chat.html"

}

function guest(){

let g="Guest"+Math.floor(Math.random()*999)

localStorage.setItem("user",g)

window.location="chat.html"

}

</script>

</body>
</html>
