<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tulips Chat</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <div id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <h3>Main Room</h3>
                <button id="close-sidebar">&times;</button>
            </div>
            <ul class="sidebar-menu">
                <li><i class="fas fa-home"></i> Room list</li>
                <li><i class="fas fa-rss"></i> Friends wall</li>
                <li><i class="fas fa-newspaper"></i> News</li>
            </ul>
        </div>

        <header class="header">
            <button id="menu-btn"><i class="fas fa-bars"></i></button>
            <span class="brand">Tulips.chat</span>
            <span class="status"><i class="fas fa-circle"></i> 1</span>
        </header>

        <main id="chat-messages" class="chat-main">
            <div class="msg received">Welcome to Tulips Chat! Start typing below.</div>
        </main>

        <footer class="input-footer">
            <div class="input-wrapper">
                <button class="plus-btn"><i class="fas fa-plus"></i></button>
                <input type="text" id="msg-input" placeholder="Type here..." autocomplete="off">
                <button id="send-btn"><i class="fas fa-paper-plane"></i></button>
            </div>
        </footer>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
