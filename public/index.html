<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tulips Chat Updated</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app">
        <div id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <h3>Main Room</h3>
            </div>
            <ul>
                <li><i class="fas fa-home"></i> Room List</li>
                <li><i class="fas fa-users"></i> Friends</li>
                <li><i class="fas fa-gamepad"></i> Games</li>
                <li><i class="fas fa-crown"></i> VIP Store</li>
            </ul>
        </div>

        <div class="main-content">
            <header class="header">
                <button id="menu-btn"><i class="fas fa-bars"></i></button>
                <div class="logo">Tulips.chat</div>
                <div class="notif"><i class="fas fa-bell"></i></div>
            </header>

            <div id="chat-messages" class="chat-display">
                </div>

            <div class="input-area">
                <input type="text" id="msg-input" placeholder="Type a message...">
                <button id="send-btn"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
