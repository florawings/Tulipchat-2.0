<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeChat | Professional</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>VibeChat</h2>
                <button class="close-btn" onclick="toggleSidebar()"><i class="fas fa-times"></i></button>
            </div>
            <div class="user-section">
                <h4><i class="fas fa-circle" style="color: #00ff88; font-size: 10px;"></i> Online Users</h4>
                <div id="user-list" class="user-list"></div>
            </div>
        </aside>

        <main class="chat-area">
            <header class="main-header">
                <button class="menu-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                <div class="header-info">
                    <h3>Global Square</h3>
                    <span>Real-time Community</span>
                </div>
            </header>

            <div id="chat-box" class="chat-messages">
                </div>

            <div class="input-container">
                <button class="action-btn" onclick="document.getElementById('file-input').click()">
                    <i class="fas fa-image"></i>
                </button>
                <input type="file" id="file-input" hidden accept="image/*" onchange="handleFileUpload(this)">
                
                <input type="text" id="msg-input
