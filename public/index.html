<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tulipchat 2.0</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #0b0b0b; color: white; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .card { background: #151515; padding: 40px; border-radius: 20px; border: 1px solid #333; text-align: center; width: 90%; max-width: 400px; box-shadow: 0 15px 35px rgba(0,0,0,0.7); }
        h2 { color: #ff0055; margin-bottom: 20px; font-size: 28px; }
        input { padding: 15px; margin: 10px 0; width: 100%; border-radius: 10px; border: 1px solid #444; background: #222; color: white; outline: none; transition: 0.3s; }
        input:focus { border-color: #ff0055; box-shadow: 0 0 10px rgba(255, 0, 85, 0.3); }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        button { flex: 1; padding: 15px; background-color: #ff0055; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s; }
        button:active { transform: scale(0.95); }
        #msg { margin-top: 15px; font-size: 14px; min-height: 20px; }
        
        /* Chat view (Initially Hidden) */
        #chat-view { display: none; width: 100%; height: 100%; flex-direction: column; background: #000; }
        #chat-header { padding: 20px; background: #151515; text-align: center; border-bottom: 1px solid #333; color: #ff0055; font-weight: bold; }
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 12px 18px; border-radius: 15px; max-width: 80%; line-height: 1.4; }
        .sent { align-self: flex-end; background: #ff0055; color: white; }
        #input-bar { padding: 20px; display: flex; gap: 10px; background: #151515; }
    </style>
</head>
<body>

    <div id="auth-view" class="card">
        <h2>Tulipchat 2.0</h2>
        <input type="text" id="user" placeholder="Choose Username">
        <input type="password" id="pass" placeholder="Password">
        <div class="btn-group">
            <button onclick="auth('register')">Register</button>
            <button onclick="auth('login')">Login</button>
        </div>
        <div id="msg"></div>
    </div>

    <div id="chat-view">
        <div id="chat-header">Global Chatroom</div>
        <div id="messages"></div>
        <div id="input-bar">
            <input type="text" id="chat-input" placeholder="Type a message..." style="margin:0;">
            <button style="width: 80px;" onclick="send()">Send</button>
        </div>
    </div>

    <script>
        async function auth(type) {
            const username = document.getElementById('user').value;
            const password = document.getElementById('pass').value;
            const status = document.getElementById('msg');

            if(!username || !password) return status.innerText = "Fields are empty!";
            status.innerText = "Connecting...";

            try {
                const res = await fetch(`/api/${type}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                if (res.ok) {
                    status.style.color = "#44ff44";
                    status.innerText = data.message;
                    if(type === 'login') {
                        setTimeout(() => {
                            document.getElementById('auth-view').style.display = 'none';
                            document.getElementById('chat-view').style.display = 'flex';
                            document.body.style.alignItems = 'stretch';
                        }, 1000);
                    }
                } else {
                    status.style.color = "#ff4444";
                    status.innerText = data.message;
                }
            } catch (err) {
                status.innerText = "Server is busy. Try again.";
            }
        }

        function send() {
            const input = document.getElementById('chat-input');
            if(!input.value) return;
            const box = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = "msg sent";
            div.innerText = input.value;
            box.appendChild(div);
            input.value = "";
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
