<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
font-family:sans-serif;
background:#0f1b3d;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:white;
padding:25px;
border-radius:10px;
width:260px;
text-align:center;
}

input{
width:100%;
padding:10px;
margin-top:10px;
}

button{
width:100%;
padding:10px;
margin-top:10px;
}

</style>

</head>

<body>

<div class="box">

<h3>🌷 Tulip Chat</h3>

<input id="user" placeholder="Username">

<input id="pass" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<button onclick="guest()">Guest Login</button>

<button onclick="location='register.html'">Register</button>

</div>

<script>

async function login(){

let username=user.value
let password=pass.value

let r=await fetch("/login",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({username,password})
})

let data=await r.json()

if(data.ok){

localStorage.setItem("user",username)
location="chat.html"

}else{

alert("Wrong login")

}

}


function guest(){

let g="Guest"+Math.floor(Math.random()*999)

localStorage.setItem("user",g)

location="chat.html"

}

</script>

</body>

</html>
