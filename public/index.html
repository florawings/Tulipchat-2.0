<style>
    /* Side Menu (3 line wala) Styling */
    #side-menu {
        position: fixed; left: -250px; top: 0; width: 250px; height: 100%;
        background: #151515; color: white; transition: 0.3s; z-index: 1000;
        padding: 20px; box-shadow: 2px 0 10px rgba(0,0,0,0.5);
    }
    #side-menu.active { left: 0; }
    .overlay {
        display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.5); z-index: 999;
    }
    /* Messages styling fix */
    .system-msg { text-align: center; color: #ff0055; font-size: 12px; margin: 5px 0; font-weight: bold; }
</style>

<body>
    <div id="side-menu">
        <h3>Menu</h3>
        <hr>
        <p>Profile</p>
        <p>Settings</p>
        <p onclick="location.reload()">Refresh Chat</p>
    </div>
    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <header>
        <div class="head-left">
            <span onclick="toggleMenu()">☰</span> 
            <span class="head-title">Tulips.chat</span>
        </div>
        </header>

    <div id="chat-display"></div>

    <div class="input-bar">
        <input type="file" id="file-input" style="display:none" accept="image/*" onchange="uploadFile()">
        <button class="icon-btn" onclick="document.getElementById('file-input').click()">➕</button>
        <input type="text" id="message-input" placeholder="Type here..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button id="send-btn" onclick="sendMessage()">➤</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const display = document.getElementById('chat-display');
        const input = document.getElementById('message-input');

        // Toggle Menu Function
        function toggleMenu() {
            document.getElementById('side-menu').classList.toggle('active');
            const overlay = document.getElementById('overlay');
            overlay.style.display = overlay.style.display === 'block' ? 'none' : 'block';
        }

        // Message Receive
        socket.on('chatMessage', (data) => {
            if(data.system) {
                display.innerHTML += `<div class="system-msg">${data.text}</div>`;
            } else {
                const msgHtml = `
                    <div class="msg">
                        <div class="msg-avatar" style="background:${data.avatarColor}">${data.username[0]}</div>
                        <div class="msg-info">
                            <div class="user-sig" style="color:${data.userColor}">${data.username}</div>
                            <div class="msg-text">
                                ${data.text ? `<div>${data.text}</div>` : ''}
                                ${data.image ? `<img src="${data.image}" class="msg-img">` : ''}
                            </div>
                        </div>
                    </div>`;
                display.innerHTML += msgHtml;
            }
            display.scrollTop = display.scrollHeight;
        });

        function sendMessage() {
            if(!input.value.trim()) return;
            socket.emit('chatMessage', {
                username: localStorage.getItem('tulipUsername') || 'Guest',
                text: input.value,
                userColor: '#5c2d91',
                avatarColor: '#9c27b0'
            });
            input.value = "";
        }

        function uploadFile() {
            const file = document.getElementById('file-input').files[0];
            const reader = new FileReader();
            reader.onload = () => {
                socket.emit('chatMessage', {
                    username: localStorage.getItem('tulipUsername') || 'Guest',
                    image: reader.result,
                    avatarColor: '#9c27b0'
                });
            };
            if(file) reader.readAsDataURL(file);
        }
    </script>
</body>
