<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tulipchat 2.0</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #080808; color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        #chat-header { padding: 15px; background: #111; border-bottom: 2px solid #ff0055; text-align: center; font-weight: bold; color: #ff0055; display: flex; justify-content: space-between; align-items: center; }
        
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; background: #080808; }
        
        .msg-box { max-width: 80%; padding: 12px 16px; border-radius: 20px; font-size: 15px; line-height: 1.4; position: relative; word-wrap: break-word; }
        .user-sig { font-size: 11px; color: rgba(255,255,255,0.6); margin-bottom: 4px; display: block; font-weight: bold;}
        .sent { align-self: flex-end; background: #ff0055; color: white; border-bottom-right-radius: 4px; }
        .received { align-self: flex-start; background: #1a1a1a; color: #eee; border-bottom-left-radius: 4px; }
        .msg-img { max-width: 250px; max-height: 250px; border-radius: 10px; margin-top: 5px; cursor: pointer; display: block;}
        
        #input-area { padding: 15px 20px; background: #111; display: flex; gap: 10px; border-top: 1px solid #222; position: relative; }
        #message-input { flex: 1; padding: 12px 18px; border-radius: 25px; border: 1px solid #333; background: #1a1a1a; color: white; outline: none; margin: 0; }
        #message-input:focus { border-color: #ff0055; }
        
        /* Upload Buttons */
        .icon-btn { background: none; border: none; font-size: 22px; cursor: pointer; color: #888; padding: 0 5px; transition: 0.2s; }
        .icon-btn:hover { color: white; }
        #send-btn { padding: 12px 22px; background-color: #ff0055; color: white; border: none; border-radius: 25px; cursor: pointer; font-weight: bold; }
        #file-input { display: none; }
        
        /* Image Preview */
        #img-preview-container { display: none; position: absolute; bottom: 80px; left: 20px; background: rgba(0,0,0,0.8); padding: 10px; border-radius: 10px; z-thought: 10; border: 1px solid #333; }
        #img-preview { max-width: 100px; max-height: 100px; border-radius: 5px; }
        #close-preview { position: absolute; top: -5px; right: -5px; background: #ff0055; border-radius: 50%; color: white; border: none; font-size: 12px; width: 20px; height: 20px; cursor: pointer; }

    </style>
</head>
<body>

    <div id="chat-header">
        <span>Tulipchat 2.0</span>
        <span style="font-size:12px; color:#888;">Feel the Heat 🔥</span>
    </div>

    <div id="messages"></div>

    <div id="img-preview-container">
        <button id="close-preview" onclick="closePreview()">×</button>
        <img id="img-preview" src="">
    </div>

    <div id="input-area">
        <input type="file" id="file-input" accept="image/*, image/gif" onchange="previewFile()">
        <button class="icon-btn" onclick="triggerFileInput()">📷</button>
        <input type="text" id="message-input" placeholder="Say something hot...">
        <button id="send-btn" onclick="sendMessage()">Send</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        // Server URL Render ka yahan daalein
        const socket = io('https://tulipchat-2-0.onrender.com'); 
        let currentImage = null;

        socket.on('chatMessage', (data) => {
            const messages = document.getElementById('messages');
            const div = document.createElement('div');
            
            // Sent vs Received (Mera username kya hai?)
            // Abhi ke liye random username use kar rahe hain
            const myUsername = localStorage.getItem('tulipUsername') || 'Anonymous';
            div.className = `msg-box ${data.username === myUsername ? 'sent' : 'received'}`;
            
            // Signature
            const sig = document.createElement('span');
            sig.className = 'user-sig';
            sig.innerText = data.username + " (" + data.signature + ")";
            div.appendChild(sig);

            // Text Message
            if(data.text) {
                const text = document.createElement('div');
                text.innerText = data.text;
                div.appendChild(text);
            }

            // Image/GIF
            if(data.image) {
                const img = document.createElement('img');
                img.className = 'msg-img';
                img.src = data.image; // Base64 link
                img.onclick = () => window.open(data.image); // Click to open full
                div.appendChild(img);
            }

            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight; // Auto-scroll
        });

        function triggerFileInput() {
            document.getElementById('file-input').click();
        }

        function previewFile() {
            const fileInput = document.getElementById('file-input');
            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.addEventListener("load", () => {
                currentImage = reader.result; // Base64 string
                document.getElementById('img-preview').src = currentImage;
                document.getElementById('img-preview-container').style.display = 'block';
            }, false);

            if (file) { reader.readAsDataURL(file); }
        }

        function closePreview() {
            currentImage = null;
            document.getElementById('img-preview-container').style.display = 'none';
            document.getElementById('file-input').value = "";
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const fileInput = document.getElementById('file-input');
            const text = input.value.trim();
            
            if (!text && !currentImage) return;

            // Simple User/Sig
            const myUsername = localStorage.getItem('tulipUsername') || 'Anonymous';
            const signature = localStorage.getItem('tulipSig') || "Hot!";

            const messageData = {
                username: myUsername,
                text: text,
                image: currentImage, // Base64
                signature: signature
            };

            socket.emit('chatMessage', messageData);

            input.value = "";
            closePreview();
        }

        // Prompt user for Username and Signature if not present
        if(!localStorage.getItem('tulipUsername')) {
            localStorage.setItem('tulipUsername', prompt("Enter your Username:") || 'User' + Math.floor(Math.random()*1000));
            localStorage.setItem('tulipSig', prompt("Enter your Signature:") || 'Feeling hot!');
        }

    </script>
</body>
</html>
