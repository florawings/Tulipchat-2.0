<!DOCTYPE html>
<html>

<head>
<title>Tulip Chat</title>

<style>

body{
font-family:Arial;
background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:white;
padding:30px;
border-radius:10px;
text-align:center;
width:250px;
}

button{
width:100%;
margin:8px 0;
padding:10px;
border:none;
background:#22c55e;
color:white;
font-size:16px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="box">

<h2>Tulip Chat</h2>

<button onclick="location='login.html'">Login</button>

<button onclick="guest()">Guest</button>

<button onclick="location='register.html'">New User Registration</button>

</div>

<script>

function guest(){

let name = prompt("Enter guest name")

if(!name) return

localStorage.setItem("username",name)

location="chat.html"

}

</script>

</body>

</html>
