<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-box">
<h2>🌷 Tulip Chat</h2>
<input id="user" placeholder="Username">
<button onclick="go()">Enter</button>
</div>

<script>
function go(){
  if(!user.value) return alert("Enter name");
  localStorage.setItem("user", user.value);
  location="chat.html";
}
</script>

</body>
</html>
