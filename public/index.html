<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tulipchat 2.0</title>
    <style>
        /* Basic Styling */
        body { font-family: Arial, sans-serif; background-color: #121212; color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #auth-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        input { padding: 10px; margin: 5px; width: 250px; border-radius: 5px; border: none; }
        button { padding: 10px 20px; background-color: #ff0055; color: white; border: none; border-radius: 5px; cursor: pointer; }
        
        /* Chat Interface */
        #chat-container { display: none; flex-direction: column; height: 100vh; }
        #chat-display { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        
        .msg-box { max-width: 75%; padding: 10px 15px; border-radius: 15px; word-wrap: break-word; }
        .sent { align-self: flex-end; background: #ff0055; color: white; }
        .received { align-self: flex-start; background: #222; color: #eee; }
        
        #input-area { padding: 15px; background: #1a1a1a; display: flex; gap: 10px; }
        #message-input { flex: 1; }
    </style>
</head>
<body>

    <div id="auth-container">
        <h2>Tulipchat 2.0</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <div>
            <button onclick="handleAuth('register')">Register</button>
            <button onclick="handleAuth('login')">Login</button>
        </div>
        <p id="auth-error" style="color: #ff0055; margin-top: 10px;"></p>
    </div>

    <div id="chat-container">
        <div id="chat-display"></div>
        <div id="input-area">
            <input type="text" id="message-input" placeholder="Type a message...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        // Frontend Logic (Yahan aap apne API endpoints connect karenge)
        async function handleAuth(type) {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorElement = document.getElementById('auth-error');

            try {
                const response = await fetch(`/${type}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();
                if (response.ok) {
                    document.getElementById('auth-container').style.display = 'none';
                    document.getElementById('chat-container').style.display = 'flex';
                } else {
                    errorElement.innerText = data.message || "Error occurred";
                }
            } catch (err) {
                errorElement.innerText = "Server connection failed";
            }
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            if (!input.value) return;
            
            const display = document.getElementById('chat-display');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'msg-box sent';
            msgDiv.innerText = input.value;
            display.appendChild(msgDiv);
            
            input.value = '';
            display.scrollTop = display.scrollHeight;
        }
    </script>
</body>
</html>
