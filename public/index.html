<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tulips Chat</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app">
        <div id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <h3>Main Room</h3>
                <button id="close-sidebar">&times;</button>
            </div>
            <ul>
                <li onclick="location.reload()"><i class="fas fa-home"></i> Home</li>
                <li><i class="fas fa-list"></i> Room List</li>
                <li><i class="fas fa-user-friends"></i> Friends Wall</li>
            </ul>
        </div>

        <div class="main-content">
            <header class="header">
                <button id="menu-btn"><i class="fas fa-bars"></i></button>
                <div class="logo">Tulips.chat</div>
                <div class="online-count"><i class="fas fa-circle"></i> <span id="count">0</span></div>
            </header>

            <div class="chat-wrapper">
                <div id="chat-messages" class="chat-display">
                    </div>
                
                <div class="online-users" id="user-list">
                    <h4>Online</h4>
                    <ul id="users"></ul>
                </div>
            </div>

            <div class="input-area">
                <input type="text" id="msg-input" placeholder="Type here...">
                <button id="send-btn"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
