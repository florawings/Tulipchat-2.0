<!DOCTYPE html><html>
<head>
<title>Tulip Chat Login</title><style>

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:sans-serif;
background:linear-gradient(135deg,#ffd6e7,#ffe9f3,#f5e6ff);
}

#box{
background:white;
padding:40px;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,0.1);
text-align:center;
}

input{
padding:10px;
width:200px;
border-radius:10px;
border:1px solid #ccc;
}

button{
margin-top:15px;
padding:10px 20px;
border:none;
background:#ff4d8d;
color:white;
border-radius:10px;
cursor:pointer;
}

</style></head><body><div id="box"><h2>🌷 Tulip Chat</h2><input id="name" placeholder="Enter username"><br><button onclick="login()">Enter Chat</button>

</div><script>

function login(){

let name=document.getElementById("name").value.trim()

if(name===""){
alert("Enter username")
return
}

localStorage.setItem("username",name)

window.location="chat.html"

}

</script></body>
</html>
