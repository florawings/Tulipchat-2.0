<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tulipchat 2.0</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: sans-serif; background-color: #0b0b0b; color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        
        /* Header */
        header { padding: 15px; background: #151515; border-bottom: 2px solid #ff0055; text-align: center; font-weight: bold; color: #ff0055; font-size: 20px; }

        /* Chat Display Area */
        #chat-display { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; background: #000; }

        /* Message Box Styling */
        .msg { max-width: 80%; padding: 10px 15px; border-radius: 18px; font-size: 15px; word-wrap: break-word; }
        .sent { align-self: flex-end; background: #ff0055; color: white; border-bottom-right-radius: 2px; }
        .received { align-self: flex-start; background: #222; color: #eee; border-bottom-left-radius: 2px; }
        .msg img { max-width: 100%; border-radius: 10px; margin-top: 5px; display: block; }

        /* Bottom Input Bar */
        .input-bar { padding: 10px; background: #151515; display: flex; align-items: center; gap: 10px; border-top: 1px solid #333; }
        
        #message-input { flex: 1; padding: 12px; border-radius: 25px; border: 1px solid #444; background: #222; color: white; outline: none; }
        
        .icon-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: #ff0055; padding: 5px; }
        
        #send-btn { background: #ff0055; color: white; border: none; border-radius: 50%; width: 45px; height: 45px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        #file-input { display: none; }
    </style>
</head>
<body>

    <header>TULIPCHAT 2.0</header>

    <div id="chat-display">
        <div class="msg received">Welcome to Tulipchat! Start sharing pics and GIFs 🔥</div>
    </div>

    <div class="input-bar">
        <input type="file" id="file-input" accept="image/*, image/gif" onchange="previewAndSend()">
        <button class="icon-btn" onclick="document.getElementById('file-input').click()">📷</button>
        <input type="text" id="message-input" placeholder="Type a message...">
        <button id="send-btn" onclick="sendMessage()">➤</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io(); // Automatic connection to Render
        const display = document.getElementById('chat-display');
        const input = document.getElementById('message-input');

        socket.on('chatMessage', (data) => {
            const div = document.createElement('div');
            div.className = `msg ${data.self ? 'sent' : 'received'}`;
            
            if(data.text) div.innerHTML = `<div>${data.text}</div>`;
            if(data.image) div.innerHTML += `<img src="${data.image}">`;
            
            display.appendChild(div);
            display.scrollTop = display.scrollHeight;
        });

        function sendMessage() {
            if(!input.value.trim()) return;
            socket.emit('chatMessage', { text: input.value, self: true });
            input.value = "";
        }

        function previewAndSend() {
            const file = document.getElementById('file-input').files[0];
            const reader = new FileReader();
            reader.onload = () => {
                socket.emit('chatMessage', { image: reader.result, self: true });
            };
            if(file) reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
