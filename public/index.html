<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tulipchat 2.0 - Official</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0b0b0b; color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        #auth-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: radial-gradient(circle, #1a1a1a 0%, #000 100%); }
        .card { background: #151515; padding: 30px; border-radius: 15px; border: 1px solid #333; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        input { padding: 12px; margin: 10px 0; width: 260px; border-radius: 8px; border: 1px solid #444; background: #222; color: white; outline: none; }
        input:focus { border-color: #ff0055; }
        .btn-group { display: flex; gap: 10px; justify-content: center; margin-top: 15px; }
        button { padding: 12px 25px; background-color: #ff0055; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { background-color: #cc0044; transform: scale(1.05); }
        
        /* Chat Design */
        #chat-container { display: none; flex-direction: column; height: 100vh; }
        #chat-header { padding: 15px; background: #151515; border-bottom: 1px solid #333; text-align: center; font-weight: bold; color: #ff0055; }
        #chat-display { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; background: #0b0b0b; }
        .msg-box { max-width: 80%; padding: 12px 16px; border-radius: 18px; font-size: 15px; line-height: 1.4; }
        .sent { align-self: flex-end; background: #ff0055; color: white; border-bottom-right-radius: 2px; }
        .received { align-self: flex-start; background: #262626; color: #eee; border-bottom-left-radius: 2px; }
        #input-area { padding: 20px; background: #151515; display: flex; gap: 10px; border-top: 1px solid #333; }
        #message-input { flex: 1; margin: 0; }
    </style>
</head>
<body>

    <div id="auth-container">
        <div class="card">
            <h2 style="color: #ff0055; margin-bottom: 5px;">Tulipchat 2.0</h2>
            <p style="font-size: 12px; color: #888; margin-bottom: 20px;">The World is Waiting for You</p>
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            <div class="btn-group">
                <button onclick="handleAuth('register')">Register</button>
                <button onclick="handleAuth('login')">Login</button>
            </div>
            <p id="auth-error" style="color: #ff4444; font-size: 13px; margin-top: 15px;"></p>
        </div>
    </div>

    <div id="chat-container">
        <div id="chat-header">Global Chatroom</div>
        <div id="chat-display"></div>
        <div id="input-area">
            <input type="text" id="message-input" placeholder="Say something...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        async function handleAuth(type) {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorElement = document.getElementById('auth-error');

            if(!username || !password) {
                errorElement.innerText = "Please fill all fields";
                return;
            }

            try {
                const response = await fetch(`/api/${type}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();
                if (response.ok) {
                    alert(data.message);
                    if(type === 'login' || type === 'register') {
                        document.getElementById('auth-container').style.display = 'none';
                        document.getElementById('chat-container').style.display = 'flex';
                    }
                } else {
                    errorElement.innerText = data.message;
                }
            } catch (err) {
                errorElement.innerText = "Server is sleeping. Try again in 30s.";
            }
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            if (!input.value.trim()) return;
            
            const display = document.getElementById('chat-display');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'msg-box sent';
            msgDiv.innerText = input.value;
            display.appendChild(msgDiv);
            
            input.value = '';
            display.scrollTop = display.scrollHeight;
        }
    </script>
</body>
</html>
