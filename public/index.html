<div class="vibe-wrapper">
    <aside class="vibe-sidebar">
        <div class="logo">VibeChat</div>
        <div class="user-list" id="online-users">
            </div>
    </aside>

    <main class="vibe-global">
        <div class="chat-header">🌐 Global Public Square</div>
        <div class="message-container" id="global-box"></div>
        <div class="input-area">
            <input type="text" id="global-input" placeholder="Say something to the world...">
            <button id="send-global">Send</button>
        </div>
    </main>

    <section class="vibe-dm" id="dm-window">
        <div class="dm-header">💬 Private Chat</div>
        <div class="dm-messages" id="private-box"></div>
        <div class="dm-input">
            <input type="text" id="private-input" placeholder="Type a secret...">
            <button id="send-private">➤</button>
        </div>
    </section>
</div>
