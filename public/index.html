<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tulips Chat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-wrapper">
        <div id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <div class="room-box">
                    <img src="https://via.placeholder.com/40" alt="Room Icon">
                    <div class="text">
                        <small>Current room</small>
                        <strong>Main room</strong>
                    </div>
                </div>
                <button id="close-sidebar" class="close-btn">&times;</button>
            </div>
            <ul class="sidebar-menu">
                <li><i class="fas fa-home"></i> Room list</li>
                <li><i class="fas fa-rss"></i> Friends wall <span class="notification-dot"></span></li>
                <li><i class="fas fa-newspaper"></i> News</li>
                <li><i class="fas fa-gavel"></i> Rules</li>
                <li><i class="fas fa-id-badge"></i> Rank Applications</li>
                <li><i class="fas fa-user-tag"></i> Profile Guide</li>
            </ul>
        </div>

        <div class="main-content">
            <header class="header">
                <div class="header-left">
                    <button id="menu-btn"><i class="fas fa-bars"></i></button>
                </div>
                <div class="header-center">
                    <span class="logo-text">Tulips.chat</span>
                </div>
                <div class="header-right">
                    <i class="fas fa-bell"></i>
                    <span class="online-indicator">1</span>
                </div>
            </header>

            <div id="chat-messages" class="chat-display">
                <div class="msg received">
                    Welcome to Tulips Chat! Start typing below.
                </div>
            </div>

            <footer class="input-area">
                <div class="input-container">
                    <button class="action-btn"><i class="fas fa-plus"></i></button>
                    <button class="action-btn"><i class="far fa-smile"></i></button>
                    <input type="text" id="msg-input" placeholder="Type here..." autocomplete="off">
                    <button id="send-btn"><i class="fas fa-paper-plane"></i></button>
                </div>
            </footer>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
