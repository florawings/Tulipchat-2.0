<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tulip Chat</title>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
}

.card{
background:white;
width:340px;
padding:30px;
border-radius:10px;
box-shadow:0 10px 30px rgba(0,0,0,0.4);
text-align:center;
}

.logo{
font-size:26px;
font-weight:bold;
color:#e91e63;
margin-bottom:20px;
}

input,select{
width:100%;
padding:12px;
margin-top:10px;
border-radius:6px;
border:1px solid #ccc;
font-size:15px;
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:6px;
font-size:16px;
cursor:pointer;
}

.login{
background:#4CAF50;
color:white;
}

.guest{
background:black;
color:white;
}

.register{
background:#2196F3;
color:white;
}

.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
align-items:center;
justify-content:center;
}

.modal-box{
background:white;
padding:25px;
width:320px;
border-radius:10px;
}

.close{
float:right;
cursor:pointer;
font-size:18px;
}

</style>

</head>

<body>

<div class="card">

<div class="logo">🌷 Tulip Chat</div>

<input id="username" placeholder="Username">

<input id="password" type="password" placeholder="Password">

<button class="login" onclick="login()">Login</button>

<button class="guest" onclick="guestLogin()">Guest Login</button>

<button class="register" onclick="openRegister()">Register</button>

</div>


<!-- REGISTER POPUP -->

<div id="registerModal" class="modal">

<div class="modal-box">

<span class="close" onclick="closeRegister()">✖</span>

<h3>Create Account</h3>

<input id="ruser" placeholder="Username">

<input id="remail" placeholder="Email">

<input id="rpass" type="password" placeholder="Password">

<label>DOB</label>

<input id="rdob" type="date">

<select id="rcountry">
<option>India</option>
<option>USA</option>
<option>UK</option>
<option>Canada</option>
<option>Australia</option>
</select>

<button onclick="register()">Register</button>

</div>

</div>


<script>

function login(){

let user=document.getElementById("username").value

if(user==""){
alert("Enter username")
return
}

localStorage.setItem("user",user)

alert("Login success")

}

function guestLogin(){

let guest="Guest"+Math.floor(Math.random()*999)

localStorage.setItem("user",guest)

alert("Guest login: "+guest)

}

function openRegister(){

document.getElementById("registerModal").style.display="flex"

}

function closeRegister(){

document.getElementById("registerModal").style.display="none"

}

function register(){

let dob=document.getElementById("rdob").value

if(dob==""){
alert("Enter DOB")
return
}

let birth=new Date(dob)

let today=new Date()

let age=today.getFullYear()-birth.getFullYear()

if(age<18){

alert("Only 18+ users allowed")

return

}

alert("Registration successful")

closeRegister()

}

</script>

</body>
</html>
