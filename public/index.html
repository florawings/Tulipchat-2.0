<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeChat | Pro Edition</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>VibeChat</h2>
                <button class="close-btn" onclick="toggleSidebar()"><i class="fas fa-times"></i></button>
            </div>
            <div class="user-section">
                <h4><i class="fas fa-users"></i> Online Users</h4>
                <div id="user-list" class="user-list"></div>
            </div>
        </aside>

        <main class="chat-area">
            <header class="main-header">
                <button class="menu-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                <div class="header-info">
                    <h3>Global Square</h3>
                    <span id="status-text">Connecting...</span>
                </div>
            </header>

            <div id="chat-box" class="chat-messages"></div>

            <div class="input-container">
                <button class="action-btn" id="emoji-btn"><i class="far fa-smile"></i></button>
                <button class="action-btn" onclick="document.getElementById('file-input').click()">
                    <i class="far fa-image"></i>
                </button>
                <input type="file" id="file-input" hidden accept="image/*" onchange="handleFileUpload(this)">
                
                <input type="text" id="msg-input" placeholder="Type a message..." autocomplete="off">
                
                <button class="send-btn" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
            </div>
        </main>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@joeattardi/emoji-button@4.6.0/dist/index.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
