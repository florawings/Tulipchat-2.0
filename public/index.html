<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="overlay">

<div class="landing">

<h1 class="logo">🌷 Tulip Chat</h1>

<p class="tag">
Make new friends and enjoy chatting with people around the world
</p>

<button class="loginBtn" onclick="openLogin()">Login</button>

<button class="guestBtn" onclick="guest()">Guest Login</button>

<p class="registerLink">
New here? <a href="register.html">Register now</a>
</p>

</div>

</div>


<!-- LOGIN MODAL -->

<div id="loginModal" class="modal">

<div class="modalBox">

<span class="close" onclick="closeLogin()">✕</span>

<h2>Login</h2>

<input id="username" placeholder="Username or Email">

<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>

</div>

</div>



<script>

function openLogin(){
document.getElementById("loginModal").style.display="flex"
}

function closeLogin(){
document.getElementById("loginModal").style.display="none"
}


function login(){

let u=document.getElementById("username").value
let p=document.getElementById("password").value

fetch("/login",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({username:u,password:p})
})
.then(r=>r.json())
.then(d=>{

if(d.ok){

localStorage.setItem("user",u)
window.location="chat.html"

}else{

alert("Wrong login")

}

})

}


function guest(){

let name="Guest"+Math.floor(Math.random()*1000)

localStorage.setItem("user",name)

window.location="chat.html"

}

</script>

</body>

</html>
