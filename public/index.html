<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login | Tulip Pro</title>
    <style>
        body { margin: 0; padding: 0; background: #ff6a95; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; }
        .card { background: white; padding: 35px; border-radius: 20px; width: 85%; max-width: 350px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center; position: relative; z-index: 100; }
        h2 { color: #f43f5e; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 10px; border: 1px solid #ddd; box-sizing: border-box; }
        button { width: 100%; padding: 14px; background: #f43f5e; color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; position: relative; z-index: 200; }
        button:active { transform: scale(0.95); }
        .footer { margin-top: 20px; font-size: 13px; color: #666; }
        .footer a { color: #f43f5e; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>🌷 Tulip Chat</h2>
    <form action="/auth/login" method="POST">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>
    <div class="footer">
        New here? <a href="register.html">Register Now</a>
    </div>
</div>

</body>
</html>
