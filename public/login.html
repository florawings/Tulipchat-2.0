<!DOCTYPE html>
<html>

<head>

<title>Tulip Chat Login</title>

<style>

body{
font-family:sans-serif;
margin:0;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(180deg,#ff4f7a,#ff7ca0);
}

#box{

background:white;
padding:40px;
width:320px;
border-radius:15px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,0.2);

}

h2{

color:#ff4f7a;

}

input{

width:100%;
padding:12px;
margin-top:15px;
border-radius:8px;
border:1px solid #ccc;
font-size:16px;

}

button{

margin-top:20px;
width:100%;
padding:12px;
background:#ff2d5a;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;

}

button:hover{

background:#e01e4c;

}

a{

color:#ff2d5a;
text-decoration:none;

}

#error{

color:red;
margin-top:10px;

}

</style>

</head>

<body>

<div id="box">

<h2>🌷 Tulip Chat</h2>

<input id="username" placeholder="Username">

<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<div id="error"></div>

<p>Don't have account? <a href="register.html">Register</a></p>

</div>

<script>

async function login(){

const username=document.getElementById("username").value
const password=document.getElementById("password").value

if(username=="" || password==""){

document.getElementById("error").innerText="Enter username and password"
return

}

const res = await fetch("/login",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
username,
password
})

})

const data = await res.json()

if(data.success){

localStorage.setItem("username",data.username)
localStorage.setItem("role",data.role)

window.location="chat.html"

}else{

document.getElementById("error").innerText=data.error

}

}

</script>

</body>

</html>
