<!DOCTYPE html>
<html>
<head>

<title>Tulip Chat</title>

<style>

body{
font-family:Arial;
background:#0f172a;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:#020617;
padding:30px;
border-radius:10px;
width:260px;
text-align:center;
}

input{
width:100%;
padding:10px;
margin-top:10px;
border:none;
border-radius:5px;
}

button{
margin-top:10px;
width:100%;
padding:10px;
background:#22c55e;
border:none;
color:white;
border-radius:5px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="box">

<h2>Tulip Chat</h2>

<input id="username" placeholder="Username">

<button onclick="login()">Login</button>

<button onclick="guest()">Guest Login</button>

</div>

<script>

function login(){

let u=document.getElementById("username").value

if(u=="") return

localStorage.setItem("username",u)

location="chat.html"

}

function guest(){

let u="Guest"+Math.floor(Math.random()*9999)

localStorage.setItem("username",u)

location="chat.html"

}

</script>

</body>
</html>
