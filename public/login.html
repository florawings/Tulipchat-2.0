<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VibeChat | Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-bg">
    <div class="auth-card">
        <h2>Welcome to VibeChat</h2>
        <input type="email" id="email" placeholder="Email Address">
        <input type="password" id="pass" placeholder="Password">
        <button onclick="loginUser()">Enter the Vibe</button>
        <p>New here? <a href="signup.html">Create Account</a></p>
    </div>
    
    <script>
        async function loginUser() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('pass').value;
            
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            if(data.user) {
                localStorage.setItem('vibeUser', JSON.stringify(data.user));
                window.location.href = 'index.html'; // Chat page par bhej do
            } else {
                alert(data.msg);
            }
        }
    </script>
</body>
</html>
