<!DOCTYPE html>
<html>
<head>

<title>Register</title>

<style>

body{
background:#0d1b2a;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.box{
background:white;
color:black;
padding:30px;
border-radius:10px;
width:260px;
text-align:center;
}

input{
width:100%;
padding:10px;
margin-top:10px;
}

button{
width:100%;
padding:10px;
margin-top:10px;
background:#2196F3;
border:none;
color:white;
cursor:pointer;
}

</style>

</head>

<body>

<div class="box">

<h2>Create Account</h2>

<input id="name" placeholder="Username">

<input id="pass" type="password" placeholder="Password">

<button onclick="register()">Register</button>

</div>

<script>

function register(){

let name=document.getElementById("name").value
let pass=document.getElementById("pass").value

if(pass.length < 6){
alert("Password must be at least 6 characters")
return
}

localStorage.setItem("username",name)

alert("Account created")

location.href="/chat.html"

}

</script>

</body>
</html>
