<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Owner Dashboard</title>

<style>
body{
font-family:sans-serif;
background:#f5f5f5;
padding:20px;
}

h1{
color:#ff5a76;
}

table{
width:100%;
background:white;
border-collapse:collapse;
}

td,th{
padding:10px;
border:1px solid #ddd;
}

button{
padding:6px 10px;
margin-right:5px;
}
</style>
</head>

<body>

<h1>Owner Dashboard</h1>

<button onclick="clearChat()">Clear Chat</button>

<h3>Users</h3>

<table>
<thead>
<tr>
<th>User</th>
<th>Email</th>
<th>Action</th>
</tr>
</thead>

<tbody id="userTable"></tbody>

</table>

<script>

fetch("/admin/users")
.then(res=>res.json())
.then(users=>{

const table=document.getElementById("userTable")

users.forEach(u=>{

let tr=document.createElement("tr")

tr.innerHTML=`
<td>${u.username}</td>
<td>${u.email}</td>
<td>
<button onclick="kick('${u.username}')">Kick</button>
<button onclick="ban('${u.username}')">Ban</button>
</td>
`

table.appendChild(tr)

})

})


function kick(user){

fetch("/admin/kick/"+user,{method:"POST"})

}

function ban(user){

fetch("/admin/ban/"+user,{method:"POST"})

}

function clearChat(){

fetch("/admin/clear",{method:"POST"})

}

</script>

</body>
</html>
